 آستین به خونِ جگر شوی\nهر که در این آستانه راه ندارد\nنی منِ تنها کشم تَطاولِ زلفت\nکیست که او داغِ آن سیاه ندارد؟\nحافظ اگر سجدهٔ تو کرد مکن عیب\nکافرِ عشق ای صنم گناه ندارد"},{"id":128,"poem":"نیست در شهر نگاری که دلِ ما ببَرد\nبختم ار یار شود رختم از این جا ببَرد\nکو حریفی کَشِ سرمست که پیش کرمش\nعاشق سوخته‌دل، نام تمنا ببَرد\nباغبانا ز خزان، بی‌خبرت می‌بینم\nآه از آن روز که بادت گُل رعنا ببَرد\nرهزن دهر نخفته‌ست، مشو ایمن از او\nاگر امروز نَبُرده‌ست که فردا ببَرد\nدر خیال، این همه لعبت به هوس می‌بازم\nبو که صاحب‌نظری نام تماشا ببَرد\nعلم و فضلی که به چل سال دلم جمع آورد\nترسم آن نرگسِ مستانه به یغما ببَرد\nبانگ گاوی، چه صدا باز دهد؟ عشوه مَخَر\nسامری کیست که دست از ید بیضا ببَرد؟\nجام میناییِ می، سدّ ره تنگ‌دلی‌ست\nمَنِه از دست که سیل غمت از جا ببَرد\nراه عشق ار چه کمینگاهِ کمانداران است\nهر که دانسته رود صرفه ز اعدا ببَرد\nحافظ! ار جان طلبد غمزهٔ مستانهٔ یار\nخانه از غیر بپرداز و بِهِل تا ببَرد"},{"id":129,"poem":"اگر نه باده غمِ دل ز یادِ ما بِبَرَد\nنهیبِ حادثه بنیادِ ما ز جا بِبَرَد\nاگر نه عقل به مستی فروکَشَد لنگر\nچگونه کَشتی از این وَرطِهٔ بلا ببرد\nفغان که با همه کس غایبانه باخت فلک\nکه کس نبود که دستی از این دَغا ببرد\nگذار بر ظلمات است، خِضْرِ راهی کو؟\nمباد کآتش محرومی آبِ ما ببرد\nدل ضعیفم از آن می‌کَشَد به طَرْفِ چمن\nکه جان ز مرگ به بیماریِ صبا ببرد\nطبیبِ عشق منم باده دِه که این معجون\nفَراغت آرد و اندیشهٔ خطا ببرد\nبسوخت حافظ و کس حالِ او به یار نگفت\nمگر نسیم پیامی خدای را ببرد"},{"id":130,"poem":"سحر بلبل حکایت با صبا کرد\nکه عشقِ رویِ گل با ما چه‌ها کرد\nاز آن رنگِ رُخَم، خون در دل افتاد\nوز آن گلشن، به خارم مبتلا کرد\nغلامِ همتِ آن نازنینم\nکه کار خیر بی روی و ریا کرد\nمن از بیگانگان دیگر ننالم\nکه با من هرچه کرد آن آشنا کرد\nگر از سلطان طمع کردم، خطا بود\nور از دلبر وفا جُستَم، جفا کرد\nخوشش باد آن نسیمِ صبحگاهی\nکه دردِ شب نشینان را دوا کرد\nنقابِ گل کَشید و زلفِ سُنبل\nگره بندِ قبای غنچه وا کرد\nبه هر سو بلبلِ عاشق در افغان\nتَنَعُّم از میان، بادِ صبا کرد\nبشارت بَر به کویِ می فروشان\nکه حافظ توبه از زهدِ ریا کرد\nوفا از خواجگانِ شهر با من\nکمالِ دولت و دین بوالوفا کرد"},{"id":131,"poem":"بیا که تُرکِ فلک خوانِ روزه غارت کرد\nهلالِ عید به دورِ قدح اشارت کرد\nثوابِ روزه و حجِّ قبول آن کس بُرد\nکه خاکِ میکدهٔ عشق را زیارت کرد\nمُقامِ اصلیِ ما گوشهٔ خرابات است\nخداش خیر دهاد آن که این عمارت کرد\nبهایِ بادهٔ چون لعل چیست؟ جوهرِ عقل\nبیا که سود کسی بُرد، کاین تجارت کرد\nنماز در خَمِ آن ابروانِ محرابی\nکسی کُنَد که به خونِ جگر طهارت کرد\nفغان که نرگس جَمّاشِ شیخِ شهر امروز\nنظر به دُردکشان از سرِ حقارت کرد\nبه رویِ یار نظر کن ز دیده مِنّت دار\nکه کاردیده، نظر از سرِ بِصارت کرد\nحدیثِ عشق ز حافظ شنو نه از واعظ\nاگر چه صنعتِ بسیار در عبارت کرد"},{"id":132,"poem":"به آبِ روشنِ می، عارفی طهارت کرد\nعَلَی الصَّباح، که میخانه را زیارت کرد\nهمین که ساغرِ زَرّینِ خور، نهان گردید\nهِلال عید به دورِ قدح اشارت کرد\nخوشا نماز و نیازِ کسی که از سرِ درد\nبه آبِ دیده و خونِ جگر طهارت کرد\nامام خواجه، که بودش سرِ نمازِ دراز\nبه خونِ دخترِ رَز، خرقه را قِصارت کرد\nدلم ز حلقهٔ زلفش به جان خرید آشوب\nچه سود دید؟ ندانم، که این تجارت کرد\nاگر امامِ جماعت طلب کند امروز\nخبر دهید که حافظ به می طهارت کرد"},{"id":133,"poem":"صوفی نَهاد دام و سَرِ حُقِّه، باز کَرْد\nبُنْیادِ مَکْر با فَلَکِ حُقِّه‌باز کَرْد\nبازیِّ چَرْخ بِشْکَنَدَش بِیْضِه دَر کُلاه\nزیرا که عَرْضِ شُعْبَدِه با اَهْلِ راز کَرْد\nساقی! بیا! که شاهِدِ رَعْنایِ صوفیان\nدیگَر به جِلْوِه آمد و آغازِ ناز کَرْد\nاین مُطْرِب اَز کُجاست که سازِ عِراق ساخت؟\nوآهَنْگِ بازْگَشْت به راهِ حِجاز کَرْد؟\nای دِل! بیا! که ما بِه پَناهِ خُدا رَویم\nزآنْچ آسْتینِ کوتَه و دَسْتِ دِراز کَرْد\nصَنْعَت مَکُن که هَرکِه مُحَبَّت، نَه راسْت باخْت\nعِشْقَش به رویِ دِل، دَرِ مَعْنی، فَراز کَرْد\nفَرْدا که پیشگاهِ حَقیقَت شَوَد پَدید\nشَرْمَنْدِه رَهْرُوی کِه عَمَل بَر مَجاز کَرْد\nاِی کَبْکِ خوش‌خُرام! کُجا می‌رَوی؟ بِایست!\nغَرِّه مَشو! که گُرْبِهٔ زاهِد، نَماز کَرْد\n«حافِظ»! مَکُن مَلامَتِ رِنْدان! که دَر اَزَل\nما را خُدا زِ زُهْدِ ریا، بی‌نیاز کَرْد"},{"id":134,"poem":"بلبلی خونِ دلی خورد و گلی حاصل کرد\nبادِ غیرت به صدش خار، پریشان‌دل کرد\nطوطیی را به خیالِ شکری، دل‌خوش بود\nناگَهَش سیلِ فنا نقشِ اَمَل، باطل کرد\nقُرَّةُ الْعینِ من، آن میوهٔ دل، یادش باد\nکه چه آسان بشد و کارِ مرا مشکل کرد\nساروان! بارِ من افتاد، خدا را مددی\nکه امیدِ کَرَمَم همرهِ این مَحمِل کرد\nرویِ خاکی و نمِ چشمِ مرا خوار مدار\nچرخ فیروزه طرب‌خانه از این کَهگِل کرد\nآه و فریاد که از چشمِ حسودِ مهِ چرخ\nدر لحد ماهِ کمان‌ابرویِ من منزل کرد\nنزدی شاه‌رخ و فوت شد امکان حافظ\nچه کنم؟ بازی ایام مرا غافل کرد"},{"id":135,"poem":"چو باد، عزمِ سرِ کویِ یار خواهم کرد\nنفس به بویِ خوشش مُشکبار خواهم کرد\nبه هرزه بی می و معشوق عمر می‌گذرد\nبِطالتم بس از امروز کار خواهم کرد\nهر آبروی که اندوختم ز دانش و دین\nنثارِ خاکِ رهِ آن نگار خواهم کرد\nچو شمعِ صبحدمم شد ز مهر او روشن\nکه عمر در سر این کار و بار خواهم کرد\nبه یادِ چشم تو خود را خراب خواهم ساخت\nبنایِ عهدِ قدیم استوار خواهم کرد\nصبا کجاست؟ که این جانِ خون گرفته چو گُل\nفدای نَکهَتِ گیسویِ یار خواهم کرد\nنفاق و زَرق نبخشد صفایِ دل حافظ\nطریقِ رندی و عشق اختیار خواهم کرد"},{"id":136,"poem":"دست در حلقهٔ آن زلفِ دوتا نتوان کرد\nتکیه بر عهدِ تو و بادِ صبا نتوان کرد\nآن‌چه سعی است، من اندر طلبت بنمایم\nاین قَدَر هست که تغییرِ قضا نتوان کرد\nدامنِ دوست به صد خونِ دل افتاد به دست\nبه فُسوسی که کُنَد خصم، رها نتوان کرد\nعارضش را به مَثَل ماهِ فلک نتوان گفت\nنسبتِ دوست به هر بی سر و پا نتوان کرد\nسروبالایِ من آنگه که درآید به سَماع\nچه محل جامهٔ جان را که قبا نتوان کرد؟\nنظرِ پاک توانَد رخِ جانان دیدن\nکه در آیینه نظر جز به صفا نتوان کرد\nمشکلِ عشق نه در حوصلهٔ دانشِ ماست\nحلّ‌ِ این نکته بدین فکرِ خطا نتوان کرد\nغیرتم کُشت که محبوبِ جهانی، لیکن\nروز و شب عربده با خلقِ خدا نتوان کرد\nمن چه گویم؟ که تو را نازکیِ طبعِ لطیف\nتا به حَدّیست که آهسته دعا نتوان کرد\nبجز ابرویِ تو محرابِ دل حافظ نیست\nطاعتِ غیر تو در مذهبِ ما نتوان کرد"},{"id":137,"poem":"دل از من بُرد و روی از من نهان کرد\nخدا را با که این بازی توان کرد\nشب تنهاییَم در قصدِ جان بود\nخیالش لطف‌هایِ بی‌کران کرد\nچرا چون لاله خونین دل نباشم؟\nکه با ما نرگسِ او سر گران کرد\nکه را گویم که با این دردِ جان‌سوز\nطبیبم قصدِ جانِ ناتوان کرد؟\nبدانسان سوخت چون شمعم که بر من\nصُراحی گریه و بَربَط فغان کرد\nصبا گر چاره داری وقت وقت است\nکه دردِ اشتیاقم قصدِ جان کرد\nمیان مهربانان کی توان گفت؟\nکه یارِ ما چُنین گفت و چُنان کرد\nعدو با جانِ حافظ آن نکردی\nکه تیرِ چشمِ آن ابروکمان کرد"},{"id":138,"poem":"یاد باد آن که ز ما وقتِ سفر یاد نکرد\nبه وداعی دلِ غم‌دیدهٔ ما شاد نکرد\nآن جوان‌بخت که می‌زد رقمِ خیر و قبول\nبندهٔ پیر ندانم ز چه آزاد نکرد\nکاغذین جامه به خونآب بشویم که فلک\nرهنمونیم به پایِ عَلَمِ داد نکرد\nدل به امّیدِ صدایی که مگر در تو رسد\nناله‌ها کرد در این کوه که فرهاد نکرد\nسایه تا بازگرفتی ز چمن مرغِ سحر\nآشیان در شِکَنِ طُرِّهٔ شمشاد نکرد\nشاید ار پیکِ صبا، از تو بیاموزد کار\nزآن که چالاک‌تر از این حرکت، باد نکرد\nکِلْکِ مَشّاطِهٔ صُنعَش نَکِشد نقشِ مراد\nهر که اقرار بدین حُسنِ خداداد نکرد\nمطربا! پرده بگردان و بزن راهِ عراق\nکه بدین راه بشد یار و ز ما یاد نکرد\nغزلیاتِ عراقی‌ست سرودِ حافظ\nکه شنید این رهِ دل‌سوز که فریاد نکرد؟"},{"id":139,"poem":"رو بر رَهَش نهادم و بر من گذر نکرد\nصد لطف چشم داشتم و یک نظر نکرد\nسیلِ سرشک ما ز دلش کین به در نَبُرد\nدر سنگِ خاره قطرهٔ باران اثر نکرد\nیا رب تو آن جوانِ دلاور نگاه‌دار\nکز تیرِ آهِ گوشه‌نشینان حذر نکرد\nماهی و مرغْ دوش ز افغانِ من نَخُفت\nوان شوخْ‌دیده بین که سر از خواب برنکرد\nمی‌خواستم که میرَمَش اندر قدم چو شمع\nاو خود گذر به ما چو نسیمِ سحر نکرد\nجانا کدام سنگدلِ بی‌کفایت است\nکاو پیشِ زخمِ تیغِ تو جان را سپر نکرد؟\nکِلکِ زبان‌بریدهٔ حافظ در انجمن\nبا کس نگفت رازِ تو تا تَرکِ سر نکرد"},{"id":140,"poem":"دلبر بِرَفت و دلشدگان را خبر نکرد\nیادِ حریفِ شهر و رفیقِ سفر نکرد\nیا بختِ من طریقِ مروت فروگذاشت\nیا او به شاهراهِ طریقت گذر نکرد\nگفتم مگر به گریه دلش مهربان کنم\nچون سخت بود در دلِ سنگش اثر نکرد\nشوخی مکن که مرغِ دلِ بی‌قرارِ من\nسودایِ دامِ عاشقی از سر به درنکرد\nهر کس که دید رویِ تو بوسید چشمِ من\nکاری که کرد دیدهٔ من، بی‌نظر نکرد\nمن ایستاده تا کُنَمَش جان فدا چو شمع\nاو خود گذر به ما چو نسیمِ سحر نکرد"},{"id":141,"poem":"دیدی ای دل که غمِ عشق دگربار چه کرد؟\nچون بشد دلبر و با یارِ وفادار چه کرد\nآه از آن نرگسِ جادو که چه بازی انگیخت\nآه از آن مست که با مردمِ هشیار چه کرد\nاشکِ من رنگِ شفق یافت ز بی‌مِهری یار\nطالعِ بی‌شفقت بین که در این کار چه کرد\nبرقی از منزلِ لیلی بدرخشید سحر\nوَه که با خرمنِ مجنونِ دل‌افگار چه کرد\nساقیا جامِ مِی‌ام دِه که نگارندهٔ غیب\nنیست معلوم که در پردهٔ اسرار چه کرد\nآن که پُرنقش زد این دایرهٔ مینایی\nکس ندانست که در گردشِ پرگار چه کرد\nفکرِ عشق آتشِ غم در دلِ حافظ زد و سوخت\nیارِ دیرینه ببینید که با یار چه کرد"},{"id":142,"poem":"دوستان دخترِ رَز توبه ز مستوری کرد\nشد سویِ محتسب و کار به دستوری کرد\nآمد از پرده به مجلس عَرَقَش پاک کنید\nتا نگویند حریفان که چرا دوری کرد\nمژدگانی بده ای دل که دگر مطربِ عشق\nراهِ مستانه زد و چارهٔ مخموری کرد\nنه به هفت آب، که رنگش به صد آتش نرود\nآن چه با خرقهٔ زاهد، مِی انگوری کرد\nغنچهٔ گُلبُنِ وصلم ز نسیمش بِشِکُفت\nمرغ خوشخوان طرب از برگِ گلِ سوری کرد\nحافظ افتادگی از دست مده زان که حسود\nعِرض و مال و دل و دین در سرِ مغروری کرد"},{"id":143,"poem":"سال‌ها دل طلبِ جامِ جم از ما می‌کرد\nوآنچه خود داشت ز بیگانه تمنّا می‌کرد\nگوهری کز صدفِ کون و مکان بیرون است\nطلب از گمشدگانِ لبِ دریا می‌کرد\nمشکلِ خویش بَرِ پیرِ مُغان بُردم دوش\nکاو به تأییدِ نظر حلّ‌ِ معمّا می‌کرد\nدیدمش خُرَّم و خندان قدحِ باده به دست\nواندر آن آینه صد گونه تماشا می‌کرد\nگفتم این جامِ جهان‌بین به تو کِی داد حکیم؟\nگفت آن روز که این گنبدِ مینا می‌کرد\nبی‌دلی در همه‌احوال خدا با او بود\nاو نمی‌دیدش و از دور خدارا می‌کرد\nاین‌همه شعبدهٔ خویش که می‌کرد اینجا\nسامری پیشِ عصا و یدِ بیضا می‌کرد\nگفت آن یار کز او گشت سرِ دار بلند\nجُرمش این بود که اسرار هویدا می‌کرد\nفیضِ روحُ‌القُدُس ار باز مدد فرماید\nدیگران هم بکنند آن‌چه مسیحا می‌کرد\nگفتمش سلسلهٔ زلفِ بُتان از پیِ چیست؟\nگفت حافظ گله‌ای از دلِ شیدا می‌کرد"},{"id":144,"poem":"به سِرِّ جامِ جم آنگه نظر توانی کرد\nکه خاکِ میکده کُحلِ بَصَر توانی کرد\nمباش بی می و مُطرب که زیرِ طاقِ سپهر\nبدین ترانه غم از دل به در توانی کرد\nگُلِ مرادِ تو آنگه نقاب بُگْشاید\nکه خدمتش چو نسیمِ سحر توانی کرد\nگدایی درِ میخانه طُرفه اِکسیریست\nگر این عمل بِکُنی، خاکْ زر توانی کرد\nبه عزمِ مرحلهٔ عشق پیش نِه قدمی\nکه سودها کنی ار این سفر توانی کرد\nتو کز سرایِ طبیعت نمی‌روی بیرون\nکجا به کویِ طریقت گذر توانی کرد\nجمالِ یار ندارد نقاب و پرده ولی\nغبارِ رَه بِنِشان تا نظر توانی کرد\nبیا که چارهٔ ذوقِ حضور و نظم امور\nبه فیض‌بخشیِ اهلِ نظر توانی کرد\nولی تو تا لبِ معشوق و جامِ مِی خواهی\nطمع مدار که کارِ دگر توانی کرد\nدلا ز نورِ هدایت گر آگهی یابی\nچو شمع، خنده‌زنان تَرکِ سر توانی کرد\nگر این نصیحتِ شاهانه بشنوی حافظ\nبه شاهراهِ حقیقت گذر توانی کرد"},{"id":145,"poem":"چه مستی است ندانم که رو به ما آورد\nکه بود ساقی و این باده از کجا آورد\nچه راه می‌زند این مطربِ مقام شناس\nکه در میان غزل قول آشنا آورد\nتو نیز باده به چنگ آر و راهِ صحرا گیر\nکه مرغ نغمه‌سُرا سازِ خوش‌نوا آورد\nدلا چو غُنچه شکایت ز کارِ بسته مکن\nکه بادِ صبح، نسیمِ گره‌گُشا آورد\nرسیدن گل نسرین به خیر و خوبی باد\nبنفشه شاد و کَش آمد، سمن صفا آورد\nصبا به خوش‌خبری هُدهُدِ سلیمان است\nکه مژدهٔ طرب از گلشنِ سبا آورد\nعلاج ضعف دل ما کرشمهٔ ساقیست\nبرآر سر که طبیب آمد و دوا آورد\nمریدِ پیرِ مُغانم ز من مرنج ای شیخ\nچرا که وعده تو کردیّ و او به جا آورد\nبه تنگ‌چشمیِ آن تُرکِ لشکری نازم\nکه حمله بر منِ درویشِ یک قبا آورد\nفلک غلامی حافظ کنون به طوع کُنَد\nکه اِلتِجا به درِ دولت شما آورد"},{"id":146,"poem":"صبا وقتِ سحر بویی ز زلفِ یار می‌آورد\nدل شوریدهٔ ما را به نو، در کار می‌آورد\nمن آن شکلِ صِنوبر را ز باغِ دیده بَرکَندَم\nکه هر گُل کز غمش بِشْکُفت مِحنت، بار می‌آورد\nفروغِ ماه می‌دیدم ز بامِ قصر او روشن\nکه رو از شرمِ آن خورشید در دیوار می‌آورد\nز بیمِ غارتِ عشقش، دلِ پُرخون رها کردم\nولی می‌ریخت خون و رَه بِدان هنجار می‌آورد\nبه قولِ مطرب و ساقی، برون رفتم گَه و بی‌گَه\nکز آن راهِ گران، قاصد، خبر، دشوار می‌آورد\nسراسر بخششِ جانان، طریقِ لطف و احسان بود\nاگر تسبیح می‌فرمود، اگر زُنّار می‌آورد\nعَفَاالله چینِ ابرویَش اگر چه ناتوانم کرد\nبه عشوه هم پیامی بر سرِ بیمار می‌آورد\nعجب می‌داشتم دیشب ز حافظ جام و پیمانه\nولی مَنعَش نمی‌کردم که صوفی‌وار می‌آورد"},{"id":147,"poem":"بریدِ بادِ صبا دوشم آگهی آورد\nکه روزِ محنت و غم رو به کوتهی آورد\nبه مُطربانِ صَبوحی دهیم جامهٔ چاک\nبدین نوید که بادِ سحرگهی آورد\nبیا بیا که تو حورِ بهشت را رضوان\nدر این جهان ز برایِ دلِ رهی آورد\nهمی‌رویم به شیراز با عنایتِ دوست\nزهی رفیق که بختم به همرهی آورد\nبه جبرِ خاطرِ ما کوش کـ‌این کلاهِ نمد\nبسا شکست که با افسرِ شهی آورد\nچه ناله‌ها که رسید از دلم به خرمنِ ماه\nچو یادِ عارضِ آن ماهِ خرگهی آورد\nرساند رایتِ منصور بر فلک حافظ\nکه اِلتِجا به جنابِ شهنشهی آورد"},{"id":148,"poem":"یارم چو قدح به دست گیرد\nبازارِ بتان شکست گیرد\nهر کس که بدید چشم او گفت\n«کو محتسبی که مست گیرد؟»\nدر بحر فتاده‌ام چو ماهی\nتا یار مرا به شَست گیرد\nدر پاش فتاده‌ام به زاری\nآیا بوَد آن که دست گیرد؟\nخُرَّم دلِ آن که همچو حافظ\nجامی ز مِیِ اَلَست گیرد"},{"id":149,"poem":"دلم جز مِهرِ مَه‌رویان، طریقی بر نمی‌گیرد\nز هر در می‌دهم پندش، ولیکن در نمی‌گیرد\nخدا را ای نصیحت‌گو، حدیثِ ساغر و مِی گو\nکه نقشی در خیالِ ما، از این خوش‌تر نمی‌گیرد\nبیا ای ساقی گُل‌رُخ‌، بیاور بادهٔ رنگین\nکه فکری در درونِ ما، از این بهتر نمی‌گیرد\nصُراحی می‌کشم پنهان و مردم دفتر انگارند\nعجب‌! گر آتشِ این زَرْق در دفتر نمی‌گیرد\nمن این دَلقِ مُرَقَّع را، بخواهم سوختن روزی\nکه پیرِ مِی فروشانش‌، به جامی بر نمی‌گیرد\nاز آن رو هست یاران را، صفا‌ها با مِی لَعلَش\nکه غیر از راستی نقشی، در آن جوهر نمی‌گیرد\nسر و چَشمی چُنین دلکَش، تو گویی چشم از او بردوز؟\nبرو کاین وعظ بی‌معنی‌، مرا در سر نمی‌گیرد\nنصیحتگو‌‌یِ رندان را، که با حکمِ قضا جنگ است\nدلش بس تنگ می‌بینم، مگر ساغر نمی‌گیرد\nمیانِ گریه می‌خندم‌، که چون شمع اندر این مجلس\nزبانِ آتشینم هست، لیکن در نمی‌گیرد\nچه خوش صیدِ دلم کردی، بنازم چَشمِ مستت را\nکه کَس مُرغانِ وحشی را، از این خوش‌تر نمی‌گیرد\nسخن در احتیاجِ ما و اِسْتِغنا‌یِ معشوق است\nچه سود افسونگر‌ی ای دل؟ که در دلبر نمی‌گیرد\nمن آن آیینه را روزی، به دست آرَم سِکَنْدَر‌وار\nاگر می‌گیرد این آتش زمانی‌، ور نمی‌گیرد\nخدا را رحمی ای مُنْعِم‌، که درویشِ سرِ کویت\nدری دیگر نمی‌داند، رهی دیگر نمی‌گیرد\nبدین شعرِ ترِ شیرین‌، ز شاهنشَه عجب دارم\nکه سر تا پایِ حافظ را، چرا در زر نمی‌گیرد"},{"id":150,"poem":"ساقی ار باده از این دست به جام اندازد\nعارفان را همه در شُربِ مُدام اندازد\nور چُنین زیرِ خَم زلف نهد دانهٔ خال\nای بسا مرغِ خِرَد را که به دام اندازد\nای خوشا دولتِ آن مست که در پایِ حریف\nسر و دستار نداند که کدام اندازد\nزاهدِ خام که انکارِ مِی و جام کند\nپخته گردد چو نظر بر میِ خام اندازد\nروز در کسبِ هنر کوش که مِی خوردنِ روز\nدلِ چون آینه، در زنگِ ظَلام اندازد\nآن زمان وقتِ میِ صبح فروغ است که شب\nگِردِ خَرگاهِ افق پردهٔ شام اندازد\nباده با محتسبِ شهر ننوشی زنهار\nبخورد باده‌ات و سنگ به جام اندازد\nحافظا سر ز کُلَه گوشهٔ خورشید برآر\nبختت ار قرعه بدان ماهِ تمام اندازد"},{"id":151,"poem":"دَمی با غم به سر بردن، جهان یک سر نمی‌ارزد\nبه می بفروش دلقِ ما، کز این بهتر نمی‌ارزد\nبه کویِ می فروشانش، به جامی بر نمی‌گیرند\nزهی سجادهٔ تقوا که یک ساغر نمی‌ارزد\nرقیبم سرزنش‌ها کرد کز این باب رُخ برتاب\nچه افتاد این سر ما را که خاکِ در نمی‌ارزد؟\nشکوهِ تاجِ سلطانی که بیمِ جان در او دَرج است\nکلاهی دلکش است اما به تَرکِ سر نمی‌ارزد\nچه آسان می‌نمود اول غمِ دریا به بوی سود\nغلط کردم که این طوفان به صد گوهر نمی‌ارزد\nتو را آن بِهْ که رویِ خود ز مشتاقان بپوشانی\nکه شادیِّ جهانگیری، غمِ لشکر نمی‌ارزد\nچو حافظ در قناعت کوش و از دنیایِ دون بگذر\nکه یک جو مِنَّتِ دونان دو صد من زر نمی‌ارزد"},{"id":152,"poem":"در ازل پرتوِ حُسنت ز تجلی دَم زد\nعشق پیدا شد و آتش به همه عالم زد\nجلوه‌ای کرد رُخَت دید مَلَک عشق نداشت\nعینِ آتش شد از این غیرت و بر آدم زد\nعقل می‌خواست کز آن شعله چراغ افروزد\nبرق غیرت بدرخشید و جهان برهم زد\nمدعی خواست که آید به تماشاگَهِ راز\nدست غیب آمد و بر سینهٔ نامحرم زد\nدیگران قرعهٔ قسمت همه بر عیش زدند\nدل غمدیدهٔ ما بود که هم بر غم زد\nجانِ عِلْوی هوسِ چاهِ زنخدان تو داشت\nدست در حلقهٔ آن زلفِ خَم اندر خَم زد\nحافظ آن روز طربنامهٔ عشق تو نوشت\nکه قلم بر سرِ اسبابِ دلِ خُرَّم زد"},{"id":153,"poem":"سحر چون خسرو خاور، عَلَم بر کوهساران زد\nبه دستِ مرحمت، یارم، درِ امیدواران زد\nچو پیشِ صبح روشن شد که حالِ مِهر گردون چیست\nبرآمد خنده‌ای خوش بر غرورِ کامگاران زد\nنگارم دوش در مجلس، به عزمِ رقص چون برخاست\nگره بگشود از گیسو و بر دل‌های یاران زد\nمن از رنگِ صلاح آن دَم، به خونِ دل بِشُستم دست\nکه چشم باده پیمایش صلا بر هوشیاران زد\nکدام آهن‌دلش آموخت این آیین عیّاری؟\nکز اول چون برون آمد، رهِ شب‌زنده‌داران زد\nخیالِ شهسواری پخت و شد ناگَه دلِ مسکین\nخداوندا! نگه دارش که بر قلبِ سواران زد\nدر آب و رنگِ رخسارش، چه جان دادیم و خون خوردیم\nچو نقشش دست داد اول، رقم بر جان‌سپاران زد\nمنش با خرقهٔ پشمین، کجا اندر کمند آرم؟\nزره‌مویی که مژگانش رهِ خنجرگزاران زد\nنظر بر قرعهٔ توفیق و یُمنِ دولتِ شاه است\nبده کامِ دلِ حافظ که فالِ بختیاران زد\nشهنشاهِ مظفر فر، شجاعِ مُلک و دین منصور\nکه جودِ بی‌دریغش خنده بر ابر بهاران زد\nاز آن ساعت که جامِ می به دستِ او مُشَرَّف شد\nزمانه ساغرِ شادی به یادِ می‌گساران زد\nز شمشیرِ سرافشانش، ظفر آن روز بِدْرَخشید\nکه چون خورشیدِ انجم‌سوز تنها بر هِزاران زد\nدوامِ عمر و مُلکِ او، بخواه از لطف حق ای دل!\nکه چرخ، این سکهٔ دولت به دورِ روزگاران زد"},{"id":154,"poem":"راهی بزن که آهی بر سازِ آن توان زد\nشعری بخوان که با او رَطلِ گران توان زد\nبر آستانِ جانان گر سر توان نهادن\nگلبانگِ سربلندی بر آسمان توان زد\nقَدِّ خمیدهٔ ما سهلت نماید اما\nبر چشمِ دشمنان تیر، از این کمان توان زد\nدر خانقه نگنجد اسرارِ عشقبازی\nجامِ میِ مُغانه هم با مُغان توان زد\nدرویش را نباشد برگِ سرایِ سلطان\nماییم و کهنه دلقی کآتش در آن توان زد\nاهلِ نظر دو عالم در یک نظر ببازند\nعشق است و داوِ اول بر نقدِ جان توان زد\nگر دولتِ وصالت خواهد دری گشودن\nسرها بدین تَخَیُّل بر آستان توان زد\nعشق و شباب و رندی مجموعهٔ مراد است\nچون جمع شد معانی گویِ بیان توان زد\nشد رهزنِ سلامت زلفِ تو وین عجب نیست\nگر راهزن تو باشی صد کاروان توان زد\nحافظ به حَقِّ قرآن کز شِید و زرق بازآی\nباشد که گویِ عیشی در این جهان توان زد"},{"id":155,"poem":"اگر روم ز پِی‌اش فتنه‌ها برانگیزد\nور از طلب بنشینم به کینه برخیزد\nو گر به رهگذری یک دَم از وفاداری\nچو گَرد در پِی‌اش افتم چو باد بُگْریزد\nو گر کنم طلبِ نیم بوسه صد افسوس\nز حُقِّهٔ دهنش چون شکر فرو ریزد\nمن آن فریب که در نرگسِ تو می‌بینم\nبس آبروی که با خاک ره برآمیزد\nفراز و شیب بیابان عشق، دامِ بلاست\nکجاست شیردلی کز بلا نپرهیزد\nتو عمر خواه و صبوری که چرخِ شعبده باز\nهزار بازی از این طُرفه‌تر برانگیزد\nبر آستانهٔ تسلیم سر بِنِه حافظ\nکه گر ستیزه کنی، روزگار بستیزد"},{"id":156,"poem":"به حسن و خُلق و وفا کس به یارِ ما نرسد\nتو را در این سخن، انکارِ کارِ ما نرسد\nاگرچه حُسن‌فروشان به جلوه آمده‌اند\nکسی به حُسن و ملاحت به یارِ ما نرسد\nبه حق صحبت دیرین که هیچ محرمِ راز\nبه یارِ یک جهت حق‌گزارِ ما نرسد\nهزار نقش برآید ز کِلکِ صُنع و یکی\nبه دلپذیری نقشِ نگارِ ما نرسد\nهزار نقد به بازارِ کائنات آرند\nیکی به سکهٔ صاحب عیارِ ما نرسد\nدریغ قافله عمر کآنچنان رفتند\nکه گَردشان به هوایِ دیارِ ما نرسد\nدلا ز رنجِ حسودان مرنج و واثق باش\nکه بد به خاطرِ امیدوارِ ما نرسد\nچنان بِزی که اگر خاکِ ره شوی کس را\nغبارِ خاطری از رهگذارِ ما نرسد\nبسوخت حافظ و ترسم که شرحِ قصهٔ او\nبه سمعِ پادشهِ کامگارِ ما نرسد"},{"id":157,"poem":"هر که را با خطِ سبزت سرِ سودا باشد\nپای از این دایره بیرون نَنِهَد تا باشد\nمن چو از خاکِ لحد لاله‌صفت برخیزم\nداغِ سودای توام سِرِّ سُویدا باشد\nتو خود ای گوهرِ یک‌دانه کجایی آخِر\nکز غمت دیدهٔ مردم همه دریا باشد\nاز بُنِ هر مژه‌ام آب روان است بیا\nاگرت میلِ لبِ جوی و تماشا باشد\nچون گل و مِی دمی از پرده برون آی و درآ\nکه دگرباره ملاقات نه پیدا باشد\nظِلِّ مَمدودِ خَمِ زلفِ توام بر سر باد\nکاندر این سایه قرارِ دلِ شیدا باشد\nچشمت از ناز به حافظ نکند میل آری\nسرگرانی صفتِ نرگسِ رعنا باشد"},{"id":158,"poem":"من و انکارِ شراب! این چه حکایت باشد؟\nغالباً این قَدَرَم عقل و کِفایت باشد\nتا به غایت رهِ میخانه نمی‌دانستم\nور نه مستوری ما تا به چه غایت باشد\nزاهد و عجب و نماز و من و مستی و نیاز\nتا تو را خود ز میان با که عنایت باشد\nزاهد ار راه به رندی نَبَرَد معذور است\nعشق کاری‌ست که موقوف هدایت باشد\nمن که شب‌ها رهِ تقوا زده‌ام با دف و چنگ\nاین زمان سر به ره آرَم؟ چه حکایت باشد!\nبندهٔ پیرِ مغانم که ز جهلم بِرَهانْد\nپیرِ ما هر چه کُنَد عینِ عنایت باشد\nدوش از این غصه نَخُفتَم که رفیقی می‌گفت\n«حافظ ار مست بُوَد جایِ شکایت باشد»"},{"id":159,"poem":"نقدِ صوفی نه همه صافیِ بی‌غَش باشد\nای بسا خرقه که مُستوجبِ آتش باشد\nصوفیِ ما که ز وِردِ سحری مست شدی\nشامگاهش نگران باش که سرخوش باشد\nخوش بُوَد گر محکِ تجربه آید به میان\nتا سیه‌روی شود هر که در او غَش باشد\nخَطِّ ساقی گر از این گونه زند نقش بر آب\nای بسا رُخ که به خونآبه مُنَقَّش باشد\nناز‌پروردِ تَنَعُّم نبَرَد راه به دوست\nعاشقی شیوهٔ رندانِ بلاکش باشد\nغمِ دنیای دَنی چند خوری؟ باده بخور\nحیف باشد دلِ دانا که مُشَوَّش باشد\nدلق و سجادهٔ حافظ ببَرَد باده‌فروش\nگر شرابش ز کفِ ساقی مَه‌وَش باشد"},{"id":160,"poem":"خوش است خلوت اگر یار یارِ من باشد\nنه من بسوزم و او شمعِ انجمن باشد\nمن آن نگینِ سلیمان به هیچ نَسْتانَم\nکه گاه گاه بر او دستِ اهرمن باشد\nروا مدار خدایا که در حریمِ وصال\nرقیب محرم و حِرمان نصیبِ من باشد\nهُمای گو مَفِکَن سایهٔ شرف هرگز\nدر آن دیار که طوطی کم از زَغَن باشد\nبیانِ شوق چه حاجت؟ که سوز آتش دل\nتوان شناخت ز سوزی که در سخن باشد\nهوایِ کویِ تو از سر نمی‌رود آری\nغریب را دلِ سرگشته با وطن باشد\nبه سانِ سوسن اگر دَه‌زبان شود حافظ\nچو غنچه پیشِ تواش مُهر بر دهن باشد"},{"id":161,"poem":"کِی شعر تر انگیزد خاطر که حزین باشد\nیک نکته از این معنی گفتیم و همین باشد\nاز لعلِ تو گر یابم انگشتریِ زنهار\nصد مُلکِ سلیمانم در زیرِ نگین باشد\nغمناک نباید بود از طعنِ حسود ای دل\nشاید که چو وابینی خیرِ تو در این باشد\nهر کو نَکُنَد فهمی زین کِلکِ خیال‌انگیز\nنقشش به حرام اَر خود صورتگر چین باشد\nجامِ میْ و خونِ دل هر یک به کسی دادند\nدر دایرهٔ قسمت اوضاع چنین باشد\nدر کارِ گلاب و گل حکمِ ازلی این بود\nکاین شاهدِ بازاری وآن پرده‌نشین باشد\nآن نیست که حافظ را رِندی بِشُد از خاطر\nکه‌این سابقهٔ پیشین تا روزِ پَسین باشد"},{"id":162,"poem":"خوش آمد گُل وز آن خوش‌تر نباشد\nکه در دستت بجز ساغر نباشد\nزمانِ خوش‌دلی دریاب و دُر یاب\nکه دایم در صدف گوهر نباشد\nغنیمت دان و مِی خور در گلستان\nکه گُل تا هفتهٔ دیگر نباشد\nایا پُرلعل کرده جامِ زَرّین\nببخشا بر کسی کش زر نباشد\nبیا ای شیخ و از خُم‌خانهٔ ما\nشرابی خور که در کوثر نباشد\nبشوی اوراق اگر هم‌درسِ مایی\nکه عِلمِ عشق در دفتر نباشد\nز من بنیوش و دل در شاهدی بند\nکه حُسنش بستهٔ زیور نباشد\nشرابی بی‌خمارم بخش یا رب\nکه با وی هیچ دردِ سر نباشد\nمن از جان بندهٔ سلطان اویسم\nاگر چه یادش از چاکر نباشد\nبه تاجِ عالم آرایش که خورشید\nچنین زیبندهٔ افسر نباشد\nکسی گیرد خطا بر نظمِ حافظ\nکه هیچش لطف در گوهر نباشد"},{"id":163,"poem":"گل بی‌رخِ یار خوش نباشد\nبی‌باده بهار خوش نباشد\nطَرفِ چمن و طوافِ بستان\nبی‌لاله‌عذار خوش نباشد\nرقصیدن سرو و حالتِ گُل\nبی‌صوتِ هَزار خوش نباشد\nبا یارِ شکرلبِ گل‌اندام\nبی‌بوس و کنار خوش نباشد\nهر نقش که دستِ عقل بندد\nجز نقشِ نگار، خوش نباشد\nجان نقدِ مُحَقَّر است حافظ\nاز بهرِ نثار خوش نباشد"},{"id":164,"poem":"نفسِ بادِ صبا مُشک‌فشان خواهد شد\nعالَمِ پیر دگرباره جوان خواهد شد\nارغوان جامِ عقیقی به سمن خواهد داد\nچشمِ نرگس به شقایق نگران خواهد شد\nاین تَطاول که کشید از غمِ هجران بلبل\nتا سراپردهٔ گل نعره‌زنان خواهد شد\nگر ز مسجد به خرابات شدم خرده مگیر\nمجلس وعظ دراز است و زمان خواهد شد\nای دل ار عشرتِ امروز به فردا فکنی\nمایهٔ نقدِ بقا را که ضَمان خواهد شد؟\nماه شعبان مَنِه از دست قدح، کاین خورشید\nاز نظر تا شبِ عیدِ رمضان خواهد شد\nگل عزیز است غنیمت شِمُریدَش صحبت\nکه به باغ آمد از این راه و از آن خواهد شد\nمطربا مجلسِ انس است غزل خوان و سرود\nچند گویی که چنین رفت و چنان خواهد شد؟\nحافظ از بهر تو آمد سویِ اقلیمِ وجود\nقدمی نِه به وداعش که روان خواهد شد"},{"id":165,"poem":"مرا مِهر سیَه چشمان ز سر بیرون نخواهد شد\nقضای آسمان است این و دیگرگون نخواهد شد\nرقیب آزارها فرمود و جایِ آشتی نگذاشت\nمگر آهِ سحرخیزان سویِ گردون نخواهد شد؟\nمرا روزِ ازل کاری به جز رندی نفرمودند\nهر آن قسمت که آن جا رفت از آن افزون نخواهد شد\nخدا را محتسب ما را به فریادِ دَف و نِی بخش\nکه سازِ شرع از این افسانه بی‌قانون نخواهد شد\nمجالِ من همین باشد که پنهان عشقِ او ورزم\nکنار و بوس و آغوشش چه گویم چون نخواهد شد\nشرابِ لعل و جایِ امن و یارِ مهربان ساقی\nدلا کی بِه شود کارت اگر اکنون نخواهد شد\nمشوی ای دیده نقشِ غم ز لوحِ سینهٔ حافظ\nکه زخمِ تیغِ دلدار است و رنگِ خون نخواهد شد"},{"id":166,"poem":"روزِ هجران و شبِ فُرقَتِ یار آخر شد\nزدم این فال و گذشت اختر و کار آخر شد\nآن همه ناز و تَنَعُّم که خزان می‌فرمود\nعاقبت در قدمِ بادِ بهار آخر شد\nشُکرِ ایزد که به اقبالِ کُلَه گوشهٔ گُل\nنَخوَتِ بادِ دی و شوکتِ خار آخر شد\nصبحِ امّید که بُد معتکفِ پردهٔ غیب\nگو برون آی که کارِ شبِ تار آخر شد\nآن پریشانیِ شب‌هایِ دراز و غمِ دل\nهمه در سایهٔ گیسویِ نگار آخر شد\nباورم نیست ز بدعهدی ایام هنوز\nقصهٔ غصه که در دولتِ یار آخر شد\nساقیا لطف نمودی قدحت پُر مِی باد\nکه به تدبیرِ تو تشویشِ خُمار آخر شد\nدر شمار ار چه نیاورد کسی حافظ را\nشُکرْ کان محنتِ بی‌حدّ و شمار آخر شد"},{"id":167,"poem":"ستاره‌ای بدرخشید و ماهِ مجلس شد\nدل رمیدهٔ ما را رفیق و مونس شد\nنگارِ من که به مکتب نرفت و خط ننوشت\nبه غمزه مسأله‌آموزِ صد مُدَرِّس شد\nبه بویِ او دلِ بیمارِ عاشقان چو صبا\nفدایِ عارضِ نسرین و چشمِ نرگس شد\nبه صدرِ مَصطَبه‌ام می‌نِشانَد اکنون دوست\nگدایِ شهر نِگَه کُن که میرِ مجلس شد\nخیالِ آبِ خِضِر بست و جامِ اسکندر\nبه جرعه‌نوشیِ سلطان ابوالفَوارِس شد\nطرب‌سرایِ محبت کنون شود مَعمور\nکه طاقِ اَبرویِ یارِ مَنَش مهندس شد\nلب از تَرَشُّحِ مِی پاک کن برایِ خدا\nکه خاطرم به هزاران گُنَه مُوَسوِس شد\nکرشمهٔ تو شرابی به عاشقان پیمود\nکه عِلم بی‌خبر افتاد و عقل بی‌حس شد\nچو زر عزیزِ وجود است نظمِ من، آری\nقبولِ دولتیان کیمیایِ این مس شد\nز راهِ میکده یاران عِنان بگردانید\nچرا که حافظ از این راه رفت و مفلس شد"},{"id":168,"poem":"گداخت جان که شود کارِ دل تمام و نشد\nبسوختیم در این آرزویِ خام و نشد\nبه لابه گفت شبی میرِ مجلسِ تو شوم\nشدم به رغبتِ خویشش کمین غلام و نشد\nپیام داد که خواهم نشست با رندان\nبشد به رندی و دُردی کشیم نام و نشد\nرواست در بَر اگر می‌تَپَد کبوترِ دل\nکه دید در رهِ خود تاب و پیچِ دام و نشد\nبدان هوس که به مستی ببوسم آن لبِ لعل\nچه خون که در دلم افتاد همچو جام و نشد\nبه کویِ عشق مَنِه بی دلیلِ راه، قدم\nکه من به خویش نمودم صد اهتمام و نشد\nفغان که در طلبِ گنج نامهٔ مقصود\nشدم خرابِ جهانی ز غم تمام و نشد\nدریغ و درد که در جست و جوی گنجِ حضور\nبسی شدم به گدایی بَرِ کِرام و نشد\nهزار حیله برانگیخت حافظ از سرِ فکر\nدر آن هوس که شود آن نگار رام و نشد"},{"id":169,"poem":"یاری اندر کس نمی‌بینیم، یاران را چه شد؟\nدوستی کِی آخر آمد؟ دوست‌دار‌ان را چه شد؟\nآب حیوان تیره‌گون شد، خضر فرخ‌پِی کجاست؟\nخون چکید از شاخِ گل، بادِ بهار‌ان را چه شد؟\nکس نمی‌گوید که «یاری داشت حقِّ دوستی»\nحق‌شناسان را چه حال افتاد؟ یاران را چه شد؟\nلعلی از کانِ مُروّت برنیامد سال‌هاست\nتابش خورشید و سعی باد و باران را چه شد؟\nشهرِ یاران بود و خاکِ مهر‌بانان این دیار\nمهربانی کِی سر آمد؟ شهرِ یار‌ان را چه شد؟\nگویِ توفیق و کرامت، در میان افکنده‌اند\nکس به میدان در نمی‌آید، سوار‌ان را چه شد؟\nصدهزاران گل شکفت و بانگِ مرغی برنخاست\nعندلیبان را چه پیش آمد؟ هَزاران را چه شد؟\nزهره سازی خوش نمی‌سازد، مگر عود‌ش بسوخت؟\nکس ندارد ذوقِ مستی، مِی‌گسار‌ان را چه شد؟\nحافظ اسرارِ الهی کَس نمی‌داند، خموش\nاز که می‌پرسی که دورِ روزگار‌ان را چه شد؟"},{"id":170,"poem":"زاهدِ خلوت‌نشین، دوش به مِیخانه شد\nاز سرِ پیمان بِرَفت، با سرِ پیمانه شد\nصوفیِ مجلس که دی، جام و قدح می‌شکست\nباز به یک جرعه می، عاقل و فرزانه شد\nشاهدِ عهدِ شباب، آمده بودش به خواب\nباز به پیرانه‌سر‌، عاشق و دیوانه شد\nمُغْ‌بَچه‌ای می‌گذشت، راهزنِ دین و دل\nدر پِیِ آن آشنا، از همه بیگانه شد\nآتشِ رخسارِ گُل، خرمنِ بلبل بسوخت\nچهرهٔ خندانِ شمع، آفتِ پروانه شد\nگریهٔ شام و سحر، شُکر که ضایع نگشت\nقطرهٔ بارانِ ما، گوهرِ یک‌دانه شد\nنرگسِ ساقی بِخوانْد، آیتِ افسون‌گری\nحلقهٔ اورادِ ما، مجلسِ افسانه شد\nمنزلِ حافظ کنون، بارگهِ پادشاست\nدل بَرِ دل‌دار رفت، جان بَرِ جانانه شد"},{"id":171,"poem":"دوش از جنابِ آصف، پیکِ بشارت آمد\nکز حضرتِ سلیمان، عشرت اشارت آمد\nخاکِ وجود ما را، از آبِ دیده گِل کن\nویران‌سرایِ دل را، گاهِ عمارت آمد\nاین شرحِ بی‌نهایت، کز زلفِ یار گفتند\nحرفی‌ست از هزاران، کاَندر عبارت آمد\nعیبم بپوش زنهار، ای خرقهٔ مِی‌آلود\nکآن پاکْ پاک‌دامن، بهرِ زیارت آمد\nامروز جایِ هر کس، پیدا شود ز خوبان\nکآن ماهِ مجلس‌افروز، اندر صدارت آمد\nبر تختِ جم که تاجش، معراجِ آسمان است\nهمّت نگر که موری، با آن حقارت آمد\nاز چشمِ شوخش ای دل! ایمانِ خود نگه دار\nکآن جادویِ کمانکش، بر عزمِ غارت آمد\nآلوده‌ای تو حافظ، فیضی ز شاه درخواه\nکآن عنصرِ سَماحت، بهرِ طهارت آمد\nدریاست مجلسِ او، دَریاب وقت و دُر یاب\nهان ای زیان‌رسیده وقتِ تجارت آمد"},{"id":172,"poem":"عشقِ تو نهالِ حیرت آمد\nوصلِ تو کمالِ حیرت آمد\nبس غرقهٔ حالِ وصل کآخر\nهم بر سرِ حالِ حیرت آمد\nیک دل بنما که در رَهِ او\nبر چهره نه خالِ حیرت آمد\nنه وصل بِمانَد و نه واصل\nآنجا که خیالِ حیرت آمد\nاز هر طرفی که گوش کردم\nآوازِ سؤالِ حیرت آمد\nشد مُنهَزِم از کمالِ عزّت\nآن را که جلالِ حیرت آمد\nسر تا قدمِ وجودِ حافظ\nدر عشق، نهالِ حیرت آمد"},{"id":173,"poem":"در نمازم خَمِ ابرویِ تو با یاد آمد\nحالتی رفت که محراب به فریاد آمد\nاز من اکنون طمعِ صبر و دل و هوش مدار\nکان تحمّل که تو دیدی همه بر باد آمد\nباده صافی شد و مرغانِ چمن مست شدند\nموسمِ عاشقی و کار به بنیاد آمد\nبویِ بهبود ز اوضاعِ جهان می‌شنوم\nشادی آورد گل و بادِ صبا شاد آمد\nای عروسِ هنر از بخت شکایت مَنِما\nحجلهٔ حُسن بیارای که داماد آمد\nدلفریبانِ نباتی همه زیور بستند\nدلبرِ ماست که با حُسنِ خداداد آمد\nزیرِ بارند درختان که تعلّق دارند\nای خوشا سرو که از بارِ غم آزاد آمد\nمطرب از گفتهٔ حافظ غزلی نَغز بخوان\nتا بگویم که ز عهدِ طربم یاد آمد"},{"id":174,"poem":"مژده ای دل که دگر بادِ صبا بازآمد\nهدهد خوش‌خبر از طَرْفِ سبا بازآمد\nبرکش ای مرغِ سحر نغمهٔ داوودی باز\nکه سلیمانِ گل از بادِ هوا بازآمد\nعارفی کو که کُنَد فَهْم زبانِ سوسن\nتا بپرسد که چرا رفت و چرا بازآمد\nمردمی کرد و کرم لطفِ خداداد به من\nکـ‌آن بتِ ماه‌رخ از راهِ وفا بازآمد\nلاله بویِ میِ نوشین بشنید از دمِ صبح\nداغ‌دل بود، به امّیدِ دوا بازآمد\nچشمِ من در رهِ این قافلهٔ راه بماند\nتا به گوشِ دلم آوازِ دَرا بازآمد\nگرچه حافظ دَرِ رَنجِش زد و پیمان بِشکست\nلطفِ او بین که به لطف از درِ ما بازآمد"},{"id":175,"poem":"صبا به تهنیتِ پیرِ مِی‌فروش آمد\nکه موسمِ طرب و عیش و ناز و نوش آمد\nهوا مسیح‌نفس گشت و باد نافه‌گشای\nدرخت سبز شد و مرغ دَر خروش آمد\nتنورِ لاله چنان برفروخت بادِ بهار\nکه غنچه غرقِ عرق گشت و گل به جوش آمد\nبه گوشِ هوش نیوش از من و به عشرت کوش\nکه این سخن سَحَر از هاتفم به گوش آمد\nز فکرِ تفرقه بازآی تا شوی مجموع\nبه حکمِ آنکه چو شد اهرمن سروش آمد\nز مرغِ صبح ندانم که سوسنِ آزاد\nچه گوش کرد که با دَه زبان خموش آمد\nچه جایِ صحبتِ نامحرم است مجلسِ انس؟\nسرِ پیاله بپوشان که خرقه‌پوش آمد\nز خانقاه به میخانه می‌رود حافظ\nمگر ز مستیِ زهدِ ریا به هوش آمد"},{"id":176,"poem":"سَحَرم دولتِ بیدار به بالین آمد\nگفت برخیز که آن خسرو شیرین آمد\nقدحی درکش و سرخوش به تماشا بخرام\nتا ببینی که نگارت به چه آیین آمد\nمژدگانی بده ای خلوتیِ نافه‌گشای\nکه ز صحرایِ خُتَن آهویِ مُشکین آمد\nگریه آبی به رخِ سوختگان بازآورد\nناله فریادرَسِ عاشقِ مسکین آمد\nمرغِ دل باز هوادارِ کمان‌ابروییست\nای کبوتر نگران باش که شاهین آمد\nساقیا می بده و غم مخور از دشمن و دوست\nکه به کامِ دلِ ما آن بشد و این آمد\nرسمِ بدعهدیِ ایّام چو دید ابرِ بهار\nگریه‌اش بر سمن و سنبل و نسرین آمد\nچون صبا گفتهٔ حافظ بشنید از بلبل\nعَنبرافشان به تماشایِ ریاحین آمد"},{"id":177,"poem":"نه هر که چهره برافروخت دلبری داند\nنه هر که آینه سازد سِکندری داند\nنه هر که طَرْفِ کُلَه کج نهاد و تُند نشست\nکلاه‌داری و آیینِ سروری داند\nتو بندگی چو گدایان به شرطِ مزد مکن\nکه دوست، خود روشِ بنده‌پروری داند\nغلامِ همّتِ آن رندِ عافیت‌سوزم\nکه در گداصفتی کیمیاگری داند\nوفا و عهد نکو باشد ار بیاموزی\nوگر نه هر که تو بینی ستمگری داند\nبباختم دلِ دیوانه و ندانستم\nکه آدمی‌بچه‌ای، شیوهٔ پری داند\nهزار نکتهٔ باریک‌تر ز مو این جاست\nنه هر که سر بتراشد قلندری داند\nمدارِ نقطهٔ بینش ز خالِ توست مرا\nکه قدرِ گوهرِ یک‌دانه جوهری داند\nبه قَدّ و چهره هر آن کس که شاهِ خوبان شد\nجهان بگیرد اگر دادگستری داند\nز شعرِ دلکَشِ حافظ کسی بُوَد آگاه\nکه لطفِ طبع و سخن گفتنِ دَری داند"},{"id":178,"poem":"هر که شد مَحرمِ دل در حرمِ یار بِمانْد\nوان که این کار ندانست در انکار بِمانْد\nاگر از پرده برون شد دلِ من عیب مکن\nشُکرِ ایزد که نه در پردهٔ پندار بِمانْد\nصوفیان واسِتَدَنْد از گروِ مِی همه رَخْت\nدلقِ ما بود که در خانهٔ خَمّار بِمانْد\nمحتسب شیخ شد و فِسقِ خود از یاد بِبُرد\nقصّهٔ ماست که در هر سرِ بازار بِمانْد\nهر مِیِ لعل کز آن دستِ بلورین سِتَدیم\nآبِ حسرت شد و در چشمِ گهربار بِمانْد\nجز دلِ من کز ازل تا به ابد عاشق رفت\nجاودان کس نشنیدیم که در کار بِمانْد\nگشت بیمار که چون چشمِ تو گردد نرگس\nشیوهٔ تو نَشُدَش حاصل و بیمار بِمانْد\nاز صدایِ سخنِ عشق ندیدم خوشتر\nیادگاری که در این گنبدِ دَوّار بِمانْد\nداشتم دلقی و صد عیبِ مرا می‌پوشید\nخرقه رهنِ مِی و مطرب شد و زُنّار بِمانْد\nبر جمالِ تو چنان صورتِ چین حیران شد\nکه حدیثش همه‌جا در در و دیوار بِمانْد\nبه تماشاگَهِ زلفش دلِ حافظ روزی\nشد که بازآید و جاوید گرفتار بِمانْد"},{"id":179,"poem":"رسید مژده که ایّامِ غم نخواهد ماند\nچنان نماند، چنین نیز هم نخواهد ماند\nمن ار چه در نظرِ یار خاک‌سار شدم\nرقیب نیز چنین محترم نخواهد ماند\nچو پرده‌دار به شمشیر می‌زند همه را\nکسی مُقیمِ حریمِ حَرَم نخواهد ماند\nچه جایِ شُکر و شکایت ز نقشِ نیک و بد است؟\nچو بر صحیفهٔ هستی رقم نخواهد ماند\nسرودِ مجلسِ جمشید گفته‌اند این بود\nکه «جامِ باده بیاور که جم نخواهد ماند»\nغنیمتی شِمُر ای شمع وصلِ پروانه!\nکه این معامله تا صبح‌دم نخواهد ماند\nتوانگرا! دلِ درویشِ خود به دست آور\nکه مخزنِ زَر و گنجِ دِرَم نخواهد ماند\nبدین رَواقِ زَبَرجَد نوشته‌اند به زر\nکه «جز نکوییِ اهلِ کرم نخواهد ماند»\nز مهربانیِ جانان طمع مَبر حافظ\nکه نقشِ جور و نشانِ ستم نخواهد ماند"},{"id":180,"poem":"ای پستهٔ تو خنده زده بر حدیثِ قند\nمشتاقم از برای خدا یک شِکَر بخند\nطوبی ز قامتِ تو نیارد که دَم زند\nزین قصّه بگذرم که سخن می‌شود بلند\nخواهی که برنخیزدت از دیده رودِ خون\nدل در وفایِ صحبتِ رودِ کسان مَبَند\nگر جلوه می‌نمایی و گر طعنه می‌زنی\nما نیستیم معتقدِ شیخِ خودپسند\nز آشفتگیِ حالِ من آگاه کِی شود؟\nآن را که دل نگشت گرفتارِ این کمند\nبازارِ شوق گرم شد آن سروْقد کجاست؟\nتا جانِ خود بر آتش رویش کُنم سپند\nجایی که یارِ ما به شِکَرخنده دَم زند\nای پسته کیستی تو، خدا را به خود مخند\nحافظ چو تَرکِ غمزهٔ تُرکان نمی‌کنی\nدانی کجاست جای تو؟ خوارزم یا خُجَند"},{"id":181,"poem":"بعد از این دستِ من و دامنِ آن سروِ بلند\nکه به بالای چَمان از بُن و بیخَم بَرکَنْد\nحاجتِ مطرب و مِی نیست تو بُرقَع بِگُشا\nکه به رقص آوَرَدَم آتشِ رویت چو سپند\nهیچ رویی نشود آینهٔ حجلهٔ بخت\nمگر آن روی که مالَند در آن سُمِّ سمند\nگفتم اسرارِ غمت هر چه بُوَد گو می‌باش\nصبر از این بیش ندارم چه کنم تا کی و چند؟\nمَکُش آن آهویِ مُشکینِ مرا ای صیّاد\nشرم از آن چشمِ سیه دار و مَبَندَش به کمند\nمنِ خاکی که از این در نَتَوانَم برخاست\nاز کجا بوسه زنم بر لبِ آن قصرِ بلند؟\nبازمَستان دل از آن گیسویِ مُشکین حافظ\nزان که دیوانه همان به که بُوَد اندر بند"},{"id":182,"poem":"حَسْبِ حالی نَنِوِشتی و شد ایّامی چند\nمَحرمی کو که فرستم به تو پیغامی چند؟\nما بدان مقصدِ عالی نتوانیم رسید\nهم مگر پیش نَهَد لطفِ شما گامی چند\nچون مِی از خُم به سبو رفت و گُل افکند نقاب\nفرصتِ عیش نگه دار و بزن جامی چند\nقندِ آمیخته با گُل نه علاجِ دلِ ماست\nبوسه‌ای چند برآمیز به دشنامی چند\nزاهد از کوچهٔ رندان به سلامت بگذر\nتا خرابت نکند صحبتِ بدنامی چند\nعیبِ مِی جمله چو گفتی، هنرش نیز بگو\nنفیِ حکمت مکن از بهرِ دلِ عامی چند\nای گدایانِ خرابات خدا یارِ شماست\nچشمِ اِنعام مدارید ز اَنعامی چند\nپیرِ میخانه چه خوش گفت به دُردی‌کشِ خویش\nکه مگو حالِ دلِ سوخته با خامی چند\nحافظ از شوقِ رخِ مِهر‌فروغِ تو بسوخت\nکامگارا نظری کن سویِ ناکامی چند"},{"id":183,"poem":"دوش وقتِ سَحَر، از غُصّه نجاتم دادند\nواندر آن ظلمتِ شب، آبِ حیاتم دادند\nبی‌خود از شَعْشَعِهٔ پرتوِ ذاتم کردند\nباده از جامِ تَجَلّیِّ صفاتم دادند\nچه مبارک‌سَحَری بود و چه فرخنده‌شبی\nآن شبِ قدر که این تازه‌براتم دادند\nبعد از این رویِ من و آینهٔ وصفِ جمال\nکه در آن جا خبر از جلوهٔ ذاتم دادند\nمن اگر کامروا گشتم و خوش‌دل چه عجب؟\nمستحق بودم و این‌ها به زکاتم دادند\nهاتف آن روز به من مژدهٔ این دولت داد\nکه بِدان جور و جفا صبر و ثباتم دادند\nاین همه شهد و شِکر کز سخنم می‌ریزد\nاَجرِ صبری‌ست کز آن شاخِ نباتم دادند\nهمّتِ حافظ و انفاسِ سحرخیزان بود\nکه ز بندِ غمِ ایّام نجاتم دادند"},{"id":184,"poem":"دوش دیدم که ملائک درِ میخانه زدند\nگِلِ آدم بسرشتَند و به پیمانه زدند\nساکنانِ حرمِ سِتر و عفافِ ملکوت\nبا منِ راه‌نشین، بادهٔ مستانه زدند\nآسمان بارِ امانت نتوانست کشید\nقرعهٔ کار به نامِ منِ دیوانه زدند\nجنگِ هفتاد و دو ملت همه را عذر بِنه\nچون ندیدند حقیقت، رهِ افسانه زدند\nشُکرِ ایزد که میانِ من و او صلح افتاد\nصوفیان، رقص‌کنان، ساغرِ شکرانه زدند\nآتش آن نیست که از شعلهٔ او خندد شمع\nآتش آن است که در خرمنِ پروانه زدند\nکس چو حافظ نَگُشاد، از رخِ اندیشه نقاب\nتا سرِ زلفِ سخن را، به قلم شانه زدند"},{"id":185,"poem":"نقدها را بُوَد آیا که عیاری گیرند؟\nتا همه صومعه‌داران، پی کاری گیرند\nمصلحت‌دید من، آن است که یاران، همه کار\nبگذارند و خم طُرّهٔ یاری گیرند\nخوش گرفتند حریفان، سر زلف ساقی\nگر فلکْشان بگذارد که قراری گیرند\nقُوَّتِ بازوی پرهیز به خوبان مفروش!\nکه در این خیل، حصاری به سواری گیرند\nیا‌ رب! این بچهٔ تُرکان چه دلیرند به خون\nکه به تیر مُژه، هر لحظه، شکاری گیرند\nرقص بر شعر تر و نالهٔ نی خوش باشد\nخاصه، رقصی که در آن، دست نگاری گیرند\n«حافظ»! ابنایِ زمان را غم مسکینان نیست\nزین میان گر بتوان؛ بِهْ که کناری گیرند"},{"id":186,"poem":"گر می‌فروش، حاجت رندان روا کند\nایزد، گنه ببخشد و دفع بلا کند\nساقی، به جام عدل بده باده تا گدا\nغیرت نیاورد، که جهان پر‌بلا کند\nحقّا کز این غمان برسد مژدهٔ امان\nگر سالکی، به عهد امانت، وفا کند\nگر رنج پیشت آید و گر راحت ای حکیم!\nنسبت مکن به غیر که این‌ها خدا کند\nدر کارخانه‌ای که ره عقل و فضل نیست\nفهم ضعیف رای فضولی چرا کند؟\nمطرب بساز پرده که کس بی‌اجل نمرد\nوان کاو نه این ترانه سراید خطا کند\nما را که درد عشق و بلای خمار کشت\nیا وصل دوست یا می صافی دوا کند\nجان رفت در سر می و حافظ به عشق سوخت\nعیسی‌دمی کجاست که احیای ما کند؟"},{"id":187,"poem":"دلا! بسوز! که سوز تو، کارها بکند\nنیاز نیم‌شبی، دفع صد بلا بکند\nعتاب یار پری‌چهره، عاشقانه بکش!\nکه یک کرشمه، تلافیّ صد جفا بکند\nز ملک تا ملکوتش، حجاب بردارند\nهر آن که خدمت جام جهان‌نما بکند\nطبیب عشق، مسیحا دم است و مشفق، لیک\nچو درد، در تو نبیند؛ که را دوا بکند؟\nتو با خدای خود انداز کار و دل خوش دار!\nکه رحم اگر نکند مدّعی‌، خدا بکند\nز بخت خفته ملولم، بود که بیداری\nبه وقت فاتحهٔ صبح، یک دعا بکند؟\nبسوخت حافظ و بویی به زلف یار نبرد\nمگر دلالت این دولتش، صبا بکند"},{"id":188,"poem":"مرا به رندی و عشق، آن فضول، عیب کند\nکه اعتراض بر اسرار علم غیب کند\nکمال سرّ محبّت ببین، نه نقص گناه\nکه هر که بی‌هنر افتد، نظر به عیب کند\nز عطر حور بهشت، آن نفس برآید بوی\nکه خاک میکدهٔ ما، عبیر جیب کند\nچُنان زَنَد رَهِ اِسْلام، غَمْزِهٔ ساقی\nکه اجتناب ز صهبا، مگر صهیب کند\nکلید گنج سعادت، قبول اهل دل است\nمباد آن‌که در این نکته، شکّ و ریب کند!\nشبان وادی ایمن، گهی رسد به مراد\nکه چند سال، به جان، خدمت شعیب کند\nز دیده، خون بچکاند فسانهٔ حافظ\nچو یاد وقت زمان شباب و شیب کند"},{"id":189,"poem":"طایرِ دولت اَگر باز گذاری بکند\nیار باز آید و با وصل، قراری بکند\nدیده را دستگهِ دُرّ و گهر، گرچه نمانْد\nبخورد خونی و تدبیرِ نثاری بکند\nدوش گفتم: «بکند لعلِ لبش، چارهٔ من؟»\nهاتفِ غیب، ندا داد که: «آری! بکند»\nکس نیارد برِ او دم زند از قصّهٔ ما\nمگرش بادِ صبا گوش گذاری بکند\nداده‌ام بازِ نظر را به تَذَرْوی پرواز\nبازخواند مگرش نقش و شکاری بکند\nشهر خالیست ز عشّاق؛ بود کز طرفی\nمردی از خویش برون آید و کاری بکند\nکو کریمی که ز بزم طربش، غم‌زده‌ای\nجرعه‌ای درکشد و دفع خُماری بکند؟\nیا وفا، یا خبرِ وصل تو، یا مرگ رقیب\nبود آیا که فلک، زین دو سه، کاری بکند؟\n«حافظا»! گر نروی از در او، هم روزی\nگذری بر سرت از گوشه کناری بکند"},{"id":190,"poem":"کِلْکِ مُشْکینِ تو، روزی که زِ ما یاد کُنَد\nبِبَرَد اَجْرِ دو صَد بَنْدِه کِه آزاد کُنَد\nقاصِدِ مَنْزِلِ سَلْمیٰ که سَلامَت بادَش\nچِه شَوَد، گَر بِه سَلامی، دِلِ ما، شاد کُنَد؟\nاِمْتِحان کُن! کِه بَسی گَنْجِ مُرادَت بِدَهَنْد\nگَر خَرابی چو مَرا، لُطْفِ تو، آباد کُنَد\nیا رَب! اَنْدَر دِلِ آن خُسْروِ شیرین اَنْداز\nکِه بِه رَحْمَت، گُذَری بَر سَرِ فَرْهاد کُنَد!\nشاه را بِهْ بُوَد اَز طاعَتِ صَدسالِه و زُهْد\nقَدْرِ یک ساعَتِه عُمْری کِه دَر او، داد کُنَد\nحالیا، عِشْوِهٔ نازِ تو، زِ بُنْیادَم بُرْد\nتا دِگَربارِه، حَکیمانِه، چِه بُنْیاد کُنَد\nگوهَرِ پاکِ تو از مِدْحَتِ ما مُسْتَغْنی‌ست\nفِکْرِ مَشّاطِه، چِه با حُسْنِ خُداداد کُنَد؟\nرَه نَبُرْدیم بِه مَقْصودِ خود اَنْدَر شیراز\nخُرَّم آن روز که «حافِظ»، رَهِ بَغْداد کُنَد"},{"id":191,"poem":"آن، کیست کز روی کَرَم، با ما وفاداری کند؟\nبر جای بدکاری چو من، یک دم نکوکاری کند؟\nاول، بِه بانگِ نای و نی، آرد به دل، پیغام وی\nوآن‌گه به یک پیمانه می، با من وفاداری کند\nدلبر که جان فرسود از او، کام دلم نگْشود از او\nنومید نتْوان بود از او، باشد که دلداری کند\nگفتم: «گره نگْشوده‌ام، زان طُرّه تا من بوده‌ام»\nگفتا: «مَنَش فرموده‌ام، تا با تو طَرّاری کند»\nپشمینه‌پوش تندخو، از عشق نشنیده‌ست بو\nبا مستی‌اش، رمزی بگو! تا تَرکِ هشیاری کند\nچون من گدای بی‌نشان، مشکل بود یاری چُنان\nسلطان کجا عیشِ نهان، با رندِ بازاری کند؟\nزآن طُرّهٔ پرپیچ و خم، سهل است اگر بینم ستم\nاز بند و زنجیرش چه غم، هر کس که عیّاری کند؟\nشد لشکر غم بی‌عدد، از بخت می‌خواهم مدد\nتا فخرِ دین عبدالصّمد، باشد که غم‌خواری کند\nبا چشم پر نیرنگ او، «حافظ»! مکن آهنگ او!\nکآن طُرِّهٔ شبرنگِ او، بسیار طرّاری کند"},{"id":192,"poem":"سروِ چَمانِ من چرا میلِ چمن نمی‌کند؟\nهمدمِ گل نمی‌شود، یادِ سَمَن نمی‌کند\nدی گِلِه‌ای ز طُرِّه‌اش، کردم و از سرِ فُسوس\nگفت که «این سیاه‌کج، گوش به من نمی‌کند»\nتا دلِ هرزه‌گَردِ من، رفت به چینِ زلفِ او\nزان سفرِ درازِ خود، عزمِ وطن نمی‌کند\nپیشِ کمانِ ابرویش، لابه همی کنم ولی\nگوش کشیده است از آن، گوش به من نمی‌کند\nبا همه عطفِ دامنت، آیدم از صبا عجب\nکز گذرِ تو، خاک را، مُشکِ خُتَن نمی‌کند\nچون ز نسیم می‌شود، زلفِ بنفشه پُرشِکَن\nوه که دلم چه یاد از آن، عهدشکن نمی‌کند\nدل به امیدِ رویِ او، همدمِ جان نمی‌شود\nجان به هوایِ کویِ او، خدمتِ تن نمی‌کند\nساقیِ سیم‌ساقِ من، گر همه دُرد می‌دهد\nکیست که تن چو جامِ مِی، جمله دهن نمی‌کند؟\nدستخوشِ جفا مَکُن، آبِ رُخَم که فیضِ ابر\nبی‌مددِ سِرشکِ من، دُرِ عَدَن نمی‌کند\nکُشتهٔ غمزهٔ تو شد، حافظِ ناشنیده‌پند\nتیغ سزاست هر که را، دَرد، سخن نمی‌کند"},{"id":193,"poem":"در نظربازی ما، بی‌خبران، حیرانند\nمن، چنینم که نمودم؛ دگر ایشان دانند\nعاقلان، نقطهٔ پرگار وجودند ولی\nعشق داند که در این دایره، سرگردانند\nجلوه‌گاه رخ او، دیدهٔ من، تنها نیست\nماه و خورشید، همین آینه می‌گردانند\nعهد ما با لب شیرین‌دهنان بست خدا\nما، همه، بنده و این قوم، خداوندانند\nمفلسانیم و هوای می و مطرب داریم\nآه اگر خرقهٔ پشمین به گرو نستانند!\nوصل خورشید به شب‌پرّهٔ اعمیٰ نرسد\nکه در آن آینه، صاحب‌نظران، حیرانند\nلاف عشق و گِله از یار؟ زهی لاف دروغ!\nعشق‌بازانِ چُنین، مستحقِ هجرانند\nمگرم چشم سیاه تو بیاموزد کار\nورنه مستوری و مستی، همه‌کس نتْوانند\nگر به نُزهتگهِ ارواح بَرَد بویِ تو، باد\nعقل و جان، گوهر هستی به نثار افشانند\nزاهد ار رندیِ «حافظ» نکند فهم، چه شد؟\nدیو بگریزد از آن قوم که قرآن خوانند\nگر شوند آگه از اندیشهٔ ما، مغ‌بَچگان\nبعد از این، خرقهٔ صوفی به گرو نستانند"},{"id":194,"poem":"سَمَن‌بویان، غُبارِ غَم چو بِنْشینَنْد؛ بِنْشانَنْد\nپَری‌رویان، قَرار از دِل چو بِسْتیزَنْد؛ بِسْتانَنْد\nبِه فِتْراکِ جَفا، دِل‌ها چو بَربَنْدَنْد؛ بَربَنْدَنْد\nزِ زُلْفِ عَنْبَرین، جان‌ها چو بُگشایَنْد؛ بِفْشانَنْد\nبِه عُمْری، یِک نَفَس با ما چو بِنْشینَنْد؛ بَرخیزَنْد\nنَهالِ شوق در خاطِر چو بَرخیزَنْد، بِنْشانَنْد\nسِرِشْکِ گوشِه‌گیران را چو دَریابَنْد، دُر یابَنٔد\nرُخِ مِهْر از سَحَرخیزان نَگَردانَنْد، اَگَر دانند\nزِ چَشْمَم، لَعْلِ رُمّانی چو می‌خَنْدَنْد، می‌بارَنْد\nزِ رویَم، رازِ پِنْهانی چو می‌بینَنْد؛ می‌خوانَنْد\nدَوایِ دَرْدِ عاشِق را کسی کاو سَهْل پِنْدارَد\nزِ فِکْر، آنان کِه دَر تَدْبیر درمانند، در مانند\nچو مَنْصور از مُراد آنان که بردارند، بر دارند\nبدین درگاه، «حافِظ» را چو می‌خوانَنْد؛ می‌رانَنْد\nدَر این حَضْرَت چو مُشْتاقان نیاز آرَنْد، ناز آرَنْد\nکِه با این دَرْد اگر دربند درمانند، در مانند"},{"id":195,"poem":"غُلَامِ نَرْگِسِ مَسْتِ تو، تاجداران‌اَنْد\nخَرابِ بادِهٔ لَعْلِ تو، هوشیاران‌اَنْد\nتو را صَبا و مَرا آبِ دیدِه شُد غَمّاز\nوَگَرنَه عاشِق و مَعْشوق، رازداران‌اَنْد\nزِ زیرِ زُلْفِ دوتا چون گُذَر کُنی، بِنْگر\nکِه اَز یَمین و یَسارت چِه سوگواران‌اَنْد!\nگُذار کُن چو صَبا بَر بَنَفْشِه‌زار! و بِبین\nکِه اَز تَطاوُلِ زُلْفَت چِه بی‌قَراران‌اَنْد!\nنَصیبِ ماست بِهِشْت، اِی خُداشِناس! بُرو!\nکِه مُستَحَقِّ کِرامَت، گُناهکاران‌اَنْد\nنَه مَن بر آن گُلِ عارِض، غَزَل‌سُرایم و بَس\nکه عَنْدَلیبِ تو اَز هَر طَرَف، هزاران‌اَنْد\nتو دَسْتگیر شو! اِی خِضْرِ پِی‌خُجَسْتِه! کِه مَن\nپیادِه می‌رَوَم و هَمْرَهان، سَواران‌اَنْد\nبیا به مِیکَدِه! و چِهْرِه، اَرغَوانی کُن!\nمَرو بِه صومَعِه کآنجا سیاه‌کاران‌اَنْد!\nخَلاصِ «حافِظ» از آن زُلْفِ تابدار مَباد!\nکِه بَسْتِگانِ کَمَنْدِ تو، رَسْتگاران‌اَنْد"},{"id":196,"poem":"آنان که خاک را به نظر کیمیا کنند\nآیا بُوَد که گوشهٔ چشمی به ما کنند\nدَردَم نهفته بِه ز طبیبانِ مدعی\nباشد که از خزانهٔ غیبم دوا کنند\nمعشوق چون نقاب ز رخ درنمی‌کشد\nهر کس حکایتی به تَصوّر چرا کنند؟\nچون حُسنِ عاقبت نه به رندی و زاهدی‌ست\nآن بِه که کارِ خود به عنایت رها کنند\nبی معرفت مباش که در من‌یزیدِ عشق\nاهلِ نظر معامله با آشنا کنند\nحالی درونِ پرده بسی فتنه می‌رود\nتا آن زمان که پرده برافتد چه‌ها کنند\nگر سنگ از این حدیث بنالد عجب مدار\nصاحبدلان حکایتِ دل خوش ادا کنند\nمِی خور که صد گناه ز اغیار در حجاب\nبهتر ز طاعتی که به روی و ریا کنند\nپیراهنی که آید از او بویِ یوسفم\nترسم برادران غَیورش قَبا کنند\nبگذر به کویِ میکده تا زُمرِهٔ حضور\nاوقاتِ خود ز بهر تو صرفِ دعا کنند\nپنهان ز حاسدان به خودم خوان که مُنعِمان\nخیرِ نهان برایِ رضایِ خدا کنند\nحافظ دوامِ وصل میسر نمی‌شود\nشاهان کم التفات به حالِ گدا کنند"},{"id":197,"poem":"شاهدان گر دلبری زین سان کنند\nزاهدان را رخنه در ایمان کنند\nهر کجا آن شاخِ نرگس بِشْکُفد\nگُل‌رُخانَش دیده نرگس‌دان کنند\nای جوانِ سَروقَد! گویی بِبَر\nپیش از آن کز قامتت چوگان کنند\nعاشقان را بر سرِ خود حُکم نیست\nهر چه فرمانِ تو باشد آن کنند\nپیشِ چشمم کمتر است از قطره‌ای\nاین حکایت‌ها که از طوفان کنند\nیارِ ما چون گیرد آغازِ سَماع\nقُدسیان بر عرش دست‌افشان کنند\nمردمِ چشمم به خون آغشته شد\nدر کجا این ظلم بر انسان کنند؟\nخوش برآ با غصه، ای دل! کاَهلِ راز\nعیشِ خوش در بوتهٔ هجران کنند\nسر مکش حافظ ز آهِ نیم‌شب\nتا چو صبحت، آینه رخشان کنند"},{"id":198,"poem":"گفتم کِی ام دهان و لبت کامران کنند؟\nگفتا به چشم هر چه تو گویی چُنان کنند\nگفتم خَراجِ مصر طلب می‌کند لبت\nگفتا در این معامله کمتر زیان کنند\nگفتم به نقطهٔ دهنت خود که بُرد راه؟\nگفت این حکایتیست که با نکته‌دان کنند\nگفتم صَنم‌پَرست مشو با صَمَد نشین\nگفتا به کویِ عشق هم این و هم آن کنند\nگفتم هوایِ میکده غم می‌بَرَد ز دل\nگفتا خوش آن کَسان که دلی شادمان کنند\nگفتم شراب و خِرقه نه آیینِ مذهب است\nگفت این عمل به مذهبِ پیرِ مغان کنند\nگفتم ز لَعلِ نوش‌ْلبان پیر را چه سود؟\nگفتا به بوسهٔ شِکَرینَش جوان کنند\nگفتم که خواجه کِی به سرِ حجله می‌رود؟\nگفت آن زمان که مشتری و مَه قِران کنند\nگفتم دعایِ دولت او وِردِ حافظ است\nگفت این دعا ملایکِ هفت آسمان کنند"},{"id":199,"poem":"واعظان کاین جلوه در محراب و منبر می‌کنند\nچون به خلوت می‌روند آن کارِ دیگر می‌کنند!\nمشکلی دارم، زِ دانشمندِ مجلس بازپرس\nتوبه‌فرمایان، چرا خود توبه کم‌تر می‌کنند؟\nگوییا باور نمی‌دارند روزِ داوری\nکاین همه قَلب و دَغَل در کارِ داور می‌کنند\nیا رب این نُودولَتان را با خَرِ خودْشان نشان\nکاین همه ناز از غلامِ تُرک و اَسْتَر می‌کنند\nای گدای خانِقَه، بَرْجَه که در دِیرِ مُغان\nمی‌دهند آبی و دل‌ها را توانگر می‌کنند\nحُسنِ بی‌پایان او، چندان که عاشق می‌کُشد\nزمرهٔ دیگر به عشق از غیب سَر بَر می‌کنند\nبر درِ می‌خانهٔ عشق ای مَلَک، تسبیح گوی\nکاَندر آنجا، طینَتِ آدم مُخَمَّر می‌کنند\nصبح‌دم از عرش می‌آمد خروشی، عقل گفت\n«قُدسیان گویی که شعرِ حافظ از بَر می‌کنند»"},{"id":200,"poem":"دانی که چنگ و عود چه تَقریر می‌کنند؟\nپنهان خورید باده که تَعزیر می‌کنند\nناموسِ عشق و رونقِ عُشّاق می‌بَرند\nعیبِ جوان و سرزنشِ پیر می‌کنند\nجز قلبِ تیره هیچ نشد حاصل و هنوز\nباطل در این خیال که اِکسیر می‌کنند\nگویند رمزِ عشق مگویید و مشنوید\nمشکل حکایتیست که تَقریر می‌کنند\nما از برونِ در شده مغرورِ صد فریب\nتا خود درونِ پرده چه تدبیر می‌کنند\nتشویشِ وقتِ پیرِ مغان می‌دهند باز\nاین سالِکان نگر که چه با پیر می‌کنند\nصد مُلکِ دل به نیم نظر می‌توان خرید\nخوبان در این معامله تقصیر می‌کنند\nقومی به جِدّ و جهد نهادند وصلِ دوست\nقومی دگر حواله به تقدیر می‌کنند\nفِی‌الجُمله اعتماد مکُن بر ثباتِ دهر\nکـ‌این کارخانه‌ایست که تغییر می‌کنند\nمِی خور که شیخ و حافظ و مفتی و محتسب\nچون نیک بنگری همه تزویر می‌کنند"},{"id":201,"poem":"شرابِ بی‌غَش و ساقیِّ خوش دو دامِ رهند\nکه زیرکانِ جهان از کمندشان نَرَهَند\nمن ار چه عاشقم و رند و مست و نامه سیاه\nهزار شُکر که یارانِ شهر بی‌گنهند\nجفا نه پیشهٔ درویشیَست و راهرُوی\nبیار باده که این سالکان نَه مردِ رهند\nمَبین حقیر، گدایانِ عشق را کاین قوم\nشَهانِ بی کمر و خسروانِ بی کُلَهند\nبه هوش باش که هنگامِ بادِ اِستغنا\nهزار خرمنِ طاعت به نیمْ جو ننهند\nمَکُن که کوکبهٔ دلبری شکسته شود\nچو بندگان بِگُریزند و چاکران بِجَهَند\nغلامِ همَّتِ دُردی کشانِ یک رنگم\nنه آن گروه که اَزْرَق لباس و دل سیَهَند\nقدم مَنِه به خرابات جز به شرطِ ادب\nکه سالکانِ درش محرمانِ پادشهند\nجنابِ عشق بلند است همّتی حافظ\nکه عاشقان، رَه بی‌همّتان به خود ندهند"},{"id":202,"poem":"بُوَد آیا که درِ میکده‌ها بگشایند؟\nگره از کارِ فروبستهٔ ما بگشایند؟\nاگر از بهرِ دلِ زاهدِ خودبین بستند\nدل قوی دار که از بهرِ خدا بگشایند\nبه صفایِ دلِ رندانِ صَبوحی‌زدگان\nبس درِ بسته به مِفْتاحِ دعا بگشایند\nنامهٔ تَعزیَتِ دختر رَز بِنْویسید\nتا همه مُغبَچِگان زلفِ دوتا بگشایند\nگیسوی چنگ بِبُرّید به مرگِ مِیِ ناب\nتا حریفان همه خون از مژه‌ها بگشایند\nدرِ میخانه ببستند، خدایا مپسند!\nکه درِ خانهٔ تزویر و ریا بگشایند\nحافظ این خرقه که داری تو ببینی فردا\nکه چه زُنّار ز زیرش به دَغا بگشایند"},{"id":203,"poem":"سال‌ها دفترِ ما در گرو صَهبا بود\nرونقِ می‌کده از درس و دعایِ ما بود\nنیکیِ پیرِ مغان بین که چو ما بدمستان\nهر چه کردیم به چشمِ کَرَمَش زیبا بود\nدفترِ دانش ما جمله بشویید به مِی\nکه فلک دیدم و در قصدِ دلِ دانا بود\nاز بتان آن طلب ار حسن شناسی ای دل\nکاین کسی گفت که در علمِ نظر بینا بود\nدل چو پرگار به هر سو دَوَرانی می‌کرد\nو اندر آن دایره سرگشتهٔ پابرجا بود\nمُطرب از دَردِ محبت عملی می‌پرداخت\nکه حکیمانِ جهان را مژه خون پالا بود\nمی‌شکفتم ز طرب زان که چو گُل بر لبِ جوی\nبر سرم سایهٔ آن سروِ سَهی بالا بود\nپیرِ گلرنگِ من اندر حقِ اَزْرَق‌پوشان\nرخصتِ خُبث نداد ار نه حکایت‌ها بود\nقلبِ اندودهٔ حافظ بَرِ او خرج نشد\nکاین مُعامِل به همه عیبِ نهان بینا بود"},{"id":204,"poem":"یاد باد آن که نَهانَت نظری با ما بود\nرَقَمِ مِهرِ تو بر چهرهٔ ما پیدا بود\nیاد باد آن که چو چَشمت به عِتابم می‌کُشت\nمُعْجِزِ عیسَویَت در لبِ شِکَّرخا بود\nیاد باد آن که صَبوحی زده در مجلسِ انس\nجز من و یار نبودیم و خدا با ما بود\nیاد باد آن که رُخَت شمعِ طَرَب می‌افروخت\nوین دلِ سوخته پروانهٔ ناپروا بود\nیاد باد آن که در آن بزمگَهِ خُلق و ادب\nآن که او خندهٔ مستانه زدی صَهبا بود\nیاد باد آن که چو یاقوتِ قدح خنده زدی\nدر میانِ من و لعلِ تو حکایت‌ها بود\nیاد باد آن که نگارم چو کمر بَربَستی\nدر رکابش مَهِ نو پیکِ جهان‌پیما بود\nیاد باد آن که خرابات‌نشین بودم و مست\nوآنچه در مسجدم امروز کم است آنجا بود\nیاد باد آن که به اصلاحِ شما می‌شد راست\nنظمِ هر گوهرِ ناسُفته که حافظ را بود"},{"id":205,"poem":"تا ز میخانه و مِی نام و نشان خواهد بود\nسرِ ما خاکِ رَهِ پیرِ مُغان خواهد بود\nحلقهٔ پیرِ مغان از ازلم در گوش است\nبر همانیم که بودیم و همان خواهد بود\nبر سرِ تربتِ ما چون گذری همّت خواه\nکه زیارتگَهِ رِندانِ جهان خواهد بود\nبرو ای زاهدِ خودبین که ز چشمِ من و تو\nرازِ این پرده نهان است و نهان خواهد بود\nتُرکِ عاشق‌کُشِ من مست برون رفت امروز\nتا دگر خونِ که از دیده روان خواهد بود\nچشمم آن دَم که ز شوقِ تو نَهَد سر به لَحَد\nتا دَمِ صبحِ قیامت نگران خواهد بود\nبختِ حافظ گر از این گونه مدد خواهد کرد\nزلفِ معشوقه به دستِ دگران خواهد بود"},{"id":206,"poem":"پیش از اینَت بیش از این اندیشهٔ عُشّاق بود\nمِهرورزیِ تو با ما شُهرهٔ آفاق بود\nیاد باد آن صحبتِ شب‌ها که با نوشین لبان\nبحثِ سِرِّ عشق و ذکرِ حلقهٔ عُشّاق بود\nپیش از این کاین سقفِ سبز و طاقِ مینا بَرکِشند\nمَنظَرِ چشمِ مرا ابرویِ جانان طاق بود\nاز دَمِ صبحِ ازل تا آخرِ شامِ ابد\nدوستی و مِهر بر یک عهد و یک میثاق بود\nسایهٔ معشوق اگر افتاد بر عاشق چه شد؟\nما به او محتاج بودیم او به ما مشتاق بود\nحُسنِ مَه رویانِ مجلس گرچه دل می‌بُرد و دین\nبحثِ ما در لطفِ طبع و خوبیِ اخلاق بود\nبر درِ شاهم گدایی نکته‌ای در کار کرد\nگفت بر هر خوان که بِنْشَستَم خدا رزّاق بود\nرشتهٔ تسبیح اگر بُگْسَست معذورم بدار\nدستم اندر دامنِ ساقیِ سیمین ساق بود\nدر شبِ قدر ار صَبوحی کرده‌ام، عیبم مکن\nسرخوش آمد یار و جامی بر کنارِ طاق بود\nشعرِ حافظ در زمانِ آدم اندر باغِ خُلد\nدفترِ نسرین و گُل را زینتِ اوراق بود"},{"id":207,"poem":"یاد باد آن که سرِ کویِ توام منزل بود\nدیده را روشنی از خاکِ درت حاصل بود\nراست چون سوسن و گل از اثرِ صحبتِ پاک\nبر زبان بود مرا آن‌چه تو را در دل بود\nدل چو از پیرِ خِرَد نَقلِ مَعانی می‌کرد\nعشق می‌گفت به شرح آن‌چه بر او مشکل بود\nآه از آن جور و تَطاول که در این دامگَه است\nآه از آن سوز و نیازی که در آن محفل بود\nدر دلم بود که بی‌دوست نباشم هرگز\nچه توان کرد؟ که سعیِ من و دل باطل بود\nدوش بر یادِ حریفان به خرابات شدم\nخُمِ مِی دیدم، خون در دل و پا در گل بود\nبس بِگَشتَم که بپرسم سببِ دردِ فِراق\nمفتیِ عقل در این مسأله لایَعْقِل بود\nراستی خاتمِ فیروزهٔ بواسحاقی\nخوش درخشید ولی دولتِ مُستَعجِل بود\nدیدی آن قهقههٔ کبکِ خِرامان حافظ؟\nکه ز سرپنجهٔ شاهینِ قضا غافل بود"},{"id":208,"poem":"خستگان را چو طلب باشد و قُوَّت نَبُوَد\nگر تو بیداد کنی شرطِ مُروَّت نَبُوَد\nما جفا از تو ندیدیم و تو خود نَپْسَندی\nآنچه در مذهبِ اربابِ طریقت نبود\nخیره آن دیده که آبش نَبَرَد گریهٔ عشق\nتیره آن دل که در او شمعِ محبت نبود\nدولت از مرغِ همایون طلب و سایهٔ او\nزان که با زاغ و زَغَن شَهپَرِ دولت نبود\nگر مدد خواستم از پیرِ مُغان عیب مکن\nشیخ ما گفت که در صومعه همّت نبود\nچون طهارت نَبُوَد کعبه و بتخانه یکیست\nنَبُوَد خیر در آن خانه که عصمت نبود\nحافظا علم و ادب ورز که در مجلسِ شاه\nهر که را نیست ادب لایقِ صحبت نبود"},{"id":209,"poem":"قتلِ این خسته به شمشیرِ تو تقدیر نبود\nور نه هیچ از دلِ بی‌رحمِ تو تقصیر نبود\nمنِ دیوانه چو زلفِ تو رها می‌کردم\nهیچ لایق‌ترم از حلقهٔ زنجیر نبود\nیا رب این آینهٔ حُسن چه جوهر دارد؟\nکه در او آهِ مرا قُوَّتِ تأثیر نبود\nسر ز حسرت به درِ میکده‌ها بَرکردم\nچون شناسایِ تو در صومعه یک پیر نبود\nنازنین‌تر ز قَدَت در چمنِ ناز نَرُست\nخوش‌تر از نقشِ تو در عالمِ تصویر نبود\nتا مگر همچو صبا باز به کویِ تو رَسَم\nحاصلم دوش به جز نالهٔ شبگیر نبود\nآن کشیدم ز تو ای آتشِ هجران که چو شمع\nجز فنای خودم از دستِ تو تدبیر نبود\nآیتی بود عذابْ اَنْدُهِ حافظ بی تو\nکه بَرِ هیچ کَسَش حاجتِ تفسیر نبود"},{"id":210,"poem":"دوش در حلقهٔ ما قصّهٔ گیسویِ تو بود\nتا دلِ شب سخن از سلسلهٔ مویِ تو بود\nدل که از ناوَکِ مژگانِ تو در خون می‌گشت\nباز مشتاقِ کمان‌خانهٔ ابرویِ تو بود\nهم عَفَاالله صبا کز تو پیامی می‌داد\nور نه در کس نرسیدیم که از کویِ تو بود\nعالَم از شور و شرِ عشق خبر هیچ نداشت\nفتنه‌انگیزِ جهان غمزهٔ جادویِ تو بود\nمنِ سرگشته هم از اهلِ سلامت بودم\nدامِ راهم شِکَنِ طُرِّهٔ هندویِ تو بود\nبگشا بندِ قبا تا بگشاید دلِ من\nکه گشادی که مرا بود ز پهلویِ تو بود\nبه وفایِ تو که بر تربتِ حافظ بگذر\nکز جهان می‌شد و در آرزویِ رویِ تو بود"},{"id":211,"poem":"دوش می‌آمد و رخساره برافروخته بود\nتا کجا باز دلِ غمزده‌ای سوخته بود\nرسم عاشق‌کُشی و شیوهٔ شهرآشوبی\nجامه‌ای بود که بر قامتِ او دوخته بود\nجانِ عُشّاق سپندِ رخِ خود می‌دانست\nو آتشِ چهره بدین کار برافروخته بود\nگر‌چه می‌گفت که زارَت بِکُشم می‌دیدم\nکه نهانش نظری با منِ دلسوخته بود\nکفرِ زلفش رَهِ دین می‌زد و آن سنگین‌ دل\nدر پِی‌اش مشعلی از چهره برافروخته بود\nدل بسی خون به کف آورد ولی دیده بریخت\nالله الله، که تلف کرد و که اندوخته بود؟\nیار مَفروش به دنیا که بسی سود نکرد\nآن که یوسف به زَرِ ناسره بفروخته بود\nگفت و خوش گفت برو خرقه بسوزان حافظ\nیا رب این قلب‌شناسی ز که آموخته بود؟"},{"id":212,"poem":"یک دو جامم دی سحرگه اتفاق افتاده بود\nوز لبِ ساقی شرابم در مَذاق افتاده بود\nاز سرِ مستی دگر با شاهدِ عهدِ شباب\nرجعتی می‌خواستم لیکن طلاق افتاده بود\nدر مقاماتِ طریقت هر کجا کردیم سِیر\nعافیت را با نظربازی فِراق افتاده بود\nساقیا جامِ دَمادَم ده که در سِیرِ طریق\nهر که عاشق‌وَش نیامد در نفاق افتاده بود\nای مُعَبِّر مژده‌ای فرما که دوشم آفتاب\nدر شکرخوابِ صبوحی هم وثاق افتاده بود\nنقش می‌بستم که گیرم گوشه‌ای زان چشمِ مست\nطاقت و صبر از خَمِ ابروش طاق افتاده بود\nگر نکردی نصرتِ دین، شاه یحیی، از کَرَم\nکار مُلک و دین ز نظم و اِتِّساق افتاده بود\nحافظ آن ساعت که این نظمِ پریشان می‌نوشت\nطایرِ فکرش به دامِ اشتیاق افتاده بود"},{"id":213,"poem":"گوهرِ مخزنِ اسرار همان است که بود\nحُقِّهٔ مِهر بدان مُهر و نشان است که بود\nعاشقان زُمرهٔ اربابِ امانت باشند\nلاجرم چشمِ گهربار همان است که بود\nاز صبا پرس که ما را همه شب تا دمِ صبح\nبویِ زلفِ تو همان مونسِ جان است که بود\nطالب لعل و گهر نیست وگرنه خورشید\nهم‌چُنان در عملِ معدن و کان است که بود\nکشتهٔ غمزهٔ خود را به زیارت دریاب\nزانکه بیچاره همان دل‌نگران است که بود\nرنگِ خونِ دلِ ما را که نهان می‌داری\nهمچنان در لبِ لعلِ تو عیان است که بود\nزلفِ هندویِ تو گفتم که دگر رَه نزند\nسال‌ها رفت و بدان سیرت و سان است که بود\nحافظا بازنما قصه خونابهٔ چشم\nکه بر این چشمه همان آبِ روان است که بود"},{"id":214,"poem":"دیدم به خوابِ خوش که به دستم پیاله بود\nتعبیر رفت و کار به دولت حواله بود\nچل سال رنج و غصّه کشیدیم و عاقبت\nتدبیرِ ما به دستِ شرابِ دوساله بود\nآن نافهٔ مراد که می‌خواستم ز بخت\nدر چینِ زلفِ آن بتِ مشکین کُلاله بود\nاز دست برده بود خمارِ غمم سحر\nدولت مساعد آمد و مِی در پیاله بود\nبر آستانِ میکده خون می‌خورم مدام\nروزیِّ ما ز خوانِ قَدَر این نَواله بود\nهر کو نکاشت مِهر و ز خوبی گُلی نچید\nدر رهگذارِ باد نگهبانِ لاله بود\nبر طَرْفِ گلشنم گذر افتاد وقتِ صبح\nآن دَم که کارِ مرغِ سحر آه و ناله بود\nدیدیم شعرِ دلکش حافظ به مدحِ شاه\nیک بیت از این قصیده به از صد رساله بود\nآن شاهِ تندحمله که خورشیدِ شیرگیر\nپیشش به روزِ معرکه کمتر غزاله بود"},{"id":215,"poem":"به کویِ میکده یا رب سحر چه مشغله بود؟\nکه جوشِ شاهد و ساقی و شمع و مشعله بود\nحدیثِ عشق که از حرف و صوت مُستَغنیست\nبه نالهٔ دف و نی در خروش و ولوله بود\nمباحثی که در آن مجلسِ جنون می‌رفت\nوَرایِ مدرسه و قال و قیلِ مسأله بود\nدل از کرشمهٔ ساقی به شُکر بود ولی\nز نامساعدیِ بختش اندکی گِلِه بود\nقیاس کردم و آن چشمِ جادوانهٔ مست\nهزار ساحر چون سامریش در گَله بود\nبگفتمش به لبم بوسه‌ای حوالت کن\nبه خنده گفت کِی‌ات با من این معامله بود؟\nز اخترم نظری سعد در رَه است که دوش\nمیان ماه و رخِ یارِ من مُقابله بود\nدهانِ یار که درمانِ دردِ حافظ داشت\nفغان که وقتِ مُرُوَّت چه تنگ حوصله بود"},{"id":216,"poem":"آن یار کز او خانهٔ ما جایِ پَری بود\nسر تا قدمش چون پَری از عیب بَری بود\nدل گفت فروکش کنم این شهر به بویش\nبیچاره ندانست که یارش سفری بود\nتنها نه ز رازِ دلِ من پرده برافتاد\nتا بود فلک، شیوهٔ او پرده‌دری بود\nمنظورِ خردمندِ من آن ماه که او را\nبا حُسنِ ادب شیوهٔ صاحب‌نظری بود\nاز چنگِ مَنَش اختر بَدمِهر به در برد\nآری چه کنم؟ دولتِ دورِ قمری بود\nعُذری بِنِه ای دل، که تو درویشی و او را\nدر مملکتِ حُسن سَرِ تاجْوَری بود\nاوقاتِ خوش آن بود که با دوست به سر رفت\nباقی همه بی‌حاصلی و بی‌خبری بود\nخوش بود لبِ آب و گل و سبزه و نسرین\nافسوس که آن گنجِ روان رهگذری بود\nخود را بکش ای بلبل از این رشک که گُل را\nبا بادِ صبا وقتِ سحر جلوه‌گری بود\nهر گنجِ سعادت که خدا داد به حافظ\nاز یُمنِ دعایِ شب و وِردِ سَحَری بود"},{"id":217,"poem":"مسلمانان مرا وقتی دلی بود\nکه با وی گفتمی گر مشکلی بود\nبه گِردابی چو می‌افتادم از غم\nبه تدبیرش امیدِ ساحلی بود\nدلی همدرد و یاری مصلحت بین\nکه اِستِظهارِ هر اهلِ دلی بود\nز من ضایع شد اندر کویِ جانان\nچه دامنگیر یا رب منزلی بود\nهنر بی‌عیبِ حِرمان نیست لیکن\nز من محروم‌تر کِی سائلی بود؟\nبر این جانِ پریشان رحمت آرید\nکه وقتی کاردانی کاملی بود\nمرا تا عشق تعلیمِ سخن کرد\nحدیثم نکتهٔ هر محفلی بود\nمگو دیگر که حافظ نکته‌دان است\nکه ما دیدیم و محکم جاهلی بود"},{"id":218,"poem":"در ازل هر کو به فیضِ دولت ارزانی بُوَد\nتا ابد جامِ مرادش همدمِ جانی بُوَد\nمن همان ساعت که از مِی خواستم شد توبه کار\nگفتم این شاخ ار دهد باری، پشیمانی بُوَد\nخود گرفتم کَافکَنَم سجاده چون سوسن به دوش\nهمچو گُل بر خِرقه رنگِ مِی مسلمانی بُوَد؟\nبی چراغِ جام در خلوت نمی‌یارم نشست\nزان که کُنجِ اهلِ دل باید که نورانی بُوَد\nهمتِ عالی طلب جامِ مُرَصَّع گو مباش\nرند را آبِ عِنَب یاقوتِ رُمّانی بُوَد\nگرچه بی‌سامان نماید کارِ ما، سهلش مبین\nکاندر این کشور گدایی، رَشکِ سلطانی بُوَد\nنیک نامی خواهی ای دل با بَدان صحبت مدار\nخودپسندی جانِ من بُرهانِ نادانی بُوَد\nمجلسِ اُنس و بهار و بحثِ شعر اندر میان\nنَستَدَن جامِ مِی از جانان گران جانی بُوَد\nدی عزیزی گفت حافظ می‌خورد پنهان شراب\nای عزیزِ من! نه عیب آن بِه که پنهانی بود؟"},{"id":219,"poem":"کنون که در چمن آمد گُل از عَدَم به وجود\nبنفشه در قدمِ او نهاد سر به سجود\nبنوش جامِ صبوحی به نالهٔ دَف و چنگ\nببوس غَبغَب ساقی به نغمهٔ نی و عود\nبه دورِ گُل منشین بی‌شراب و شاهد و چنگ\nکه همچو روزِ بقا هفته‌ای بُوَد معدود\nشد از خروجِ رِیاحین چو آسمان روشن\nزمین، به اخترِ میمون و طالعِ مسعود\nز دستِ شاهدِ نازک‌عِذار عیسی‌دَم\nشراب نوش و رها کن حدیثِ عاد و ثمود\nجهان چو خُلدِ بَرین شد به دورِ سوسن و گل\nولی چه سود که در وِی نه ممکن است خُلُود\nچو گل سوار شَوَد بر هوا سلیمان‌وار\nسحر که مرغ درآید به نغمهٔ داوود\nبه باغ، تازه کن آیینِ دینِ زردشتی\nکنون که لاله برافروخت آتشِ نمرود\nبخواه جامِ صَبوحی به یادِ آصفِ عهد\nوزیرِ مُلکِ سلیمان، عمادِ دین، محمود\nبُوَد که مجلس حافظ به یمن تربیتش\nهر آن چه می‌طلبد جمله باشدش موجود"},{"id":220,"poem":"از دیده خونِ دل همه بر رویِ ما رَوَد\nبر رویِ ما ز دیده چه گویم چه‌ها رَوَد\nما در درونِ سینه هوایی نهفته‌ایم\nبر باد اگر رَوَد دلِ ما زان هوا رود\nخورشیدِ خاوری کُنَد از رَشک جامه چاک\nگر ماهِ مِهرپرورِ من در قبا رود\nبر خاکِ راهِ یار نهادیم رویِ خویش\nبر رویِ ما رواست اگر آشنا رود\nسیل است آبِ دیده و هر کس که بگذرد\nگر خود دلش ز سنگ بُوَد هم ز جا رود\nما را به آبِ دیده شب و روز ماجراست\nزان رهگذر که بر سرِ کویش چرا رود\nحافظ به کوی میکده دایم به صدقِ دل\nچون صوفیانِ صومعه دار از صفا رود"},{"id":221,"poem":"چو دست بر سرِ زلفش زنم به تاب رَوَد\nور آشتی طلبم با سرِ عِتاب رَوَد\nچو ماهِ نو رَهِ بیچارگانِ نَظّاره\nزَنَد به گوشهٔ ابرو و در نقاب رود\nشبِ شراب خرابم کُنَد به بیداری\nوگر به روز شکایت کنم به خواب رود\nطریقِ عشق پرآشوب و فتنه است ای دل\nبیفتد آن که در این راه با شتاب رود\nگدایی درِ جانان به سلطنت مفروش\nکسی ز سایهٔ این در به آفتاب رود؟\nسوادِ نامهٔ مویِ سیاه چون طی شد\nبَیاض کم نَشَوَد گر صد انتخاب رود\nحباب را چو فِتَد بادِ نخوت اندر سر\nکلاه داریَش اندر سرِ شراب رود\nحجابِ راه تویی حافظ از میان برخیز\nخوشا کسی که در این راه بی‌حجاب رود"},{"id":222,"poem":"از سرِ کویِ تو هر کو به ملالت برود\nنرود کارش و آخِر به خجالت برود\nکاروانی که بُوَد بدرقه‌اش حفظِ خدا\nبه تَجَمُّل بنشیند، به جَلالت برود\nسالک از نورِ هدایت بِبَرَد راه به دوست\nکه به جایی نرسد گر به ضَلالت برود\nکامِ خود آخرِ عمر از مِی و معشوق بگیر\nحیفِ اوقات که یک سر به بطالت برود\nای دلیلِ دلِ گم‌گشته! خدا را مددی\nکه غریب اَر نَبَرَد رَه، به دلالت برود\nحکمِ مستوری و مستی همه بر خاتِمَت است\nکس ندانست که آخِر به چه حالت برود\nحافظ از چشمهٔ حکمت به کف آور جامی\nبو که از لوحِ دلت نقشِ جهالت برود"},{"id":223,"poem":"هرگزم نقشِ تو از لوحِ دل و جان نَرَوَد\nهرگز از یادِ من آن سروِ خرامان نَرَوَد\nاز دِماغِ مَنِ سرگشته خیالِ دَهَنَت\nبه جفایِ فلک و غُصهٔ دوران نرود\nدر ازل بست دلم با سرِ زلفت پیوند\nتا ابد سر نَکشَد، وز سرِ پیمان نرود\nهر چه جز بارِ غمت بر دلِ مسکینِ من است\nبرود از دلِ من وز دلِ من آن نرود\nآن چُنان مِهر توام در دل و جان جای گرفت\nکه اگر سر برود، از دل و از جان نرود\nگر رَوَد از پِی خوبان دلِ من معذور است\nدرد دارد چه کُنَد کز پِی درمان نرود\nهر که خواهد که چو حافظ نشود سرگردان\nدل به خوبان ندهد وز پِی ایشان نرود"},{"id":224,"poem":"خوشا دلی که مدام از پِی نظر نرود\nبه هر دَرَش که بخوانند بی‌خبر نرود\nطمع در آن لبِ شیرین نکردَنَم اولی\nولی چگونه مگس از پِی شکر نرود\nسوادِ دیدهٔ غمدیده‌ام به اشک مشوی\nکه نقشِ خالِ توام هرگز از نظر نرود\nز من چو بادِ صبا بویِ خود دریغ مدار\nچرا که بی سرِ زلفِ توام به سر نرود\nدلا مباش چنین هرزه‌گَرد و هرجایی\nکه هیچ کار ز پیشَت بدین هنر نرود\nمکن به چشمِ حقارت نگاه در منِ مست\nکه آبرویِ شریعت بدین قَدَر نرود\nمنِ گدا هوس سروقامتی دارم\nکه دست در کمرش جز به سیم و زر نرود\nتو کز مکارمِ اخلاق عالَمی دگری\nوفایِ عهدِ من از خاطرت به در نرود\nسیاه‌نامه‌تر از خود کسی نمی‌بینم\nچگونه چون قلمم دودِ دل به سر نرود\nبه تاجِ هدهدم از رَه مَبَر که بازِ سفید\nچو باشه در پِی هر صیدِ مختصر نرود\nبیار باده و اول به دستِ حافظ ده\nبه شرطِ آن که ز مجلس سخن به در نرود"},{"id":225,"poem":"ساقی حدیثِ سرو و گل و لاله می‌رود\nوین بحث با ثَلاثهٔ غَسّاله می‌رود\nمِی ده که نوعروسِ چمن حَدِّ حُسن یافت\nکار این زمان ز صنعتِ دَلّاله می‌رود\nشِکَّرشِکن شَوَند همه طوطیانِ هند\nزین قندِ پارسی که به بَنگاله می‌رود\nطِیِّ مکان ببین و زمان در سلوکِ شعر\nکاین طفل یک شبه رَهِ یک ساله می‌رود\nآن چشمِ جادوانهٔ عابدفریب بین\nکش کاروانِ سِحْر ز دنباله می‌رود\nاز رَه مَرو به عشوهٔ دنیا که این عجوز\nمکّاره می‌نشیند و مُحتاله می‌رود\nبادِ بهار می‌وزد از گُلْسِتانِ شاه\nوز ژاله باده در قدحِ لاله می‌رود\nحافظ ز شوقِ مجلس سلطان غیاثِ دین\nغافل مشو که کارِ تو از ناله می‌رود"},{"id":226,"poem":"تَرسَم که اشک، در غمِ ما پرده‌دَر شود\nوین رازِ سر به مُهر به عالَم سَمَر شود\nگویند سنگْ لَعل شود، در مقامِ صبر\nآری شود، وَلیکْ به خونِ جِگِر شود\nخواهَم شُدَن به میکده گریان و دادخواه\nکَز دستِ غَم خلاصِ مَن، آنجا مَگَر شود\nاز هَر کَرانه تیرِ دُعا کَرده‌ام رَوان\nباشَد کَز آن میانه یکی کارگر شود\nای جانْ حَدیثِ ما بَرِ دِلدار بازگو\nلیکن چنان مَگو که صَبا را خَبَر شود\nاز کیمیایِ مِهرِ تو زَر گَشت رویِ مَن\nآری به یُمْنِ لطفِ شُما خاک، زَر شود\nدَر تنگنایِ حِیرتَم از نِخوتِ رَقیب\nیا رَب مَبادْ آن که گدا معتبر شود\nبَس نکته غیرحُسن بِباید که تا کَسی\nمَقبولِ طبعِ مردمِ صاحب‌نظر شود\nاین سَرکشی که کنگرهٔ کاخِ وَصلْ راست\nسَرها بر آستانهٔ او خاکِ دَر شود\nحافظ چو نافهٔ سَرِ زُلفش به دَستِ توست\nدَمْ دَرکَش اَر نِه بادِ صبا را خبر شود"},{"id":227,"poem":"گرچه بر واعظِ شهر این سخن آسان نشود\nتا ریا وَرزَد و سالوس مسلمان نشود\nرِندی آموز و کَرَم کُن که نه چندان هنر است\nحَیَوانی که ننوشد مِی و انسان نشود\nگوهرِ پاک بِباید که شود قابلِ فیض\nوَر نه هر سنگ و گِلی، لؤلؤ و مرجان نشود\nاسمِ اعظم بِکُنَد کارِ خود ای دل! خوش باش\nکه به تَلبیس و حِیَل، دیو مسلمان نشود\nعشق می‌ورزم و امّید که این فَنِّ شریف\nچون هنرهایِ دگر، موجب حِرمان نشود\nدوش می‌گفت که «فردا بدهم کامِ دلت»\nسببی ساز خدایا که پشیمان نشود\nحُسنِ خُلقی زِ خدا می‌طلبم خویِ تو را\nتا دگر خاطرِ ما از تو پریشان نشود\nذره را تا نَبوَد همّتِ عالی حافظ\nطالبِ چشمهٔ خورشیدِ درخشان نشود"},{"id":228,"poem":"گر من از باغِ تو یک میوه بچینم چه شود؟\nپیش پایی به چراغِ تو ببینم چه شود؟\nیا رب اندر کَنَفِ سایهٔ آن سروِ بلند\nگر منِ سوخته یک دَم بنشینم چه شود؟\nآخِر ای خاتَمِ جمشیدِ همایون آثار\nگر فِتَد عکسِ تو بر نقشِ نگینم چه شود؟\nواعظِ شهر چو مِهرِ مَلِک و شَحنه گُزید\nمن اگر مِهرِ نگاری بِگُزینم چه شود؟\nعقلم از خانه به در رفت، وَگَر مِی این است\nدیدم از پیش که در خانهٔ دینم چه شود\nصرف شد عمرِ گرانمایه به معشوقه و مِی\nتا از آنم چه به پیش آید، از اینم چه شود؟\nخواجه دانست که من عاشقم و هیچ نگفت\nحافظ ار نیز بداند که چُنینم چه شود؟"},{"id":229,"poem":"بخت از دهانِ دوست نشانم نمی‌دهد\nدولت خبر ز رازِ نهانم نمی‌دهد\nاز بهرِ بوسه‌ای ز لبش جان همی‌دهم\nاینم همی‌سِتانَد و آنم نمی‌دهد\nمُردم در این فِراق و در آن پرده راه نیست\nیا هست و پرده دار نشانم نمی‌دهد\nزلفش کشید بادِ صبا چرخِ سِفله بین\nکانجا مجالِ بادِ وَزانَم نمی‌دهد\nچندان که بر کنار چو پرگار می‌شدم\nدوران چو نقطه رَه به میانم نمی‌دهد\nشِکَّر به صبر دست دهد عاقبت ولی\nبدعهدیِ زمانه زمانم نمی‌دهد\nگفتم رَوَم به خواب و ببینم جمالِ دوست\nحافظ ز آه و ناله امانم نمی‌دهد"},{"id":230,"poem":"اگر به بادهٔ مُشکین دلم کشد، شاید\nکه بویِ خیر ز زهدِ ریا نمی‌آید\nجهانیان همه گر منعِ من کنند از عشق\nمن آن کنم که خداوندگار فرماید\nطمع ز فیضِ کرامت مَبُر که خُلقِ کریم\nگنه ببخشد و بر عاشقان بِبَخشاید\nمقیمِ حلقهٔ ذکر است دل بدان امّید\nکه حلقه‌ای ز سرِ زلفِ یار بگشاید\nتو را که حُسنِ خداداده هست و حجلهٔ بخت\nچه حاجت است که مَشّاطِه‌ات بیاراید\nچمن خوش است و هوا دلکَش است و مِی بی‌غَش\nکنون به جز دلِ خوش هیچ در نمی‌باید\nجمیله‌ایست عروسِ جهان، ولی هُش دار\nکه این مُخَدَّره در عقدِ کس نمی‌آید\nبه لابه گفتمش ای ماهرُخ چه باشد اگر\nبه یک شِکَر ز تو دلخسته‌ای بیاساید\nبه خنده گفت که حافظ خدای را مَپسَند\nکه بوسهٔ تو رخِ ماه را بیالاید"},{"id":231,"poem":"گفتم غمِ تو دارم گفتا غمَت سرآید\nگفتم که ماهِ من شو گفتا اگر برآید\nگفتم ز مِهروَرزان رسمِ وفا بیاموز\nگفتا ز خوب‌رویان این کار کمتر آید\nگفتم که بر خیالت راهِ نظر ببندم\nگفتا که شب‌رو است او از راهِ دیگر آید\nگفتم که بویِ زلفت گمراهِ عالَمَم کرد\nگفتا اگر بدانی هم اوت رهبر آید\nگفتم خوشا هوایی کز بادِ صبح خیزد\nگفتا خُنُک نسیمی کز کویِ دلبر آید\nگفتم که نوشِ لَعلَت ما را به آرزو کشت\nگفتا تو بندگی کن کاو بنده‌پرور آید\nگفتم دلِ رحیمت کِی عزمِ صلح دارد؟\nگفتا مگوی با کس تا وقتِ آن درآید\nگفتم زمانِ عِشرَت دیدی که چون سر آمد؟\nگفتا خموش حافظ کـاین غصّه هم سر آید"},{"id":232,"poem":"بر سرِ آنم که گر ز دست برآید\nدست به‌کاری زنم که غصّه سرآید\nخلوتِ دل نیست جایِ صحبتِ اَضداد\nدیو چو بیرون رود فرشته درآید\nصحبت حُکّام ظلمتِ شبِ یلداست\nنور ز خورشید جوی بو که برآید\nبر درِ اربابِ بی‌مروّتِ دنیا\nچند نشینی که خواجه کی به درآید\nتَرکِ گدایی مکن که گنج بیابی\nاز نظرِ رهرُوی که در گذر آید\nصالح و طالِح مَتاعِ خویش نمودند\nتا که قبول افتد و که در نظر آید\nبلبلِ عاشق تو عمر خواه که آخِر\nباغ شود سبز و شاخِ گُل به بر‌آید\nغفلتِ حافظ در این سراچه عجب نیست\nهر که به میخانه رفت بی‌خبر آید"},{"id":233,"poem":"دست از طلب ندارم تا کامِ من برآید\nیا تن رسد به جانان یا جان ز تن برآید\nبگشای تربتم را بعد از وفات و بنگر\nکز آتش درونم دود از کفن برآید\nبنمای رخ که خَلقی والِه شَوَند و حیران\nبگشای لب که فریاد از مرد و زن برآید\nجان بر لب است و حسرت در دل که از لبانش\nنگرفته هیچ کامی جان از بدن برآید\nاز حسرتِ دهانش آمد به تنگ جانم\nخود کامِ تنگدستان کی زان دهن برآید\nگویند ذکرِ خیرش در خیلِ عشقبازان\nهر جا که نامِ حافظ در انجمن برآید"},{"id":234,"poem":"چو آفتاب مِی از مشرقِ پیاله برآید\nز باغِ عارِضِ ساقی هزار لاله برآید\nنسیم در سرِ گُل بشکند کُلالهٔ سنبل\nچو از میانِ چمن بویِ آن کُلاله برآید\nحکایتِ شبِ هجران نه آن حکایتِ حالیست\nکه شَمِّه‌ای ز بَیانش به صد رساله برآید\nز گِردِ خوانِ نگونِ فلک طمع نتوان داشت\nکه بی مَلالتِ صد غُصه، یک نَواله برآید\nبه سعیِ خود نتوان بُرد پِی به گوهرِ مقصود\nخیال باشد کاین کار بی حواله برآید\nگرت چو نوحِ نبی صبر هست در غمِ طوفان\nبلا بگردد و کامِ هزارساله برآید\nنسیمِ زلفِ تو چون بگذرد به تربتِ حافظ\nز خاکِ کالبدش صد هزار لاله برآید"},{"id":235,"poem":"زهی خجسته زمانی که یار بازآید\nبه کامِ غمزدگان غمگُسار بازآید\nبه پیشِ خیلِ خیالش کشیدم اَبلقِ چشم\nبدان امید که آن شهسوار بازآید\nاگر نه در خمِ چوگان او رَوَد سَرِ من\nز سر نگویم و سر خود چه کار بازآید\nمقیم بر سرِ راهش نشسته‌ام چون گرد\nبدان هوس که بدین رهگذار بازآید\nدلی که با سرِ زلفین او قراری داد\nگمان مَبَر که بدان دل قرار بازآید\nچه جورها که کشیدند بلبلان از دی\nبه بویِ آن که دگر نوبهار بازآید\nز نقش بندِ قضا هست امید آن حافظ\nکه همچو سرو به دستم نگار بازآید"},{"id":236,"poem":"اگر آن طایرِ قدسی ز دَرَم بازآید\nعمرِ بگذشته به پیرانه سرم بازآید\nدارم امّید بر این اشکِ چو باران که دگر\nبرقِ دولت که بِرَفت از نظرم بازآید\nآن که تاجِ سرِ من خاکِ کفِ پایش بود\nاز خدا می‌طلبم تا به سرم بازآید\nخواهم اندر عقبش رفت به یاران عزیز\nشخصم ار بازنیاید خبرم بازآید\nگر نثارِ قدمِ یارِ گرامی نکنم\nگوهرِ جان به چه کار دگرم بازآید؟\nکوسِ نو دولتی از بامِ سعادت بزنم\nگر ببینم که مَهِ نوسفرم بازآید\nمانِعَش غلغلِ چنگ است و شکرخوابِ صَبوح\nور نه گر بشنود آهِ سحرم بازآید\nآرزومندِ رخِ شاهِ چو ماهم حافظ\nهمتی تا به سلامت ز درم بازآید"},{"id":237,"poem":"نفس برآمد و کام از تو بر نمی‌آید\nفغان که بختِ من از خواب در نمی‌آید\nصبا به چشمِ من انداخت خاکی از کویش\nکه آبِ زندگیم در نظر نمی‌آید\nقدِ بلندِ تو را تا به بَر نمی‌گیرم\nدرختِ کام و مرادم به بَر نمی‌آید\nمگر به رویِ دلارایِ یارِ ما ور نی\nبه هیچ وجه دگر کار بر نمی‌آید\nمقیمِ زلفِ تو شد دل که خوش سَوادی دید\nوز آن غریبِ بلاکش خبر نمی‌آید\nز شَستِ صدق گشادم هزار تیرِ دعا\nولی چه سود یکی کارگر نمی‌آید\nبسم حکایتِ دل هست با نسیمِ سحر\nولی به بختِ من امشب سحر نمی‌آید\nدر این خیال به سر شد زمانِ عمر و هنوز\nبلایِ زلفِ سیاهت به سر نمی‌آید\nز بس که شد دلِ حافظ رمیده از همه کس\nکنون ز حلقهٔ زلفت به در نمی‌آید"},{"id":238,"poem":"جهان بر ابرویِ عید از هِلال وَسمه کشید\nهِلال عید در ابرویِ یار باید دید\nشکسته گشت چو پشتِ هلال قامتِ من\nکمانِ ابرویِ یارم چو وَسمه بازکشید\nمگر نسیمِ خَطَت صبح در چمن بگذشت\nکه گُل به بویِ تو بر تن چو صبح جامه درید\nنبود چنگ و رَباب و نَبید و عود، که بود\nگِلِ وجودِ من آغشتهٔ گلاب و نَبید\nبیا که با تو بگویم غمِ ملالتِ دل\nچرا که بی تو ندارم مَجالِ گفت و شَنید\nبهایِ وصلِ تو گر جان بُوَد خریدارم\nکه جنسِ خوب مُبَصِّر به هر چه دید خرید\nچو ماهِ روی تو در شامِ زلف می‌دیدم\nشبم به رویِ تو روشن چو روز می‌گردید\nبه لب رسید مرا جان و برنیامد کام\nبه سر رسید امید و طلب به سر نرسید\nز شوقِ رویِ تو حافظ نوشت حرفی چند\nبخوان ز نظمش و در گوش کن چو مروارید"},{"id":239,"poem":"رسید مژده که آمد بهار و سبزه دمید\nوظیفه گر برسد، مصرفش گُل است و نَبید\nصَفیرِ مرغ برآمد، بَطِ شراب کجاست؟\nفَغان فتاد به بلبل، نقابِ گُل که کشید؟\nز میوه‌های بهشتی چه ذوق دریابد\nهر آن که سیبِ زَنَخدانِ شاهدی نَگَزید\nمَکُن ز غُصّه شکایت که در طریقِ طلب\nبه راحتی نرسید آن که زحمتی نکشید\nز رویِ ساقی مَه‌وَش گلی بچین امروز\nکه گِردِ عارضِ بُستان خطِ بنفشه دمید\nچُنان کرشمهٔ ساقی دلم ز دست بِبُرد\nکه با کسی دِگَرَم نیست برگِ گفت و شَنید\nمن این مُرَقَّعِ رنگین چو گُل، بخواهم سوخت\nکه پیرِ باده‌فروشش به جُرعه‌ای نخرید\nبهار می‌گذرد دادگسترا دریاب\nکه رفت موسم و حافظ هنوز مِی نچشید"},{"id":240,"poem":"ابرِ آذاری برآمد بادِ نوروزی وزید\nوَجهِ مِی می‌خواهم و مُطرب، که می‌گوید رسید؟\nشاهدان در جلوه و من شرمسارِ کیسه‌ام\nبارِ عشق و مُفلسی صَعب است، می‌باید کشید\nقَحطِ جُود است آبروی خود نمی‌باید فروخت\nباده و گُل از بهایِ خرقه می‌باید خرید\nگوییا خواهد گشود از دولتم کاری که دوش\nمن همی‌کردم دعا و صبحِ صادق می‌دمید\nبا لبی و صد هزاران خنده آمد گل به باغ\nاز کریمی گوییا در گوشه‌ای بویی شنید\nدامنی گر چاک شد در عالمِ رندی چه باک\nجامه‌ای در نیکنامی نیز می‌باید درید\nاین لطایف کز لبِ لَعلِ تو من گفتم، که گفت؟\nوین تَطاول کز سرِ زلفِ تو من دیدم، که دید؟\nعدلِ سلطان گر نپرسد حالِ مظلومانِ عشق\nگوشه‌گیران را ز آسایش طمع باید بُرید\nتیرِ عاشق‌کُش ندانم بر دلِ حافظ که زد\nاین قَدَر دانم که از شعرِ تَرَش خون می‌چکید"},{"id":241,"poem":"معاشران ز حریفِ شبانه یاد آرید\nحقوقِ بندگیِ مخلصانه یاد آرید\nبه وقتِ سرخوشی از آه و ناله عُشّاق\nبه صوت و نغمهٔ چنگ و چَغانه یاد آرید\nچو لطفِ باده کُنَد جلوه در رخِ ساقی\nز عاشقان به سرود و ترانه یاد آرید\nچو در میانِ مراد آورید دستِ امید\nز عهدِ صحبت ما در میانه یاد آرید\nسمندِ دولت اگر چند سرکشیده رَوَد\nز همرهان به سرِ تازیانه یاد آرید\nنمی‌خورید زمانی غمِ وفاداران\nز بی‌وفاییِ دورِ زمانه یاد آرید\nبه وَجهِ مرحمت ای ساکنانِ صدرِ جلال\nز رویِ حافظ و این آستانه یاد آرید"},{"id":242,"poem":"بیا که رایتِ منصورِ پادشاه رسید\nنویدِ فتح و بشارت به مِهر و ماه رسید\nجمالِ بخت ز رویِ ظفر نقاب انداخت\nکمالِ عدل به فریادِ دادخواه رسید\nسپهر، دور خوش اکنون کُنَد که ماه آمد\nجهان به کامِ دل اکنون رسد که شاه رسید\nز قاطعانِ طریق این زمان شوند ایمن\nقوافلِ دل و دانش که مَرد راه رسید\nعزیزِ مصر به رغمِ برادران غیور\nز قعرِ چاه برآمد به اوجِ ماه رسید\nکجاست صوفیِ دَجّال فِعلِ مُلحِدشکل\nبگو بسوز، که مهدیِّ دین پناه رسید\nصبا بگو که چه‌ها بر سرم در این غمِ عشق\nز آتشِ دلِ سوزان و دودِ آه رسید\nز شوقِ رویِ تو شاها بدین اسیرِ فراق\nهمان رسید کز آتش به برگِ کاه رسید\nمرو به خواب که حافظ به بارگاهِ قبول\nز وِردِ نیمْ شب و درسِ صبحگاه رسید"},{"id":243,"poem":"بویِ خوشِ تو هر که ز بادِ صبا شنید\nاز یارِ آشنا سخنِ آشنا شنید\nای شاهِ حُسن، چَشم به حالِ گدا فِکَن\nکـاین گوش بس حکایتِ شاه و گدا شنید\nخوش می‌کنم به بادهٔ مُشکین مَشامِ جان\nکز دلق‌پوشِ صومعه بویِ ریا شنید\nسِرِّ خدا که عارفِ سالِک به کَس نگفت\nدر حیرتم که باده‌فروش از کجا شنید\nیا رب کجاست محرمِ رازی که یک زمان\nدل شرحِ آن دهد که چه گفت و چه‌ها شنید\nاینَش سزا نبود دلِ حق‌گُزارِ من\nکز غمگسارِ خود سخنِ ناسزا شنید\nمحروم اگر شدم ز سرِ کویِ او چه شد؟\nاز گلشنِ زمانه که بویِ وفا شنید؟\nساقی بیا که عشق ندا می‌کند بلند\nکان کس که گفت قصهٔ ما هم ز ما شنید\nما باده زیرِ خرقه نه امروز می‌خوریم\nصد بار پیرِ میکده این ماجرا شنید\nما مِی به بانگِ چنگ نه امروز می‌کشیم\nبس دور شد که گنبدِ چرخ این صدا شنید\nپندِ حکیمْ محضِ صَواب است و عینِ خیر\nفرخنده آن کسی که به سَمعِ رضا شنید\nحافظ، وظیفهٔ تو دعا گفتن است و بس\nدر بَندِ آن مباش که نشنید یا شنید"},{"id":244,"poem":"معاشران! گره از زلفِ یار باز کنید\nشبی خوش‌ است بدین قصه‌اش دراز کنید\nحضورِ خلوتِ اُنس است و دوستان جمعند\nوَ اِنْ یَکاد بخوانید و در فَراز کنید\nرَباب و چنگ به بانگِ بلند می‌گویند\n«که گوشِ هوش به پیغامِ اهلِ راز کنید»\nبه جانِ دوست که غم پرده بر شما نَدَرَد\nگر اعتماد بر الطافِ کارساز کنید\nمیانِ عاشق و معشوق فَرق بسیار است\nچو یار ناز نماید، شما نیاز کنید\nنخست موعظهٔ پیرِ صحبت این حرف است\nکه «از مُصاحبِ ناجِنس اِحتِراز کنید»\nهر آن کسی که در این حلقه نیست زنده به عشق\nبر او نَمُرده، به فتوای من نماز کنید\nوگر طلب کند انعامی از شما حافظ\nحَوالَتَش به لبِ یارِ دل‌نواز کنید"},{"id":245,"poem":"الا ای طوطیِ گویا‌یِ اسرار!\nمبادا خالیَت شَکَّر ز مِنقار\nسَرَت سبز و دلت خوش باد، جاوید\nکه خوش نقشی نمودی از خطِ یار\nسخن سربسته گفتی با حریفان\nخدا را زین معما پرده بردار\nبه رویِ ما زن از ساغر گلابی\nکه خواب‌آلوده‌ایم، ای بختِ بیدار!\nچه رَه بود این که زد در پرده مطرب؟\nکه می‌رقصند با هم مست و هشیار\nاز آن افیون که ساقی در مِی افکند\nحریفان را نه سَر مانَد، نه دَستار\nسِکَندَر را نمی‌بخشند آبی\nبه زور و زر مُیَسَّر نیست این کار\nبیا و حالِ اهلِ درد بشنو\nبه لفظِ اندک و معنیِ بسیار\nبُتِ چینی عدویِ دین و دل‌هاست\nخداوندا دل و دینم نگه دار\nبه مستور‌ان مگو اسرارِ مستی\nحدیثِ جان مگو با نقشِ دیوار\nبه یُمنِ دولتِ منصور شاهی\nعَلَم شد حافظ اندر نظمِ اشعار\nخداوندی به جایِ بندگان کرد\nخداوندا ز آفاتش نگه دار"},{"id":246,"poem":"عید است و آخِرِ گُل و یاران در انتظار\nساقی به رویِ شاه ببین ماه و مِی بیار\nدل برگرفته بودم از ایّام گُل، ولی\nکاری بِکَرد همّت پاکانِ روزه دار\nدل در جهان مَبَند و به مستی سؤال کن\nاز فیض جام و قصهٔ جمشیدِ کامگار\nجز نقدِ جان به دست ندارم شراب کو؟\nکان نیز بر کرشمهٔ ساقی کُنم نثار\nخوش دولتیست خرّم و خوش خسروی کریم\nیا رب ز چشمْ زخمِ زمانش نگاه دار\nمِی خور به شعرِ بنده که زیبی دگر دهد\nجامِ مُرَصَّعِ تو بدین دُرِّ شاهوار\nگر فوت شد سَحور چه نقصان صَبوح هست\nاز مِی کنند روزه گشا طالبانِ یار\nزانجا که پرده پوشیِ عفوِ کریمِ توست\nبر قلب ما ببخش که نقدیست کم عیار\nترسم که روزِ حشر عِنان بر عِنان رَوَد\nتسبیحِ شیخ و خرقهٔ رندِ شرابخوار\nحافظ چو رفت روزه و گل نیز می‌رود\nناچار باده نوش که از دستْ رفتْ کار"},{"id":247,"poem":"صبا ز منزلِ جانان گذر دریغ مدار\nوز او به عاشقِ بی‌دل خبر دریغ مدار\nبه شُکرِ آن که شِکُفتی به کامِ بخت ای گل\nنسیمِ وصل ز مرغِ سحر دریغ مدار\nحریفِ عشقِ تو بودم چو ماهِ نو بودی\nکنون که ماهِ تمامی نظر دریغ مدار\nجهان و هر چه در او هست سهل و مختصر است\nز اهلِ معرفت این مختصر دریغ مدار\nکنون که چشمهٔ قند است لعلِ نوشین‌ات\nسخن بگوی و ز طوطی، شِکَر دریغ مدار\nمکارمِ تو به آفاق می‌بَرَد شاعر\nاز او وظیفه و زادِ سفر دریغ مدار\nچو ذکرِ خیر طلب می‌کنی سخن این است\nکه در بهایِ سخن سیم و زر دریغ مدار\nغبارِ غم بِرَوَد، حال خوش شود حافظ\nتو آبِ دیده از این ره‌گذر دریغ مدار"},{"id":248,"poem":"ای صبا نَکهَتی از کویِ فُلانی به من آر\nزار و بیمارِ غَمَم راحتِ جانی به من آر\nقلب بی‌حاصلِ ما را بزن اکسیرِ مراد\nیعنی از خاکِ درِ دوست نشانی به من آر\nدر کمینگاه نظر با دلِ خویشم جنگ است\nز ابرو و غمزهٔ او تیر و کمانی به من آر\nدر غریبی و فِراق و غمِ دل پیر شدم\nساغرِ مِی ز کفِ تازه جوانی به من آر\nمنکران را هم از این مِی دو سه ساغر بچشان\nوگر ایشان نَستانند روانی به من آر\nساقیا عشرتِ امروز به فردا مَفِکَن\nیا ز دیوانِ قضا خطِّ امانی به من آر\nدلم از دست بِشُد دوش چو حافظ می‌گفت\nکای صَبا نَکهَتی از کویِ فلانی به من آر"},{"id":249,"poem":"ای صبا نَکهَتی از خاکِ رَهِ یار بیار\nبِبَر اندوهِ دل و مژدهٔ دل‌دار بیار\nنکته‌ای روح‌فَزا از دهنِ دوست بگو\nنامه‌ای خوش خبر از عالَمِ اسرار بیار\nتا مُعَطَّر کُنَم از لطفِ نسیمِ تو مَشام\nشَمِّه‌ای از نَفَحاتِ نفسِ یار بیار\nبه وفایِ تو که خاکِ رَهِ آن یارِ عزیز\nبی‌غباری که پدید آید از اغیار بیار\nگَردی از ره‌گذرِ دوست به کوریِّ رقیب\nبهرِ آسایش این دیدهٔ خون‌بار بیار\nخامی و ساده‌دلی شیوهٔ جانبازان نیست\nخبری از بَرِ آن دل‌بر عیّار بیار\nشُکرِ آن را که تو در عِشرتی ای مرغِ چمن\nبه اسیرانِ قفس، مژدهٔ گل‌زار بیار\nکامِ جان تلخ شد از صبر که کردم بی‌دوست\nعشوه‌ای زان لبِ شیرین شِکربار بیار\nروزگاریست که دل چهرهٔ مقصود ندید\nساقیا آن قدحِ آینه‌کردار بیار\nدلقِ حافظ به چه ارزد؟ به مِی‌اش رنگین کن\nوان گَه‌اش مست و خراب از سَرِ بازار بیار"},{"id":250,"poem":"روی بِنْمای و وجودِ خودم از یاد بِبَر\nخَرمنِ سوختگان را همه گو باد بِبَر\nما چو دادیم دل و دیده به طوفانِ بلا\nگو «بیا سیلِ غم و خانه ز بنیاد بِبَر»\nزلفِ چون عَنبَرِ خامَش که ببوید؟ هیهات\nای دلِ خام‌طمع! این سخن از یاد بِبَر\nسینه گو «شعلهٔ آتشکدهٔ فارس بِکُش»\nدیده گو «آبِ رخِ دجلهٔ بغداد بِبَر»\nدولتِ پیرِ مُغان باد که باقی سهل است\nدیگری گو «برو و نامِ من از یاد بِبَر»\nسعی‌نابرده در این راه به جایی نرسی\nمزد اگر می‌طلبی، طاعتِ استاد بِبَر\nروزِ مرگم نفسی وعدهٔ دیدار بده\nوآن گَهَم تا به لَحَد فارغ و آزاد بِبَر\nدوش می‌گفت «به مژگانِ درازت بِکُشم»\nیا رب از خاطرش اندیشهٔ بیداد بِبَر\nحافظ اندیشه کن از نازکیِ خاطرِ یار\nبرو از دَرگَهَش این ناله و فریاد بِبَر"},{"id":251,"poem":"شبِ وصل است و طی شد نامهٔ هَجر\n«سلامٌ فیهِ حَتّی مَطْلَعِ الفَجْر»\nدلا در عاشقی ثابت‌قدم باش\nکه در این رَه نباشد کار بی‌اجر\nمن از رندی نخواهم کرد توبه\nو لو آذَیْتَني بِالْهَجرِ و الْحَجر\nبرآی ای صبحِ روشن‌دل خدا را\nکه بس تاریک می‌بینم شبِ هَجر\nدلم رفت و ندیدم رویِ دل‌دار\nفَغان از این تَطاول، آه از این زَجر\nوفا خواهی، جفاکَش باش حافظ\nفَاِنَّ الرِّبْحَ و الْخُسرانَ فِي التَّجْر"},{"id":252,"poem":"گر بُوَد عمر، به میخانه رَسَم بارِ دِگَر\nبجز از خدمتِ رندان نکنم کارِ دِگَر\nخُرَّم آن روز که با دیدهٔ گریان بِرَوَم\nتا زنم آب درِ میکده یک بارِ دگر\nمعرفت نیست در این قوم خدا را سَبَبی\nتا بَرَم گوهرِ خود را به خریدارِ دگر\nیار اگر رفت و حقِ صحبتِ دیرین نشناخت\nحاشَ لِلَّه که رَوَم من ز پِیِ یارِ دگر\nگر مساعد شَوَدَم دایرهٔ چرخِ کبود\nهم به دست آورمش باز به پرگارِ دگر\nعافیت می‌طلبد خاطرم ار بگذارند\nغمزهٔ شوخَش و آن طرهٔ طَرّارِ دگر\nراز سربستهٔ ما بین که به دستان گفتند\nهر زمان با دف و نی بر سرِ بازارِ دگر\nهر دم از درد بنالم که فلک هر ساعت\nکُنَدَم قصدِ دلِ ریش به آزارِ دگر\nبازگویم نه در این واقعه حافظ تنهاست\nغرقه گشتند در این بادیه بسیارِ دگر"},{"id":253,"poem":"ای خُرَّم از فروغِ رُخَت لاله زارِ عمر\nبازآ که ریخت بی گُلِ رویت بهارِ عمر\nاز دیده گر سرشک چو باران چِکَد رواست\nکاندر غمت چو برق بِشُد روزگارِ عمر\nاین یک دو دَم که مهلتِ دیدار ممکن است\nدریاب کارِ ما که نه پیداست کارِ عمر\nتا کی مِی صَبوح و شِکرخوابِ بامداد\nهشیار گَرد، هان که گذشت اختیارِ عمر\nدی در گذار بود و نظر سویِ ما نکرد\nبیچاره دل که هیچ ندید از گذارِ عمر\nاندیشه از محیطِ فنا نیست هر که را\nبر نقطهٔ دهانِ تو باشد مدارِ عمر\nدر هر طرف ز خیلِ حوادث کمین‌گهیست\nزان رو عِنان‌گسسته دَوانَد سوارِ عمر\nبی عمر زنده‌ام من و این بس عجب مدار\nروز فِراق را که نَهَد در شمارِ عمر\nحافظ سخن بگوی که بر صفحهٔ جهان\nاین نقش مانَد از قَلَمَت یادگارِ عمر"},{"id":254,"poem":"دیگر ز شاخِ سروِ سَهی بلبلِ صبور\nگلبانگ زد که چشمِ بد از رویِ گُل به دور\nای گُل به شُکرِ آن که تویی پادشاهِ حُسن\nبا بلبلانِ بی‌دلِ شیدا مَکُن غرور\nاز دستِ غیبتِ تو شکایت نمی‌کنم\nتا نیست غیبتی نَبُوَد لذّتِ حضور\nگر دیگران به عیش و طَرَب خُرَّمَند و شاد\nما را غمِ نگار بُوَد مایهٔ سُرور\nزاهد اگر به حور و قصور است امیدوار\nما را شرابخانه قصور است و یار حور\nمِی خور به بانگِ چنگ و مخور غصه ور کسی\nگوید تو را که باده مخور گو هُوَالْغَفُور\nحافظ شکایت از غمِ هجران چه می‌کنی؟\nدر هِجر وصل باشد و در ظلمت است نور"},{"id":255,"poem":"یوسفِ گم‌گشته بازآید به کنعان، غم مخور\nکلبهٔ احزان شَوَد روزی گلستان، غم مخور\nای دل غمدیده، حالت بِه شود، دل بَد مکن\nوین سرِ شور
