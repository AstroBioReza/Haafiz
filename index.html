یده باز آید به سامان غم مخور\nگر بهارِ عمر باشد باز بر تختِ چمن\nچتر گل در سر کَشی، ای مرغِ خوشخوان غم مخور\nدورِ گردون گر دو روزی بر مرادِ ما نرفت\nدائماً یکسان نباشد حالِ دوران غم مخور\nهان مَشو نومید چون واقِف نِه‌ای از سِرِّ غیب\nباشد اندر پرده بازی‌هایِ پنهان غم مخور\nای دل اَر سیلِ فنا بنیادِ هستی بَرکَنَد\nچون تو را نوح است کشتیبان، ز طوفان غم مخور\nدر بیابان گر به شوقِ کعبه خواهی زد قدم\nسرزنش‌ها گر کُنَد خارِ مُغیلان غم مخور\nگرچه منزل بس خطرناک است و مقصد بس بعید\nهیچ راهی نیست کآن را نیست پایان، غم مخور\nحال ما در فُرقت جانان و اِبرامِ رقیب\nجمله می‌داند خدایِ حالْ‌گردان غم مخور\nحافظا در کُنجِ فقر و خلوتِ شب‌هایِ تار\nتا بُوَد وِردَت دعا و درس قرآن غم مخور"},{"id":256,"poem":"نصیحتی کُنَمَت بشنو و بهانه مَگیر\nهر آنچه ناصِحِ مُشْفِق بگویَدَت بپذیر\nز وصلِ رویِ جوانان تَمَتُّعی بردار\nکه در کمینگهِ عمر است مَکرِ عالَمِ پیر\nنَعیم هر دو جهان پیش عاشقان بجوی\nکه این متاعِ قلیل است و آن عَطایِ کثیر\nمعاشری خوش و رودی بساز می‌خواهم\nکه دردِ خویش بگویم به نالهٔ بَم و زیر\nبر آن سَرَم که نَنوشَم مِی و گُنَه نکنم\nاگر موافقِ تدبیرِ من شَوَد تقدیر\nچو قسمتِ ازلی بی‌حضورِ ما کردند\nگر اندکی نه به وِفقِ رضاست خرده مگیر\nچو لاله در قَدَحم ریز ساقیا مِی و مُشک\nکه نقشِ خالِ نگارم نمی‌رود ز ضمیر\nبیار ساغرِ دُرِّ خوشاب ای ساقی\nحسود گو کَرَمِ آصفی ببین و بمیر\nبه عزمِ توبه نهادم قدح ز کف صد بار\nولی کرشمهٔ ساقی نمی‌کُنَد تقصیر\nمِی دوساله و محبوبِ چارده ساله\nهمین بس است مرا صُحبتِ صَغیر و کَبیر\nدل رمیدهٔ ما را که پیش می‌گیرد؟\nخبر دهید به مجنونِ خسته از زنجیر\nحدیثِ توبه در این بزمگه مگو حافظ\nکه ساقیان کمان ابرویَت زَنَند به تیر"},{"id":257,"poem":"روی بِنْما و مرا گو که ز جان دل برگیر\nپیشِ شمع آتشِ پروانه به جان گو درگیر\nدر لبِ تشنهٔ ما بین و مدار آب دریغ\nبر سَرِ کُشتهٔ خویش آی و ز خاکَش برگیر\nتَرکِ درویش مگیر ار نَبُوَد سیم و زَرَش\nدر غَمَت سیمْ شُمار اشک و رُخَش را زر گیر\nچنگ بِنْواز و بساز ار نَبُوَد عود چه باک؟\nآتشم عشق و دلم عود و تَنَم مِجمَر گیر\nدر سَماع آی و ز سر خرقه برانداز و برقص\nور نه با گوشه رو و خرقهٔ ما در سر گیر\nصوف بَرکَش ز سر و بادهٔ صافی دَرکَش\nسیم در باز و به زر سیمبَری در بر گیر\nدوست گو یار شو و هر دو جهان دشمن باش\nبخت گو پشت مَکُن، رویِ زمین لشکر گیر\nمیل رفتن مَکُن ای دوست دَمی با ما باش\nبر لبِ جوی، طرب جوی و به کف ساغر گیر\nرفته گیر از بَرَم و زآتش و آبِ دل و چشم\nگونه‌ام زرد و لبم خشک و کنارم تَر گیر\nحافظ آراسته کن بزم و بگو واعظ را\nکه ببین مجلسم و تَرکِ سَرِ منبر گیر"},{"id":258,"poem":"هزار شُکر که دیدم به کامِ خویشت باز\nز رویِ صدق و صفا گشته با دلم دَمساز\nرَوَندگانِ طریقت رَهِ بلا سِپَرَند\nرفیقِ عشق چه غم دارد از نَشیب و فراز\nغمِ حبیب نهان بِه ز گفت و گوی رقیب\nکه نیست سینهٔ اربابِ کینه‌، محرمِ راز\nاگر چه حُسنِ تو از عشقِ غیر مُستَغنی‌ست\nمن آن نیَم که از این عشق‌بازی آیم باز\nچه گویَمَت که ز سوزِ درون چه می‌بینم\nز اشک پُرس حکایت که من نیَم غَمّاز\nچه فتنه بود که مَشّاطِهٔ قضا انگیخت\nکه کرد نرگسِ مستش سیَه به سرمهٔ ناز\nبدین سپاس که مجلس مُنَوَّر است به دوست\nگَرَت چو شمع جفایی رِسَد بسوز و بساز\nغَرَض کِرشمهٔ حُسن است ور نه حاجت نیست\nجمالِ دولتِ محمود را به زلفِ ایاز\nغزل سُرایی ناهید صرفه‌ای نَبَرَد\nدر آن مَقام که حافظ برآورد آواز"},{"id":259,"poem":"منم که دیده به دیدارِ دوست کردم باز\nچه شُکر گویَمَت ای کارسازِ بنده نواز؟\nنیازمندِ بلا گو رخ از غبار مَشوی\nکه کیمیایِ مراد است، خاکِ کویِ نیاز\nز مشکلاتِ طریقت عِنان مَتاب ای دل!\nکه مردِ راه نَیَندیشد از نَشیب و فراز\nطهارت ار نه به خونِ جگر کُنَد عاشق\nبه قولِ مُفتیِ عشقش درست نیست نماز\nدر این مقامِ مجازی به جز پیاله مگیر\nدر این سراچهٔ بازیچه، غیرِ عشق مَباز\nبه نیم‌بوسه دعایی بخر ز اهلِ دلی\nکه کِیدِ دشمنت از جان و جسم دارد باز\nفِکَنْد زمزمهٔ عشق در حجاز و عراق\nنوایِ بانگِ غزل‌هایِ حافظ از شیراز"},{"id":260,"poem":"ای سروِ نازِ حُسن که خوش می‌روی به ناز\nعُشّاق را به نازِ تو هر لحظه صد نیاز\nفرخنده باد طلعتِ خوبت که در ازل\nبُبْریده‌اند بر قدِ سَرْوَت قبایِ ناز\nآن را که بویِ عَنبر زلفِ تو آرزوست\nچون عود گو بر آتشِ سودا بسوز و ساز\nپروانه را ز شمع بُوَد سوزِ دل، ولی\nبی شمعِ عارضِ تو دلم را بُوَد گداز\nصوفی که بی تو توبه ز مِی کرده بود، دوش\nبِشْکَست عهد، چون درِ میخانه دید باز\nاز طعنهٔ رقیب نگردد عیارِ من\nچون زر اگر برَند مرا در دهانِ گاز\nدل کز طوافِ کعبهٔ کویت وقوف یافت\nاز شوقِ آن حریم ندارد سرِ حجاز\nهر دَم به خونِ دیده چه حاجت وضو؟ چو نیست\nبی طاقِ ابروی تو، نمازِ مرا جواز\nچون باده باز بر سرِ خُم رفت کف‌زنان\nحافظ که دوش از لبِ ساقی شنید راز"},{"id":261,"poem":"درآ که در دلِ خسته، توان درآید باز\nبیا که در تنِ مُرده، رَوان درآید باز\nبیا که فُرقَتِ تو، چشمِ من چنان در بست\nکه فتحِ بابِ وصالت مگر گشاید باز\nغمی که چون سپهِ زنگ، مُلکِ دل بگرفت\nز خیلِ شادیِ رومِ رُخَت زُدایَد باز\nبه پیشِ آینهٔ دل هر آن چه می‌دارم\nبه جز خیالِ جمالت، نمی‌نماید باز\nبدان مَثَل که شب آبستن است روز از تو\nستاره می‌شِمُرَم تا که شب چه زاید باز\nبیا که بلبلِ مطبوعِ خاطرِ حافظ\nبه بویِ گُلبُنِ وصلِ تو می‌سُراید باز"},{"id":262,"poem":"حالِ خونین دلان که گوید باز؟\nوز فلک خونِ خُم که جوید باز؟\nشرمش از چشمِ مِی پرستان باد\nنرگسِ مست اگر بروید باز\nجز فَلاطونِ خُم نشینِ شراب\nسِرِّ حکمت به ما که گوید باز؟\nهر که چون لاله کاسه گَردان شد\nزین جفا رُخ به خون بشوید باز\nنَگُشایَد دلم چو غنچه اگر\nساغری از لبش نبوید باز\nبس که در پرده چنگ گفت سخن\nبِبُرَش موی تا نَمویَد باز\nگِردِ بیتُ الحَرامِ خُم حافظ\nگر نمیرد به سَر بپوید باز"},{"id":263,"poem":"بیا و کَشتیِ ما در شَطِ شراب انداز\nخروش و وِلوِله در جانِ شیخ و شاب انداز\nمرا به کَشتیِ باده درافکن ای ساقی!\nکه گفته‌اند «نِکویی کن و در آب انداز»\nز کویِ میکده برگشته‌ام ز راهِ خطا\nمرا دگر ز کَرَم با رهِ صواب انداز\nبیار زآن مِی گلرنگِ مشک‌بو جامی\nشرارِ رَشک و حسد در دلِ گلاب انداز\nاگر چه مست و خرابم، تو نیز لطفی کن\nنظر بر این دلِ سرگشتهٔ خراب انداز\nبه نیم‌شب اگرت آفتاب می‌باید\nز رویِ دخترِ گُل‌چهرِ رز، نقاب انداز\nمَهِل که روزِ وفاتم به خاک بسپارند\nمرا به میکده بَر، در خُمِ شراب انداز\nز جورِ چرخ چو حافظ به جان رسید دلت\nبه سویِ دیو مِحَن، ناوَکِ شهاب انداز"},{"id":264,"poem":"خیز و در کاسهٔ زر آبِ طَرَبناک انداز\nپیشتر زان که شَوَد کاسهٔ سَر خاک‌ انداز\nعاقبت منزلِ ما وادیِ خاموشان است\nحالیا غُلغُله در گنبدِ افلاک انداز\nچشمِ آلوده‌نظر، از رخِ جانان دور است\nبر رخِ او نظر از آینهٔ پاک انداز\nبه سرِ سبزِ تو ای سرو که گر خاک شَوَم\nناز از سَر بِنِه و سایه بر این خاک انداز\nدلِ ما را که ز مارِ سرِ زلفِ تو بِخَست\nاز لبِ خود به شفاخانهٔ تریاک انداز\nمُلکِ این مزرعه دانی که ثباتی ندهد\nآتشی از جگرِ جام، در املاک انداز\nغسل در اشک زدم کَاهلِ طریقت گویند\nپاک شو اول و پس دیده بر آن پاک انداز\nیا رب آن زاهدِ خودبین که به جز عیب ندید\nدودِ آهیش در آیینهٔ اِدراک انداز\nچون گُل از نَکهَتِ او جامه قبا کن حافظ\nوین قبا در رَهِ آن قامتِ چالاک انداز"},{"id":265,"poem":"برنیامد از تمنّایِ لَبَت کامم هنوز\nبر امید جامِ لعلت دُردی‌آشامم هنوز\nروز اول رفت دینم در سرِ زلفین تو\nتا چه خواهد شد در این سودا سرانجامم هنوز\nساقیا یک جرعه‌ای زان آبِ آتش‌گون که من\nدر میانِ پُختگانِ عشقِ او خامم هنوز\nاز خطا گفتم شبی زلفِ تو را مُشکِ خُتَن\nمی‌زند هر لحظه تیغی مو بر اندامم هنوز\nپرتوِ رویِ تو تا در خلوتم دید آفتاب\nمی‌رود چون سایه هر دَم، بر در و بامم هنوز\nنام من رفته‌ست روزی بر لبِ جانان به سَهو\nاهلِ دل را بویِ جان می‌آید از نامم هنوز\nدر ازل داده‌ست ما را ساقیِ لعلِ لبت\nجرعهٔ جامی که من مَدهوشِ آن جامم هنوز\nای که گفتی جان بده تا باشَدَت آرامِ جان\nجان به غم‌هایش سپردم، نیست آرامم هنوز\nدر قلم آورد حافظ قصهٔ لَعلِ لَبَش\nآب حیوان می‌رود هر دَم ز اقلامم هنوز"},{"id":266,"poem":"دلم رمیدهٔ لولی‌وَشیست شورانگیز\nدروغ‌وَعده و قَتّال‌وَضع و رنگ‌آمیز\nفدایِ پیرهنِ چاکِ ماهرویان باد\nهزار جامهٔ تقوی و خرقهٔ پرهیز\nخیالِ خالِ تو با خود به خاک خواهم برد\nکه تا ز خالِ تو خاکم شود عَبیرآمیز\nفرشته عشق نداند که چیست، ای ساقی\nبِخواه جام و گلابی به خاکِ آدم ریز\nپیاله بر کفنم بند، تا سحرگهِ حَشر\nبه مِی ز دل بِبَرَم هولِ روزِ رستاخیز\nفقیر و خسته به درگاهت آمدم رحمی\nکه جز وِلایِ تواَم نیستْ هیچْ دست آویز\nبیا که هاتفِ میخانه دوش با من گفت\nکه در مَقامِ رضا باش و از قَضا مَگریز\nمیانِ عاشق و معشوق هیچ حائل نیست\nتو خود حجابِ خودی حافظ از میان برخیز"},{"id":267,"poem":"ای صبا گر بُگذری بر ساحلِ رودِ اَرَس\nبوسه زن بر خاکِ آن وادی و مُشکین کُن نَفَس\nمنزلِ سَلمی که بادَش هر دَم از ما صد سلام\nپُر صدایِ ساربانان بینی و بانگِ جرس\nمَحمِلِ جانان ببوس، آن‌گه به زاری عَرضه دار\nکز فِراقت سوختم ای مهربان فریاد رس\nمن که قولِ ناصحان را خواندَمی قولِ رَباب\nگوش‌مالی دیدم از هجران که اینم پند بس\nعشرتِ شب‌گیر کن، مِی نوش کاندر راهِ عشق\nشَب‌رُوان را آشنایی‌هاست با میرِ عَسَس\nعشق‌بازی کارِ بازی نیست ای دل! سر بِباز\nزان که گویِ عشق نَتْوان زد به چوگانِ هوس\nدل به رَغبت می‌سپارد جان به چشمِ مستِ یار\nگر چه هشیاران ندادند اختیارِ خود به کس\nطوطیان در شِکَّرِستان کامرانی می‌کنند\nو از تَحَسُّر دست بر سر می‌زند مسکین مگس\nنامِ حافظ گر برآید بر زبانِ کِلکِ دوست\nاز جنابِ حضرتِ شاهم بس است این مُلتَمَس"},{"id":268,"poem":"گُلعِذاری ز گلستانِ جهان ما را بس\nزین چمن سایهٔ آن سروِ روان ما را بس\nمن و همصحبتیِ اهلِ ریا دورَم باد\nاز گرانانِ جهان، رَطلِ گران ما را بس\nقصرِ فردوس به پاداشِ عمل می‌بخشند\nما که رندیم و گدا، دیرِ مُغان ما را بس\nبنشین بر لبِ جوی و گذرِ عمر ببین\nکاین اشارت ز جهانِ گذران، ما را بس\nنقدِ بازارِ جهان بِنگر و آزارِ جهان\nگر شما را نه بس این سود و زیان ما را بس\nیار با ماست، چه حاجت که زیادت طلبیم؟\nدولتِ صحبتِ آن مونسِ جان ما را بس\nاز درِ خویش خدا را به بهشتم مَفرست\nکه سرِ کویِ تو از کون و مکان ما را بس\nحافظ از مَشْرَبِ قسمت گِلِه ناانصافیست\nطبعِ چون آب و غزل‌هایِ روان ما را بس"},{"id":269,"poem":"دلا، رَفیقِ سفر بختِ نیکخواهت بس\nنسیمِ روضهٔ شیراز، پیکِ راهت بس\nدگر ز منزلِ جانان سفر مَکُن درویش\nکه سِیرِ معنوی و کُنجِ خانقاهت بس\nوگر کمین بِگُشایَد غمی ز گوشهٔ دل\nحریمِ درگهِ پیرِ مغان، پناهت بس\nبه صَدرِ مِصْطَبه بنشین و ساغرِ مِی‌ نوش\nکه این قَدَر ز جهان، کسبِ مال و جاهَت بس\nزیادتی مَطَلَب، کار بر خود آسان کن\nصُراحیِ مِیِ لعل و بُتی چو ماهَت بس\nفلک به مَردمِ نادان دهد زِمامِ مراد\nتو اهل فضلی و دانش، همین گناهت بس\nهوایِ مسکن مألوف و عهدِ یارِ قدیم\nز رهروانِ سفرکرده، عذرخواهت بس\nبه مِنَّتِ دگران خو مَکُن که در دو جهان\nرضایِ ایزد و اِنعامِ پادشاهت بس\nبه هیچ وِردِ دگر نیست حاجت ای حافظ\nدعایِ نیمْ‌شب و درسِ صبحگاهت بس"},{"id":270,"poem":"دردِ عشقی کشیده‌ام که مَپُرس\nزهرِ هجری چشیده‌ام که مَپُرس\nگشته‌ام در جهان و آخرِ کار\nدلبری برگزیده‌ام که مپرس\nآن چنان در هوایِ خاکِ دَرَش\nمی‌رود آبِ دیده‌ام که مپرس\nمن به گوشِ خود از دهانش دوش\nسخنانی شنیده‌ام که مپرس\nسویِ من لب چه می‌گَزی که مگوی\nلبِ لعلی گَزیده‌ام که مپرس\nبی تو در کلبهٔ گداییِ خویش\nرنج‌هایی کشیده‌ام که مپرس\nهمچو حافظ غریب در رَهِ عشق\nبه مَقامی رسیده‌ام که مپرس"},{"id":271,"poem":"دارم از زلفِ سیاهش گِلِه چندان که مَپُرس\nکه چُنان ز او شده‌ام بی سر و سامان که مَپُرس\nکَس به امّیدِ وفا ترکِ دل و دین مَکُناد\nکه چُنانم من از این کرده پشیمان که مپرس\nبه یکی جرعه که آزارِ کَسَش در پِی نیست\nزحمتی می‌کشم از مردمِ نادان که مپرس\nزاهد از ما به سلامت بگذر کـ‌این مِیِ لعل\nدل و دین می‌برد از دست بدان سان که مپرس\nگفت‌وگوهاست در این راه که جان بُگْدازد\nهر کسی عربده‌ای این که مبین آن که مپرس\nپارسایی و سلامت هَوَسم بود، ولی\nشیوه‌ای می‌کند آن نرگسِ فَتّان که مپرس\nگفتم از گویِ فلک صورتِ حالی پرسم\nگفت آن می‌کشم اندر خمِ چوگان که مپرس\nگفتمش زلف به خونِ که شکستی؟ گفتا\nحافظ این قصه دراز است به قرآن که مپرس"},{"id":272,"poem":"باز آی و دلِ تنگِ مرا مونس جان باش\nوین سوخته را مَحرَمِ اسرارِ نهان باش\nزآن باده که در میکدهٔ عشق فروشند\nما را دو سه ساغر بده و گو «رمضان باش»\nدر خرقه، چو آتش زدی ای عارفِ سالِک!\nجهدی کن و سرحلقهٔ رندانِ جهان باش\nدلدار که گفتا به تواَم دل‌نگران است\nگو «می‌رسم اینک به سلامت»، نگران باش\nخون شد دلم از حسرتِ آن لعلِ روان‌بخش\nای دُرجِ محبّت! به همان مُهر و نشان باش\nتا بر دلش از غصه غباری نَنشیند\nای سیلِ سرشک! از عقبِ نامه روان باش\nحافظ که هوس می‌کندش جامِ جهان‌بین\nگو «در نظرِ آصفِ جمشید‌مکان باش»"},{"id":273,"poem":"اگر رفیقِ شفیقی، درست پیمان باش\nحریفِ خانه و گرمابه و گلستان باش\nشِکَنجِ زلفِ پریشان به دستِ باد مده\nمگو که «خاطرِ عُشّاق گو پریشان باش»\nگَرَت هواست که با خِضْر هم‌نشین باشی\nنهان ز چشمِ سِکَندَر چو آبِ حیوان باش\nزبورِ عشق نوازی نه کارِ هر مرغی است\nبیا و نوگُلِ این بلبلِ غزل‌خوان باش\nطریقِ خدمت و آیینِ بندگی کردن\nخدای را که رها کن به ما و سلطان باش\nدگر به صیدِ حرم تیغ برمکش، زنهار\nوز آن که با دلِ ما کرده‌ای پشیمان باش\nتو شمعِ انجمنی، یک‌زبان و یک‌دل شو\nخیال و کوشش پروانه بین و خندان باش\nکمالِ دل‌بری و حُسن در نظربازی است\nبه شیوهٔ نظر، از نادرانِ دوران باش\nخموش حافظ و از جورِ یار ناله مکن\nتو را که گفت که در رویِ خوب، حیران باش؟"},{"id":274,"poem":"به دورِ لاله، قدح گیر و بی‌ریا می‌باش\nبه بویِ گُل، نفسی همدمِ صبا می‌باش\nنگویمت که همه ساله مِی پرستی کن\nسه ماه مِی خور و نُه ماه پارسا می‌باش\nچو پیرِ سالِک عشقت به مِی حواله کند\nبنوش و منتظرِ رحمتِ خدا می‌باش\nگَرَت هواست که چُون جَم به سِرِّ غیب رسی\nبیا و همدمِ جامِ جهان‌نما می‌باش\nچو غنچه گر چه فروبستگی‌ست کارِ جهان\nتو همچو بادِ بهاری گره‌گشا می‌باش\nوفا مجوی ز کس ور سخن نمی‌شنوی\nبه هرزه طالبِ سیمرغ و کیمیا می‌باش\nمریدِ طاعتِ بیگانگان مشو حافظ\nولی معاشرِ رندانِ پارسا می‌باش"},{"id":275,"poem":"صوفی گُلی بچین و مُرَقَّع به خار بخش\nوین زهدِ خشک را به مِی خوشگوار بخش\nطامات و شَطح در رَهِ آهنگِ چنگ نِه\nتسبیح و طَیلَسان به مِی و مِیگُسار بخش\nزُهدِ گران که شاهد و ساقی نمی‌خرند\nدر حلقهٔ چمن به نسیمِ بهار بخش\nراهم شراب لعل زد ای میرِ عاشقان\nخونِ مرا به چاهِ زَنَخدانِ یار بخش\nیا رب به وقتِ گُل، گُنَهِ بنده عفو کن\nوین ماجرا به سروِ لبِ جویبار بخش\nای آن که رَه به مشربِ مقصود بُرده‌ای\nزین بحر، قطره‌ای به منِ خاکسار بخش\nشکرانه را که چشم تو رویِ بتان ندید\nما را به عفو و لطفِ خداوندگار بخش\nساقی چو شاه نوش کند بادهٔ صَبوح\nگو جامِ زر به حافظِ شب زنده دار بخش"},{"id":276,"poem":"باغبان گر پنج‌روزی صحبتِ گل بایدش\nبر جفایِ خارِ هجران صبرِ بلبل بایدش\nای دل اندر بندِ زلفش از پریشانی مَنال\nمرغِ زیرک چون به دام افتد تحمل بایدش\nرندِ عالم‌سوز را با مصلحت‌بینی چه‌کار؟\nکار مُلک است آن که تدبیر و تأمل بایدش\nتکیه بر تقوی و دانش در طریقت کافری‌ست\nراهرو گر صد هنر دارد توکل بایدش\nبا چُنین زلف و رُخَش بادا نظربازی حرام\nهر که روی یاسمین و جَعدِ سنبل بایدش\nنازها زان نرگسِ مستانه‌اش باید کشید\nاین دلِ شوریده تا آن جَعد و کاکُل بایدش\nساقیا در گردشِ ساغر تعلل تا به چند؟\nدور چون با عاشقان افتد تَسَلسُل بایدش\nکیست حافظ تا ننوشد باده بی‌آوازِ رود؟\nعاشقِ مسکین چرا چندین تجمل بایدش؟"},{"id":277,"poem":"فکرِ بلبل همه آن است که گُل شد یارش\nگُل در اندیشه که چُون عشوه کُنَد در کارش\nدلربایی همه آن نیست که عاشق بِکُشَند\nخواجه آن است که باشد غَمِ خدمتکارش\nجایِ آن است که خون موج زَنَد در دلِ لعل\nزین تَغابُن که خَزَف می‌شکند بازارش\nبلبل از فیضِ گل آموخت سخن، ور نه نبود\nاین همه قول و غزل تعبیه در منقارش\nای که در کوچهٔ معشوقهٔ ما می‌گُذَری\nبر حذر باش، که سر می‌شکند دیوارش\nآن سفرکرده که صد قافله دل همرهِ اوست\nهر کجا هست خدایا به سلامت دارش\nصحبت عافیتت گرچه خوش افتاد ای دل\nجانبِ عشق عزیز است، فرومگذارش\nصوفیِ سرخوش از این دست که کج کرد کلاه\nبه دو جامِ دگر آشفته شود دستارش\nدلِ حافظ که به دیدارِ تو خوگر شده بود\nنازپروردِ وصال است، مجو آزارش"},{"id":278,"poem":"شرابِ تلخ می‌خواهم که مردافکن بُوَد زورش\nکه تا یک دَم بیاسایم ز دنیا و شر و شورش\nسِماطِ دَهرِ دون‌پرور ندارد شهدِ آسایش\nمَذاقِ حرص و آز ای دل، بشو از تلخ و از شورَش\nبیاور مِی که نَتْوان شد ز مکرِ آسمان ایمن\nبه لَعبِ زهرهٔ چنگیّ و مرّیخِ سلحشورش\nکمندِ صیدِ بهرامی بیفکن، جامِ جم بردار\nکه من پیمودم این صحرا، نه بهرام است و نه گورش\nبیا تا در مِی صافیت رازِ دَهر بِنْمایم\nبه شرطِ آن که نَنْمایی به کج‌طبعانِ دل‌کورش\nنظر کردن به درویشان مُنافیِّ بزرگی نیست\nسلیمان با چُنان حشمت، نظرها بود با مورش\nکمانِ ابرویِ جانان نمی‌پیچد سر از حافظ\nولیکن خنده می‌آید، بدین بازویِ بی‌زورش"},{"id":279,"poem":"خوشا شیراز و وضعِ بی‌مثالش\nخداوندا نگه دار از زَوالش\nز رکن آباد ما صد لوحش الله\nکه عمرِ خضر می‌بخشد زلالش\nمیانِ جعفرآباد و مُصَلّا\nعبیرآمیز می‌آید شِمالش\nبه شیراز آی و فیضِ روحِ قدسی\nبجوی از مردمِ صاحب کمالش\nکه نامِ قند مصری برد آنجا؟\nکه شیرینان ندادند اِنفِعالش\nصبا زان لولیِ شنگولِ سرمست\nچه داری آگهی؟ چون است حالش؟\nگر آن شیرین پسر خونم بریزد\nدلا چون شیرِ مادر کن حلالش\nمکن از خواب بیدارم خدا را\nکه دارم خلوتی خوش با خیالش\nچرا حافظ چو می‌ترسیدی از هجر\nنکردی شُکرِ ایامِ وصالش؟"},{"id":280,"poem":"چو بر شکست صبا زلفِ عنبرافشانش\nبه هر شکسته که پیوست، تازه شد جانش\nکجاست همنفسی؟ تا به شرح عرضه دَهَم\nکه دل چه می‌کشد از روزگارِ هجرانش\nزمانه از ورقِ گُل، مثالِ رویِ تو بست\nولی ز شرمِ تو در غنچه کرد پنهانش\nتو خفته‌ای و نشد عشق را کرانه پدید\nتبارک الله از این رَه که نیست پایانش\nجمالِ کعبه مگر عذرِ رهروان خواهد؟\nکه جانِ زنده‌دلان سوخت در بیابانش\nبدین شکستهٔ بیت الحزن که می‌آرد\nنشان یوسفِ دل از چَهِ زَنَخدانَش؟\nبگیرم آن سرِ زلف و به دستِ خواجه دهم\nکه سوخت حافظِ بی‌دل ز مکر و دستانش"},{"id":281,"poem":"یا رب این نوگُلِ خندان که سپردی به مَنَش\nمی‌سپارم به تو از چشمِ حسودِ چَمَنَش\nگرچه از کویِ وفا گشت به صد مرحله دور\nدور باد آفتِ دورِ فلک از جان و تَنَش\nگر به سرمنزل سلمی رَسی ای بادِ صبا\nچشم دارم که سلامی برسانی ز مَنَش\nبه ادب نافه گشایی کن از آن زلفِ سیاه\nجای دل‌های عزیز است به هم بر مَزَنَش\nگو دلم حقِّ وفا با خط و خالت دارد\nمحترم دار در آن طُرِّهٔ عَنبرشِکَنَش\nدر مقامی که به یادِ لبِ او مِی نوشند\nسِفله آن مست، که باشد خبر از خویشتنش\nعِرض و مال از درِ میخانه نشاید اندوخت\nهر که این آب خورَد رَخْت به دریا فِکَنَش\nهر که ترسد ز ملال اندُهِ عشقش نه حلال\nسَرِ ما و قدمش یا لبِ ما و دهنش\nشعرِ حافظ همه بیتُ الْغَزَلِ معرفت است\nآفرین بر نَفَسِ دلکَش و لطفِ سخنش"},{"id":282,"poem":"بِبُرد از من قرار و طاقت و هوش\nبتِ سنگین‌دلِ سیمین بناگوش\nنگاری چابکی شِنگی کُلَه‌دار\nظریفی مَه‌وشی تُرکی قباپوش\nز تابِ آتشِ سودایِ عشقش\nبه سانِ دیگ دایم می‌زنم جوش\nچو پیراهن شوَم آسوده‌خاطر\nگَرَش همچون قبا گیرم در آغوش\nاگر پوسیده گردد استخوانم\nنگردد مِهرت از جانم فراموش\nدل و دینم، دل و دینم بِبُرده‌ست\nبَر و دوشش، بَر و دوشش، بَر و دوش\nدوایِ تو، دوایِ توست حافظ\nلبِ نوشش، لبِ نوشش، لبِ نوش"},{"id":283,"poem":"سحر ز هاتفِ غیبم رسید مژده به گوش\nکه دورِ شاه‌شجاع است، مِی دلیر بنوش\nشد آن که اهلِ نظر بر کناره می‌رفتند\nهزار گونه سخن در دهان و لب خاموش\nبه صوتِ چنگ بگوییم آن حکایت‌ها\nکه از نهفتنِ آن دیگِ سینه می‌زد جوش\nشرابِ خانگیِ ترسِ محتسب‌خورده\nبه رویِ یار بنوشیم و بانگِ نوشانوش\nز کویِ میکده دوشش به دوش می‌بُردند\nامامِ شهر که سجاده می‌کشید به دوش\nدلا! دلالتِ خیرت کنم به راهِ نجات\nمکن به فسق مباهات و زهد هم مَفُروش\nمحلِ نورِ تَجَلّی‌ست رایِ انور شاه\nچو قربِ او طلبی در صفایِ نیّت کوش\nبه جز ثنایِ جلالش مساز وِردِ ضمیر\nکه هست گوشِ دلش محرمِ پیامِ سروش\nرموزِ مصلحتِ مُلک خسروان دانند\nگدایِ گوشه‌نشینی تو حافظا مَخروش"},{"id":284,"poem":"هاتفی از گوشهٔ میخانه دوش\nگفت ببخشند گنه، مِی بنوش\nلطفِ الهی بِکُنَد کارِ خویش\nمژدهٔ رحمت برساند سروش\nاین خِرَدِ خام به میخانه بَر\nتا مِیِ لعل آوَرَدَش خون به جوش\nگرچه وصالش نه به کوشش دهند\nهر قَدَر ای دل که توانی بکوش\nلطفِ خدا بیشتر از جرمِ ماست\nنکتهٔ سربسته چه دانی؟ خموش\nگوشِ من و حلقهٔ گیسویِ یار\nرویِ من و خاکِ درِ مِی فروش\nرندیِ حافظ نه گناهیست صَعب\nبا کَرَمِ پادشه عیب پوش\nداورِ دین، شاه شجاع، آن که کرد\nروحِ قدس حلقهٔ امرش به گوش\nای مَلِکُ العَرش مرادش بده\nو از خطرِ چشمِ بَدَش دار گوش"},{"id":285,"poem":"در عهدِ پادشاهِ خطابخشِ جُرم پوش\nحافظ قَرابه کَش شد و مفتی پیاله نوش\nصوفی ز کُنجِ صومعه با پایِ خُم نشست\nتا دید محتسب که سَبو می‌کشد به دوش\nاحوالِ شیخ و قاضی و شُربُ الیَهودِشان\nکردم سؤال صبحدم از پیرِ مِی فروش\nگفتا نه گفتنیست سخن گرچه محرمی\nدَرکَش زبان و پرده نگه دار و مِی بنوش\nساقی بهار می‌رسد و وجهِ مِی نماند\nفکری بکن که خونِ دل آمد ز غم به جوش\nعشق است و مفلسیّ و جوانیّ و نوبهار\nعُذرم پذیر و جرم به ذیلِ کرم بپوش\nتا چند همچو شمع زبان آوری کنی؟\nپروانهٔ مراد رسید ای مُحِب خموش\nای پادشاهِ صورت و معنی که مثل تو\nنادیده هیچ دیده و نشنیده هیچ گوش\nچندان بمان که خرقهٔ اَزْرَق کُنَد قبول\nبختِ جوانَت از فلکِ پیرِ ژِنده پوش"},{"id":286,"poem":"دوش با من گفت پنهان کاردانی تیزهوش\nوز شما پنهان نشاید کرد سِرِّ مِی‌فروش\nگفت آسان گیر بر خود کارها کز رویِ طبع\nسخت می‌گردد جهان بر مردمانِ سخت‌کوش\nوان گَهَم دَر داد جامی کز فروغش بر فلک\nزهره در رقص آمد و بَرْبَط زنان می‌گفت نوش\nبا دلِ خونین لبِ خندان بیاور همچو جام\nنی گَرَت زخمی رسد، آیی چو چنگ اندر خروش\nتا نگردی آشْنا زین پرده رَمزی نشنوی\nگوشِ نامحرم نباشد جایِ پیغامِ سروش\nگوش کن پند ای پسر وز بهرِ دنیا غم مَخور\nگفتمت چون دُر حدیثی، گر توانی داشت هوش\nدر حریمِ عشق نَتْوان زد دَم از گفت و شنید\nزان که آنجا جمله اعضا چشم باید بود و گوش\nبر بساطِ نکته‌دانان خودفروشی شرط نیست\nیا سخن دانسته گو ای مردِ عاقل، یا خموش\nساقیا مِی ده که رندی‌هایِ حافظ فهم کرد\nآصِفِ صاحب‌قرانِ جرم‌بخشِ عیب‌پوش"},{"id":287,"poem":"ای همه شکلِ تو مَطبوع و همه جایِ تو خوش\nدلم از عشوهٔ شیرینِ شِکرخایِ تو خوش\nهمچو گلبرگِ طَری هست وجودِ تو لطیف\nهمچو سروِ چمنِ خُلد سراپای تو خوش\nشیوه و نازِ تو شیرین، خط و خالِ تو مَلیح\nچشم و ابرویِ تو زیبا، قد و بالایِ تو خوش\nهم گلستانِ خیالم ز تو پُر نقش و نگار\nهم مَشامِ دلم از زلفِ سَمَن سایِ تو خوش\nدر رَهِ عشق که از سیلِ بلا نیست گذار\nکرده‌ام خاطرِ خود را به تمنایِ تو خوش\nشُکرِ چشمِ تو چه گویم؟ که بِدان بیماری\nمی‌کُنَد دَردِ مرا از رخِ زیبایِ تو خوش\nدر بیابانِ طلب گر چه ز هر سو خطری‌ست\nمی‌رود حافظِ بی‌دل به تَوَلّایِ تو خوش"},{"id":288,"poem":"کنارِ آب و پایِ بید و طبعِ شعر و یاری خوش\nمعاشر دلبری شیرین و ساقی گُلعِذاری خوش\nالا ای دولتی طالع، که قدرِ وقت می‌دانی\nگوارا بادَت این عِشرت که داری روزگاری خوش\nهر آن کس را که در خاطر ز عشقِ دلبری باریست\nسِپندی گو بر آتش نِه، که دارد کار و باری خوش\nعروسِ طَبع را زیور ز فکرِ بِکر می‌بندم\nبُوَد کز دستِ ایّامَم به دست اُفتَد نگاری خوش\nشبِ صحبت غنیمت دان و دادِ خوشدلی بِسْتان\nکه مهتابی دل افروز است و طَرْفِ لاله زاری خوش\nمِیی در کاسهٔ چشم است ساقی را بِنامیزد\nکه مستی می‌کند با عقل و می‌بخشد خُماری خوش\nبه غفلت عمر شُد حافظ، بیا با ما به میخانه\nکه شنگولانِ خوش باشت، بیاموزند کاری خوش"},{"id":289,"poem":"مَجمَعِ خوبی و لطف است عِذار چو مَهَش\nلیکَنَش مِهر و وفا نیست خدایا بِدَهَش\nدلبرم شاهد و طفل است و به بازی روزی\nبِکُشد زارم و در شرع نباشد گُنَهَش\nمن همان بِه که از او نیک نگه دارم دل\nکه بد و نیک ندیده‌ست و ندارد نِگَهَش\nبویِ شیر از لبِ همچون شِکَرَش می‌آید\nگرچه خون می‌چکد از شیوهٔ چشمِ سیَهَش\nچارده ساله بُتی چابُکِ شیرین دارم\nکه به جان حلقه به گوش است مَهِ چاردَهَش\nاز پِی آن گُلِ نورُستِه دلِ ما یارب\nخود کجا شد که ندیدیم در این چند گَهَش؟\nیارِ دلدارِ من ار قلب بدین سان شِکَنَد\nبِبَرَد زود به جانداریِ خود پادشهَش\nجان به شکرانه کنم صرف گَر آن دانهٔ دُر\nصدفِ سینهٔ حافظ بُوَد آرامگَهَش"},{"id":290,"poem":"دلم رمیده شد و غافلم منِ درویش\nکه آن شِکاریِ سرگشته را چه آمد پیش\nچو بید بر سرِ ایمانِ خویش می‌لرزم\nکه دل به دستِ کمان ابرویی‌ست کافِرکیش\nخیال حوصلهٔ بحر می‌پزد هیهات\nچه‌هاست در سرِ این قطرهٔ محال‌اندیش!\nبنازم آن مژهٔ شوخِ عافیت‌کُش را\nکه موج می‌زندش آبِ نوش، بر سرِ نیش\nز آستینِ طبیبان هزار خون بچکد\nگَرَم به تجربه دستی نهند بر دلِ ریش\nبه کویِ میکده گریان و سرفِکنده رَوَم\nچرا که شرم همی آیدم ز حاصلِ خویش\nنه عمرِ خِضر بِمانَد، نه مُلکِ اسکندر\nنزاع بر سرِ دنیی دون مَکُن درویش\nبِدان کمر نرسد دستِ هر گدا حافظ\nخزانه‌ای به کف آور ز گنجِ قارون بیش"},{"id":291,"poem":"ما آزموده‌ایم در این شهر بختِ خویش\nبیرون کشید باید از این وَرطه رَختِ خویش\nاز بس که دست می‌گَزَم و آه می‌کشم\nآتش زدم چو گُل به تنِ لَخت لَختِ خویش\nدوشم ز بلبلی چه خوش آمد که می‌سرود\nگل گوش پهن کرده ز شاخِ درختِ خویش\nکای دل تو شاد باش که آن یارِ تندخو\nبسیار تند روی نشیند ز بختِ خویش\nخواهی که سخت و سست جهان بر تو بگذرد\nبگذر ز عهدِ سست و سخن‌هایِ سختِ خویش\nوقت است کز فراقِ تو وز سوزِ اندرون\nآتش درافکنم به همه رَخت و پَختِ خویش\nای حافظ ار مراد مُیَسَّر شدی مدام\nجمشید نیز دور نماندی ز تخت خویش"},{"id":292,"poem":"قسم به حشمت و جاه و جلالِ شاه شجاع\nکه نیست با کَسَم از بهرِ مال و جاه نزاع\nشرابِ خانگیم بس مِیِ مُغانِه بیار\nحریفِ باده رسید ای رفیقِ توبه وِداع\nخدای را به مِی‌ام شست و شویِ خِرقه کنید\nکه من نمی‌شِنَوَم بویِ خیر از این اوضاع\nببین که رقص‌کُنان می‌رود به نالهٔ چنگ\nکسی که رُخصه نفرمودی اِسْتِماعِ سَماع\nبه عاشقان نظری کن به شُکرِ این نعمت\nکه من غلامِ مطیعم، تو پادشاهِ مُطاع\nبه فیضِ جرعهٔ جامِ تو تشنه‌ایم، ولی\nنمی‌کنیم دلیری نمی‌دهیم صُداع\nجبین و چهرهٔ حافظ خدا جدا مَکُناد\nز خاکِ بارگه کبریایِ شاه شجاع"},{"id":293,"poem":"بامدادان که ز خلوتگَهِ کاخِ اِبداع\nشمعِ خاور فِکَنَد بر همه اطراف شُعاع\nبَرکَشَد آینه از جِیبِ افق چرخ و در آن\nبنماید رخِ گیتی به هزاران انواع\nدر زوایایِ طَرَبخانهٔ جمشیدِ فلک\nاَرغَنون ساز کُنَد زهره به آهنگِ سَماع\nچنگ در غُلغُله آید که کجا شد منکر؟\nجام در قَهقَهه آید که کجا شد مَنّاع؟\nوضعِ دوران بنگر ساغرِ عِشرت بَر گیر\nکه به هر حالتی این است بِهینِ اوضاع\nطُرِّهٔ شاهدِ دنیی همه بند است و فریب\nعارفان بر سرِ این رشته نجویند نِزاع\nعمرِ خسرو طلب ار نفعِ جهان می‌خواهی\nکه وجودیست عطابخشِ کریمِ نَفّاع\nمَظهَرِ لطفِ ازل، روشنی چشمِ اَمَل\nجامعِ علم و عمل جانِ جهان، شاه شجاع"},{"id":294,"poem":"در وفایِ عشقِ تو، مشهورِ خوبانم چو شمع\nشب‌نشینِ کویِ سربازان و رندانم چو شمع\nروز و شب خوابم نمی‌آید به چشمِ غم‌پرست\nبس که در بیماریِ هجرِ تو گریانم چو شمع\nرشتهٔ صبرم به مِقراضِ غمت بُبْریده شد\nهمچنان در آتشِ مهرِ تو سوزانم چو شمع\nگر کُمَیتِ اشکِ گُلگونم نبودیِ گرم‌رو\nکِی شدی روشن به گیتی رازِ پنهانم چو شمع؟\nدر میانِ آب و آتش همچنان سرگرمِ توست\nاین دلِ زارِ نزارِ اشک‌بارانم چو شمع\nدر شبِ هجران، مرا پروانهٔ وصلی فرست\nور نه از دَردَت جهانی را بسوزانم چو شمع\nبی جمالِ عالم‌آرایِ تو روزم چون شب است\nبا کمالِ عشقِ تو در عینِ نُقصانم چو شمع\nکوهِ صبرم نرم شد چون موم در دستِ غمت\nتا در آب و آتشِ عشقت گدازانم چو شمع\nهمچو صبحم یک نفس باقی‌ست با دیدارِ تو\nچهره بنما دلبرا تا جان برافشانم چو شمع\nسرفرازم کن شبی از وصلِ خود ای نازنین\nتا مُنور گردد از دیدارت ایوانم چو شمع\nآتشِ مِهر تو را حافظ عجب در سر گرفت\nآتشِ دل، کِی به آبِ دیده بنشانم چو شمع؟"},{"id":295,"poem":"سَحَر به بویِ گلستان دَمی شدم در باغ\nکه تا چو بلبلِ بیدل کُنَم عِلاجِ دِماغ\nبه جلوهٔ گلِ سوری نگاه می‌کردم\nکه بود در شبِ تیره به روشنی چو چراغ\nچُنان به حُسن و جوانیِ خویشتن مغرور\nکه داشت از دلِ بلبل هزار گونه فَراغ\nگشاده نرگسِ رعنا ز حسرت آب از چشم\nنهاده لاله ز سودا به جان و دل صد داغ\nزبان کشیده چو تیغی به سرزنش سوسن\nدهان گُشاده شقایق چو مردمِ ایغاغ\nیکی چو باده پرستان صُراحی اندر دست\nیکی چو ساقیِ مستان به کف گرفته اَیاغ\nنشاط و عیش و جوانی چو گُل غنیمت دان\nکه حافظا نَبُوَد بر رسول غیر بَلاغ"},{"id":296,"poem":"طالع اگر مدد دهد، دامنَش آوَرَم به کف\nگر بکِشم زهی طرب، ور بکُشد زهی شرف\nطرْفِ کرَم ز کَس نبست، این دلِ پُر امیدِ من\nگر چه سخن همی بَرَد، قصهٔ من به هر طرف\nاز خَمِ ابرویِ توام، هیچ گشایشی نشد\nوَه که در این خیالِ کَج، عمرِ عزیز شد تلف\nابرویِ دوست کِی شود، دست‌کشِ خیالِ من؟\nکس نزده‌ست از این کمان، تیرِ مراد بر هدف\nچند به ناز پرورم، مِهرِ بُتانِ سنگ‌دل\nیادِ پدر نمی‌کنند، این پسرانِ ناخلف\nمن به خیالِ زاهدی، گوشه‌نشین و طُرفه آنک\nمُغْبَچه‌ای ز هر طرف، می‌زندم به چنگ و دف\nبی‌خبرند زاهدان، نقش بخوان و لاتَقُل\nمستِ ریاست، محتسب، باده بده و لاتَخَف\nصوفی شهر بین که چون، لقمهٔ شُبهه می‌خورد\nپاردُمَش دراز باد، آن حَیَوانِ خوش علف\nحافظ اگر قدم زنی، در رَهِ خاندان به صِدق\nبدرقهٔ رهت شود، همتِ شَحنِهٔ نجف"},{"id":297,"poem":"زبانِ خامه ندارد سرِ بیان فِراق\nوگرنه شرح دهم با تو داستانِ فِراق\nدریغ مدت عمرم که بر امیدِ وصال\nبه سر رسید و نیامد به سر زمانِ فِراق\nسری که بر سرِ گردون به فخر می‌سودم\nبه راستان که نهادم، بر آستانِ فِراق\nچگونه باز کنم بال در هوایِ وصال\nکه ریخت مرغِ دلم پَر در آشیانِ فِراق\nکنون چه چاره که در بَحرِ غم به گردابی\nفُتاد زورقِ صبرم ز بادبانِ فِراق\nبسی نَمانْد که کَشتیِ عمر غرقه شود\nز موجِ شوقِ تو در بحرِ بی‌کرانِ فِراق\nاگر به دستِ من اُفتَد فِراق را بِکُشَم\nکه روزِ هجر سیَه باد و خان و مانِ فِراق\nرفیقِ خِیلِ خیالیم و همنشینِ شَکیب\nقَرینِ آتشِ هجران و هم قِرانِ فِراق\nچگونه دَعویِ وصلت کُنَم به جان؟ که شده‌ست\nتنم وکیلِ قَضا و دلم ضمانِ فِراق\nز سوزِ شوق دلم شد کباب دور از یار\nمدام خونِ جگر می‌خورم ز خوانِ فِراق\nفلک چو دید سرم را اسیرِ چَنبَرِ عشق\nبِبَست گردنِ صبرم به ریسمانِ فِراق\nبه پایِ شوق گر این رَه به سر شدی حافظ\nبه دستِ هجر ندادی کسی عِنانِ فِراق"},{"id":298,"poem":"مقامِ امن و میِ بی‌غَش و رفیقِ شفیق\nگَرَت مدام میسّر شود، زهی توفیق\nجهان و کارِ جهان جمله هیچ بَر هیچ است\nهزار بار من این نکته کرده‌ام تحقیق\nدریغ و دَرد که تا این زمان ندانستم\nکه کیمیایِ سعادت، رفیق بود، رفیق\nبه مَأمَنی رو و فرصت شمُر غنیمتِ وقت\nکه در کمینگهِ عمرند قاطعانِ طریق\nبیا که توبه ز لعلِ نگار و خندهٔ جام\nحکایتی‌ست که عقلش نمی‌کُند تصدیق\nاگر چه مویِ میانت به چون منی نرسد\nخوش است خاطرم از فکرِ این خیالِ دقیق\nحلاوتی که تو را در چَهِ زَنَخدان است\nبه کُنهِ آن نرسد صد‌ هزار فکرِ عمیق\nاگر به رنگِ عقیقی شد اشکِ من، چه عَجب؟\nکه مُهرِ خاتمِ لَعلِ تو هست همچو عقیق\nبه خنده گفت که «حافظ! غلامِ طبعِ تواَم»\nببین که تا به چه حدَّم همی کُند تحمیق"},{"id":299,"poem":"اگر شراب خوری جُرعه‌ای فشان بر خاک\nاز آن گناه که نَفعی رسد به غیر، چه باک؟\nبرو به هر چه تو داری بخور، دریغ مخور\nکه بی‌دریغ زَنَد روزگار تیغِ هَلاک\nبه خاکِ پایِ تو ای سروِ نازپرورِ من\nکه روزِ واقعه پا وا مَگیرم از سرِ خاک\nچه دوزخی، چه بهشتی، چه آدمی، چه پَری\nبه مذهبِ همه کفرِ طریقت است اِمساک\nمهندسِ فَلَکی، راهِ دِیرِ شش جهتی\nچنان بِبَست که رَه نیست زیرِ دیرِ مغاک\nفریبِ دخترِ رَز طُرفِه می‌زند رَهِ عقل\nمباد تا به قیامت خراب طارَمِ تاک\nبه راهِ میکده، حافظ! خوش از جهان رفتی\nدعایِ اهلِ دلت باد، مونسِ دلِ پاک"},{"id":300,"poem":"هزار دشمنم اَر می‌کنند قصدِ هلاک\nگَرَم تو دوستی از دشمنان ندارم باک\nمرا امیدِ وصالِ تو زنده می‌دارد\nو گر نه هر دَمم از هجرِ توست بیمِ هلاک\nنفَس‌نفَس اگر از باد نَشنوم بویش\nزمان‌زمان چو گل از غم کُنم گریبان چاک\nرَوَد به خواب، دو چشم از خیالِ تو؟ هیهات\nبُوَد صبور، دل اندر فراقِ تو؟ حاشاک\nاگر تو زخم زَنی، بِهْ که دیگری مَرهم\nو گر تو زهر دهی، بِهْ که دیگری تریاک\nبِضَربِ سَیْفِکَ قَتْلی حَیاتُنا اَبدا\nلِأنَّ روحیَ قَدْ طابَ اَن یَکونَ فِداک\nعنان مَپیچ که گر می‌زنی به شمشیرم\nسپر کُنم سر و دستت ندارم از فِتراک\nتو را چنان که تویی هر نظر کجا بیند؟\nبه قدرِ دانشِ خود هر کسی کند ادراک\nبه چشمِ خَلق، عزیزِ جهان شود حافظ\nکه بر درِ تو نَهد رویِ مَسکَنَت بر خاک"},{"id":301,"poem":"ای دلِ ریشِ مرا با لبِ تو حقِّ نمک\nحق نگه دار که من می‌روم، الله مَعَک\nتویی آن گوهرِ پاکیزه که در عالمِ قدس\nذکرِ خیرِ تو بُوَد حاصلِ تسبیحِ مَلَک\nدر خلوصِ مَنَت ار هست شکی، تجربه کن\nکس عیارِ زرِ خالص نشناسد چو محَک\nگفته بودی که شَوَم مست و دو بوست بدهم\nوعده از حد بشد و ما نه دو دیدیم و نه یَک\nبگشا پستهٔ خندان و شِکَرریزی کن\nخلق را از دهنِ خویش مَیَنداز به شک\nچرخ برهم زنم ار غیرِ مرادم گردد\nمن نه آنم که زبونی کشَم از چرخِ فلک\nچون بَرِ حافظِ خویشش نگذاری باری\nای رقیب از بَرِ او یک دو قدم دورتَرَک"},{"id":302,"poem":"خوش خبر باشی ای نسیمِ شِمال\nکه به ما می‌رسد زمانِ وصال\nقصّةُ الْعِشق لَا اِنْفِصامَ لَها\nفُصِمَت ها هُنا لسانَ القال\nما لِسَلمی و من بِذی سَلَمٍ\nأینَ جِیرانُنا و کَیفَ الْحال\nعَفَتِ الدارُ بَعدَ عافیةٍ\nفَاسألوا حالَها عَنِ الاَطْلال\nفی جَمالِ الکمالِ نِلتَ مُنی\nصَرَّفَ اللهُ عَنکَ عَینَ کمال\nیا بَریدَ الْحِمی حَماکَ الله\nمرحباً مرحباً تَعال تَعال\nعرصهٔ بزمگاه خالی ماند\nاز حریفان و جامِ مالامال\nسایه افکند حالیا شبِ هجر\nتا چه بازَند شبرُوانِ خیال\nتُرکِ ما سویِ کَس نمی‌نِگرد\nآه از این کبریا و جاه و جلال\nحافظا عشق و صابری تا چند؟\nنالهٔ عاشقان خوش است، بِنال"},{"id":303,"poem":"شَمَمتُ روحَ وِدادٍ و شِمتُ برقَ وِصال\nبیا که بویِ تو را میرم ای نسیمِ شِمال\nأَ حادیاً بجمالِ الحبیبِ قِفْ وَ انْزِل\nکه نیست صبرِ جمیلم ز اشتیاقِ جَمال\nحکایتِ شبِ هجران فروگذاشته بِهْ\nبه شکرِ آن که برافکند پرده روزِ وصال\nبیا که پردهٔ گلریزِ هفت خانهٔ چشم\nکَشیده‌ایم به تَحریرِ کارگاهِ خیال\nچو یار بر سرِ صلح است و عُذر می‌طلبد\nتوان گذشت ز جورِ رقیب در همه حال\nبه جز خیالِ دهانِ تو نیست در دلِ تنگ\nکه کَس مباد چو من در پِیِ خیالِ محال\nقَتیلِ عشقِ تو شد حافظِ غریب، ولی\nبه خاکِ ما گذری کن که خونِ مات حلال"},{"id":304,"poem":"دارایِ جهان نصرتِ دین خسروِ کامل\nیَحیَی بنِ مُظَفَّر مَلِکِ عالمِ عادل\nای درگهِ اسلام پناهِ تو گشاده\nبر رویِ زمین روزنهٔ جان و دَرِ دل\nتعظیمِ تو بر جان و خِرَد واجب و لازم\nاِنعام تو بر کون و مکان فایض و شامل\nروزِ ازل از کِلکِ تو یک قطره سیاهی\nبر رویِ مَه افتاد که شد حلِّ مسائل\nخورشید چو آن خالِ سیَه دید، به دل گفت\nای کاج که من بودَمی آن هندویِ مقبل\nشاها فلک از بزمِ تو در رقص و سَماع است\nدستِ طَرَب از دامنِ این زمزمه مَگسِل\nمِی نوش و جهان بخش که از زلفِ کمندت\nشد گردنِ بدخواه گرفتار سَلاسِل\nدورِ فلکی یکسَره بر مَنْهَجِ عدل است\nخوش باش که ظالم نَبَرد راه به منزل\nحافظ قلمِ شاه جهان مُقسِمِ رزق است\nاز بهرِ معیشت مَکُن اندیشهٔ باطل"},{"id":305,"poem":"به وقت گُل شدم از توبهٔ شراب خجِل\nکه کَس مباد ز کِردارِ ناصَواب خجِل\nصلاحِ ما همه دامِ رَه است و من زین بحث\nنی‌ام ز شاهد و ساقی به هیچ باب خجِل\nبوَد که یار نرنجد ز ما به خُلقِ کریم\nکه از سؤال ملولیم و از جواب خجِل\nز خون که رفت شبِ دوش از سراچهٔ چشم\nشدیم در نظر رَهرُوانِ خواب خجِل\nرواست نرگسِ مست ار فِکند سر در پیش\nکه شد ز شیوهٔ آن چشمِ پُر عِتاب خجِل\nتویی که خوب‌تری ز آفتاب و شُکرِ خدا\nکه نیستم ز تو در رویِ آفتاب خجِل\nحجابِ ظلمت از آن بست آبِ خضر که گشت\nز شعرِ حافظ و آن طَبعِ همچو آب خجِل"},{"id":306,"poem":"اگر به کویِ تو باشد مرا مَجالِ وصول\nرَسَد، به دولتِ وصلِ تو، کارِ من به اصول\nقرار برده ز من آن دو نرگسِ رَعنا\nفَراغ برده ز من آن دو جادو‌یِ مَکحول\nچو بر درِ تو منِ بینوا‌یِ بی زر و زور\nبه هیچ باب ندارم رَهِ خروج و دُخول\nکجا رَوَم چه کنم چاره از کجا جویم‌؟\nکه گَشته‌ام ز غم و جورِ روزگار مَلول\nمنِ شکستهٔ بدحال زندگی یابم\nدر آن زمان که به تیغِ غَمَت شَوَم مَقتول\nخراب‌تر ز دلِ من غمِ تو جای نیافت\nکه ساخت در دلِ تنگم قرار‌گاهِ نزول\nدل از جواهرِ مِهر‌ت چو صیقلی دارد\nبُوَد ز زنگِ حوادث هر آینه مَصقول\nچه جرم کرده‌ام؟ ای جان و دل، به حضرتِ تو\nکه طاعتِ منِ بیدل نمی‌شود مَقبول\nبه دَردِ عشق بساز و خموش کن حافظ\nرموزِ عشق مَکُن فاش پیشِ اهلِ عقول"},{"id":307,"poem":"هر نکته‌ای که گفتم در وصفِ آن شَمایل\nهر کو شنید گفتا «لِلّهِ دَرُّ قائل»\nتحصیلِ عشق و رندی آسان نمود اول\nآخر بسوخت جانم در کسبِ این فضایل\nحَلّاج بر سرِ دار این نکته خوش سُراید\n«از شافعی نپرسند امثالِ این مسائل»\nگفتم که «کِی ببخشی بر جانِ ناتوانم؟»\nگفت «آن زمان که نَبْوَد جان در میانه حائل»\nدل داده‌ام به یاری، شوخی‌، کَشی، نگاری\nمَرضیّةُ السَجایا مَحمودَةُ الخَصائل\nدر عینِ گوشه‌گیری بودم چو چشمِ مستت\nو اکنون شدم به مستان چون ابرویِ تو مایل\nاز آبِ دیده صد رَه طوفانِ نوح دیدم\nوز لوحِ سینه نقشت هرگز نگشت زایل\nای دوست دستِ حافظ تَعویذِ چشم زخم است\nیا رب ببینم آن را در گردنت حَمایل"},{"id":308,"poem":"ای رُخَت چون خُلد و لَعلَت سَلسَبیل\nسَلسَبیلت کرده جان و دل سَبیل\nسبزپوشانِ خَطَت بر گِردِ لب\nهمچو مورانند گِردِ سَلسَبیل\nناوَکِ چشمِ تو در هر گوشه‌ای\nهمچو من افتاده دارد صد قَتیل\nیا رب این آتش که در جانِ من است\nسرد کن زان سان که کردی بر خلیل\nمن نمی‌یابم مجال ای دوستان\nگرچه دارد او جمالی بس جمیل\nپای ما لَنگ است و منزل بس دراز\nدست ما کوتاه و خرما بر نَخیل\nحافظ از سرپنجهٔ عشقِ نگار\nهمچو مور افتاده شد در پایِ پیل\nشاهِ عالم را بقا و عِزّ و ناز\nباد و هر چیزی که باشد زین قَبیل"},{"id":309,"poem":"عشقبازیّ و جوانیّ و شرابِ لَعلْ‌فام\nمجلسِ اُنس و حریفِ همدم و شُربِ مدام\nساقیِ شِکَّردهان و مُطربِ شیرین‌سخن\nهمنشینی نیک‌کردار و ندیمی نیک‌نام\nشاهدی از لطف و پاکی رَشکِ آبِ زندگی\nدلبری در حُسن و خوبی غیرتِ ماهِ تمام\nبَزم‌گاهی دل‌نِشان، چون قصرِ فردوسِ بَرین\nگلشنی پیرامُنَش چون روضهٔ دارُالسَّلام\nصف‌نشینان نیک‌خواه و پیشکاران باادب\nدوست‌داران صاحب‌اسرار و حریفان دوست‌کام\nبادهٔ گلرنگِ تلخِ تیزِ خوش‌خوارِ سَبُک\nنُقلَش از لَعلِ نگار و نَقلَش از یاقوتِ خام\nغمزهٔ ساقی به یَغمایِ خِرَد آهِخته تیغ\nزلفِ جانان از برایِ صیدِ دل گسترده‌دام\nنکته‌دانی بَذله‌گو چون حافظِ شیرین‌‌سخن\nبخشش‌آموزی جهان‌افروز چون حاجی قوام\nهر که این عِشرت نخواهد خوش‌دلی بر وی تباه\nوان که این مجلس نجوید زندگی بر وی حرام"},{"id":310,"poem":"مرحبا طایرِ فَرُّخ پِیِ فرخنده پیام\nخیرِ مقدم چه خبر؟ دوست کجا؟ راه کدام؟\nیا رب این قافله را لطفِ ازل بدرقه باد\nکه از او خصم به دام آمد و معشوقه به کام\nماجرایِ من و معشوقِ مرا پایان نیست\nهر چه آغاز ندارد نپذیرد انجام\nگل ز حَد بُرد تَنَعُّم نفسی رخ بنما\nسرو می‌نازد و خوش نیست خدا را بخرام\nزلفِ دلدار چو زُنّار همی‌فرماید\nبرو ای شیخ که شد بر تنِ ما خرقه حرام\nمرغِ روحم که همی‌زد ز سرِ سِدره صَفیر\nعاقبت دانهٔ خالِ تو فِکَندَش در دام\nچشمِ بیمارِ مرا خواب نه در خور باشد\nمن لَهُ یَقتُلُ داءٌ دَنَفٌ کیفَ یَنام؟\nتو تَرَحُّم نکنی بر منِ مُخلص گفتم\nذاکَ دعوایَ و ها انتَ و تِلکَ الایّام\nحافظ ار میل به ابرویِ تو دارد شاید\nجای در گوشهٔ محراب کنند اهلِ کلام"},{"id":311,"poem":"عاشقِ رویِ جوانی خوشِ نوخاسته‌ام\nوز خدا دولتِ این غم به دعا خواسته‌ام\nعاشق و رِند و نظربازم و می‌گویم فاش\nتا بدانی که به چندین هنر آراسته‌ام\nشَرمَم از خرقهٔ آلودهٔ خود می‌آید\nکه بر او وصله به صد شُعبده پیراسته‌ام\nخوش بسوز از غَمَش ای شمع که اینک من نیز\nهم بدین کار کمربسته و برخاسته‌ام\nبا چُنین حیرتم از دست بِشُد صرفهٔ کار\nدر غم افزوده‌ام آنچ از دل و جان کاسته‌ام\nهمچو حافظ به خرابات رَوَم جامه قبا\nبو که در بَر کَشَد آن دلبرِ نوخاسته‌ام"},{"id":312,"poem":"بُشری اِذِ السَّلامةُ حَلَّت بِذی سَلَم\nلِلّهِ حمدُ مُعتَرِفٍ غایةَ النِّعَم\nآن خوش خبر کجاست؟ که این فتح، مژده داد\nتا جان فِشانَمَش چو زر و سیم در قَدَم\nاز بازگشتِ شاه در این طُرفِه منزل است\nآهنگِ خصم او به سراپردهٔ عَدَم\nپیمان شکن هرآینه گَردَد شکسته حال\nانَّ العُهودَ عِندَ مَلیکِ النُّهی ذِمَم\nمی‌جست از سحابِ اَمل رحمتی ولی\nجز دیده‌اش مُعاینه بیرون نداد نَم\nدر نیلِ غم فُتاد؛ سپهرش به طنز گفت\nالآنَ قَد نَدِمتَ و ما یَنفَعُ النَّدَم؟\nساقی چو یارِ مَه رخ و از اهلِ راز بود\nحافظ بخورد باده و شیخ و فقیه هم"},{"id":313,"poem":"بازآی ساقیا که هواخواهِ خدمتم\nمشتاقِ بندگیّ و دعاگویِ دولتم\nزان جا که فیضِ جامِ سعادت فروغِ توست\nبیرون شدی نُمای ز ظلماتِ حیرتم\nهرچند غرقِ بحرِ گناهم ز صد جهت\nتا آشِنایِ عشق شدم ز اهل رحمتم\nعیبم مکن به رندی و بدنامی ای حکیم\nکاین بود سرنوشت ز دیوانِ قسمتم\nمِی خور که عاشقی نه به کسب است و اختیار\nاین موهبت رسید ز میراثِ فطرتم\nمن کز وطن سفر نَگُزیدَم به عمرِ خویش\nدر عشقِ دیدن تو هواخواهِ غربتم\nدریا و کوه در رَه و من خسته و ضعیف\nدورم به صورت از درِ دولتسرایِ تو\nلیکن به جان و دل ز مقیمانِ حضرتم\nحافظ به پیشِ چشم تو خواهد سِپُرد جان\nدر این خیالم اَر بدهد عمر مهلتم"},{"id":314,"poem":"دوش بیماری چشم تو بِبُرد از دستم\nلیکن از لطفِ لبت صورتِ جان می‌بستم\nعشق من با خَطِ مشکین تو امروزی نیست\nدیرگاه است کز این جامِ هِلالی مستم\nاز ثباتِ خودم این نکته خوش آمد که به جور\nدر سرِ کویِ تو از پایِ طلب ننشَستم\nعافیتْ چشم مدار از منِ میخانه‌نشین\nکه دَم از خدمتِ رندان زده‌ام تا هستم\nدر رَهِ عشق از آن سویِ فنا صد خطر است\nتا نگویی که چو عمرم به سر آمد رَستم\nبعد از اینم چه غم از تیرِ کج اندازِ حسود\nچون به محبوبِ کمان ابرویِ خود پیوستم\nبوسه بر دُرجِ عقیقِ تو حلال است مرا\nکه به افسوس و جفا مُهرِ وفا نشکستم\nصنمی لشکریَم غارتِ دل کرد و بِرَفت\nآه اگر عاطِفَتِ شاه نگیرد دستم\nرُتبَتِ دانشِ حافظ به فلک بَر شده بود\nکرد غم‌خواریِ شمشادِ بلندت پَستم"},{"id":315,"poem":"به غیر از آن که بِشُد دین و دانش از دستم\nبیا بگو که ز عشقت چه طَرْف بَربَستَم؟\nاگر چه خَرمَنِ عمرم غمِ تو داد به باد\nبه خاک‌پایِ عزیزت که عهد نشکستم\nچو ذَرِّه گرچه حقیرم؛ ببین به دولتِ عشق\nکه در هوایِ رُخَت چون به مِهر پیوستم\nبیار باده که عمریست تا من از سَرِ اَمن\nبه کُنجِ عافیت از بهرِ عیش نَنشَستَم\nاگر ز مردمِ هشیاری ای نصیحت‌گو\nسخن به خاک مَیَفکَن؛ چرا که من مستم\nچگونه سر ز خجالت برآورم بَرِ دوست\nکه خدمتی بسزا برنیامد از دستم\nبسوخت حافظ و آن یارِ دلنواز نگفت\nکه مَرهمی بفرستم که خاطرش خَستم"},{"id":316,"poem":"زُلف بَر باد مَده تا نَدَهی بَر بادَم\nناز بُنیاد مَکُن تا نَکَنی بُنیادَم\nمِی مَخور با هَمه کَس تا نَخورَم خونِ جِگَر\nسَر مَکِش تا نَکِشَد سَر به فَلَک فَریادَم\nزُلف را حَلقه مَکُن تا نَکُنی دَر بَندَم\nطُرّه را تاب مَده تا نَدَهی بَر بادَم\nیارِ بیگانه مَشو تا نَبَری از خویشم\nغَمِ اَغیار مَخور تا نَکُنی ناشادَم\nرُخ بَراَفروز که فارغ کُنی اَز بَرگِ گُلم\nقَد بَراَفراز که اَز سَروْ کُنی آزادَم\nشَمعِ هَر جَمع مَشو وَر نَه بِسوزی ما را\nیادِ هَر قوم مَکُن تا نَرَوی اَز یادَم\nشُهرهٔ شَهر مَشو تا نَنَهَم سَر دَر کوه\nشورِ شیرین مَنَما تا نَکُنی فَرهادَم\nرَحم کُن بَر مَنِ مِسکین و بِه فَریادَم رَس\nتا به خاکِ دَرِ آصِف نَرِسَد فَریادَم\nحافظ از جورِ تو حاشا که بِگَرداند روی\nمَن اَز آن روز که دَر بَندِ توام آزادَم"},{"id":317,"poem":"فاش می‌گویم و از گفتهٔ خود دلشادَم\nبندهٔ عشقم و از هر دو جهان آزادم\nطایرِ گلشنِ قُدسم چه دَهَم شَرحِ فِراق؟\nکه در این دامگَهِ حادثه چون اُفتادم\nمن مَلَک بودم و فردوسِ بَرین جایَم بود\nآدَم آوَرد دَر این دِیرِ خَراب‌آبادَم\nسایهٔ طوبی و دلجوییِ حور و لبِ حوض\nبه هوایِ سَرِ کویِ تو بِرَفت از یادم\nنیست بر لوحِ دِلَم جُز اَلفِ قامَتِ دوست\nچه کُنَم حَرفِ دِگَر یاد نداد اُستادم\nکوکَبِ بَختِ مَرا هیچ مُنَجِّم نَشِناخت\nیا رَب از مادرِ گیتی به چه طالع زادم؟\nتا شُدم حَلقه به گوشِ دَرِ میخانهٔ عشق\nهَر دَم آیَد غَمی اَز نو به مُبارَکبادَم\nمی‌خورَد خونِ دِلَم مَردُمکِ دیده، سِزاست\nکه چرا دِل به جِگرگوشهٔ مَردُم دادَم\nپاک کن چهرهٔ حافظ به سَرِ زُلف زِ اَشک\nوَر نَه این سیلِ دَمادَم بِبَرَد بُنیادَم"},{"id":318,"poem":"مرا می‌بینی و هر دَم زیادَت می‌کنی دَردَم\nتو را می‌بینم و میلم زیادَت می‌شود هر دَم\nبه سامانم نمی‌پرسی، نمی‌دانم چه سر داری\nبه درمانم نمی‌کوشی، نمی‌دانی مگر دردم؟\nنه راه است این که بُگذاری مرا بر خاک و بُگریزی\nگُذاری آر و بازم پرس تا خاکِ رَهَت گردم\nندارم دستت از دامن، به جز در خاک و آن دَم هَم\nکه بر خاکم روان گَردی بگیرد دامنت گَردم\nفرو رفت از غمِ عشقت دَمَم دَم می‌دهی تا کی؟\nدَمار از من برآوردی نمی‌گویی برآوردم\nشبی دل را به تاریکی ز زلفت باز می‌جُستم\nرُخَت می‌دیدم و جامی هلالی باز می‌خوردم\nکشیدم در بَرَت ناگاه و شد در تابْ گیسویت\nنهادم بر لبت لب را و جان و دل فِدا کردم\nتو خوش می‌باش با حافظ، برو گو خصم جان می‌ده\nچو گرمی از تو می‌بینم، چه باک از خصمِ دَم سَردم"},{"id":319,"poem":"سال‌ها پیرُویِ مذهبِ رندان کردم\nتا به فتویّ خِرَد حرص به زندان کردم\nمن به سرمنزلِ عَنْقا نه به خود بُردم راه\nقطعِ این مرحله با مرغِ سلیمان کردم\nسایه‌ای بر دلِ ریشم فِکَن ای گنجِ روان\nکه من این خانه به سودایِ تو ویران کردم\nتوبه کردم که نبوسم لبِ ساقی و کنون\nمی‌گَزَم لب که چرا گوش به نادان کردم\nدر خِلاف‌آمدِ عادت بطلب کام! که من\nکسب جمعیت از آن زلفِ پریشان کردم\nنقش مستوری و مستی نه به دستِ من و توست\nآن چه سلطانِ ازل گفت بکن، آن کردم\nدارم از لطفِ ازل جنَّتِ فردوس طمع\nگرچه دربانی میخانه فراوان کردم\nاین که پیرانه‌سَرَم صحبتِ یوسف بنواخت\nاجر صبریست که در کلبهٔ احزان کردم\nصبح‌خیزی و سلامت طلبی چون حافظ\nهر چه کردم همه از دولتِ قرآن کردم\nگر به دیوانِ غزل صدرنشینم چه عجب؟\nسال‌ها بندگیِ صاحبِ دیوان کردم"},{"id":320,"poem":"دیشب به سیلِ اشک رَهِ خواب می‌زدم\nنقشی به یادِ خَطِّ تو بر آب می‌زدم\nابرویِ یار در نظر و خرقه سوخته\nجامی به یادِ گوشهٔ محراب می‌زدم\nهر مرغِ فکر کز سرِ شاخِ سخن بِجَست\nبازش ز طُرِّهٔ تو به مِضراب می‌زدم\nرویِ نگار در نظرم جلوه می‌نمود\nوز دور بوسه بر رخِ مهتاب می‌زدم\nچشمم به رویِ ساقی و گوشم به قولِ چنگ\nفالی به چشم و گوش در این باب می‌زدم\nنقشِ خیالِ رویِ تو تا وقتِ صبحدم\nبر کارگاهِ دیدهٔ بی‌خواب می‌زدم\nساقی به صوتِ این غزلم کاسه می‌گرفت\nمی‌گفتم این سرود و مِیِ ناب می‌زدم\nخوش بود وقتِ حافظ و فالِ مراد و کام\nبر نامِ عمر و دولتِ احباب می‌زدم"},{"id":321,"poem":"هر چند پیر و خسته‌دل و ناتوان شدم\nهر گَه که یادِ رویِ تو کردم جوان شدم\nشکرِ خدا که هر چه طلب کردم از خدا\nبر مُنتهایِ همتِ خود کامران شدم\nای گُلبُن جوان! بَرِ دولت بخور که من\nدر سایهٔ تو بلبلِ باغِ جهان شدم\nاول ز تحت و فوقِ وجودم خبر نبود\nدر مکتبِ غمِ تو، چُنین نکته‌دان شدم\nقسمت حوالتم به خرابات می‌کند\nهر چند کاینچنین شدم و آنچنان شدم\nآن روز بر دلم درِ معنی گشوده شد\nکز ساکنانِ درگهِ پیرِ مغان شدم\nدر شاه‌راهِ دولتِ سرمد به تختِ بخت\nبا جامِ مِی به کامِ دلِ دوستان شدم\nاز آن زمان که فتنهٔ چشمت به من رسید\nایمن ز شرِّ فتنهٔ آخرزمان شدم\nمن پیرِ سال و ماه نیَم، یار بی‌وفاست\nبر من چو عمر می‌گذرد پیر از آن شدم\nدوشم نوید داد عنایت که حافظا\nبازآ که من به عفوِ گناهت ضمان شدم"},{"id":322,"poem":"خیالِ نقشِ تو در کارگاهِ دیده کشیدم\nبه صورتِ تو نگاری ندیدم و نشنیدم\nاگرچه در طلبت هم عِنانِ باد شِمالم\nبه گَردِ سروِ خرامانِ قامتت نرسیدم\nامید در شبِ زلفت به روزِ عمر نبستم\nطمع به دورِ دهانت ز کامِ دل بِبُریدم\nبه شوق چشمهٔ نُوشَتْ چه قطره‌ها که فشاندم\nز لَعلِ باده‌فروشت چه عشوه‌ها که خریدم\nز غمزه بر دلِ ریشم چه تیرها که گشادی\nز غصه بر سرِ کویت چه بارها که کشیدم\nز کویِ یار بیار ای نسیمِ صبح غباری\nکه بویِ خونِ دلِ ریش از آن تراب شنیدم\nگناهِ چشمِ سیاهِ تو بود و گردنِ دلخواه\nکه من چو آهویِ وحشی ز آدمی بِرَمیدم\nچو غنچه بر سرم از کویِ او گذشت نسیمی\nکه پرده بر دلِ خونین به بویِ او بِدَریدَم\nبه خاکِ پایِ تو سوگند و نورِ دیدهٔ حافظ\nکه بی رخِ تو، فروغ از چراغ دیده ندیدم"},{"id":323,"poem":"ز دستِ کوتهِ خود زیرِ بارم\nکه از بالابلندان شرمسارم\nمگر زنجیرِ مویی گیردَم دست\nوگر نه سر به شیدایی برآرم\nز چشمِ من بپرس اوضاعِ گردون\nکه شب تا روز اختر می‌شمارم\nبدین شکرانه می‌بوسم لبِ جام\nکه کرد آگه ز رازِ روزگارم\nاگر گفتم دعایِ مِی فروشان\nچه باشد؟ حقِّ نعمت می‌گزارم\nمن از بازویِ خود دارم بسی شُکر\n«که زورِ مردم آزاری ندارم»\nسری دارم چو حافظ مست لیکن\nبه لطف آن سری امیدوارم"},{"id":324,"poem":"گرچه افتاد ز زلفش گرهی در کارم\nهمچُنان چشمِ گشاد از کَرَمَش می‌دارم\nبه طَرَب حمل مَکُن سرخیِ رویم که چو جام\nخونِ دل عکس برون می‌دهد از رخسارم\nپردهٔ مطربم از دست برون خواهد برد\nآه اگر زان که در این پرده نباشد بارم\nپاسبانِ حرمِ دل شده‌ام شب همه شب\nتا در این پرده جز اندیشه او نَگْذارم\nمنم آن شاعرِ ساحر که به افسونِ سخن\nاز نِیِ کِلک، همه قند و شِکَر می‌بارم\nدیدهٔ بخت به افسانهٔ او شد در خواب\nکو نسیمی ز عنایت که کُنَد بیدارم؟\nچون تو را در گذر ای یار نمی‌یارم دید\nبا که گویم که بگوید سخنی با یارم؟\nدوش می‌گفت که حافظ همه روی است و ریا\nبجز از خاکِ درش با که بُوَد بازارم؟"},{"id":325,"poem":"گر دست دهد خاکِ کفِ پایِ نگارم\nبر لوحِ بَصَر خطِّ غباری بنگارم\nبر بویِ کنارِ تو شدم غرق و امید است\nاز موجِ سرشکم که رسانَد به کنارم\nپروانهٔ او گر رسدم در طلبِ جان\nچون شمع همان دَم به دَمی جان بِسِپارَم\nامروز مَکَش سر ز وفایِ من و اندیش\nزان شب که من از غم به دعا دست برآرم\nزلفین سیاهِ تو به دلداریِ عُشّاق\nدادند قراری و بِبُردَند قرارم\nای باد از آن باده نسیمی به من آور\nکان بویِ شفابخش بُوَد دفعِ خُمارم\nگر قلبِ دلم را نَنَهد دوست عیاری\nمن نقدِ روان در دَمَش از دیده شمارم\nدامن مَفِشان از منِ خاکی که پس از من\nزین در نتواند که بَرَد باد غبارم\nحافظ لبِ لَعلَش چو مرا جانِ عزیز است\nعمری بُوَد آن لحظه که جان را به لب آرم"},{"id":326,"poem":"در نهانخانهٔ عشرت صنمی خوش دارم\nکز سر زلف و رخش، نعل در آتش دارم\nعاشق و رندم و می‌خواره به آواز بلند\nوین همه منصب از آن حور پری‌وش دارم\nگر تو زین دست، مرا بی سر و سامان داری\nمن به آه سحرت زلف، مشوش دارم\nگر چنین چهره گشاید خطِ زنگاریِ دوست\nمن رخ زرد، به خونابه منقش دارم\nگر به کاشانهٔ رندان قدمی خواهی زد\nنُقل شعر شِکرین و مِیِ بی‌غش دارم\nناوَک غمزه بیار و رَسَنِ زلف که من\nجنگ‌ها با دل مجروح بلاکش دارم\nحافظا چون غم و شادیِّ جهان در گذر است\nبهتر آن است که من خاطر خود خوش دارم"},{"id":327,"poem":"مرا عهدی‌ست با جانان که تا جان در بدن دارم\nهوادارانِ کویش را چو جانِ خویشتن دارم\nصفایِ خلوتِ خاطر از آن شمعِ چِگِل جویم\nفروغِ چشم و نورِ دل از آن ماهِ خُتَن دارم\nبه کام و آرزویِ دل، چو دارم خلوتی حاصل\nچه فکر از خُبثِ بدگویان، میانِ انجمن دارم؟\nمرا در خانه سروی هست کاندر سایهٔ قَدَّش\nفَراغ از سروِ بستانی و شمشادِ چمن دارم\nگَرَم صد لشکر از خوبان به قصدِ دل کمین سازند\nبِحَمْدِ الله و الْمِنَّه بُتی لشکرشِکن دارم\nسِزَد کز خاتمِ لَعلَش زَنَم لافِ سلیمانی\nچو اسمِ اعظمم باشد، چه باک از اهرِمَن دارم؟\nالا ای پیرِ فرزانه، مَکُن عیبم ز میخانه\nکه من در تَرکِ پیمانه دلی پیمان‌شِکن دارم\nخدا را ای رقیب امشب زمانی دیده بر هم نِه\nکه من با لَعلِ خاموشش نهانی صد سخن دارم\nچو در گل‌زارِ اِقبالش خرامانم بِحَمْدِالله\nنه میلِ لاله و نسرین، نه برگِ نسترن دارم\nبه رندی شهره شد حافظ میانِ همدمان، لیکن\nچه غم دارم که در عالم قَوامُ‌الدّین حَسَن دارم"},{"id":328,"poem":"من که باشم که بر آن خاطرِ عاطِر گذرم؟\nلطف‌ها می‌کنی ای خاکِ دَرَت، تاجِ سرم\nدلبرا بنده نوازیت که آموخت؟ بگو\nکه من این ظَن، به رقیبانِ تو هرگز نَبَرم\nهمتم بدرقهٔ راه کن ای طایرِ قدس\nکه دراز است رَهِ مقصد و من نوسفرم\nای نسیمِ سحری بندگیِ من برسان\nکه فراموش مکن وقتِ دعایِ سحرم\nخُرَم آن روز کز این مرحله بَربَندَم بار\nو از سرِ کوی تو پرسند رفیقان خبرم\nحافظا شاید اگر در طلبِ گوهرِ وصل\nدیده دریا کُنم از اشک و در او غوطه خورم\nپایهٔ نظم بلند است و جهان گیر بگو\nتا کُند پادشهِ بحر دهان پُر گهرم"},{"id":329,"poem":"جوزا سَحَر نهادْ حمایل برابرم\nیعنی غلامِ شاهم و سوگند می‌خورم\nساقی بیا که از مددِ بختِ کارساز\nکامی که خواستم ز خدا شد مُیَسَّرَم\nجامی بده که باز به شادیِّ رویِ شاه\nپیرانه‌سر، هوایِ جوانیست در سرم\nراهم مزن به وصفِ زلالِ خِضِر که من\nاز جامِ شاه جُرعه‌کشِ حوضِ کوثرم\nشاها اگر به عرش رسانم سریرِ فضل\nمملوکِ این جِنابم و مسکین این دَرَم\nمن جرعه‌نوشِ بزمِ تو بودم هزار سال\nکی تَرکِ آبخورْد کُنَد طبعِ خوگرم\nور باوَرَت نمی‌کند از بنده این حدیث\nاز گفتهٔ کمال، دلیلی بیاورم\n«گر بَرکَنَم دل از تو و بَردارم از تو مِهر\nآن مِهر بَر کِه افکنم؟ آن دل کجا بَرَم؟»\nمنصور بِنْ مُظَفَّرِ غازیست حرزِ من\nوز این خجسته‌نام، بر اَعدا مُظَفَّرَم\nعهدِ اَلَستِ من همه با عشقِ شاه بود\nوَز شاهراهِ عمر، بدین عهد بگذرم\nگردون چو کرد نظمِ ثُرَیّا به نامِ شاه\nمن نظمِ دُر چرا نکنم؟ از کِه کمترم؟\nشاهین‌صفت چو طعمه چشیدم ز دستِ شاه\nکِی باشد التفات به صیدِ کبوترم\nای شاهِ شیرگیر چه کم گردد ار شود\nدر سایهٔ تو مُلکِ فَراغت مُیَسَّرَم\nشعرم به یُمنِ مَدحِ تو صد مُلکِ دل گشاد\nگویی که تیغِ توست زبانِ سُخنورم\nبر گُلشنی اگر بِگُذشتم چو بادِ صبح\nنِی عشقِ سرو بود و نه شوقِ صنوبرم\nبویِ تو می‌شنیدم و بر یادِ رویِ تو\nدادند ساقیانِ طَرَب یک دو ساغرم\nمستی به آبِ یک دو عِنَب وضعِ بنده نیست\nمن سالخورده پیرِ خرابات‌پَروَرَم\nبا سِیرِ اخترِ فلکم داوری بَسیست\nانصافِ شاه باد در این قصه یاورم\nشُکرِ خدا که باز در این اوجِ بارگاه\nطاووسِ عرش می‌شنود صیتِ شَهپَرَم\nنامم ز کارخانهٔ عُشّاق محو باد\nگر جز محبتِ تو بُوَد شغلِ دیگرم\nشِبلُ الاَسَد به صیدِ دلم حمله کرد و من\nگر لاغرم وگرنه شکارِ غضنفرم\nای عاشقانِ رویِ تو از ذَرِّه بیشتر\nمن کِی رَسَم به وصلِ تو کز ذَرِّه کمترم\nبنما به من که مُنکِرِ حُسنِ رخِ تو کیست\nتا دیده‌اش به گِزلِکِ غیرت برآورم\nبر من فُتاد سایهٔ خورشیدِ سلطنت\nواکنون فَراغت است ز خورشیدِ خاورم\nمقصود از این معامله بازارتیزی است\nنی جلوه می‌فروشم و نی عشوه می‌خرم"},{"id":330,"poem":"تو همچو صبحی و من شمعِ خلوتِ سَحَرم\nتبسمی کن و جان بین که چون همی‌سِپرَم\nچُنین که در دلِ من داغِ زلفِ سرکَشِ توست\nبنفشه زار شود تُربَتَم چو درگذرم\nبر آستانِ مرادَت گشاده‌ام درِ چشم\nکه یک نظر فِکنی، خود فِکندی از نظرم\nچه شُکر گویمت ای خیلِ غم، عَفاکَ الله\nکه روزِ بی‌کسی آخر نمی‌روی ز سرم\nغلامِ مردمِ چشمم، که با سیاه دلی\nهزار قطره بِبارَد چو دردِ دل شِمُرَم\nبه هر نظر بُت ما جلوه می‌کند، لیکن\nکس این کرشمه نبیند که من همی‌ نِگَرَم\nبه خاکِ حافظ اگر یار بگذرد چون باد\nز شوق در دلِ آن تنگنا کفن بِدَرَم"},{"id":331,"poem":"به تیغم گَر کُشد، دستش نگیرم\nوگر تیرم زَنَد منّت پذیرم\nکمانِ ابرویت را گو بزن تیر\nکه پیشِ دست و بازویت بمیرم\nغمِ گیتی گر از پایم درآرد\nبجز ساغر که باشد دستگیرم؟\nبرآی ای آفتابِ صبحِ امّید\nکه در دستِ شبِ هجران اسیرم\nبه فریادم رَس ای پیرِ خرابات\nبه یک جرعه جوانم کن که پیرم\nبه گیسویِ تو خوردم دوش سوگند\nکه من از پایِ تو سر بر نگیرم\nبسوز این خرقهٔ تقوا تو حافظ\nکه گر آتش شَوَم در وی نگیرم"},{"id":332,"poem":"مزن بر دل ز نوکِ غمزه تیرم\nکه پیشِ چشمِ بیمارت بمیرم\nنِصاب حُسن در حدِّ کمال است\nزکاتم دِه که مسکین و فقیرم\nچو طفلان تا کِی ای زاهد، فریبی\nبه سیبِ بوستان و شهد و شیرم\nچُنان پُر شد فضایِ سینه از دوست\nکه فکرِ خویش گم شد از ضمیرم\nقدح پُر کن که من در دولتِ عشق\nجوانبخت جهانم گرچه پیرم\nقراری بسته‌ام با مِی فروشان\nکه روزِ غم به جز ساغر نگیرم\nمبادا جز حسابِ مُطرب و مِی\nاگر نقشی کشد کِلکِ دبیرم\nدر این غوغا که کَس کَس را نپُرسد\nمن از پیرِ مُغان منّت پذیرم\nخوشا آن دَم کز اِستغنایِ مستی\nفَراغت باشد از شاه و وزیرم\nمن آن مرغم که هر شام و سحرگاه\nز بامِ عرش می‌آید صَفیرم\nچو حافظ گنج او در سینه دارم\nاگرچه مُدَّعی بیند حقیرم"},{"id":333,"poem":"نمازِ شامِ غریبان چو گریه آغازم\nبه مویه‌هایِ غریبانه، قِصه پردازم\nبه یادِ یار و دیار آنچنان بِگِریَم زار\nکه از جهان رَه و رسمِ سفر براندازم\nمن از دیارِ حبیبم نه از بِلاد غریب\nمُهَیمنا به رفیقانِ خود رسان بازم\nخدای را مددی ای رفیقِ رَه تا من\nبه کویِ میکده دیگر عَلَم برافرازم\nخِرَد ز پیریِ من کِی حساب برگیرد؟\nکه باز با صَنَمی طفل، عشق می‌بازم\nبجز صَبا و شِمالم نمی‌شناسد کس\nعزیز من! که بجز باد نیست دَم‌سازم\nهوایِ منزل یار، آب زندگانیِ ماست\nصبا بیار نسیمی ز خاکِ شیرازم\nسِرشکم آمد و عیبم بگفت روی به روی\nشکایت از که کنم؟ خانگی‌ست غَمّازَم\nز چَنگِ زهره شنیدم که صبح‌دم می‌گفت\n«غلامِ حافظِ خوش‌لهجهٔ خوش‌آوازم»"},{"id":334,"poem":"گر دست رَسَد در سرِ زُلفینِ تو بازم\nچون گوی چه سرها که به چوگانِ تو بازم\nزلفِ تو مرا عمر دراز است ولی نیست\nدر دست، سرِ مویی از آن عمرِ درازم\nپروانهٔ راحت بده ای شمع که امشب\nاز آتشِ دل پیش تو چون شمع گُدازم\nآن دَم که به یک خنده دَهَم جان چو صُراحی\nمستانِ تو خواهم که گُزارَند نمازم\nچون نیست نمازِ منِ آلوده نمازی\nدر میکده زان کم نَشَوَد سوز و گُدازم\nدر مسجد و میخانه خیالت اگر آید\nمحراب و کمانچه ز دو ابرویِ تو سازم\nگر خلوتِ ما را شبی از رخ بِفُروزی\nچون صبح بر آفاقِ جهان سر بِفَرازم\nمحمود بُوَد عاقبتِ کار در این راه\nگر سر بِرَوَد در سرِ سودایِ اَیازم\nحافظ غمِ دل با که بگویم؟ که در این دور\nجز جام نشاید که بُوَد محرمِ رازم"},{"id":335,"poem":"در خراباتِ مُغان گر گذر افتد بازم\nحاصلِ خرقه و سجاده، روان دربازم\nحلقهٔ توبه گر امروز چو زُهّاد زنم\nخازنِ میکده فردا نَکُنَد در، بازم\nور چو پروانه دهد دست، فَراغِ بالی\nجز بدان عارضِ شمعی نَبُوَد پروازم\nصحبتِ حور نخواهم که بُوَد عینِ قُصور\nبا خیالِ تو اگر با دِگری پردازم\nسِرِّ سودایِ تو در سینه بماندی پنهان\nچشمِ تَر دامن اگر فاش نکردی رازم\nمرغْ سان از قفسِ خاک هوایی گشتم\nبه هوایی که مگر صید کُنَد شهبازم\nهمچو چنگ ار به کناری ندهی کامِ دلم\nاز لبِ خویش چو نِی یک نفسی بِنْوازم\nماجرایِ دلِ خون گشته نگویم با کس\nزان که جز تیغِ غمت نیست کسی دَمسازم\nگر به هر موی، سری بر تنِ حافظ باشد\nهمچو زلفت همه را در قدمت اندازم"},{"id":336,"poem":"مژدهٔ وصلِ تو کو کز سرِ جان برخیزم\nطایرِ قُدسم و از دامِ جهان برخیزم\nبه ولای تو که گر بندهٔ خویشم خوانی\nاز سرِ خواجگیِ کون و مکان برخیزم\nیا رب از ابرِ هدایت بِرَسان بارانی\nپیشتر زان که چو گَردی ز میان برخیزم\nبر سرِ تربتِ من با مِی و مُطرب بنشین\nتا به بویت ز لحد رقص کُنان برخیزم\nخیز و بالا بنما ای بتِ شیرین حرکات\nکز سرِ جان و جهان دست فشان برخیزم\nگرچه پیرم تو شبی تنگ در آغوشم کَش\nتا سحرگه ز کنارِ تو جوان برخیزم\nروز مرگم نفسی مهلتِ دیدار بده\nتا چو حافظ ز سرِ جان و جهان برخیزم"},{"id":337,"poem":"چرا نه در پِیِ عزمِ دیارِ خود باشم\nچرا نه خاکِ سرِ کویِ یارِ خود باشم\nغمِ غریبی و غربت چو بر نمی‌تابم\nبه شهرِ خود رَوَم و شهریارِ خود باشم\nز مَحرمان سراپردهٔ وصال شَوَم\nز بندگانِ خداوندگارِ خود باشم\nچو کار عمر نه پیداست باری آن اولی\nکه روزِ واقعه پیشِ نگارِ خود باشم\nز دستِ بختِ گران‌خواب و کارِ بی‌سامان\nگَرَم بُوَد گِلِه‌ای، رازدارِ خود باشم\nهمیشه پیشهٔ من عاشقی و رندی بود\nدگر بکوشم و مشغولِ کارِ خود باشم\nبُوَد که لطفِ ازل رهنمون شود حافظ\nوگرنه تا به ابد شرمسارِ خود باشم"},{"id":338,"poem":"من دوستدارِ رویِ خوش و مویِ دلکَشَم\nمَدهوشِ چَشمِ مست و مِیِ صافِ بی‌غَشَم\nگفتی ز سِرِّ عهدِ ازل یک سخن بگو\nآنگَه بگویمت که دو پیمانه دَر کَشَم\nمن آدمِ بهشتیَم اما در این سفر\nحالی اسیرِ عشقِ جوانان مَهوَشَم\nدر عاشقی گزیر نباشد ز ساز و سوز\nاِسْتادِه‌ام چو شمع، مَتَرسان ز آتشم\nشیراز معدنِ لبِ لَعل است و کانِ حُسن\nمن جوهریِّ مُفلِسَم، ایرا مُشَوَّشَم\nاز بس که چَشمِ مست در این شهر دیده‌ام\nحقّا که مِی نمی‌خورم اکنون و سَرخوشم\nشهریست پُر کِرشمهٔ حوران ز شِش جهت\nچیزیم نیست وَر نه خریدارِ هر شَشَم\nبخت ار مدد دهد که کَشَم رَخت سویِ دوست\nگیسویِ حور گَرد فشاند ز مَفْرَشَم\nحافظ عروسِ طَبعِ مرا جلوه آرزوست\nآیینه‌ای ندارم از آن آه می‌کشم"},{"id":339,"poem":"خیالِ رویِ تو چون بُگذَرَد به گلشنِ چَشم\nدل از پِیِ نظر آید به سویِ روزنِ چَشم\nسزایِ تکیه گَهَت مَنظَری نمی‌بینم\nمنم ز عالَم و این گوشهٔ مُعَیَّنِ چَشم\nبیا که لَعل و گُهَر در نثارِ مَقْدَمِ تو\nز گنج‌خانه‌‌ دل می‌کشم به روزنِ چَشم\nسَحَر سِرِشکِ رَوانم سرِ خرابی داشت\nگَرَم نه خونِ جگر می‌گرفت دامنِ چَشم\nنخست روز که دیدم رخِ تو دل می‌گفت\nاگر رسَد خلَلی، خونِ من به گردنِ چَشم\nبه بویِ مژدهٔ وصلِ تو تا سَحَر، شبِ دوش\nبه راهِ باد نهادم چراغِ روشنِ چَشم\nبه مردمی که دلِ دردمندِ حافظ را\nمَزَن به ناوَکِ دلدوزِ مردم افکنِ چَشم"},{"id":340,"poem":"من که از آتشِ دل چون خُمِ مِی در جوشم\nمُهر بر لب زده، خون می‌خورم و خاموشم\nقصدِ جان است طمع در لبِ جانان کردن\nتو مرا بین که در این کار به جان می‌کوشم\nمن کِی آزاد شَوَم از غمِ دل؟ چون هر دَم\nهندویِ زلفِ بُتی حلقه کُنَد در گوشم\nحاشَ لِلَّه که نیَم معتقدِ طاعتِ خویش\nاین قَدَر هست که گَه گَه قدحی می‌نوشم\nهست امیدم که علیرغمِ عدو روزِ جزا\nفیضِ عَفوَش نَنَهد بارِ گُنَه بر دوشم\nپدرم روضهٔ رضوان به دو گندم بفروخت\nمن چرا مُلکِ جهان را به جوی نفروشم؟!\nخرقه‌پوشیِ من از غایتِ دین‌داری نیست\nپرده‌ای بر سرِ صد عیبِ نهان می‌پوشم\nمن که خواهم که ننوشم به جز از راوَقِ خُم\nچه کنم گر سخنِ پیرِ مُغان نَنْیوشَم؟\nگر از این دست زَنَد مُطربِ مجلس رَهِ عشق\nشعرِ حافظ بِبَرَد وقتِ سماع از هوشم"},{"id":341,"poem":"گر من از سرزنشِ مدَّعیان اندیشم\nشیوهٔ مستی و رندی نَرَوَد از پیشم\nزهدِ رندانِ نوآموخته راهی به دِهیست\nمن که بدنامِ جهانم چه صلاح اندیشم؟\nشاهِ شوریده‌سران خوان، منِ بی‌سامان را\nزان که در کم‌خِرَدی از همه عالم بیشم\nبر جَبین نقش کُن از خونِ دلِ من خالی\nتا بدانند که قربانِ تو کافِرکیشم\nاعتقادی بِنُما و بِگُذَر بهرِ خدا\nتا در این خرقه ندانی که چه نادَرویشم\nشعر خونبارِ من ای باد، بِدان یار رسان\nکه ز مژگانِ سیَه، بر رگِ جان زد نیشم\nمن اگر باده خورم ور نه چه کارم با کس؟\nحافظِ رازِ خود و عارفِ وقتِ خویشم"},{"id":342,"poem":"حجابِ چهرهٔ جان می‌شود غبارِ تنم\nخوشا دَمی که از آن چهره پرده برفکنم\nچُنین قفس نه سزایِ چو من خوش‌اَلحانی‌ست\nرَوَم به گلشنِ رضوان، که مرغِ آن چمنم\nعیان نشد که چرا آمدم، کجا رفتم\nدریغ و درد که غافل ز کارِ خویشتنم\nچگونه طوف کنم در فضایِ عالمِ قدس؟\nکه در سراچهٔ ترکیب، تخته‌‌بندِ تنم\nاگر ز خونِ دلم بویِ شوق می‌آید\nعجب مدار که هم‌دردِ نافهٔ خُتنم\nطرازِ پیرهنِ زَرکشم مبین چون شمع\nکه سوزهاست نهانی درونِ پیرهنم\nبیا و هستیِ حافظ ز پیشِ او بردار\nکه با وجودِ تو کس نشنود ز من که منم"},{"id":343,"poem":"چِل سال بیش رفت که من لاف می‌زنم\nکز چاکرانِ پیرِ مُغان کمترین منم\nهرگز به یُمنِ عاطفَتِ پیرِ مِی‌فروش\nساغر تُهی نشد ز مِیِ صافِ روشنم\nاز جاهِ عشق و دولتِ رندانِ پاک‌باز\nپیوسته صدرِ مَصطَبِه‌ها بود مَسکنم\nدر شأنِ من به دُردکِشی ظنِّ بَد مبر\nکآلوده گشت جامه، ولی پاک‌دامنم\nشهبازِ دست پادشهم، این چه حالت است؟\nکز یاد بُرده‌اند هوایِ نشیمنم\nحیف است بلبلی چو من اکنون در این قفس\nبا این لسانِ عَذب، که خامُش چو سوسنم\nآب و هوای فارس عجب سِفله‌پرور است\nکو همرهی؟ که خیمه از این خاک بَرکَنَم\nحافظ! به زیرِ خرقه قدح تا به کِی کشی؟\nدر بزمِ خواجه، پرده ز کارَت برافکنم\nتوران‌شهِ خجسته که در من یَزیدِ فضل\nشد مِنَّتِ مَواهبِ او طوقِ گردنم"},{"id":344,"poem":"عمریست تا من در طلب، هر روز گامی می‌زنم\nدستِ شفاعت هر زمان در نیک نامی می‌زنم\nبی ماهِ مِهرافروزِ خود، تا بُگذَرانَم روزِ خود\nدامی به راهی می‌نهم، مرغی به دامی می‌زنم\nاورنگ کو؟ گُلچهر کو؟ نقشِ وفا و مِهر کو؟\nحالی من اندر عاشقی، داوِ تمامی می‌زنم\nتا بو که یابم آگهی از سایهٔ سَروِ سَهی\nگلبانگِ عشق از هر طرف، بر خوش خرامی می‌زنم\nهرچند کـ‌آن آرامِ دل، دانم نبخشد کامِ دل\nنقشِ خیالی می‌کشم، فالِ دوامی می‌زنم\nدانم سر آرد غُصِّه را، رنگین برآرد قِصِّه را\nاین آهِ خون افشان که من، هر صبح و شامی می‌زنم\nبا آن که از وی غایبم، وز مِی چو حافظ تایبم\nدر مجلسِ روحانیان، گَه گاه جامی می‌زنم"},{"id":345,"poem":"بی تو ای سروِ روان، با گل و گلشن چه کنم؟\nزلفِ سنبل چه کشَم عارضِ سوسن چه کنم؟\nآه کز طعنهٔ بدخواه ندیدم رویت\nنیست چون آینه‌ام روی ز آهن، چه کنم؟\nبرو ای ناصِح و بر دردکشان خرده مگیر\nکارفرمایِ قَدَر می‌کند این، من چه کنم؟\nبرقِ غیرت چو چُنین می‌جَهَد از مَکمَنِ غیب\nتو بفرما که منِ سوخته خرمن چه کنم؟\nشاهِ تُرکان چو پسندید و به چاهم انداخت\nدستگیر ار نشود لطفِ تَهَمتَن چه کنم؟\nمددی گر به چراغی نکند آتشِ طور\nچارهٔ تیره‌شبِ وادی ایمن چه کنم؟\nحافظا خُلدِبَرین خانهٔ موروثِ من است\nاندر این منزلِ ویرانه نشیمن چه کنم؟"},{"id":346,"poem":"من نه آن رندم که تَرکِ شاهد و ساغر کنم\nمحتسب داند که من این کارها کمتر کنم\nمن که عیبِ توبه‌کاران کرده باشم بارها\nتوبه از مِی وقتِ گُل دیوانه باشم گر کنم\nعشق دردانه‌ست و من غَوّاص و دریا میکده\nسر فروبُردم در آن جا تا کجا سر بَرکُنم\nلاله ساغرگیر و نرگس مست و بر ما نامِ فِسق\nداوری دارم بسی یا رب، که را داور کنم؟\nبازکَش یک دَم عِنان ای تُرکِ شهرآشوبِ من\nتا ز اشک و چهره راهت پُر زر و گوهر کنم\nمن که از یاقوت و لَعلِ اشک دارم گنج‌ها\nکِی نظر در فیضِ خورشیدِ بلنداختر کنم\nچون صبا مجموعهٔ گل را به آبِ لطف شست\nکج دلم خوان، گر نظر بر صفحهٔ دفتر کنم\nعهد و پیمانِ فلک را نیست چندان اعتبار\nعهد با پیمانه بندم، شرط با ساغَر کُنم\nمن که دارم در گدایی گنجِ سلطانی به دست\nکِی طمع در گردشِ گردونِ دون‌پَرور کنم\nگر چه گَردآلودِ فقرم، شرم باد از همتم\nگر به آبِ چشمهٔ خورشید دامن تَر کنم\nعاشقان را گر در آتش می‌پسندد لطفِ دوست\nتنگ چشمم گر نظر در چشمهٔ کوثر کنم\nدوش لعلش عشوه‌ای می‌داد حافظ را، ولی\nمن نه آنم کز وی این افسانه‌ها باور کنم"},{"id":347,"poem":"صَنَما با غمِ عشقِ تو چه تدبیر کنم؟\nتا به کِی در غمِ تو نالهٔ شبگیر کنم؟\nدل دیوانه از آن شد که نصیحت شِنَوَد\nمگرش هم ز سرِ زلفِ تو زنجیر کنم\nآن چه در مدتِ هِجرِ تو کشیدم هیهات\nدر یکی نامه محال است که تَحریر کنم\nبا سرِ زلفِ تو مجموعِ پریشانی خود\nکو مجالی که سراسر همه تقریر کنم؟\nآن زمان کآرزویِ دیدنِ جانم باشد\nدر نظر نقشِ رخِ خوبِ تو تصویر کنم\nگر بدانم که وصالِ تو بدین دست دهد\nدین و دل را همه دَربازم و توفیر کنم\nدور شو از برم ای واعظ و بیهوده مگوی\nمن نه آنم که دگر گوش به تزویر کنم\nنیست امّید صَلاحی ز فسادِ حافظ\nچون که تقدیر چُنین است، چه تدبیر کنم؟"},{"id":348,"poem":"دیده دریا کُنم و صبر به صحرا فِکنم\nوَاندر این کار، دلِ خویش به دریا فِکنم\nاز دلِ تنگِ گنه‌کار برآرم آهی\nکآتش اندر گنهِ آدم و حوا فکنم\nمایهٔ خوش‌دلی آن جاست که دل‌دار آن جاست\nمی‌کنم جهد که خود را مگر آن جا فکنم\nبِگشا بندِ قبا ای مهِ خورشیدکلاه!\nتا چو زلفت سَرِ سودا زده در پا فکنم\nخورده‌ام تیرِ فلک، باده بده تا سرمست\nعُقده در بندِ کَمرتَرکشِ جوزا فکنم\nجرعهٔ جام بر این تختِ روان افشانم\nغُلغُلِ چنگ در این گنبدِ مینا فکنم\nحافظا! تکیه بر ایّام چو سهو است و خطا\nمن چرا عِشرتِ امروز به فردا فکنم؟"},{"id":349,"poem":"دوش سودایِ رُخَش گفتم ز سر بیرون کُنَم\nگفت کو زنجیر؟ تا تدبیرِ این مجنون کُنَم\nقامتش را سرو گفتم، سر کشید از من به خشم\nدوستان از راست می‌رَنجَد نِگارم، چون کنم؟\nنکته ناسنجیده گفتم دلبرا معذور دار\nعشوه‌ای فرمای تا من طبع را موزون کنم\nزردرویی می‌کَشَم زان طبعِ نازک، بی‌گناه\nساقیا جامی بده تا چهره را گُلگون کنم\nای نسیمِ منزلِ لیلی خدا را تا به کی\nرَبع را برهم زنم، اَطلال را جیحون کنم\nمن که رَه بُردم به گنجِ حُسنِ بی‌پایان دوست\nصد گدایِ همچو خود را بعد از این قارون کنم\nای مَهِ صاحب قران، از بنده حافظ یاد کن\nتا دعایِ دولتِ آن حُسنِ روزافزون کنم"},{"id":350,"poem":"به عزمِ توبه سحر گفتم استخاره کُنم\nبهارِ توبه‌شکن می‌رسد چه چاره کُنم؟\nسخن درست بگویم نمی‌توانم دید\nکه مِی خورند حریفان و من نِظاره کنم\nچو غنچه با لبِ خندان به یادِ مجلسِ شاه\nپیاله گیرم و از شوق، جامه پاره کنم\nبه دورِ لاله دماغِ مرا عِلاج کنید\nگر از میانهٔ بزمِ طَرَب کناره کنم\nز رویِ دوست مرا چون گلِ مراد شِکُفت\nحوالهٔ سَرِ دشمن به سنگِ خاره کنم\nگدایِ میکده‌ام، لیک وقتِ مستی بین\nکه ناز بر فلک و حکم بر ستاره کنم\nمرا که نیست رَه و رسمِ لقمه‌پرهیزی\nچرا ملامتِ رندِ شراب‌خواره کنم\nبه تختِ گُل بنشانم بُتی چو سلطانی\nز سنبل و سَمَنش، سازِ طوق و یاره کنم\nز باده خوردن پنهان مَلول شد حافظ\nبه بانگِ بَربَط و نِی، رازَش آشکاره کنم"},{"id":351,"poem":"حاشا که من به موسمِ گُل تَرکِ مِی کُنم\nمن لافِ عقل می‌زنم، این کار کِی کنم\nمطرب کجاست تا همه محصولِ زهد و عِلم\nدر کارِ چنگ و بَربَط و آوازِ نِی کُنَم\nاز قیل و قالِ مدرسه حالی دلم گرفت\nیک چند نیز خدمتِ معشوق و مِی کنم\nکِی بود در زمانه وفا؟ جامِ مِی بیار\nتا من حکایتِ جم و کاووسِ کِی کنم\nاز نامهٔ سیاه نترسم که روزِ حشر\nبا فیضِ لطفِ او صد از این نامه طِی کنم\nکو پیک صبح؟ تا گله‌های شبِ فِراق\nبا آن خجسته طالعِ فرخنده پِی کنم\nاین جانِ عاریت که به حافظ سپرد دوست\nروزی رُخش ببینم و تسلیمِ وی کنم"},{"id":352,"poem":"روزگاری شد که در میخانه خدمت می‌کنم\nدر لباسِ فقر کارِ اهلِ دولت می‌کنم\nتا کی اندر دام وصل آرم تَذَروی خوش‌خَرام\nدر کمینم و انتظار وقتِ فرصت می‌کنم\nواعظِ ما بوی حق نشنید بشنو کاین سخن\nدر حضورش نیز می‌گویم نه غیبت می‌کنم\nبا صبا افتان و خیزان می‌روم تا کویِ دوست\nو از رفیقان ره استمدادِ همت می‌کنم\nخاکِ کویت زحمت ما برنتابد بیش از این\nلطف‌ها کردی بتا، تخفیفِ زحمت می‌کنم\nزلفِ دلبر دامِ راه و غمزه‌اش تیرِ بلاست\nیاد دار ای دل که چندینت نصیحت می‌کنم\nدیدهٔ بدبین بپوشان ای کریمِ عیب‌پوش\nزین دلیری‌ها که من در کُنجِ خلوت می‌کنم\nحافظم در مجلسی دُردی‌کشم در محفلی\nبنگر این شوخی که چون با خلق، صنعت می‌کنم"},{"id":353,"poem":"من تَرکِ عشقِ شاهد و ساغر نمی‌کنم\nصد بار توبه کردم و دیگر نمی‌کنم\nباغِ بهشت و سایهٔ طوبی و قصر و حور\nبا خاکِ کوی دوست برابر نمی‌کنم\nتلقین و درسِ اهل نظر یک اشارت است\nگفتم کِنایتی و مکرر نمی‌کنم\nهرگز نمی‌شود ز سرِ خود خبر مرا\nتا در میانِ میکده سر بَر نمی‌کنم\nناصِح به طَعن گفت که «رو ترکِ عشق کن»\nمحتاجِ جنگ نیست برادر، نمی‌کنم\nاین تقوی‌ام تمام، که با شاهدانِ شهر\nناز و کرشمه بر سرِ منبر نمی‌کنم\nحافظ! جنابِ پیرِ مُغان جایِ دولت است\nمن تَرکِ خاک‌بوسیِ این در نمی‌کنم"},{"id":354,"poem":"به مژگان سیَه کردی هزاران رِخنه در دینم\nبیا کز چَشمِ بیمارت هزاران دَرد برچینم\nالا ای همنشینِ دل که یارانت بِرَفت از یاد\nمرا روزی مباد آن دَم که بی یادِ تو بنشینم\nجهان پیر است و بی‌بنیاد از این فرهادکُش فریاد\nکه کرد افسون و نیرنگش ملول از جانِ شیرینم\nز تابِ آتش دوری، شدم غرقِ عرق چون گُل\nبیار ای بادِ شبگیری نسیمی زان عرقچینم\nجهانِ فانی و باقی فدایِ شاهد و ساقی\nکه سلطانیِّ عالَم را طُفیلِ عشق می‌بینم\nاگر بر جایِ من غیری گزیند دوست، حاکم اوست\nحرامم باد اگر من جان، به جایِ دوست بُگزینم\nصَباحَ الخیر زد بلبل، کجایی ساقیا؟ برخیز\nکه غوغا می‌کند در سر خیالِ خوابِ دوشینم\nشبِ رحلت هم از بستر رَوَم در قصرِ حورُالعین\nاگر در وقتِ جان دادن تو باشی شمعِ بالینم\nحدیثِ آرزومندی که در این نامه ثبت افتاد\nهمانا بی‌غلط باشد، که حافظ داد تلقینم"},{"id":355,"poem":"حالیا مصلحتِ وقت در آن می‌بینم\nکه کشم رَخت به میخانه و خوش بنشینم\nجامِ مِی گیرم و از اهلِ ریا دور شَوَم\nیعنی از اهلِ جهان پاکدلی بُگزینم\nجز صُراحی و کتابم نَبُوَد یار و ندیم\nتا حریفانِ دَغا را به جهان کم بینم\nسر به آزادگی از خَلق برآرم چون سَرو\nگر دهد دست که دامن ز جهان دَرچینم\nبس که در خرقهٔ آلوده زدم لافِ صَلاح\nشرمسار از رخِ ساقی و مِیِ رنگینم\nسینهٔ تَنگِ من و بارِ غمِ او، هیهات\nمردِ این بارِ گران نیست دلِ مسکینم\nمن اگر رندِ خراباتم و گر زاهدِ شهر\nاین مَتاعم که همی‌بینی و کمتر زینم\nبندهٔ آصفِ عهدم دلم از راه مَبَر\nکه اگر دَم زَنَم از چرخ بخواهد کینم\nبر دلم گرد ستم‌هاست خدایا مپسند\nکه مکدر شود آیینه مهرآیینم"},{"id":356,"poem":"گَرَم از دست برخیزد که با دلدار بنشینم\nز جامِ وصل مِی‌ نوشم، ز باغِ عیش گل چینم\nشرابِ تلخِ صوفی سوز، بنیادم بخواهد برد\nلبم بر لب نِه ای ساقی و بِستان جانِ شیرینم\nمگر دیوانه خواهم شد در این سودا که شب تا روز\nسخن با ماه می‌گویم، پَری در خواب می‌بینم\nلبت شِکَّر به مستان داد و چَشمت مِی به مِیخواران\nمنم کز غایتِ حِرمان نه با آنم نه با اینم\nچو هر خاکی که باد آورد، فیضی بُرد از اِنعامت\nز حالِ بنده یاد آور که خدمتگارِ دیرینم\nنه هر کو نقشِ نظمی زد کلامش دلپذیر افتد\nتَذَروِ طُرفه من گیرم که چالاک است شاهینم\nاگر باور نمی‌داری، رو از صورتگرِ چین پُرس\nکه مانی نسخه می‌خواهد ز نوکِ کِلکِ مُشکینم\nوفاداری و حق گویی نه کارِ هر کسی باشد\nغلامِ آصفِ ثانی جلالُ الحقِ و الدینم\nرموزِ مستی و رندی ز من بشنو نه از واعظ\nکه با جام و قَدَح هر دَم ندیمِ ماه و پروینم"},{"id":357,"poem":"در خراباتِ مُغان نورِ خدا می‌بینم\nاین عجب بین که چه نوری ز کجا می‌بینم\nجلوه بر من مفروش ای مَلِکُ‌الْحاج که تو\nخانه می‌بینی و من خانه‌ خدا می‌بینم\nخواهم از زلفِ بُتان نافه‌گشایی کردن\nفکرِ دور است همانا که خطا می‌بینم\nسوزِ دل، اشکِ روان، آهِ سحر، نالهٔ شب\nاین همه از نظرِ لطفِ شما می‌بینم\nهر دَم از رویِ تو نقشی زَنَدَم راهِ خیال\nبا که گویم که در این پرده چه‌ها می‌بینم\nکس ندیده‌ست ز مُشکِ خُتَن و نافهٔ چین\nآنچه من هر سَحَر از بادِ صبا می‌بینم\nدوستان عیبِ نظربازیِ حافظ مکنید\nکه من او را ز مُحِبّانِ شما می‌بینم"},{"id":358,"poem":"غمِ زمانه که هیچش کَران نمی‌بینم\nدَواش جز مِیِ چون ارغوان نمی‌بینم\nبه تَرک خدمتِ پیرِ مُغان نخواهم گفت\nچرا که مصلحتِ خود در آن نمی‌بینم\nز آفتابِ قَدَح ارتفاعِ عیش بگیر\nچرا که طالعِ وقت آن چُنان نمی‌بینم\nنشانِ اهل خدا عاشقیست، با خود دار\nکه در مشایخِ شهر این نشان نمی‌بینم\nبدین دو دیدهٔ حیران من هزار افسوس\nکه با دو آینه رویش عیان نمی‌بینم\nقدِ تو تا بِشُد از جویبارِ دیدهٔ من\nبه جایِ سرو جز آبِ روان نمی‌بینم\nدر این خُمار کَسَم جرعه‌ای نمی‌بخشد\nببین که اهل دلی در میان نمی‌بینم\nنشانِ مویِ میانش که دل در او بستم\nز من مَپرس که خود در میان نمی‌بینم\nمن و سفینهٔ حافظ که جز در این دریا\nبضاعت سخن دُرفشان نمی‌بینم"},{"id":359,"poem":"خُرَّم آن روز کز این منزلِ ویران بروم\nراحتِ جان طلبم و از پِیِ جانان بروم\nگر چه دانم که به جایی نَبَرد راه غریب\nمن به بویِ سرِ آن زلفِ پریشان بروم\nدلم از وحشتِ زندانِ سِکَندَر بگِرفت\nرخت بربندم و تا مُلکِ سلیمان بروم\nچون صبا با تنِ بیمار و دلِ بی‌طاقت\nبه هواداریِ آن سروِ خُرامان بروم\nدر رهِ او چو قلم گر به سرم باید رفت\nبا دلِ زخم‌کَش و دیدهٔ گریان بروم\nنذر کردم گر از این غم به درآیم روزی\nتا درِ میکده شادان و غزل‌خوان بروم\nبه هواداری او ذَرِّه‌صفت، رقص‌کنان\nتا لبِ چشمهٔ خورشیدِ درخشان بروم\nتازیان را غمِ احوالِ گران‌باران نیست\nپارسایان مددی تا خوش و آسان بروم\nور چو حافظ ز بیابان نبرم رَه بیرون\nهمرهِ کوکبهٔ آصفِ دوران بروم"},{"id":360,"poem":"گر از این منزلِ ویران به سویِ خانه رَوَم\nدگر آنجا که رَوَم عاقل و فرزانه رَوَم\nزین سفر گر به سلامت به وطن باز رَسَم\nنَذر کردم که هم از راه به میخانه روم\nتا بگویم که چه کشفم شد از این سیر و سلوک\nبه درِ صَومَعَه با بَربَط و پیمانه روم\nآشنایانِ رَهِ عشق گَرَم خون بخورند\nناکَسَم گر به شکایت سویِ بیگانه روم\nبعد از این دستِ من و زلفِ چو زنجیرِ نگار\nچند و چند از پِیِ کامِ دلِ دیوانه روم\nگر ببینم خمِ ابروی چو محرابش باز\nسجدهٔ شُکر کنم و از پِیِ شُکرانه روم\nخُرَّم آن دَم که چو حافظ به تَوَلّای وزیر\nسرخوش از میکده با دوست به کاشانه روم"},{"id":361,"poem":"آن که پامالِ جفا کرد چو خاکِ راهم\nخاک می‌بوسم و عُذرِ قَدَمَش می‌خواهم\nمن نه آنم که ز جورِ تو بِنالم، حاشا\nبندهٔ معتقد و چاکرِ دولتخواهم\nبسته‌ام در خَمِ گیسویِ تو امّیدِ دراز\nآن مبادا که کُنَد دستِ طلب کوتاهم\nذَرّهٔ خاکم و در کویِ توام جای خوش است\nترسم ای دوست که بادی بِبَرَد ناگاهم\nپیرِ میخانه سَحَر جامِ جهان‌بینم داد\nو اندر آن آینه از حُسنِ تو کرد آگاهم\nصوفیِ صومعهٔ عالَمِ قُدسَم لیکن\nحالیا دیرِ مُغان است حوالتگاهم\nبا منِ راه‌نشین خیز و سوی میکده آی\nتا در آن حلقه ببینی که چه صاحب جاهم\nمست بگذشتی و از حافظت اندیشه نبود\nآه اگر دامنِ حُسنِ تو بگیرد آهم\nخوشم آمد که سحر خسروِ خاور می‌گفت\nبا همه پادشهی بندهٔ تورانشاهم"},{"id":362,"poem":"دیدار شد مُیَسَّر و بوس و کنار هم\nاز بَخت شُکر دارم و از روزگار هم\nزاهد برو که طالع اگر طالعِ من است\nجامم به دست باشد و زلفِ نگار هم\nما عیب کس به مستی و رندی نمی‌کنیم\nلعلِ بُتان خوش است و مِیِ خوشگوار هم\nای دل بشارتی دَهَمَت محتسب نماند\nو از مِی جهان پُر است و بُتِ میگسار هم\nخاطر به دستِ تفرقه دادن نه زیرکیست\nمجموعه‌ای بخواه و صُراحی بیار هم\nبر خاکیانِ عشق فشان جرعهٔ لبش\nتا خاک لعل‌گون شود و مُشکبار هم\nآن شد که چشمِ بد نگران بودی از کمین\nخصم از میان بِرَفت و سرشک از کنار هم\nچون کائنات جمله به بویِ تو زنده‌اند\nای آفتاب سایه ز ما برمدار هم\nچون آب روی لاله و گل، فیضِ حُسنِ توست\nای ابرِ لطف بر منِ خاکی بِبار هم\nحافظ اسیرِ زلفِ تو شد از خدا بترس\nو از اِنتِصافِ آصفِ جم اقتدار هم\nبُرهان مُلک و دین که ز دستِ وزارتش\nایام کانْ یمین شد و دریا یسار هم\nبر یادِ رایِ انورِ او آسمان به صبح\nجان می‌کُنَد فدا و کواکب نثار هم\nگویِ زمین ربودهٔ چوگانِ عدلِ اوست\nوین برکشیده گنبدِ نیلی حصار هم\nعزمِ سَبُک عِنان تو در جنبش آورد\nاین پایدار مرکز عالی مدار هم\nتا از نتیجه فلک و طور دور اوست\nتبدیل ماه و سال و خزان و بهار هم\nخالی مباد کاخِ جلالش ز سروران\nو از ساقیانِ سَروقَدِ گُلعِذار هم"},{"id":363,"poem":"دَردَم از یار است و درمان نیز هم\nدل فدایِ او شد و جان نیز هم\nاین که می‌گویند آن خوشتر ز حسن\nیار ما این دارد و آن نیز هم\nیاد باد آن کاو به قصدِ خونِ ما\nعهد را بشکست و پیمان نیز هم\nدوستان در پرده می‌گویم سخن\nگفته خواهد شد به دَستان نیز هم\nچون سر آمد دولتِ شب‌هایِ وصل\nبگذرد ایامِ هِجران نیز هم\nهر دو عالم یک فروغِ رویِ اوست\nگفتمت پیدا و پنهان نیز هم\nاعتمادی نیست بر کارِ جهان\nبلکه بر گردونِ گَردان نیز هم\nعاشق از قاضی نترسد مِی بیار\nبلکه از یَرغویِ دیوان نیز هم\nمحتسب داند که حافظ عاشق است\nو آصفِ مُلکِ سلیمان نیز هم"},{"id":364,"poem":"ما بی‌غمانِ مست دل از دست داده‌ایم\nهم‌رازِ عشق و هم‌نفسِ جامِ باده‌ایم\nبر ما بسی کمانِ ملامت کشیده‌اند\nتا کارِ خود ز ابرویِ جانان گشاده‌ایم\nای گُل تو دوش داغِ صَبوحی کشیده‌ای\nما آن شقایقیم که با داغ زاده‌ایم\nپیرِ مُغان ز توبهٔ ما گر ملول شد\nگو باده صاف کن که به عذر ایستاده‌ایم\nکار از تو می‌رود، مددی ای دلیلِ راه\nکانصاف می‌دهیم و ز راه اوفتاده‌ایم\nچون لاله، مِی مبین و قَدَح در میانِ کار\nاین داغ بین که بر دلِ خونین نهاده‌ایم\nگفتی که «حافظ این همه رنگ و خیال چیست؟!»\nنقشِ غلط مَبین که همان لوحِ ساده‌ایم"},{"id":365,"poem":"عمریست تا به راهِ غَمَت رو نهاده‌ایم\nروی و ریایِ خَلق به یک سو نهاده‌ایم\nطاق و رواقِ مدرسه و قال و قیلِ عِلم\nدر راهِ جام و ساقیِ مَه رو نهاده‌ایم\nهم جان بِدان دو نرگسِ جادو سپرده‌ایم\nهم دل بدان دو سُنبلِ هندو نهاده‌ایم\nعمری گذشت تا به امیدِ اشارتی\nچشمی بدان دو گوشهٔ ابرو نهاده‌ایم\nما مُلکِ عافیت نه به لشکر گرفته‌ایم\nما تختِ سلطنت نه به بازو نهاده‌ایم\nتا سِحْرِ چَشم یار چه بازی کند که باز\nبنیاد بر کرشمهٔ جادو نهاده‌ایم\nبی زلفِ سرکشش سرِ سودایی از ملال\nهمچون بنفشه بر سرِ زانو نهاده‌ایم\nدر گوشهٔ امید چو نَظّارگانِ ماه\nچَشمِ طلب بر آن خَمِ ابرو نهاده‌ایم\nگفتی که حافظا دل سرگشته‌ات کجاست؟\nدر حلقه‌هایِ آن خَمِ گیسو نهاده‌ایم"},{"id":366,"poem":"ما بدین در نه پِیِ حشمت و جاه آمده‌ایم\nاز بد حادثه این جا به پناه آمده‌ایم\nرهروِ منزلِ عشقیم و زِ سرحدِّ عَدَم\nتا به اقلیمِ وجود این همه راه آمده‌ایم\nسبزهٔ خطِّ تو دیدیم و زِ بُستانِ بهشت\nبه طلبکاریِ این مهرگیاه آمده‌ایم\nبا چُنین گنج که شد خازنِ او روحِ امین\nبه گدایی به درِ خانهٔ شاه آمده‌ایم\nلنگرِ حِلمِ تو ای کشتیِ توفیق کجاست؟\nکه در این بحرِ کَرَم غرقِ گناه آمده‌ایم\nآبرو می‌رود ای ابرِ خطاپوش ببار\nکه به دیوانِ عمل نامه‌سیاه آمده‌ایم\nحافظ این خرقهٔ پشمینه بینداز که ما\nاز پِیِ قافله با آتشِ آه آمده‌ایم"},{"id":367,"poem":"فتوی پیرِ مُغان دارم و قولی‌ست قدیم\nکه حرام است مِی آن جا که نه یار است ندیم\nچاک خواهم زدن این دلقِ ریایی، چه کنم؟\nروح را صحبتِ ناجنس، عذابی‌ست اَلیم\nتا مگر جرعه فشانَد لبِ جانان بر من\nسال‌ها شد که منم بر درِ میخانه مقیم\nمگرش خدمتِ دیرین من از یاد برفت\nای نسیم سحری! یاد دَهَش عهدِ قدیم\nبعد صد سال اگر بر سرِ خاکم گذری\nسر برآرد ز گِلم رقص‌کنان عَظمِ رَمیم\nدلبر از ما به صد امّید سِتد اول دل\nظاهراً عهد فرامُش نکُند خُلقِ کریم\nغنچه گو «تنگ‌دل از کارِ فروبسته مَباش\nکز دم صبح مدد یابی و انفاسِ نسیم»\nفکر بهبود خود ای دل ز دری دیگر کن\nدرد عاشق نشود به، به مداوایِ حکیم\nگوهرِ معرفت آموز که با خود بِبَری\nکه نصیبِ دگران است نِصابِ زر و سیم\nدام سخت است مگر یار شود لطفِ خدا\nور نه آدم نَبَرد صرفه ز شیطانِ رجیم\nحافظ ار سیم و زرت نیست، چه شد؟ شاکر باش\nچه به از دولتِ لطفِ سخن و طَبع سلیم"},{"id":368,"poem":"خیز تا از درِ میخانه گُشادی طلبیم\nبه رَهِ دوست نشینیم و مُرادی طلبیم\nزادِ راهِ حَرمِ وصل نداریم مگر\nبه گدایی ز درِ میکده زادی طلبیم\nاشکِ آلودهٔ ما گرچه روان است ولی\nبه رسالت سویِ او پاک‌نهادی طلبیم\nلذتِ داغِ غمت بر دلِ ما باد حرام\nاگر از جورِ غمِ عشقِ تو دادی طلبیم\nنقطهٔ خالِ تو بر لوحِ بصر نَتوان زد\nمگر از مَردُمَکِ دیده مِدادی طلبیم\nعشوه‌ای از لبِ شیرینِ تو دل خواست به جان\nبه شکرخنده لَبَت گفت مَزادی طلبیم\nتا بُوَد نسخهٔ عطری دل سودازده را\nاز خطِ غالیه‌سایِ تو سوادی طلبیم\nچون غمت را نَتَوان یافت مگر در دلِ شاد\nما به امّیدِ غمت خاطرِ شادی طلبیم\nبر درِ مدرسه تا چند نشینی حافظ؟\nخیز تا از درِ میخانه گُشادی طلبیم"},{"id":369,"poem":"ما زِ یاران چَشمِ یاری داشتیم\nخود غلط بود آنچه ما پنداشتیم\nتا درختِ دوستی بَر کِی دهد\nحالیا رفتیم و تخمی کاشتیم\nگفت‌و‌گو آیینِ درویشی نبود\nور نه با تو ماجراها داشتیم\nشیوهٔ چَشمت فریبِ جنگ داشت\nما غلط کردیم و صلح انگاشتیم\nگُلبُنِ حُسنَت نه خود شد دلفُروز\nما دَمِ همت بر او بگماشتیم\nنکته‌ها رفت و شکایت کس نکرد\nجانبِ حُرمَت فرو نگذاشتیم\nگفت خود دادی به ما دل حافظا\nما مُحَصِّل بر کسی نَگماشتیم"},{"id":370,"poem":"صَلاح از ما چه می‌جویی؟ که مستان را صَلا گفتیم\nبه دورِ نرگسِ مستت سلامت را دعا گفتیم\nدرِ میخانه‌ام بُگشا که هیچ از خانقه نَگشود\nگَرَت باور بُوَد ور نه سخن این بود و ما گفتیم\nمن از چشمِ تو ای ساقی خراب افتاده‌ام لیکن\nبلایی کز حبیب آید هِزارش مَرحَبا گفتیم\nاگر بر من نَبَخشایی پشیمانی خوری آخر\nبه خاطر دار این معنی که در خدمت کجا گفتیم\nقَدَت گفتم که شمشاد است؛ بس خِجلَت به بار آورد\nکه این نسبت چرا کردیم و این بُهتان چرا گفتیم\nجگر چون نافه‌ام خون گشت کم زینم نمی‌باید\nجزای آن که با زلفت سخن از چین خطا گفتیم\nتو آتش گشتی ای حافظ ولی با یار درنگرفت\nز بدعهدیِّ گُل گویی حکایت با صبا گفتیم"},{"id":371,"poem":"ما درس سحر در ره میخانه نهادیم\nمحصول دعا در ره جانانه نهادیم\nدر خرمن صد زاهد عاقل زند آتش\nاین داغ که ما بر دل دیوانه نهادیم\nسلطان ازل گنج غم عشق به ما داد\nتا روی در این منزل ویرانه نهادیم\nدر دل ندهم ره پس از این مهر بتان را\nمهر لب او بر در این خانه نهادیم\nدر خرقه از این بیش منافق نتوان بود\nبنیاد از این شیوه رندانه نهادیم\nچون می‌رود این کشتی سرگشته که آخر\nجان در سر آن گوهر یک دانه نهادیم\nالمنة للَّه که چو ما بی‌دل و دین بود\nآن را که لقب عاقل و فرزانه نهادیم\nقانع به خیالی ز تو بودیم چو حافظ\nیا رب چه گداهمت و بیگانه نهادیم"},{"id":372,"poem":"بگذار تا ز شارع میخانه بگذریم\nکز بهر جرعه‌ای همه محتاج این دریم\nروز نخست چون دم رندی زدیم و عشق\nشرط آن بود که جز ره آن شیوه نسپریم\nجایی که تخت و مسند جم می‌رود به باد\nگر غم خوریم خوش نبود به که می خوریم\nتا بو که دست در کمر او توان زدن\nدر خون دل نشسته چو یاقوت احمریم\nواعظ مکن نصیحت شوریدگان که ما\nبا خاک کوی دوست به فردوس ننگریم\nچون صوفیان به حالت و رقصند مقتدا\nما نیز هم به شعبده دستی برآوریم\nاز جرعه تو خاک زمین در و لعل یافت\nبیچاره ما که پیش تو از خاک کمتریم\nحافظ چو ره به کنگره کاخ وصل نیست\nبا خاک آستانه این در به سر بریم"},{"id":373,"poem":"خیز تا خرقه صوفی به خرابات بریم\nشطح و طامات به بازار خرافات بریم\nسوی رندان قلندر به ره آورد سفر\nدلق بسطامی و سجاده طامات بریم\nتا همه خلوتیان جام صبوحی گیرند\nچنگ صبحی به در پیر مناجات بریم\nبا تو آن عهد که در وادی ایمن بستیم\nهمچو موسی ارنی گوی به میقات بریم\nکوس ناموس تو بر کنگره عرش زنیم\nعلم عشق تو بر بام سماوات بریم\nخاک کوی تو به صحرای قیامت فردا\nهمه بر فرق سر از بهر مباهات بریم\nور نهد در ره ما خار ملامت زاهد\nاز گلستانش به زندان مکافات بریم\nشرممان باد ز پشمینه آلوده خویش\nگر بدین فضل و هنر نام کرامات بریم\nقدر وقت ار نشناسد دل و کاری نکند\nبس خجالت که از این حاصل اوقات بریم\nفتنه می‌بارد از این سقف مقرنس برخیز\nتا به میخانه پناه از همه آفات بریم\nدر بیابان فنا گم شدن آخر تا کی\nره بپرسیم مگر پی به مهمات بریم\nحافظ آب رخ خود بر در هر سفله مریز\nحاجت آن به که بر قاضی حاجات بریم"},{"id":374,"poem":"بیا تا گل برافشانیم و می در ساغر اندازیم\nفلک را سقف بشکافیم و طرحی نو دراندازیم\nاگر غم لشکر انگیزد که خون عاشقان ریزد\nمن و ساقی به هم تازیم و بنیادش براندازیم\nشرابِ ارغوانی را گلاب اندر قَدَح ریزیم\nنسیمِ عِطرگردان را، شِکَر در مِجمَر اندازیم\nچو در دست است رودی خوش، بزن مطرب سرودی خوش\nکه دست‌افشان غزل خوانیم و پاکوبان سر اندازیم\nصبا! خاک وجود ما، بدان عالی‌جناب انداز\nبُوَد کآن شاهِ خوبان را نظر بر مَنظَر اندازیم\nیکی از عقل می‌لافد، یکی طامات می‌بافد\nبیا کاین داوری‌ها را به پیشِ داور اندازیم\nبهشت عَدْن اگر خواهی، بیا با ما به میخانه\nکه از پای خُمَت روزی، به حوضِ کوثر اندازیم\nسخن‌دانی و خوش‌خوانی نمی‌ورزند در شیراز\nبیا حافظ که تا خود را، به مُلکی دیگر اندازیم"},{"id":375,"poem":"صوفی بیا که خرقه سالوس برکشیم\nوین نقش زرق را خط بطلان به سر کشیم\nنذر و فتوح صومعه در وجه می نهیم\nدلق ریا به آب خرابات برکشیم\nفردا اگر نه روضه رضوان به ما دهند\nغلمان ز روضه حور ز جنت به درکشیم\nبیرون جهیم سرخوش و از بزم صوفیان\nغارت کنیم باده و شاهد به بر کشیم\nعشرت کنیم ور نه به حسرت کشندمان\nروزی که رخت جان به جهانی دگر کشیم\nسر خدا که در تتق غیب منزویست\nمستانه‌اش نقاب ز رخسار برکشیم\nکو جلوه‌ای ز ابروی او تا چو ماه نو\nگوی سپهر در خم چوگان زر کشیم\nحافظ نه حد ماست چنین لاف‌ها زدن\nپای از گلیم خویش چرا بیشتر کشیم"},{"id":376,"poem":"دوستان وقت گل آن به که به عشرت کوشیم\nسخن اهل دل است این و به جان بنیوشیم\nنیست در کس کرم و وقت طرب می‌گذرد\nچاره آن است که سجاده به مِی بفروشیم\nخوش هوایی‌ست فرح‌بخش خدایا بفرست\nنازنینی که به رویش مِی گل‌گون نوشیم\nارغنون ساز فلک ره‌زن اهل هنر است\nچون از این غصه ننالیم و چرا نخروشیم؟\nگل به جوش آمد و از مِی نزدیمش آبی\nلاجرم زآتش حرمان و هوس می‌جوشیم\nمی‌کشیم از قدح لاله شرابی موهوم\nچشم بد دور که بی‌مطرب و مِی مدهوشیم\nحافظ این حال عجب با که توان گفت که ما\nبلبلانیم که در مُوسم گل خاموشیم"},{"id":377,"poem":"ما شبی دست برآریم و دعایی بکنیم\nغم هجران تو را چاره ز جایی بکنیم\nدلِ بیمار شد از دست، رفیقان مددی\nتا طبیبش به سر آریم و دوایی بکنیم\nآن که بی‌جرم برنجید و به تیغم زد و رفت\nبازش آرید خدا را که صفایی بکنیم\nخشک شد بیخ طرب راه خرابات کجاست\nتا در آن آب و هوا نشو و نمایی بکنیم\nمدد از خاطر رندان طلب ای دل ور نه\nکار صعب است مبادا که خطایی بکنیم\nسایهٔ طایر کم حوصله کاری نکند\nطلب از سایهٔ میمون همایی بکنیم\nدلم از پرده بشد حافظ خوش‌گوی کجاست\nتا به قول و غزلش ساز نوایی بکنیم"},{"id":378,"poem":"ما نگوییم بد و میل به ناحق نکنیم\nجامهٔ کس سیه و دلق خود ازرق نکنیم\nعیب درویش و توانگر به کم و بیش بد است\nکار بد مصلحت آن است که مطلق نکنیم\nرقم مغلطه بر دفتر دانش نزنیم\nسر حق بر ورق شعبده ملحق نکنیم\nشاه اگر جرعهٔ رندان نه به حرمت نوشد\nالتفاتش به می صاف مروّق نکنیم\nخوش برانیم جهان در نظر راهروان\nفکر اسب سیه و زین مغرّق نکنیم\nآسمان کشتی ارباب هنر می‌شکند\nتکیه آن به که بر این بحر معلّق نکنیم\nگر بدی گفت حسودی و رفیقی رنجید\nگو «تو خوش باش که ما گوش به احمق نکنیم»\nحافظ ار خصم خطا گفت، نگیریم بر او\nور به حق گفت، جدل با سخن حق نکنیم"},{"id":379,"poem":"سرم خوش است و به بانگ بلند می‌گویم\nکه من نسیم حیات از پیاله می‌جویم\nعبوس زهد به وجه خمار ننشیند\nمرید خرقهٔ دردی‌کشان خوش‌خویم\nشدم فسانه به سرگشتگی و ابروی دوست\nکشید در خم چوگان خویش چون گویم\nگرم نه پیر مغان در به روی بگشاید\nکدام در بزنم؟ چاره از کجا جویم؟\nمکن در این چمنم سرزنش به خودرویی\nچنان که پرورشم می‌دهند، می‌رویم\nتو خانقاه و خرابات در میانه مبین\nخدا گواه که هر جا که هست، با اویم\nغبار راه طلب، کیمیای بهروزی‌ست\nغلام دولت آن خاک عنبرین بویم\nز شوق نرگس مست بلندبالایی\nچو لاله با قدح افتاده بر لب جویم\nبیار می که به فتوی حافظ از دل پاک\nغبار زرق به فیض قدح فروشویم"},{"id":380,"poem":"بارها گفته‌ام و بار دگر می‌گویم\nکه منِ دل‌شده این ره، نه به خود می‌پویم\nدر پس آینه، طوطی‌صفتم داشته‌اند\nآن چه استاد ازل گفت بگو، می‌گویم\nمن اگر خارم و گر گل چمن‌آرایی هست\nکه از آن دست که او می‌کِشدم، می‌رویم\nدوستان! عیب من بی‌دل حیران مکنید\nگوهری دارم و صاحب نظری می‌جویم\nگر چه با دلق ملمع، مِیِ گلگون عیب است\nمکنم عیب کَزو رنگِ ریا می‌شویم\nخنده و گریه عشاق ز جایی دگر است\nمی‌سرایم به شب و وقت سحر می‌مویم\nحافظم گفت که «خاک در میخانه مبوی»\nگو «مکن عیب که من مشک ختن می‌بویم»"},{"id":381,"poem":"گرچه ما بندگان پادشهیم\nپادشاهان ملک صبحگهیم\nگنج در آستین و کیسه تهی\nجام گیتی‌نما و خاک رهیم\nهوشیار حضور و مست غرور\nبحر توحید و غرقهٔ گنهیم\nشاهد بخت چون کرشمه کند\nماش آیینه‌ رخ چو مهیم\nشاه بیدار بخت را هر شب\nما نگهبان افسر و کلهیم\nگو غنیمت شمار صحبت ما\nکه تو در خواب و ما به دیده گهیم\nشاه منصور واقف است که ما\nروی همّت به هر کجا که نهیم\nدشمنان را ز خون کفن سازیم\nدوستان را قبای فتح دهیم\nرنگ تزویر پیش ما نبود\nشیر سرخیم و افعی سیهیم\nوام حافظ بگو که بازدهند\nکرده‌ای اعتراف و ما گوهیم"},{"id":382,"poem":"فاتحه‌ای چو آمَدی بَر سَر خَسته‌ای بخوان\nلَب بُگُشا که می‌
