<script id="poem-data" type="application/json">[{"id":1,"poem":"اَلا یا اَیُّهَا السّاقی اَدِرْ کَأسَاً و ناوِلْها\nکه عشق آسان نمود اوّل ولی افتاد مشکل‌ها\nبه بویِ نافه‌ای کآخِر صبا زان طُرّه بُگشاید\nز تابِ جَعدِ مشکینش چه خون افتاد در دل‌ها\nمرا در منزلِ جانان چه امنِ عیش، چون هر دَم\nجَرَس فریاد می‌دارد که بَربندید مَحمِل‌ها\nبه مِی سجّاده رنگین کُن گَرَت پیرِ مُغان گوید\nکه سالِک بی‌خبر نَبْوَد ز راه و رسمِ منزل‌ها\nشبِ تاریک و بیمِ موج و گِردابی چنین هایل\nکجا دانند حالِ ما سبک‌بارانِ ساحل‌ها؟\nهمهْ کارم ز خودکامی به بدنامی کشید آخر\nنهان کِی مانَد آن رازی کَزو سازند مَحفل‌ها؟\nحضوری گر همی خواهی از او غایب مشو حافظ\nمَتیٰ ما تَلْقَ مَنْ تَهْویٰ دَعِ الدُّنْیا وَ اَهْمِلْها"},{"id":2,"poem":"صلاحِ کار کجا و منِ خراب کجا؟\nببین تفاوتِ رَه کز کجاست تا به کجا\nدلم ز صومعه بگرفت و خِرقِهٔ سالوس\nکجاست دِیرِ مُغان و شرابِ ناب کجا؟\nچه نسبت است به‌ رِندی صَلاح و تقوا را؟\nسماعِ وَعظ کجا نغمهٔ رَباب کجا؟\nز رویِ دوست دلِ دشمنان چه دریابد؟\nچراغِ مُرده کجا؟ شمعِ آفتاب کجا؟\nچو کُحلِ بینشِ ما خاکِ آستانِ شماست\nکجا رَویم بفرما ازین جناب، کجا\nمَبین به سیبِ زَنَخدان که چاه در راه است\nکجا همی‌ رَوی ای دل بدین شتاب کجا؟\nبِشُد! که یادِ خوشش باد روزگارِ وصال\nخود آن کِرِشمه کجا رفت و آن عِتاب کجا؟\nقرار و خواب ز حافظ طمع مدار ای دوست\nقرار چیست صبوری کدام و خواب کجا؟"},{"id":3,"poem":"اگر آن تُرکِ شیرازی به‌‌ دست‌ آرَد دلِ ما را\nبه خال هِندویَش بَخشَم سَمَرقند و بُخارا را\nبده ساقی مِیِ باقی که در جَنَّت نخواهی یافت\nکنارِ آبِ رُکناباد و گُل‌گَشتِ مُصَلّا را\nفَغان! کاین لولیانِ شوخِ شیرین‌کارِ شهرآشوب\nچُنان بُردند صبر از دل که تُرکان خوانِ یَغما را\nز عشقِ ناتمامِ ما جمالِ یار مُستَغنی‌ است\nبه آب و رنگ و خال و خط چه حاجت رویِ زیبا را؟\nمَن از آن حُسنِ روزاَفزون که یوسُف داشت دانستم\nکه عشق از پردهٔ عِصمت بُرون آرَد زُلِیخا را\nاگر دشنام فرمایی و گَر نفرین دعا گویم\nجوابِ تلخ می‌زیبَد لبِ لَعلِ شِکرخا را\nنصیحت گوش کن جانا که از جان دوست‌تر دارند\nجوانانِ سعادتمند پندِ پیرِ دانا را\nحَدیث از مُطرب و مِی گو و رازِ دَهر کمتر جو\nکه کس نَگشود و نَگشاید به حکمت این مُعمّا را\nغزل گفتی و دُر سُفتی بیا و خوش بخوان حافظ\nکه بر نظمِ تو اَفشانَد فَلَک عِقد ثُریّا را"},{"id":4,"poem":"صبا به لُطف بگو آن غزالِ رَعنا را\nکه سَر به کوه و بیابان تو داده‌ای ما را\nشِکر فُروش که عُمرَش دراز باد چرا\nتَفَقُّدی نَکُنَد طوطیِ شِکرخا را؟\nغرورِ حُسنت اجازَت مَگَر نداد اِی گُل\nکه پُرسِشی نکُنی عَندَلیب شیدا را\nبه خُلق و لطف توان کرد صیدِ اهلِ نظر\nبه بند و دام نگیرند مرغِ دانا را\nندانم از چه سبب رنگِ آشنایی نیست\nسَهی‌قَدانِ سیَه‌‌چشمِ ماه‌سیما را\nچو با حبیب نِشینی و باده پِیمایی\nبه یاد دار مُحِبّانِ بادپیما را\nجُز این قَدَر نَتوان گفت در جَمالِ تو عیب\nکه وضع مِهر و وفا نیست رویِ زیبا را\nدر آسمان نه عجب گَر به گفتهٔ حافظ\nسُرودِ زُهره به رقص آورد مسیحا را"},{"id":5,"poem":"دل می‌رود ز دستم صاحب‌دلان خدا را\nدردا که راز پنهان خواهد شد آشکارا\nکشتی‌شکستگانیم ای بادِ شُرطِه برخیز\nباشد که باز بینم دیدارِ آشنا را\nده‌روزه مِهرِ گردون افسانه است و افسون\nنیکی به جای یاران فرصت شمار یارا\nدر حلقهٔ گُل‌ و مُل خوش خواند دوش بلبل\nهاتِ الصَّبُوحَ هُبّوا یا ایُّها السُّکارا\nای صاحبِ کرامت شُکرانهٔ سلامت\nروزی تَفَقُّدی کن درویشِ بی‌نوا را\nآسایشِ دو گیتی تفسیرِ این دو حرف است\nبا دوستان مُرُوَّت با دشمنان مُدارا\nدر کویِ نیک‌نامی ما را گذر ندادند\nگر تو نمی‌پسندی تغییر کن قضا را\nآن تَلخ‌وَش که صوفی اُم‌ُّالخَبائِثَش خواند\nاَشهیٰ لَنا و اَحلیٰ مِن قُبلَةِ العَذارا\nهنگامِ تنگ‌دستی در عیش کوش و مستی\nکاین کیمیایِ هستی قارون کند گدا را\nسرکش مشو که چون شمع از غیرتت بسوزد\nدلبر که در کفِ او موم است سنگِ خارا\nآیینهٔ سِکَندر جامِ مِی است بنگر\nتا بر تو عرضه دارد احوالِ مُلکِ دارا\nخوبان پارسی‌گو بخشندگانِ عمرند\nساقی بده بشارت رندانِ پارسا را\nحافظ به خود نپوشید این خرقهٔ مِی‌ْآلود\nای شیخِ پاک‌دامن معذور دار ما را"},{"id":6,"poem":"به مُلازِمانِ سلطان که رساند این دعا را؟\nکه به شُکرِ پادشاهی، زِ نظر مَران گدا را\nز رقیبِ دیوسیرت، به خدای خود پناهم\nمَگَر آن شهابِ ثاقِب مددی دهد، خدا را!\nمُژِه‌یِ سیاهت اَرْ کرد به خونِ ما اشارت\nز فریبِ او بیندیش و غلط مکن، نگارا\nدلِ عالمی بِسوزی چُو عِذار بَرفُروزی\nتو از این چه سود داری، که نمی‌کنی مدارا؟\nهمه‌شب در این اُمیدم که نسیمِ صبحگاهی\nبه پیام آشنایان، بنوازد آشنا را\nچه قیامت است جانا، که به عاشقان نمودی؟\nدل و جان فدای رویت، بِنَما عِذار ما را\nبه خدا، که جرعه‌ای دِه تو به حافظِ سحرخیز\nکه دعایِ صبحگاهی، اثری کند شما را"},{"id":7,"poem":"صوفی بیا که آیِنِه، صافی‌ست جام را\nتا بِنگَری صَفایِ مِیِ لَعل‌فام را\nرازِ درونِ پَردِه زِ رِندانِ مَست پُرس\nکاین حال نیست زاهِدِ عالی‌مَقام را\nعَنقا، شِکارِ کَس نَشَوَد، دام بازچین\nکآنجا، همیشه، باد به دست است، دام را\nدَر بَزمِ دُور، یک‌دو قدح دَرکَش و برو\nیَعنی طَمَع مَدار وِصالِ مُدام را\nای دل! شَباب رَفت و نَچیدی گُلی زِ عِیش\nپیرانه‌‌سر مَکُن هُنَری نَنگ و نام را\nدر عِیشِ نَقد کوش که چون آبخَور نَمانْد\nآدَم بِهِشت، روضِهٔ دارُالسَّلام را\nما را بَر آستانِ تو، بس حَقِّ خِدمَت است\nای خواجه! بازبین به تَرَحُّم غلام را\n«حافظ» مُریدِ جامِ مِی است، ای صبا! برو!\nوز بنده بندگی بِرَسان شِیخِ جام را!"},{"id":8,"poem":"ساقیا برخیز و دَردِه جام را\nخاک بر سر کن غمِ ایّام را\nساغرِ مِی بر کَفَم نِه تا ز بَر\nبَرکِشَم این دلقِ اَزرَق‌فام را\nگرچه بدنامی‌ست نزد عاقلان\nما نمی‌خواهیم ننگ و نام را\nباده دَردِه چند از این بادِ غرور\nخاک بر سر، نفسِ نافرجام را\nدودِ آهِ سینهٔ نالانِ من\nسوخت این افسردگانِ خام را\nمحرمِ رازِ دلِ شیدایِ خود\nکس نمی‌بینم ز خاص و عام را\nبا دلارامی مرا خاطر خوش است\nکز دلم یک باره بُرد آرام را\nننگرد دیگر به سرو اندر چمن\nهرکه دید آن سروِ سیم‌اندام را\nصبر کن حافظ به سختی روز و شب\nعاقبت روزی بیابی کام را"},{"id":9,"poem":"رونق عهد شباب است دگر بُستان را\nمی‌رسد مژدهٔ گل بلبل خوش‌الحان را\nای صبا گر به جوانان چمن باز رَسی\nخدمت ما برسان سرو و گل و ریحان را\nگر چنین جلوه کند مغبچهٔ باده‌فروش\nخاک‌روبِ درِ میخانه کنم مژگان را\nای که بر مه کشی از عَنبرِ سارا چوگان\nمضطرب‌حال مگردان، من سرگردان را\nترسم این قوم که بر دُردکشان می‌خندند\nدر سر کار خرابات کنند ایمان را\nیار مردان خدا باش که در کشتی نوح\nهست خاکی که به آبی نخرد طوفان را\nبرو از خانهٔ گردون به در و نان مطلب\nکآن سیه‌کاسه در آخر بِکُشد مهمان را\nهر که را خوابگه آخر مشتی خاک است\nگو چه حاجت که به افلاک کشی ایوان را\nماه کنعانی من! مسند مصر آنِ تو شد\nوقت آن است که بدرود کنی زندان را\nحافظا می خور و رندی کن و خوش باش ولی\nدام تزویر مکن چون دگران قرآن را"},{"id":10,"poem":"دوش از مسجد سویِ میخانه آمد پیرِ ما\nچیست، یارانِ طریقت! بعد از این تدبیرِ ما؟\nما مریدان روی سویِ قبله چون آریم؟ چون\nروی سویِ خانهٔ خَمّار دارد پیرِ ما\nدر خراباتِ طریقت ما به هم منزل شویم\nکاین چنین رفته‌ است در عهدِ ازل تقدیرِ ما\nعقل اگر داند که دل در بندِ زلفش چون خوش است\nعاقلان دیوانه گردند از پیِ زنجیرِ ما\nرویِ خوبت آیتی از لطف بر ما کشف کرد\nزآن زمان جز لطف و خوبی نیست در تفسیرِ ما\nبا دلِ سنگینت آیا هیچ درگیرد شبی\nآهِ آتشناک و سوزِ سینهٔ شبگیرِ ما؟\nتیرِ آهِ ما ز گردون بگذرد، حافظ خموش\nرحم کن بر جانِ خود، پرهیز کن از تیرِ ما"},{"id":11,"poem":"ساقی به نورِ باده برافروز جامِ ما\nمطرب بگو که کارِ جهان شُد به کامِ ما\nما در پیاله عکس رخِ یار دیده‌ایم\nای بی‌خبر ز لَذَّتِ شُربِ مُدامِ ما\nهرگز نمیرد آن که دلش زنده شد به عشق\nثبت است بر جَریدهٔ عالم دوامِ ما\nچندان بُوَد کرشمه و نازِ سَهی‌قدان\nکآید به جلوه سروِ صنوبرخَرامِ ما\nای باد اگر به گُلشنِ اَحباب بُگذری\nزِنهار، عَرضه دِه بَرِ جانان پیامِ ما\nگو نامِ ما زِ یاد به عمدا چه می‌بری؟\nخود آید آن که یاد نیاری ز نامِ ما\nمستی به چشمِ شاهدِ دلبندِ ما خوش است\nزآن رو سپرده‌اند به مستی زمامِ ما\nترسم که صَرفه‌ای نَبَرَد روزِ بازخواست\nنانِ حلالِ شیخ ز آبِ حرامِ ما\nحافظ ز دیده دانهٔ اشکی همی‌فشان\nباشد که مُرغِ وصل کُند قصدِ دامِ ما\nدریای اَخضَرِ فَلَک و کَشتی هِلال\nهستند غرقِ نعمتِ حاجی‌قوامِ ما"},{"id":12,"poem":"ای فروغِ ماهِ حُسن‌، از روی رخشان شما\nآبِ‌روی خوبی از چاه زَنَخدان شما\nعزم دیدار تو دارد جانِ بر لب آمده\nباز گردد یا برآید؟ چیست فرمان شما؟\nکَس به دور نرگست طرفی نبست از عافیت\nبِه که نفروشند مستوری به مستان شما\nبخت خواب‌آلود ما بیدار خواهد شد مگر\nزان که زد بر دیده آبی، روی رخشان شما\nبا صبا همراه بفرست از رخت گل دسته‌ای\nبو که بویی بشنویم از خاک بستان شما\nعمرتان باد و مراد ای ساقیانِ بزمِ جم\nگرچه جام ما نشد پُر مِی به دوران شما\nدل خرابی می‌کند، دلدار را آگه کنید\nزینهار ای دوستان‌، جان من و جان شما\nکی دهد دست این غرض یا رب که همدستان شوند‌؟\nخاطر مجموع ما، زلف پریشان شما\nدور دار از خاک و خون دامن، چو بر ما بگذری\nکَاندَر این ره کشته بسیارند، قربان شما\nمی‌کند حافظ دعایی، بشنو، آمینی بگو\nروزی ما باد لعل شَکَّرافشان شما\nای صبا با ساکنانِ شهرِ یزد از ما بگو\nکِای سر حق‌ناشناسان گوی چوگان شما\nگرچه دوریم از بساط قُرب‌، همّت دور نیست\nبندهٔ شاه شماییم و ثناخوان شما\nای شَهنشاه بلند اختر‌، خدا را همّتی\nتا ببوسم همچو اختر خاک ایوان شما"},{"id":13,"poem":"می‌دمد صبح و کِلِّه بست سحاب\nالصَبوح الصَبوح یا اصحاب\nمی‌چکد ژاله بر رخِ لاله\nالمُدام المُدام یا احباب\nمی‌وزد از چمن نسیمِ بهشت\nهان، بنوشید دَم به دَم مِیِ ناب\nتخت زُمْرُد زده است گل به چمن\nراحِ چون لعلِ آتشین دریاب\nدرِ میخانه بسته‌اند دگر\nاِفتَتِح یا مُفَتِّح الاَبواب\nلب و دَندانْت را حقوق نمک\nهست بر جان و سینه‌هایِ کباب\nاین چنین موسِمی عجب باشد\nکه ببندند میکده به شتاب\nبر رخِ ساقیِ پری پیکر\nهمچو حافظ بنوش بادهٔ ناب"},{"id":14,"poem":"گفتم ای سلطانِ خوبان رحم کن بر این غریب\nگفت در دنبالِ دل، رَه گُم کُنَد مسکین غریب\nگفتمش مَگذر زمانی، گفت معذورم بدار\nخانه پروردی چه تاب آرد غم چندین غریب\nخفته بر سنجابِ شاهی نازنینی را چه غم؟\nگر ز خار و خاره سازد بستر و بالین غریب\nای که در زنجیرِ زلفت جایِ چندین آشناست\nخوش فتاد آن خالِ مشکین بر رخِ رنگین غریب\nمی‌نماید عکسِ مِی، در رنگِ روی مَه‌وَشت\nهمچو برگِ ارغوان بر صفحهٔ نسرین، غریب\nبس غریب افتاده است آن مور خَط، گِردِ رُخَت\nگرچه نَبوَد در نگارستان، خطِ مشکین غریب\nگفتم ای شامِ غریبان طُرِّهٔ شبرنگِ تو\nدر سحرگاهان حذر کن چون بنالد این غریب\nگفت حافظ آشنایان در مقامِ حیرتند\nدور نَبوَد گر نشیند خسته و مسکین غریب"},{"id":15,"poem":"ای شاهد قدسی، کِه کَشَد بند نقابت؟\nوی مرغ بهشتی، که دهد دانه و آبت؟\nخوابم بشد از دیده در این فکر جگرسوز\nکآغوشِ که شد منزل آسایش و خوابت؟\nدرویش نمی‌پرسی و ترسم که نباشد\nاندیشهٔ آمرزش و پروای ثوابت\nراه دل عشّاق زد آن چشم خماری\nپیداست از این شیوه که مست است شرابت\nتیری که زدی بر دلم از غمزه خطا رفت\nتا باز چه اندیشه کند رأی صوابت\nهر ناله و فریاد که کردم نشنیدی\nپیداست نگارا که بلند است جَنابت\nدور است سر آب از این بادیه، هشدار\nتا غول بیابان نفریبد به سرابت\nتا در ره پیری به چه آیین رَوی ای دل\nباری به غلط صرف شد ایّامِ شبابت\nای قصرِ دل‌افروز که منزلگهِ انسی\nیا رب مَکُناد آفتِ ایّام، خرابت\nحافظ نه غلامیست که از خواجه گریزد\nصلحی کن و بازآ که خرابم ز عِتابت"},{"id":16,"poem":"خَمی که ابرویِ شوخِ تو در کمان انداخت\nبه قصد جانِ منِ زارِ ناتوان انداخت\nنبود نقش دو عالَم، که رنگ الفت بود\nزمانه طرح محبّت، نه این زمان انداخت\nبه یک کرشمه که نرگس به خودفروشی کرد\nفریبِ چشمِ تو صد فتنه در جهان انداخت\nشراب‌خورده و خِوی‌کرده می‌رَوی به چمن\nکه آبِ روی تو آتش در ارغوان انداخت\nبه بزمگاهِ چمن، دوش، مست، بگذشتم\nچو از دهانِ تواَم غنچه در گُمان انداخت\nبنفشه طُرِّهٔ مفتول خود گره می‌زد\nصبا حکایتِ زلفِ تو در میان انداخت\nز شَرمِ آن که به روی تو نسبتش کردم\nسمن به دستِ صبا، خاک در دهان انداخت\nمن از ورع، مِی و مطرب ندیدمی زین پیش\nهوای مغبچگانم در این و آن انداخت\nکنون به آبِ میِ لعل، خرقه می‌شویَم\nنصیبهٔ ازل از خود نمی‌توان انداخت\nمگر گشایشِ حافظ در این خرابی بود\nکه بخششِ ازلش، در میِ مغان انداخت\nجهان به کامِ من اکنون شود که دورِ زمان\nمرا به بندگیِ خواجهٔ جهان انداخت"},{"id":17,"poem":"سینه از آتش دل، در غمِ جانانه بسوخت\nآتشی بود در این خانه که کاشانه بسوخت\nتنم از واسطهٔ دوریِ دلبر بگداخت\nجانم از آتشِ مهرِ رخِ جانانه بسوخت\nسوزِ دل بین که ز بس آتش اشکم، دلِ شمع\nدوش بر من ز سرِ مِهر، چو پروانه بسوخت\nآشنایی نه غریب است که دلسوزِ من است\nچون من از خویش برفتم، دلِ بیگانه بسوخت\nخرقهٔ زهدِ مرا، آبِ خرابات ببُرد\nخانهٔ عقلِ مرا، آتشِ میخانه بسوخت\nچون پیاله دلم از توبه که کردم بشکست\nهمچو لاله، جگرم بی می و خُمخانه بسوخت\nماجرا کم کن و بازآ که مرا مردمِ چشم\nخرقه از سر به درآورد و به شکرانه بسوخت\nترک افسانه بگو حافظ و مِی نوش دمی\nکه نَخُفتیم شب و شمع به افسانه بسوخت"},{"id":18,"poem":"ساقیا آمدنِ عید مبارک بادت\nوان مَواعید که کردی مَرَوَد از یادت\nدر شگفتم که در این مدّتِ ایّامِ فِراق\nبرگرفتی ز حریفان دل و دل می‌دادت\nبرسان بندگیِ دختر رَز، گو به درآی\nکه دَم و همّت ما کرد ز بند، آزادت\nشادی مجلسیان در قدم و مقدم توست\nجای غم باد، مَر آن دل که نخواهد شادت\nشکر ایزد که ز تاراجِ خزان رخنه نیافت\nبوستانِ سمن و سرو و گل و شمشادت\nچشمِ بد دور کز آن تفرقه‌ات بازآورد\nطالعِ ناموَر و دولتِ مادرزادت\nحافظ از دست مده دولت این کشتی نوح\nور نه طوفانِ حوادث بِبَرَد بُنیادت"},{"id":19,"poem":"ای نسیمِ سحر آرامگَهِ یار کجاست؟\nمنزلِ آن مَهِ عاشق‌کُشِ عَیّار کجاست؟\nشبِ تار است و رَهِ وادیِ اَیمَن در پیش\nآتشِ طور کجا موعدِ دیدار کجاست؟\nهر که آمد به جهان نقشِ خرابی دارد\nدر خرابات بگویید که هُشیار کجاست؟\nآن‌کس است اهلِ بشارت که اشارت داند\nنکته‌ها هست بسی مَحرمِ اسرار کجاست؟\nهر سرِ مویِ مرا با تو هزاران کار است\nما کجاییم و مَلامت‌گرِ بی‌کار کجاست؟\nباز پرسید ز گیسویِ شِکَن در شِکَنَش\nکاین دلِ غم‌زده سرگشته گرفتار کجاست؟\nعقل دیوانه شد آن سلسلهٔ مُشکین کو؟\nدل ز ما گوشه گرفت ابرویِ دلدار کجاست؟\nساقی و مُطرب و مِی جمله مُهَیّاست ولی\nعیش بی‌یار مُهیّا نشود یار کجاست؟\nحافظ از بادِ خزان در چمنِ دَهر مَرَنج\nفکرِ معقول بفرما گُلِ بی‌خار کجاست؟"},{"id":20,"poem":"روزه یک‌سو شد و عید آمد و دل‌ها برخاست\nمی ز خُم‌خانه به‌جوش آمد و می‌ باید خواست\nنوبهٔ زهدفروشانِ گران‌جان بگذشت\nوقتِ رندی و طرب کردنِ رندان پیداست\nچه ملامت بُوَد آن را که چنین باده خورَد؟\nاین چه عیب است بدین بی‌خردی؟ وین چه خطاست؟\nباده‌نوشی که در او روی و ریایی نَبُوَد\nبهتر از زهدفروشی که در او روی و ریاست\nما نه رندانِ ریاییم و حریفانِ نفاق\nآن‌که او عالِم سِرّ است، بدین حال گواست\nفرضِ ایزد بگزاریم و به کس بد نکنیم\nوان چه گویند روا نیست، نگوییم رواست\nچه شود گر من و تو چند قدح باده خوریم؟\nباده از خونِ رزان است، نه از خون شماست\nاین چه عیب است کز آن عیب، خلل خواهد بود؟\nور بُوَد نیز چه شد؟ مردم بی‌عیب کجاست؟"},{"id":21,"poem":"دل و دینم شد و دلبر به ملامت برخاست\nگفت با ما منشین، کز تو سلامت برخاست\nکه شنیدی که در این بزم، دمی خوش بنشست؟\nکه نه در آخرِ صحبت به ندامت برخاست\nشمع اگر زان لبِ خندان به زبان، لافی زد\nپیشِ عشاقِ تو شب‌ها به غَرامت برخاست\nدر چمن، بادِ بهاری ز کنار گل و سرو\nبه هواداریِ آن عارض و قامت برخاست\nمست بگذشتی و از خلوتیانِ ملکوت\nبه تماشایِ تو آشوبِ قیامت برخاست\nپیشِ رفتار تو پا برنگرفت از خِجلت\nسروِ سرکش که به ناز از قد و قامت برخاست\nحافظ این خرقه بینداز مگر جان ببری\nکآتش از خرقهٔ سالوس و کرامت برخاست"},{"id":22,"poem":"چو بشنوی سخنِ اهلِ دل، مگو که خطاست\nسخن‌شناس نه‌ای، جان من! خطا این جاست\nسرم به دنیی و عقبی فرو نمی‌آید\nتبارک الله ازین فتنه‌ها که در سرِ ماست\nدر اندرونِ منِ خسته‌دل ندانم کیست!\nکه من خموشم و او در فغان و در غوغاست\nدلم ز پرده برون شد، کجایی ای مطرب؟\nبنال، هان که از این پرده، کارِ ما به نواست\nمرا به کارِ جهان هرگز التفات نبود\nرخِ تو در نظرِ من چنین خوشش آراست\nنخفته‌ام ز خیالی که می‌پزد دلِ من\nخمارِ صد شبه دارم شراب‌خانه کجاست؟\nچنین که صومعه آلوده شد ز خونِ دلم\nگَرَم به باده بشویید، حق به دستِ شماست\nاز آن به دیرِ مغانم عزیز می‌دارند\nکه آتشی که نمیرد، همیشه در دلِ ماست\nچه ساز بود که در پرده می‌زد آن مطرب\nکه رفت عمر و هنوزم دماغ پُر ز هواست\nندای عشق تو دیشب در اندرون دادند\nفضایِ سینهٔ حافظ هنوز پر ز صداست"},{"id":23,"poem":"خیالِ رویِ تو در هر طریق همرهِ ماست\nنسیمِ مویِ تو، پیوندِ جانِ آگهِ ماست\nبه رَغمِ مدّعیانی که منعِ عشق کنند\nجمالِ چهرهٔ تو، حجّتِ موجّهِ ماست\nببین که سیبِ زنخدانِ تو چه می‌گوید\nهزار یوسفِ مصری، فتاده در چَهِ ماست\nاگر به زلفِ درازِ تو، دستِ ما نرسد\nگناهِ بختِ پریشان و دستِ کوتهِ ماست\nبه حاجبِ درِ خلوت‌سرایِ خاص بگو\nفُلان ز گوشه‌نشینانِ خاکِ درگهِ ماست\nبه صورت از نظر ما اگر چه محجوب است\nهمیشه در نظرِ خاطرِ مرفّهِ ماست\nاگر به سالی حافظ دری زَنَد، بگشای\nکه سال‌هاست که مشتاقِ رویِ چون مهِ ماست"},{"id":24,"poem":"مطلب طاعت و پیمان و صلاح از من مست\nکه به پیمانه‌کشی شهره شدم روز الست\nمن همان دم که وضو ساختم از چشمهٔ عشق\nچار تکبیر زدم یکسره بر هرچه که هست\nمی بده تا دهمت آگهی از سِرّ قضا\nکه به روی که شدم عاشق و از بوی که مست\nکمر کوه کم است از کمر مور اینجا\nناامید از در رحمت مشو ای باده‌پرست\nبجز آن نرگس مستانه که چشمش مرساد\nزیر این طارم فیروزه کسی خوش ننشست\nجان فدای دهنش باد که در باغ نظر\nچمن آرای جهان، خوشتر از این غنچه نبست\nحافظ از دولت عشق تو سلیمانی شد\nیعنی از وصل تواَش نیست بجز باد به دست"},{"id":25,"poem":"شکفته شد گل حَمرا و گشت بلبل مست\nصَلایِ سرخوشی، ای صوفیانِ باده پرست\nاساسِ توبه که در محکمی چو سنگ نُمود\nببین که جامِ زُجاجی چه طُرفه‌اش بشکست\nبیار باده که در بارگاهِ استغنا\nچه پاسبان و چه سلطان، چه هوشیار و چه مست\nاز این رِباط دو در، چون ضرورت است رَحیل\nرِواق و طاقِ معیشت، چه سربلند و چه پست\nمقام عیش میسر نمی‌شود بی‌رنج\nبلی به حکمِ بلا بسته‌اند عهدِ الست\nبه هست و نیست مَرنجان ضمیر و خوش می‌باش\nکه نیستی‌ست سرانجامِ هر کمال که هست\nشکوهِ آصِفی و اسبِ باد و منطقِ طیر\nبه باد رفت و از او خواجه هیچ طَرف نبست\nبه بال و پَر مرو از ره که تیرِ پرتابی\nهوا گرفت زمانی، ولی به خاک نشست\nزبانِ کِلکِ تو حافظ چه شُکرِ آن گوید\nکه گفتهٔ سخنت می‌برند دست به دست"},{"id":26,"poem":"زلف‌آشفته و خِوی‌کرده و خندان‌لب و مست\nپیرهن‌چاک و غزل‌خوان و صُراحی در دست\nنرگسش عَربده‌جوی و لبش افسوس‌کنان\nنیم شب، دوش به بالین من آمد، بنشست\nسر فرا گوش من آورد به آوازِ حزین\nگفت: ای عاشقِ دیرینهٔ من، خوابت هست؟\nعاشقی را که چنین بادهٔ شبگیر دهند\nکافر عشق بُوَد گر نشود باده پرست\nبرو ای زاهد و بر دُردکشان خرده مگیر\nکه ندادند جز این تُحفه به ما روزِ الست\nآن چه او ریخت به پیمانهٔ ما نوشیدیم\nاگر از خَمرِ بهشت است وگر بادهٔ مست\nخندهٔ جامِ می و زلفِ گره‌گیرِ نگار\nای بسا توبه که چون توبهٔ حافظ بشکست"},{"id":27,"poem":"در دیرِ مغان آمد، یارم قدحی در دست\nمست از می و میخواران از نرگسِ مستش مست\nدر نعلِ سمندِ او شکلِ مهِ نو پیدا\nوز قدِ بلندِ او بالایِ صنوبر، پست\nآخر به چه گویم هست از خود خبرم، چون نیست\nوز بَهرِ چه گویم نیست با وی نظرم، چون هست\nشمعِ دلِ دمسازم، بنشست چو او برخاست\nو افغان ز نظربازان، برخاست چو او بنشست\nگر غالیه خوش بو شد، در گیسویِ او پیچید\nور وَسمه کمانکَش گشت، در ابروی او پیوست\nبازآی که بازآید عمرِ شدهٔ حافظ\nهرچند که ناید باز، تیری که بِشُد از شست"},{"id":28,"poem":"به جانِ خواجه و حقِ قدیم و عهدِ درست\nکه مونسِ دمِ صبحم، دعایِ دولتِ توست\nسِرِشک من که ز طوفان نوح دست بَرَد\nز لوح سینه نیارَست نقشِ مهرِ تو شُست\nبکن معامله‌ای، وین دل شکسته بخر\nکه با شکستگی ارزد به صد هزار درست\nزبان مور به آصف دراز گشت و رواست\nکه خواجه خاتَمِ جم، یاوه کرد و باز نَجُست\nدلا طَمَع مَبُر از لطفِ بی‌نهایتِ دوست\nچو لافِ عشق زدی، سر بباز، چابک و چُست\nبه صدق کوش، که خورشید زایَد از نَفَسَت\nکه از دروغ سیه‌روی گشت صبحِ نخست\nشدم ز دست تو شیدای کوه و دشت و هنوز\nنمی‌کنی به ترحم، نِطاق سلسله سست\nمرنج حافظ و از دلبر‌ان حِفاظ مجوی\nگناه باغ چه باشد چو این گیاه نَرُست"},{"id":29,"poem":"ما را زِ خیالِ تو چه پروایِ شراب است؟\nخُم گو سر خود گیر، که خُمخانه خراب است\nگر خَمر بهشت است بریزید که بی دوست\nهر شَربَتِ عَذبَم که دهی، عینِ عذاب است\nافسوس که شُد دلبر و در دیدهٔ گریان\nتحریرِ خیالِ خطِ او نقشِ بر آب است\nبیدار شو ای دیده که ایمن نتوان بود\nزین سیلِ دمادم که در این منزلِ خواب است\nمعشوق عیان می‌گذرد بر تو، ولیکن\nاغیار همی‌بیند از آن بسته نقاب است\nگل بر رخِ رنگین تو تا لطفِ عرق دید\nدر آتشِ شوق از غمِ دل، غرقِ گلاب است\nسبز است در و دشت بیا تا نگذاریم\nدست از سرِ آبی که جهان جمله سراب است\nدر کُنجِ دِماغم مطلب جای نصیحت\nکـ‌این گوشه پر از زمزمهٔ چنگ و رَباب است\nحافظ چه شد ار عاشق و رند است و نظرباز\nبس طُورِ عجب لازمِ ایامِ شباب است"},{"id":30,"poem":"زلفت هزار دل به یکی تار مو ببست\nراه هزار چاره‌گر از چارسو ببست\nتا عاشقان به بوی نسیمش دهند جان\nبگشود نافه‌ایّ و دَرِ آرزو ببست\nشیدا از آن شدم که نگارم چو ماه نو\nابرو نُمود و جلوه‌گری کرد و رو ببست\nساقی به چند رنگ، می اندر پیاله ریخت\nاین نقش‌ها نگر که چه خوش در کدو ببست\nیا رب چه غمزه کرد صُراحی که خون خُم\nبا نعره‌های قُلقُلش اندر گلو ببست\nمطرب چه پرده ساخت که در پردهٔ سماع\nبر اهل وجد و حال، درِ های‌وهو ببست\nحافظ! هر آن که عشق نَورزید و وصل خواست\nاحرامِ طوفِ کعبهٔ دل، بی‌وضو ببست"},{"id":31,"poem":"آن شبِ قدری که گویند اهلِ خلوت امشب است\nیا رب این تأثیرِ دولت در کدامین کوکب است؟\nتا به گیسویِ تو دستِ ناسزایان کم رسد\nهر دلی از حلقه‌ای در ذکرِ یارب یارب است\nکشته چاه زنخدان توام کز هر طرف\nصد هزارش گردنِ جان زیرِ طوقِ غَبغَب است\nشهسوارِ من که مه آیینه دارِ روی اوست\nتاجِ خورشیدِ بلندش خاکِ نعلِ مَرکَب است\nعکسِ خِوی بر عارضَش بین کآفتابِ گرم رو\nدر هوایِ آن عَرَق تا هست هر روزش تب است\nمن نخواهم کرد تَرکِ لعلِ یار و جام می\nزاهدان معذور داریدم که اینَم مذهب است\nاندر آن ساعت که بر پشتِ صبا بندند زین\nبا سلیمان چون برانم من که مورم مرکب است\nآن که ناوَک بر دلِ من زیرِ چشمی می‌زند\nقوتِ جانِ حافظش در خندهٔ زیر لب است\nآبِ حیوانش ز منقارِ بلاغت می‌چکد\nزاغِ کِلکِ من بنامیزد چه عالی مشرب است"},{"id":32,"poem":"خدا چو صورتِ ابرویِ دلگشای تو بست\nگشادِ کارِ من اندر کرشمه‌هایِ تو بست\nمرا و سروِ چمن را به خاکِ راه نشاند\nزمانه تا قَصَبِ نرگسِ قبای تو بست\nز کارِ ما و دلِ غنچه صد گره بگشود\nنسیمِ گل چو دل اندر پیِ هوایِ تو بست\nمرا به بندِ تو دورانِ چرخ راضی کرد\nولی چه سود که سررشته در رضای تو بست\nچو نافه بر دلِ مسکینِ من گره مَفِکن\nکه عهد با سرِ زلفِ گره‌گشایِ تو بست\nتو خود وصالِ دگر بودی ای نسیمِ وصال\nخطا نِگر که دل امید در وفایِ تو بست\nز دستِ جورِ تو گفتم زِ شهر خواهم رفت\nبه خنده گفت که حافظ برو، که پایِ تو بست؟"},{"id":33,"poem":"خلوت گُزیده را به تماشا چه حاجت است\nچون کوی دوست هست به صحرا چه حاجت است\nجانا به حاجتی که تو را هست با خدا\nکآخِر دمی بپرس که ما را چه حاجت است\nای پادشاهِ حُسن خدا را بسوختیم\nآخِر سؤال کن که گدا را چه حاجت است\nاربابِ حاجتیم و زبانِ سؤال نیست\nدر حضرتِ کریم، تمنا چه حاجت است\nمحتاج قِصه نیست گَرَت قصدِ خون ماست\nچون رَخت از آن توست، به یغما چه حاجت است\nجامِ جهان نماست ضمیرِ منیرِ دوست\nاظهارِ احتیاج، خود آن جا چه حاجت است\nآن شد که بارِ منتِ مَلّاح بردمی\nگوهر چو دست داد به دریا چه حاجت است\nای مدعی برو که مرا با تو کار نیست\nاَحباب حاضرند، به اَعدا چه حاجت است\nای عاشقِ گدا چو لبِ روح‌بخشِ یار\nمی‌داندت وظیفه، تقاضا چه حاجت است\nحافظ! تو خَتم کن که هنر خود عَیان شود\nبا مدعی نزاع و مُحاکا چه حاجت است"},{"id":34,"poem":"رَواقِ منظرِ چشمِ من آشیانهٔ توست\nکَرَم نما و فرود آ که خانه، خانهٔ توست\nبه لطفِ خال و خط از عارفان ربودی دل\nلطیفه‌های عَجَب زیرِ دام و دانهٔ توست\nدلت به وصلِ گل ای بلبلِ صبا خوش باد\nکه در چمن همه گلبانگِ عاشقانهٔ توست\nعِلاجِ ضعفِ دلِ ما به لب حوالت کن\nکه این مُفَرّح یاقوت در خزانهٔ توست\nبه تن مُقصرم از دولتِ ملازمتت\nولی خلاصهٔ جان، خاکِ آستانهٔ توست\nمن آن نیَم که دَهَم نقدِ دل به هر شوخی\nدَرِ خزانه، به مُهر تو و نشانهٔ توست\nتو خود چه لعبتی ای شهسوارِ شیرین کار\nکه توسَنی چو فلک، رامِ تازیانهٔ توست\nچه جای من، که بِلَغزَد سپهرِ شعبده‌باز\nاز این حیَل که در انبانهٔ بهانهٔ توست\nسرودِ مجلست اکنون فلک به رقص آرَد\nکه شعرِ حافظِ شیرین سخن ترانهٔ توست"},{"id":35,"poem":"برو به کارِ خود ای واعظ این چه فریادست؟\nمرا فِتاد دل از ره، تو را چه اُفتادست؟\nمیان او که خدا آفریده است از هیچ\nدقیقه‌ای‌ست که هیچ آفریده نَگشادست\nبه کام تا نرساند مرا لبش، چون نای\nنصیحتِ همه عالم به گوشِ من بادست\nگدایِ کویِ تو از هشت خُلد، مستغنی‌ست\nاسیرِ عشقِ تو از هر دو عالم آزادست\nاگر چه مستیِ عشقم خراب کرد ولی\nاساسِ هستیِ من زآن خراب، آبادست\nدلا مَنال ز بیداد و جورِ یار که یار\nتو را نصیب همین کرد و این از آن دادست\nبرو فَسانه مخوان و فُسون مدم حافظ\nکز این فسانه و افسون مرا بسی یادست"},{"id":36,"poem":"تا سرِ زلفِ تو در دستِ نسیم افتادست\nدلِ سودازده از غُصه دو نیم افتادست\nچَشمِ جادویِ تو خود عینِ سَوادِ سِحْر است\nلیکن این هست که این نُسخه سَقیم اُفتادست\nدر خَمِ زلف تو آن خالِ سیه دانی چیست؟\nنقطهٔ دوده که در حلقه جیم افتادست\nزلفِ مشکینِ تو در گلشنِ فردوسِ عِذار\nچیست؟ طاووس که در باغِ نعیم افتادست\nدلِ من در هوسِ رویِ تو ای مونس جان\nخاکِ راهیست که در دستِ نسیم افتادست\nهمچو گَرد این تنِ خاکی نتوانَد برخاست\nاز سرِ کویِ تو زان رو که عظیم افتادست\nسایهٔ قَدِّ تو بر قالبم ای عیسی دم\nعکسِ روحیست که بر عَظمِ رَمیم افتادست\nآن که جز کعبه مُقامش نَبُد از یادِ لبت\nبر درِ میکده دیدم که مُقیم افتادست\nحافظِ گمشده را با غمت ای یارِ عزیز\nاتحادیست که در عهدِ قدیم افتادست"},{"id":37,"poem":"بیا که قصرِ اَمَل سخت سست‌بنیادست\nبیار باده که بنیادِ عمر بر بادست\nغلامِ همّتِ آنم که زیرِ چرخِ کبود\nز هر چه رنگِ تعلّق پذیرد آزادست\nچه گویمت که به میخانه دوش مست و خراب\nسروشِ عالَمِ غیبم چه مژده‌ها دادست\nکه ای بلندنظر شاهبازِ سِدره‌نشین\nنشیمن تو نه این کُنجِ محنت‌آبادست\nتو را ز کنگرهٔ عرش می‌زنند صفیر\nندانمت که در این دامگه چه افتادست\nنصیحتی کنمت یاد گیر و در عمل آر\nکه این حدیث، ز پیرِ طریقتم یادست\nغمِ جهان مخور و پندِ من مَبَر از یاد\nکه این لطیفهٔ عشقم ز رهروی یادست\nرضا به داده بده وز جبین گره بگشای\nکه بر من و تو دَرِ اختیار نگشادست\nمجو درستیِ عهد از جهانِ سست‌نهاد\nکه این عجوز، عروسِ هزاردامادست\nنشان عهد و وفا نیست در تبسّمِ گل\nبنال بلبل بی‌دل که جای فریادست\nحسد چه می‌بری ای سست‌نظم بر حافظ؟\nقبولِ خاطر و لطفِ سخن خدادادست"},{"id":38,"poem":"بی مِهرِ رُخَت روزِ مرا نور نماندست\nوز عمر، مرا جز شبِ دیجور نماندست\nهنگامِ وداعِ تو ز بس گریه که کردم\nدور از رخِ تو، چشمِ مرا نور نماندست\nمی‌رفت خیالِ تو ز چشمِ من و می‌گفت\nهیهات از این گوشه که معمور نماندست\nوصلِ تو اَجَل را ز سرم دور همی‌داشت\nاز دولتِ هجرِ تو کنون دور نماندست\nنزدیک شد آن دم که رقیب تو بگوید\nدور از رُخَت این خستهٔ رنجور نماندست\nصبر است مرا چارهٔ هجرانِ تو لیکن\nچون صبر توان کرد که مقدور نماندست؟\nدر هِجرِ تو گر چشمِ مرا آبِ روان است\nگو خونِ جگر ریز که معذور نماندست\nحافظ، ز غم از گریه نپرداخت به خنده\nماتم زده را داعیهٔ سور نماندست"},{"id":39,"poem":"باغِ مرا چه حاجتِ سرو و صنوبر است؟\nشمشادِ خانه‌پرورِ ما از که کمتر است؟\nای نازنین‌پسر، تو چه مذهب گرفته‌ای؟\nکِت خونِ ما حلال‌تر از شیرِ مادر است\nچون نقشِ غم ز دور بِبینی شراب خواه\nتشخیص کرده‌ایم و مداوا مقرّر است\nاز آستانِ پیرِ مغان، سر چرا کشیم؟\nدولت در آن سرا و گشایش در آن در است\nیک قِصّه بیش نیست غمِ عشق، وین عجب\nکز هر زبان که می‌شنوم، نامکرّر است\nدی وعده داد وصلم و در سر شراب داشت\nامروز تا چه گوید و بازش چه در سر است\nشیراز و آبِ رکنی و این بادِ خوش نسیم\nعیبش مکن که خالِ رُخِ هفت کشور است\nفرق است از آبِ خِضر که ظُلمات جای او است\nتا آبِ ما که مَنبَعش الله اکبر است\nما آبرویِ فقر و قناعت نمی‌بریم\nبا پادشه بگوی که روزی مقدّر است\nحافظ چه طُرفه شاخ نباتیست کِلکِ تو\nکِش میوه دلپذیرتر از شهد و شکّر است"},{"id":40,"poem":"اَلْمِنَّةُ لِلَّه که درِ میکده، باز است\nزان رو که مرا بر در او، رویِ نیاز است\nخُم‌ها، همه در جوش و خُروش‌اند ز مَسْتی\nوان می که در آن‌جاست، حقیقت، نه مَجاز است\nاز وی، همه، مَسْتی و غُرور است و تَکَبُّر\nوز ما همه بیچارگی و عَجْز و نیاز است\nرازی که بَرِ غیر نگفتیم و نگوییم\nبا دوست بگوییم که او مَحْرَمِ راز است\nشَرْحِ شِکَنِ زُلْفِ خَم اندر خَمِ جانان\nکوتَه نَتَوان کرد که این قِصِّه، دراز است\nبارِ دِلِ مَجْنون و خَمِ طُرِّهٔ لیلی\nرُخسارهٔ مَحمود و کَفِ پایِ اَیاز است\nبردوخته‌ام دیده چو باز از همه عالَم\nتا دیدهٔ من بر رُخِ زیبایِ تو، باز است\nدر کعبهٔ کویِ تو، هر آن‌کس که بیاید\nاز قبلهٔ ابرویِ تو در عِیْنِ نماز است\nای مجلسیان، سوزِ دلِ «حافظِ» مسکین\nاز شمع بپرسید که در سوز و گداز است"},{"id":41,"poem":"اگر چه باده فَرَح بخش و باد گُل‌بیز است\nبه بانگِ چَنگ مخور مِی که مُحتَسِب تیز است\nصُراحی‌ای و حریفی گَرَت به چَنگ افتد\nبه عقل نوش که ایام فتنه‌ انگیز است\nدر آستینِ مُرَقَع پیاله پنهان کن\nکه همچو چشمِ صُراحی، زمانه خونریز است\nبه آبِ دیده بشوییم خِرقه‌ها از می\nکه موسمِ وَرَع و روزگارِ پرهیز است\nمجوی عیشِ خوش از دورِ باژگونِ سِپِهر\nکه صافِ این سر خُم جمله دُردی‌آمیز است\nسپهرِ بَر شده پرویزنی‌ست خون افشان\nکه ریزه‌اش سر کَسری و تاجِ پرویز است\nعراق و فارس گرفتی به شعرِ خوش حافظ\nبیا که نوبتِ بغداد و وقتِ تبریز است"},{"id":42,"poem":"حالِ دل با تو گفتنم، هوس است\nخبرِ دل شِنُفتَنَم، هوس است\nطَمَعِ خام بین که قِصهٔ فاش\nاز رقیبان نَهُفتَنَم، هوس است\nشبِ قدری چنین عزیزِ شریف\nبا تو تا روز خُفتنم، هوس است\nوه که دُردانه‌ای چنین نازک\nدر شبِ تار سُفتنم، هوس است\nای صبا امشبَم مَدَد فرمای\nکه سحرگه شکفتنم، هوس است\nاز برای شَرَف به نوُکِ مژه\nخاکِ راهِ تو رفتنم، هوس است\nهمچو حافظ به رَغمِ مُدَعیان\nشعرِ رندانه گفتنم، هوس است"},{"id":43,"poem":"صَحنِ بُستان ذوق‌بخش و صحبتِ یاران خوش است\nوقتِ گل خوش باد کز وی وقتِ می‌خواران خوش است\nاز صبا هر دم مشامِ جانِ ما خوش می‌شود\nآری آری طیبِ اَنفاسِ هواداران خوش است\nناگشوده گُل نِقاب، آهنگِ رحلت ساز کرد\nناله‌ کن بلبل که گلبانگِ دل‌اَفکاران خوش است\nمرغِ خوشخوان را بشارت باد کاندر راهِ عشق\nدوست را با نالهٔ شب‌های بیداران خوش است\nنیست در بازارِ عالَم خوشدلی ور زان که هست\nشیوهٔ رندی و خوش‌باشیِ عیاران خوش است\nاز زبانِ سوسنِ آزاده‌ام آمد به گوش\nکاندر این دِیرِ کهن، کارِ سبکباران خوش است\nحافظا! تَرکِ جهان گفتن طریقِ خوشدلیست\nتا نپنداری که احوالِ جهان‌داران خوش است"},{"id":44,"poem":"کُنون که بر کفِ گُل، جامِ بادهٔ صاف است\nبه صد هزار زبان، بلبلش در اوصاف است\nبخواه دَفْتَرِ اَشعار و راهِ صَحرا گیر\nچه وَقْتِ مدرسه و بَحْثِ کَشْفِ کَشّاف است؟\nفقیهِ مدرسه، دی، مَسْت بود و فَتوی داد\nکه مِی، حَرام ولی بِهْ ز مالِ اوقاف است\nبه دُرد و صاف، تو را حُکْم نیست خوش دَرکَش\nکه هرچه ساقیِ ما کَرْد عِیْنِ اَلطاف است\nبِبُر ز خَلق و چو عَنقا، قیاسِ کار بگیر\nکه صیتِ گوشه‌نشینان، زِ قاف تا قاف است\nحَدیثِ مُدّعیان و خیالِ همکاران\nهمان حکایتِ زَردوز و بوریاباف است\nخموش «حافظ» و این نکته‌هایِ چونِ زَرِ سُرخ\nنگاه دار که قَلّابِ شهر، صَرّاف است"},{"id":45,"poem":"در این زمانه، رفیقی که خالی از خَلَل است\nصُراحیِ مِیِ ناب و سَفینهٔ غزل است\nجَریده رُو که گُذَرگاهِ عافیت، تَنْگ است\nپیاله گیر که عُمرِ عزیز، بی‌بَدَل است\nنه من ز بی‌عَمَلی، در جهان، مَلولَم و بَس\nمَلالَتِ عُلما هم ز عِلْمِ بی‌عَمَل است\nبه چَشْمِ عَقْل در این رَهْگُذارِ پُرآشوب\nجهان و کارِ جهان، بی‌ثُبات و بی‌مَحَل است\nبگیر طُرِّهٔ مه‌چهره‌ای و قِصِّه مَخوان\nکه سَعْد و نَحْس ز تأثیرِ زُهْرِه و زُحَل است\nدلم، امیدِ فراوان به وَصْلِ رویِ تو داشت\nولی اَجَل به رَهِ عمر، رَهْزَنِ اَمَل است\nبه هیچ دور نخواهند یافت هُشیارش\nچُنین که «حافظِ» ما، مَسْتِ بادهٔ اَزَل است"},{"id":46,"poem":"گُل در بَر و مِی در کَف و معشوق به کام است\nسلطانِ جهانم به چُنین روز، غلام است\nگو شمع میارید در این جمع که امشب\nدر مجلسِ ما، ماهِ رخِ دوست، تمام است\nدر مذهبِ ما، باده، حلال است ولیکن\nبی‌رویِ تو ای سَروِ گُل‌اندام، حرام است\nگوشم همه بر قولِ نی و نغمهٔ چنگ است\nچشمم، همه، بر لعلِ لب و گَردشِ جام است\nدر مجلسِ ما، عِطر میامیز که ما را\nهر لحظه، زِ گیسو‌یِ تو، خوش‌بوی مشام است\nاز چاشنیِ قند مگو هیچ و زِ شِکَّر\nزآن رو که مرا از لبِ شیرینِ تو، کام است\nتا گنجِ غمت در دِلِ ویرانه‌، مقیم است\nهمواره مرا کویِ خرابات، مقام است\nاز ننگ چه گویی که مرا نام ز ننگ است؟\nوز نام چه پرسی که مرا ننگ ز نام است؟\nمِی‌خواره و سرگشته و رندیم و نظرباز\nوآن کس که چو ما نیست در این شهر، کدام است؟\nبا محتسبم، عیب مگویید که او نیز\nپیوسته، چو ما در طلبِ عیشِ مدام است\nحافظ! منشین بی‌مِی و معشوق، زمانی\nکایَّامِ گُل و یاسمن و عیدِ صیام است"},{"id":47,"poem":"به کویِ میکده هر سالِکی که رَه دانست\nدری دگر زدن اندیشهٔ تَبَه دانست\nزمانه افسر رندی نداد جز به کسی\nکه سرفرازیِ عالَم در این کُلَه دانست\nبر آستانهٔ میخانه هر که یافت رَهی\nز فیضِ جامِ مِی اَسرار خانقَه دانست\nهر آن که رازِ دو عالم ز خطِ ساغَر خواند\nرُموزِ جامِ جم از نقشِ خاکِ ره دانست\nورایِ طاعتِ دیوانگان ز ما مَطَلَب\nکه شیخِ مذهبِ ما عاقلی گُنَه دانست\nدلم ز نرگسِ ساقی اَمان نخواست به جان\nچرا که شیوهٔ آن تُرکِ دل سیه دانست\nز جورِ کوکبِ طالع ،سَحَرگَهان چشمم\nچنان گریست که ناهید دید و مَه دانست\nحدیثِ حافظ و ساغر که می‌زند پنهان\nچه جایِ محتسب و شِحنه، پادشَه دانست\nبلندمرتبه شاهی که نُه رِواقِ سِپِهر\nنمونه‌ای ز خَمِ طاقِ بارگَه دانست"},{"id":48,"poem":"صوفی از پرتو مِی رازِ نهانی دانست\nگوهرِ هر کس از این لعل، توانی دانست\nقدر مجموعهٔ گل، مرغِ سَحَر داند و بس\nکه نه هر کو ورقی خواند، معانی دانست\nعرضه کردم دو جهان بر دلِ کاراُفتاده\nبه جز از عشقِ تو باقی همه فانی دانست\nآن شد اکنون که ز اَبنایِ عَوام اندیشم\nمُحتَسِب نیز در این عیشِ نهانی دانست\nدل‌بر، آسایش ما مَصلحتِ وقت ندید\nور نه از جانبِ ما دل‌نگرانی دانست\nسنگ و گِل را کُنَد از یُمنِ نظر لعل و عقیق\nهر که قَدرِ نفسِ بادِ یمانی دانست\nای که از دفترِ عقل، آیت عشق آموزی\nترسم این نکته به تَحقیق ندانی دانست\nمِی بیاور که ننازد به گلِ باغِ جهان\nهر که غارت‌گریِ بادِ خزانی دانست\nحافظ این گوهرِ مَنظوم که از طَبع اَنگیخت\nزَ اثرِ تربیتِ آصِفِ ثانی دانست"},{"id":49,"poem":"روضهٔ خُلدِ برین خلوتِ درویشان است\nمایهٔ مُحتشمی، خدمتِ درویشان است\nگَنج عُزلت که طِلِسماتِ عجایب دارد\nفتحِ آن در نظرِ رحمتِ درویشان است\nقصرِ فردوس که رضوانش به دَربانی رفت\nمَنظَری از چمنِ نُزهَتِ درویشان است\nآن چه زر می‌شود از پرتو آن، قلبِ سیاه\nکیمیاییست که در صحبتِ درویشان است\nآن که پیشش بِنَهَد تاجِ تکبر، خورشید\nکبریاییست که در حِشمتِ درویشان است\nدولتی را که نباشد غم از آسیبِ زَوال\nبی‌تَکَلُف بشنو، دولتِ درویشان است\nخسروان، قبلهٔ حاجاتِ جهانند ولی\nسببش بندگیِ حضرتِ درویشان است\nرویِ مقصود که شاهان به دعا می‌طَلبند\nمَظهَرَش آینهٔ طَلعَتِ درویشان است\nاز کران تا به کران، لشکر ظُلم است ولی\nاز اَزَل تا به اَبَد، فرصتِ درویشان است\nای توانگر مَفُروش این همه نِخوَت که تو را\nسر و زر در کَنَفِ همتِ درویشان است\nگنجِ قارون که فرو می‌شود از قَهر هنوز\nخوانده باشی که هم از غِیرتِ درویشان است\nحافظ ار آبِ حیاتِ اَزَلی می‌خواهی\nمَنبَعَش خاکِ درِ خلوتِ درویشان است\nمن غلامِ نظرِ آصِفِ عهدم کو را\nصورتِ خواجگی و سیرتِ درویشان است"},{"id":50,"poem":"# 【0†حافظ » غزلیات » غزل شمارهٔ ۵۰】\nبه دامِ زلفِ تو دل مبتلایِ خویشتن است\nبکُش به غمزه که اینَش سزایِ خویشتن است\nگَرَت ز دست برآید مُرادِ خاطرِ ما\nبه دست باش که خیری به جایِ خویشتن است\nبه جانت ای بتِ شیرین دهن که همچون شمع\nشبانِ تیره، مُرادم فنایِ خویشتن است\nچو رای عشق زدی با تو گفتم ای بلبل\nمَکُن که آن گلِ خندان به رای خویشتن است\nبه مُشکِ چین و چِگِل نیست بویِ گُل مُحتاج\nکه نافه‌هاش ز بندِ قَبایِ خویشتن است\nمرو به خانهٔ اربابِ بی‌مُروتِ دهر\nکه گنجِ عافیتت در سرایِ خویشتن است\nبسوخت حافظ و در شرطِ عشقبازی او\nهنوز بر سرِ عهد و وفایِ خویشتن است"},{"id":51,"poem":"لعلِ سیرابِ به‌خون‌تشنه‌، لب یار من است\nوز پی دیدنِ او دادنِ جان کار من است\nشرم از آن چشمِ سیه بادش و مژگان دراز\nهر که دل بردنِ او دید و در انکارِ من است\nساروان رَخت به دروازه مَبَر‌، کان سرِ کو\nشاهراهی‌ست که منزلگهِ دلدارِ من است\nبندهٔ طالعِ خویشم که در این قحطِ وفا\nعشق آن لولیِ سرمست‌، خریدار من است\nطَبلِهٔ عطرِ گل و زلفِ عبیر افشانش\nفیضِ یک شَمِّه ز بوی خوشِ عطارِ من است\nباغبان همچو نسیمم ز درِ خویش مران\nکآبِ گلزارِ تو از اشکِ چو گلنارِ من است\nشربتِ قند و گلاب از لبِ یارم فرمود\nنرگس او که طبیبِ دلِ بیمارِ من است\nآن که در طرزِ غزل نکته به حافظ آموخت\nیارِ شیرین‌سخنِ نادره‌گفتارِ من است"},{"id":52,"poem":"روزْگاری‌ست که سودایِ بُتان، دینِ من است\nغَمِ این کار‌، نِشاطِ دِلِ غَمْگینِ من است\nدیدنِ رویِ تو را دیده‌یِ جان‌بین باید\nوین کجا مَرْتَبِه‌یِ چَشْمِ جَهان‌بینِ من است؟\nیارِ من باش که زیبِ فَلَک و زینتِ دَهْر\nاز مَهِ رویِ تو و اَشْکِ چو پَروینِ من است\nتا مرا عشقِ تو، تعلیمِ سُخَن‌گفتن کرد\nخَلق را وِردِ زبان، مَدْحَت و تَحسینِ من است\nدولتِ فَقْر خدایا به من ارزانی دار\nکاین کِرامت، سَبَبِ حِشْمَت و تَمکینِ من است\nواعِظِ شِحنه‌شناس، این عَظِمَت گو مَفُروش\nزان که مَنْزِلْگَهِ سُلطان، دِلِ مِسْکینِ من است\nیا رب این کَعْبِه‌یِ مَقْصود، تَماشاگَهِ کیست؟\nکه مُغِیلانِ طَریقش، گُل و نَسْرینِ من است\n«حافظ» از حشمتِ پرویز، دگر، قِصِّه مَخوان\nکه لَبَش، جُرْعِه‌کَشِ خُسروِ شیرینِ من است"},{"id":53,"poem":"منم که گوشهٔ میخانه، خانقاهِ من است\nدعایِ پیرِ مُغان، وِرْدِ صُبْحگاهِ من است\nگَرَم ترانهٔ چنگ صَبوح نیست چه باک\nنوایِ من به سَحَر، آهِ عُذْرخواهِ من است\nز پادشاه و گِدا، فارِغم بِحَمْدِالله\nگِدایِ خاکِ دَرِ دوست، پادشاهِ من است\nغَرَض زِ مَسْجِد و مِیخانه‌ام، وِصالِ شماست\nجُز این خیال ندارم، خُدا، گُواهِ من است\nمَگَر به تیغِ اَجَل، خیمه بَرکَنَم ور نی\nرَمیدن از دَرِ دولت، نه رَسْم و راهِ من است\nاز آن زَمان که بر این آسْتان نَهادم روی\nفَرازِ مَسْنَدِ خورشید، تِکْیِه‌گاهِ من است\nگُناه اگرچه نبود اختیارِ ما، «حافظ»!\nتو در طریقِ اَدَب باش، گو گُناهِ من است"},{"id":54,"poem":"ز گریه مَردمِ چشمم نشسته در خون است\nببین که در طلبت حالِ مَردمان چون است\nبه یادِ لعلِ تو و چشمِ مستِ میگونت\nز جامِ غم، می لعلی که می‌خورم خون است\nز مشرقِ سرِ کو، آفتابِ طلعتِ تو\nاگر طلوع کند، طالعم همایون است\nحکایتِ لبِ شیرین، کلام فرهاد است\nشِکَنجِ طُرِّهٔ لیلی مقام مجنون است\nدلم بجو که قدت همچو سروِ دلجوی است\nسخن بگو که کلامت لطیف و موزون است\nز دورِ باده به جان، راحتی رسان ساقی\nکه رنجِ خاطرم از جورِ دورِ گردون است\nاز آن دمی که ز چشمم برفت رودِ عزیز\nکنارِ دامنِ من همچو رودِ جیحون است\nچگونه شاد شود اندرونِ غمگینم؟\nبه اختیار، که از اختیار بیرون است\nز بیخودی طلبِ یار می‌کند حافظ\nچو مفلسی که طلبکارِ گنجِ قارون است"},{"id":55,"poem":"خَمِ زلفِ تو دامِ کفر و دین است\nز کارستانِ او یک شمه این است\nجمالت مُعجِزِ حُسن است لیکن\nحدیثِ غمزه‌ات سحرِ مبین است\nز چشمِ شوخِ تو جان کی توان برد؟\nکه دایم با کمان اندر کمین است\nبر آن چشمِ سیه صد آفرین باد\nکه در عاشق کُشی سِحرآفرین است\nعجب عِلمیست عِلم هیئت عشق\nکه چرخِ هشتمش، هفتم زمین است\nتو پنداری که بدگو رفت و جان برد؟\nحسابش با کرام الکاتبین است\nمشو حافظ ز کیدِ زلفش ایمن\nکه دل برد و کنون در بندِ دین است"},{"id":56,"poem":"دل سراپردهٔ محبتِ اوست\nدیده آیینه‌دارِ طلعت اوست\nمن که سر در نیاورم به دو کون\nگردنم زیرِ بارِ منتِ اوست\nتو و طوبی و ما و قامتِ یار\nفکرِ هر کس به قدرِ همتِ اوست\nگر من آلوده‌دامنم چه عجب\nهمه عالم گواهِ عصمتِ اوست\nمن که باشم در آن حرم که صبا\nپرده‌دارِ حریمِ حُرمتِ اوست\nبی خیالش مباد منظرِ چشم\nزآن که این گوشه جایِ خلوتِ اوست\nهر گلِ نو که شد چمن‌آرای\nزَ اثر رنگ و بویِ صحبتِ اوست\nدورِ مجنون گذشت و نوبتِ ماست\nهر کسی پنج روز، نوبتِ اوست\nمُلکَتِ عاشقیّ و گنجِ طرب\nهر چه دارم ز یُمنِ همتِ اوست\nمن و دل گر فدا شدیم چه باک؟\nغرض اندر میان سلامتِ اوست\nفقرِ ظاهر مبین که حافظ را\nسینه گنجینهٔ محبتِ اوست"},{"id":57,"poem":"آن سیه‌چرده که شیرینیِ عالَم با اوست\nچشمِ مِیگون، لبِ خندان، دِلِ خرم با اوست\nگر چه شیرین‌‌دهنان پادشهان‌اند ولی\nاو سلیمانِ زمان است که خاتَم با اوست\nروی خوب است و کمالِ هنر و دامن پاک\nلاجَرَم، همتِ پاکانِ دو عالَم با اوست\nخالِ مشکین که بدان عارِضِ گندمگون است\nسِرِّ آن دانه که شد رهزنِ آدم با اوست\nدلبرم، عزمِ سفر کرد، خدا را یاران\nچه کنم با دِلِ مجروح؟ که مرهم با اوست\nبا که این نکته توان گفت که آن سنگین‌‌دِل\nکُشت ما را و دَمِ عیسیِ مریم با اوست\nحافظ از معتقدان است گرامی دارش\nزآن که بخشایشِ بس روحِ مکرم با اوست"},{"id":58,"poem":"سرِ ارادتِ ما و آستانِ حضرت دوست\nکه هر چه بر سرِ ما می‌رود ارادتِ اوست\nنظیرِ دوست ندیدم، اگر چه از مَه و مِهر\nنهادم آینه‌ها در مقابلِ رخِ دوست\nصبا ز حالِ دلِ تنگِ ما چه شرح دهد؟\nکه چون شِکَنجِ ورق‌هایِ غنچه تو بر توست\nنه من سَبوکش این دیرِ رندسوزم و بس\nبسا سَرا که در این کارخانه سنگ و سبوست\nمگر تو شانه زدی زلفِ عنبرافشان را؟\nکه بادْ غالیه‌سا گشت و خاکْ عنبربوست\nنثارِ رویِ تو هر برگِ گل که در چمن است\nفدای قَدِّ تو هر سروبُن که بر لبِ جوست\nزبانِ ناطقه در وصفِ شوق نالان است\nچه جای کِلکِ بریده‌زبانِ بیهُده‌گوست؟\nرخِ تو در دلم آمد مراد خواهم یافت\nچرا که حالِ نکو در قَفایِ فالِ نکوست\nنه این زمان دلِ حافظ در آتشِ هوس است\nکه داغدار ازل همچو لالهٔ خودروست"},{"id":59,"poem":"دارم امید عاطفتی از جناب دوست\nکردم جنایتی و امیدم به عفو اوست\nدانم که بُگذرد ز سرِ جرمِ من که او\nگر چه پریوش است ولیکن فرشته‌خوست\nچندان گریستیم که هر کس که برگذشت\nدر اشکِ ما چو دید روان گفت «کاین چه جوست؟»\nهیچ است آن دهان و نبینم از او نشان\nموی است آن میان و ندانم که آن چه موست\nدارم عجب ز نقشِ خیالش که چون نرفت\nاز دیده‌ام که دَم به دَمش کار شُست و شوست\nبی گفت و گوی زلفِ تو دل را همی کُشد\nبا زلف دلکَش تو که را روی گفت و گوست؟\nعمری‌ست تا ز زلفِ تو بویی شنیده‌ام\nزان بوی در مشامِ دلِ من هنوز بوست\nحافظ بد است حالِ پریشانِ تو، ولی\nبر بویِ زلفِ یار پریشانیَت نکوست"},{"id":60,"poem":"آن پیکِ ناموَر که رسید از دیارِ دوست\nآورد حِرزِ جان ز خطِ مُشکبارِ دوست\nخوش می‌دهد نشانِ جلال و جمالِ یار\nخوش می‌کند حکایتِ عِزّ و وقارِ دوست\nدل دادمش به مژده و خِجلَت همی‌برم\nزین نقدِ قلبِ خویش که کردم نثارِ دوست\nشکرِ خدا که از مددِ بختِ کارساز\nبر حسبِ آرزوست همه کار و بارِ دوست\nسیرِ سپهر و دورِ قمر را چه اختیار؟\nدر گردشند بر حَسَبِ اختیار دوست\nگر بادِ فتنه هر دو جهان را به هم زند\nما و چراغِ چَشم و رهِ انتظارِ دوست\nکُحلُ الجَواهری به من آر ای نسیمِ صبح\nزان خاکِ نیکبخت که شد رهگذارِ دوست\nماییم و آستانهٔ عشق و سرِ نیاز\nتا خوابِ خوش که را بَرَد اندر کنارِ دوست\nدشمن به قصدِ حافظ اگر دم زند چه باک؟\nمِنَّت خدای را که نیَم شرمسارِ دوست"},{"id":61,"poem":"صبا اگر گذری اُفتَدَت به کشور دوست\nبیار نَفحِه‌ای از گیسوی مُعَنبَر دوست\nبه جانِ او که به شکرانه جان برافشانم\nاگر به سویِ من آری پیامی از برِ دوست\nو گر چنان که در آن حضرتت نباشد بار\nبرایِ دیده بیاور غباری از درِ دوست\nمنِ گدا و تمنایِ وصلِ او هیهات\nمگر به خواب ببینم خیالِ منظرِ دوست\nدل صِنوبَری‌ام همچو بید لرزان است\nز حسرتِ قد و بالای چون صنوبرِ دوست\nاگر چه دوست به چیزی نمی‌خرد ما را\nبه عالمی نفروشیم مویی از سرِ دوست\nچه باشد ار شود از بندِ غم دلش آزاد\nچو هست حافظِ مسکین غلام و چاکر دوست"},{"id":62,"poem":"مرحبا ای پیکِ مشتاقان بده پیغامِ دوست\nتا کُنم جان از سرِ رغبت فدای نامِ دوست\nواله و شیداست دایم همچو بلبل در قفس\nطوطی طبعم ز عشقِ شِکَّر و بادامِ دوست\nزلفِ او دام است و خالش دانهٔ آن دام و من\nبر امیدِ دانه‌ای افتاده‌ام در دامِ دوست\nسر ز مستی برنگیرد تا به صبحِ روزِ حشر\nهر که چون من در ازل یک جرعه خورد از جامِ دوست\nبس نگویم شِمِّه‌ای از شرحِ شوقِ خود از آنک\nدردسر باشد نمودن بیش از این ابرامِ دوست\nگر دهد دستم کشم در دیده همچون توتیا\nخاک راهی کـ‌آن مشرف گردد از اَقدامِ دوست\nمیل من سویِ وصال و قصد او سویِ فراق\nتَرکِ کامِ خود گرفتم تا برآید کامِ دوست\nحافظ اندر دَردِ او می‌سوز و بی‌درمان بساز\nزان که درمانی ندارد دَردِ بی‌آرامِ دوست"},{"id":63,"poem":"رویِ تو کس ندید و هزارت رقیب هست\nدر غنچه‌ای هنوز و صدت عندلیب هست\nگر آمدم به کوی تو چندان غریب نیست\nچون من در آن دیار هزاران غریب هست\nدر عشق، خانقاه و خرابات فرق نیست\nهر جا که هست پرتوِ رویِ حبیب هست\nآن جا که کارِ صومعه را جلوه می‌دهند\nناقوسِ دِیرِ راهب و نامِ صلیب هست\nعاشق که شد که یار به حالش نظر نکرد\nای خواجه درد نیست وگرنه طبیب هست\nفریادِ حافظ این همه آخِر به هرزه نیست\nهم قصه‌ای غریب و حدیثی عجیب هست"},{"id":64,"poem":"اگر چه عرض هنر پیشِ یار بی‌ادبی‌ست\nزبان خموش، ولیکن دهان پُر از عربی‌ست\nپری نهفته رخ و دیو در کرشمهٔ حُسن\nبسوخت دیده ز حیرت که این چه بوالعجبی‌ست\nدر این چمن گلِ بی خار کس نچید، آری\nچراغِ مصطفوی با شرارِ بولَهَبی‌ست\nسبب مپرس که چرخ از چه سِفله‌پرور شد\nکه کام‌بخشی او را بهانه بی‌سببی‌ست\nبه نیم جو نخرم طاقِ خانقاه و رِباط\nمرا که مَصطَبه ایوان و پای خُم طَنَبی‌ست\nجمالِ دختر رَز، نورِ چشمِ ماست مگر\nکه در نقابِ زُجاجی و پردهٔ عِنَبی‌ست\nهزار عقل و ادب داشتم من ای خواجه\nکنون که مستِ خرابم، صلاح بی‌ادبی‌ست\nبیار می که چو حافظ هزارم استظهار\nبه گریهٔ سحری و نیازِ نیم‌شبی‌ست"},{"id":65,"poem":"خوش‌تر ز عیش و صحبت و باغ و بهار چیست؟\nساقی کجاست؟ گو سببِ انتظار چیست؟\nهر وقتِ خوش که دست دهد، مغتنم شمار\nکس را وقوف نیست که انجامِ کار چیست\nپیوندِ عمر بسته به مویی‌ست، هوش دار\nغمخوارِ خویش باش، غمِ روزگار چیست؟\nمعنیِ آبِ زندگی و روضهٔ ارم\nجز طَرفِ جویبار و میِ خوشگوار چیست؟\nمستور و مست هر دو چو از یک قبیله‌اند\nما دل به عشوهٔ که دهیم؟ اختیار چیست؟\nراز درونِ پرده چه داند فلک؟ خموش\nای مدعی! نزاعِ تو با پرده‌دار چیست؟\nسهو و خطایِ بنده گَرَش اعتبار نیست\nمعنیِ عفو و رحمتِ آمُرزگار چیست؟\nزاهد شرابِ کوثر و حافظ پیاله خواست\nتا در میانه خواستهٔ کردگار چیست"},{"id":66,"poem":"بنال بلبل اگر با مَنَت سرِ یاری‌ست\nکه ما دو عاشق زاریم و کارِ ما زاری‌ست\nدر آن زمین که نسیمی وزد ز طُرِّهٔ دوست\nچه جایِ دم زدنِ نافه‌های تاتاری‌ست\nبیار باده که رنگین کنیم جامهٔ زرق\nکه مستِ جامِ غروریم و نام هشیاری‌ست\nخیالِ زلفِ تو پختن نه کارِ هر خامی‌ست\nکه زیرِ سلسله رفتن طریقِ عیّاری‌ست\nلطیفه‌ای‌ست نهانی که عشق از او خیزد\nکه نام آن نه لبِ لعل و خطِ زنگاری‌ست\nجمالِ شخص، نه چشم است و زلف و عارض و خال\nهزار نکته در این کار و بارِ دلداری‌ست\nقلندرانِ حقیقت به نیم جو نخرند\nقبایِ اطلس آن کس که از هنر عاری‌ست\nبر آستان تو مشکل توان رسید آری\nعروج بر فلکِ سروری به دشواری‌ست\nسحر کرشمهٔ چشمت به خواب می‌دیدم\nزهی مراتب خوابی که بِه ز بیداری‌ست\nدلش به ناله میازار و ختم کن حافظ\nکه رستگاریِ جاوید در کم آزاری‌ست"},{"id":67,"poem":"یا رب! این شمع دل‌افروز ز کاشانهٔ کیست؟\nجانِ ما سوخت، بپرسید که جانانهٔ کیست؟\nحالیا خانه‌براندازِ دل و دین من است\nتا در آغوشِ که می‌خسبد و هم‌خانهٔ کیست؟\nبادهٔ لعلِ لبش کز لبِ من دور مباد\nراحِ روحِ که و پیمان‌ده پیمانهٔ کیست؟\nدولتِ صحبتِ آن شمعِ سعادت‌پرتو\nباز پرسید خدا را که به پروانهٔ کیست؟\nمی‌دهد هر کَسَش افسونی و معلوم نشد\nکه دلِ نازکِ او مایلِ افسانهٔ کیست؟\nیا رب آن شاه‌وَشِ ماه‌رخِ زهره‌جبین\nدُرِّ یکتایِ که و گوهر یک‌دانهٔ کیست؟\nگفتم «آه از دلِ دیوانهٔ حافظ بی‌تو»\nزیرِ لب خنده‌زنان گفت که «دیوانهٔ کیست؟»"},{"id":68,"poem":"ماهم این هفته برون رفت و به چشمم سالی‌ست\nحالِ هجران تو چه دانی که چه مشکل حالی‌ست؟\nمردم دیده ز لطفِ رخِ او در رخِ او\nعکس خود دید، گمان برد که مشکین خالی‌ست\nمی‌چکد شیر هنوز از لبِ هم‌چون شکرش\nگر چه در شیوه‌گری هر مژه‌اش قَتّالی‌ست\nای که انگشت‌نمایی به کرم در همه شهر\nوه که در کارِ غریبان، عَجَبَت اِهمالی‌ست\nبعد از اینم نَبُوَد شائبه در جوهرِ فرد\nکه دهانِ تو در این نکته خوش استدلالی‌ست\nمژده دادند که بر ما گذری خواهی کرد\nنیّتِ خیر مگردان که مبارک فالی‌ست\nکوهِ اندوهِ فراقت به چه حالت بکِشد؟\nحافظِ خسته که از ناله تنش چون نالی‌ست"},{"id":69,"poem":"کس نیست که افتادهٔ آن زلفِ دوتا نیست\nدر رهگذرِ کیست که دامی ز بلا نیست\nچون چشمِ تو دل می‌برد از گوشه نشینان\nهمراهِ تو بودن گُنَه از جانب ما نیست\nروی تو مگر آینهٔ لطفِ الهیست\nحقا که چنین است و در این روی و ریا نیست\nنرگس طلبد شیوهٔ چشمِ تو، زهی چشم\nمسکین خبرش از سر و، در دیده حیا نیست\nاز بهرِ خدا زلف مَپیرای که ما را\nشب نیست که صد عربده با بادِ صبا نیست\nبازآی که بی روی تو ای شمعِ دل افروز\nدر بزمِ حریفان، اثرِ نور و صفا نیست\nتیمارِ غریبان اثرِ ذکرِ جمیل است\nجانا مگر این قاعده در شهرِ شما نیست؟\nدی می‌شد و گفتم صنما عهد به جای آر\nگفتا غلطی خواجه در این عهد وفا نیست\nگر پیر مغان مرشدِ من شد چه تفاوت\nدر هیچ سری نیست که سِرّی ز خدا نیست\nعاشق چه کُنَد گر نَکِشَد بارِ ملامت\nبا هیچ دلاور سپرِ تیرِ قضا نیست\nدر صومعهٔ زاهد و در خلوتِ صوفی\nجز گوشهٔ ابروی تو محرابِ دعا نیست\nای چنگ فروبرده به خونِ دلِ حافظ\nفکرت مگر از غیرتِ قرآن و خدا نیست"},{"id":70,"poem":"مردم دیدهٔ ما جز به رُخَت ناظر نیست\nدل سرگشتهٔ ما غیرِ تو را ذاکر نیست\nاشکم احرامِ طوافِ حَرَمَت می‌بندد\nگرچه از خونِ دلِ ریش دمی طاهر نیست\nبستهٔ دام و قفس باد چو مرغ وحشی\nطایر سِدره اگر در طلبت طایر نیست\nعاشقِ مفلس اگر قلبِ دلش کرد نثار\nمَکُنَش عیب که بر نقدِ روان قادر نیست\nعاقبت دست بدان سروِ بلندش برسد\nهر که را در طلبت همتِ او قاصر نیست\nاز روان بخشی عیسی نزنم دَم هرگز\nزان که در روح فَزایی چو لبت ماهر نیست\nمن که در آتشِ سودای تو آهی نزنم\nکِی توان گفت که بر داغ، دلم صابر نیست\nروز اول که سرِ زلفِ تو دیدم گفتم\nکه پریشانیِ این سلسله را آخر نیست\nسر پیوند تو تنها نه دلِ حافظ راست\nکیست آن کِش سَرِ پیوند تو در خاطر نیست"},{"id":71,"poem":"زاهِدِ ظاهِرپَرَست از حالِ ما، آگاه نیست\nدَر حَقِ ما، هَرچِه گوید، جایِ هیچ اِکْراه نیست\nدَر طَریقَت هَرچِه پیشِ سالک آید، خِیْرِ اوست\nدَر صِراطِ مُسْتَقیم، اِی دِل، کَسی گُمراه نیست\nتا چه بازی رُخ نُماید بِیْدَقی خواهیم رانْد\nعَرْصِه‌یِ شَطْرَنْجِ رِنْدان را مَجالِ شاه نیست\nچیست این سقفِ بلندِ سادهٔ بِسیارنقش؟\nزین مُعَمّا، هیچ دانا در جَهان، آگاه نیست\nاین چِه اِسْتِغْناست یا رَب؟ وین چه قادِرْ حِکْمَت است؟\nکاین‌همه زَخْمِ نَهان است و مَجالِ آه نیست\nصاحِبِ دیوانِ ما گویی نمی‌دانَد حِساب\nکاندر این طُغرا، نِشانِ حِسْبَةً لِلّٰه نیست\nهَر کِه خواهد گو: «بیا!» و هَرچِه خواهد گو: «بِگو!»\nکِبْر و ناز و حاجِب و دَرْبان، بدین دَرْگاه نیست\nبَر دَرِ مِیخانه رَفْتَن، کارِ یِکرَنْگان بُوَد\nخودفُروشان را به کویِ مِی‌فُروشان، راه نیست\nهرچه هست از قامَتِ ناسازِ بی‌اَنْدامِ ماست\nوَر نَه تَشْریفِ تو، بَر بالایِ کَس، کوتاه نیست\nبَنْدِه‌یِ پیرِ خَراباتَم که لُطْفَش، دائِم است\nوَر نَه لُطْفِ شِیْخ و زاهِد، گاه هَسْت و گاه نیست\n«حافِظ»، اَر بَر صَدْر نَنْشینَد، زِ عالی‌مَشْرَبی‌ست\nعاشِقِ دُرْدی‌کَش اَندَر بَنْدِ مال و جاه نیست"},{"id":72,"poem":"راهی‌ست راهِ عِشْق که هیچَش کِنارِه نیست\nآن‌جا جُز آن‌که جان بِسِپارَنْد، چارِه نیست\nهر گَه که دِل به عِشْق دِهی، خوش دَمی بُوَد\nدر کارِ خِیْر، حاجَتِ هیچ اِسْتِخاره نیست\nما را زِ مَنْعِ عَقْل مَتَرْسان و مِی بیار!\nکآن شِحْنِه در وِلایَتِ ما، هیچ کارِه نیست\nاَز چَشْمِ خود بِپُرس که ما را که می‌کُشَد؟\nجانا، گُناهِ طالِع و جُرْمِ سِتارِه نیست\nاو را به چَشْمِ پاک، تَوان دید چون هِلال\nهَر دیده، جایِ جِلْوِهٔ آن ماه‌پارِه نیست\nفُرْصَت شِمُر طَریقِهٔ رِنْدی که این نِشان\nچون راهِ گَنْج، بَر هَمِه‌کَس، آشْکارِه نیست\nنَگْرِفْت در تو، گِرْیِهٔ «حافِظ»، به هیچ رو\nحِیْرانِ آن دِلَم که کَم از سَنْگِ خارِه نیست"},{"id":73,"poem":"روشن از پرتوِ رویت نظری نیست که نیست\nمِنَّت خاکِ درت بر بصری نیست که نیست\nناظرِ روی تو صاحب نظرانند آری\nسِرِّ گیسوی تو در هیچ سَری نیست که نیست\nاشکِ غَمّازِ من ار سرخ برآمد چه عجب؟\nخجل از کردهٔ خود پرده دری نیست که نیست\nتا به دامن ننشیند ز نسیمش گَردی\nسیل خیز از نظرم ره‌گذری نیست که نیست\nتا دم از شامِ سرِ زلفِ تو هر جا نزنند\nبا صبا گفت و شنیدم سحری نیست که نیست\nمن از این طالع شوریده بِرَنجَم ور نی\nبهره‌مند از سَرِ کویت دگری نیست که نیست\nاز حیایِ لبِ شیرینِ تو ای چشمهٔ نوش\nغرق آب و عرق اکنون شکری نیست که نیست\nمصلحت نیست که از پرده برون افتد راز\nور نه در مجلسِ رندان خبری نیست که نیست\nشیر در بادیهٔ عشق تو روباه شود\nآه از این راه که در وی خطری نیست که نیست\nآب چشمم که بر او مِنَّت خاکِ درِ توست\nزیرِ صد مِنَّتِ او خاکِ دری نیست که نیست\nاز وجودم قَدَری نام و نشان هست که هست\nور نه از ضعف در آن جا اثری نیست که نیست\nغیر از این نکته که حافظ ز تو ناخشنود است\nدر سراپای وجودت هنری نیست که نیست"},{"id":74,"poem":"حاصلِ کارگه کون و مکان این همه نیست\nباده پیش آر که اسبابِ جهان این همه نیست\nاز دل و جان شرفِ صحبتِ جانان غرض است\nغرض این است، وگرنه دل و جان این همه نیست\nمِنَّتِ سِدره و طوبی ز پیِ سایه مکش\nکه چو خوش بنگری ای سروِ روان، این همه نیست\nدولت آن است که بی خونِ دل آید به کنار\nور نه با سعی و عمل باغِ جَنان این همه نیست\nپنج روزی که در این مرحله مهلت داری\nخوش بیاسای زمانی که زمان این همه نیست\nبر لبِ بحرِ فنا منتظریم ای ساقی\nفرصتی دان که ز لب تا به دهان این همه نیست\nزاهد ایمن مشو از بازیِ غیرت، زنهار\nکه ره از صومعه تا دیرِ مغان این همه نیست\nدردمندیّ‌ِ منِ سوختهٔ زار و نَزار\nظاهرا حاجتِ تقریر و بیان این همه نیست\nنام حافظ رقمِ نیک پذیرفت ولی\nپیش رندان رقمِ سود و زیان این همه نیست"},{"id":75,"poem":"خوابِ آن نرگسِ فَتّانِ تو، بی‌چیزی نیست\nتابِ آن زلفِ پریشانِ تو، بی‌چیزی نیست\nاز لبت شیر روان بود که من می‌گفتم\n«این شکر گِردِ نمکدانِ تو، بی‌چیزی نیست»\nجان درازیِ تو بادا که یقین می‌دانم\nدر کمان ناوَک مژگانِ تو، بی‌چیزی نیست\nمبتلایی به غمِ محنت و اندوهِ فراق\nای دل! این ناله و افغان تو، بی‌چیزی نیست\nدوش، باد از سرِ کویش به گلستان بگذشت\nای گل! این چاکِ گریبانِ تو، بی‌چیزی نیست\nدردِ عشق ار چه دل از خلق نهان می‌دارد\nحافظ این دیدهٔ گریانِ تو، بی‌چیزی نیست"},{"id":76,"poem":"جز آستان تواَم در جهان، پناهی نیست\nسر مرا به ‌جز این در، حواله‌گاهی نیست\nعَدو چو تیغ کِشد، من سپر بیندازم\nکه تیغِ ما، به ‌جز از ناله‌ای و آهی نیست\nچرا زِ کویِ خرابات روی برتابم؟\nکز این بِهَم به جهان، هیچ رسم و راهی نیست\nزمانه گَر بزند آتشم به خرمنِ عمر\nبگو بسوز که بر من به برگِ کاهی نیست\nغلامِ نرگسِ جَمّاشِ آن سَهی سروم\nکه از شراب غرورش به کس، نگاهی نیست\nمباش در پیِ آزار و هرچه خواهی کن\nکه در شریعتِ ما غیر از این، گناهی نیست\nعِنان‌کشیده رو ای پادشاهِ کشورِ حُسن\nکه نیست بر سر راهی که دادخواهی نیست!\nچنین که از همه‌سو، دامِ راه می‌بینم\nبه از حمایتِ زلفش، مرا پناهی نیست\nخزینهٔ دلِ «حافظ» به زلف و خال مده\nکه کارهای چنین، حدِّ هر سیاهی نیست"},{"id":77,"poem":"بلبلی، برگِ گُلی خوش‌رنگ در مِنقار داشت\nو اندر آن برگ و نَوا، خوش ناله‌هایِ زار داشت\nگفتمش: در عینِ وصل‌، این نالِه و فریاد چیست؟\nگفت ما را جلوه‌ی معشوق در این کار داشت\nیار اگر نَنشست با ما نیست جای اعتراض\nپادشاهی کامران بود، از گدایی عار داشت\nدرنمی‌گیرد نیاز و ناز ما با حُسن دوست\nخُرَّم آن کز نازنینان‌، بخت برخوردار داشت\nخیز تا بر کِلک آن نقاش‌، جان افشان کنیم\nکاین همه نقش عجب در گردش پرگار داشت\nگر مرید راه عشقی، فکر بدنامی مکن\nشِیخِ صَنعان، خِرقه رهن خانهٔ خَمّار داشت\nوقت آن شیرین‌قلندر خوش که در اَطوارِ سِیر\nذکر تسبیح ملک در حلقه‌ی زُنّار داشت\nچشم حافظ زیر بام قصر آن حوری‌سرشت\nشیوه‌ی جَنّاتُ تَجْری تَحْتِهَا الاَنهار داشت"},{"id":78,"poem":"دیدی که یار، جُز سَرِ جور و سِتَم نَداشت\nبِشْکَسْت عَهْد، وَز غَمِ ما، هیچ غَم نَداشت\nیا رَب مَگیرَش اَرْچِه دِلِ چون کَبوتَرَم\nاَفْکَنْد و کُشْت و عِزَّتِ صِیْدِ حَرَم نَداشت\nبَر مَن، جَفا زِ بَخْتِ مَن آمَد وَگَرنَه یار\nحاشا که رَسْمِ لُطْف و طَریقِ کَرَم نَداشت\nبا این هَمِه، هَر آن‌که نَه خواری کَشید اَز او\nهَر جا که رَفْت، هیچ کَسَش مُحْتَرَم نَداشت\nساقی بیار بادِه و با مُحْتَسِب بِگو\nاِنْکارِ ما مَکُن که چُنین جام، جَم نَداشت\nهَر راهرو که رَه به حَریمِ دَرَش نَبُرْد\nمِسْکین بُرید وادی و رَه دَر حَرَم نَداشت\n«حافظ»! بِبَر تو گویِ فِصاحَت که مُدَّعی\nهیچش هُنَر نَبود و خَبَر نیز هَم نَداشت"},{"id":79,"poem":"کنون که می‌دمد از بوستان، نسیمِ بهشت\nمن و شرابِ فرح‌بخش و یارِ حورسرشت\nگدا چرا نزند لافِ سلطنت امروز؟\nکه خیمه، سایهٔ ابر است و بزمگه، لبِ کِشت\nچمن حکایتِ اردیبهشت می‌گوید\nنه عاقل است که نسیه خرید و نقد بِهِشت\nبه می عمارتِ دل کن که این جهانِ خراب\nبر آن سر است که از خاکِ ما بسازد خشت\nوفا مجوی ز دشمن که پرتوی ندهد\nچو شمع صومعه افروزی از چراغِ کنشت\nمَکُن به نامه سیاهی ملامتِ منِ مست\nکه آگه است که تقدیر بر سرش چه نوشت\nقدم دریغ مدار از جنازهٔ حافظ\nکه گر چه غرقِ گناه است، می‌رود به بهشت"},{"id":80,"poem":"عِیبِ رِندان مَکُن ای زاهدِ پاکیزه‌سِرِشت!\nکه گناهِ دِگَران بَر تو نخواهند نوشت\nمن اگر نیکم و گر بَد، تو برو خود را باش!\nهر کسی آن دِرَوَد عاقبتِ کار، که کِشت\nهمه‌کس، طالبِ یارند؛ چه هُشیار و چه مست\nهمه‌جا، خانهٔ عشق است؛ چه مسجد چه کِنِشت\nسر تسلیمِ من و خشتِ درِ مِیکده‌ها\nمُدَّعی گر نکند فهمِ سخن، گو سر و خشت\nناامیدم مکن از سابقهٔ لطفِ اَزَل\nتو پسِ پرده چه دانی که که خوب است و که زشت؟\nنه من از پردهٔ تقوا به درافتادم و بس\nپِدرم نیز بهِشتِ ابد از دست، بِهِشت\nحافظا! روز اجل گر به کف آری جامی\nیک‌سر از کویِ خرابات بَرَنْدَت به بهشت"},{"id":81,"poem":"صبحدم مرغ چمن با گل نوخاسته گفت\nناز کم کن که در این باغ بسی چون تو شکفت\nگل بخندید که از راست نرنجیم ولی\nهیچ عاشق سخن سخت به معشوق نگفت\nگر طمع داری از آن جام مرصع میِ لعل\nای بسا دُر که به نوک مژه‌ات باید سفت\nتا ابد بوی محبت به مشامش نرسد\nهر که خاک در میخانه به رخسار نرُفت\nدر گلستان ارم دوش چو از لطف هوا\nزلف سنبل به نسیم سحری می‌آشفت،\nگفتم: «ای مسند جم! جام جهان‌بینت کو؟»\nگفت: «افسوس که آن دولت بیدار بخفت!»\nسخن عشق نه آن است که آید به زبان\nساقیا می ده و کوتاه کُن این گفت و شنفت\nاشک حافظ، خرد و صبر، به دریا انداخت\nچه کند؟ سوز غم عشق نیارست نهفت"},{"id":82,"poem":"آن تُرکِ پَری چِهره که دوش اَز بَرِ ما رَفت\nآیا چه خطا دید که اَز راهِ خطا رَفت؟\nتا رَفت مَرا اَز نَظَر آن چَشمِ جَهان‌بین\nکَس واقفِ ما نیست که اَز دیده چه‌ها رَفت\nبَر شَمع نرفت اَز گُذرِ آتشِ دل، دوش\nآن دود که اَز سوزِ جِگر بَر سَر ما رَفت\nدور اَز رُخِ تو دَم به دَم از گوشهٔ چَشمَم\nسیلابِ سِرشک آمَد و طوفانِ بَلا رَفت\nاز پای فُتادیم چو آمَد غَمِ هجران\nدَر دَرد بِمُردیم چو اَز دَست دَوا رَفت\nدل گفت وِصالَش به دُعا باز تَوان یافت\nعُمریست که عُمرَم همه دَر کارِ دُعا رَفت\nاِحرام چه بَندیم؟ چو آن قبله نه این جاست\nدَر سَعی چه کوشیم؟ چو از مَروه صَفا رَفت\nدی گفت طبیب اَز سَرِ حَسرت چو مَرا دید\nهِیهات که رَنجِ تو زِ قانونِ شَفا رَفت\nای دوست به پُرسیدنِ حافظ قَدَمی نِه\nزان پیش که گویند که اَز دارِ فَنا رَفت"},{"id":83,"poem":"گر ز دستِ زلفِ مُشکینت خطایی رفت رفت\nور ز هندویِ شما بر ما جفایی رفت رفت\nبرقِ عشق ار خرمنِ پشمینه پوشی سوخت سوخت\nجورِ شاه کامران گر بر گدایی رفت رفت\nدر طریقت رنجشِ خاطر نباشد می بیار\nهر کدورت را که بینی چون صفایی رفت رفت\nعشقبازی را تحمل باید ای دل، پای دار\nگر ملالی بود بود و گر خطایی رفت رفت\nگر دلی از غمزهٔ دلدار باری برد برد\nور میان جان و جانان ماجرایی رفت رفت\nاز سخن چینان ملالت‌ها پدید آمد ولی\nگر میانِ همنشینان ناسزایی رفت رفت\nعیبِ حافظ گو مکن واعظ که رفت از خانقاه\nپای آزادی چه بندی؟ گر به جایی رفت رفت"},{"id":84,"poem":"ساقی بیار باده که ماهِ صیام رفت\nدَردِه قدح که موسمِ ناموس و نام رفت\nوقتِ عزیز رفت بیا تا قضا کنیم\nعمری که بی حضور صُراحی و جام رفت\nمستم کن آن چنان که ندانم ز بی‌خودی\nدر عرصهٔ خیال که آمد، کدام رفت\nبر بوی آن که جرعهٔ جامت به ما رسد\nدر مَصطَبِه دعایِ تو هر صبح و شام رفت\nدل را که مرده بود حیاتی به جان رسید\nتا بویی از نسیمِ می‌اش در مشام رفت\nزاهد غرور داشت، سلامت نبرد راه\nرند از رهِ نیاز به دارالسلام رفت\nنقدِ دلی که بود مرا صرف باده شد\nقلبِ سیاه بود از آن در حرام رفت\nدر تابِ توبه چند توان سوخت همچو عود؟\nمی ده که عمر در سرِ سودای خام رفت\nدیگر مکن نصیحتِ حافظ که ره نیافت\nگمگشته‌ای که بادهٔ نابش به کام رفت"},{"id":85,"poem":"شربتی از لبِ لعلش نچشیدیم و بِرَفت\nرویِ مَه پیکرِ او سیر ندیدیم و برفت\nگویی از صحبتِ ما نیک به تنگ آمده بود\nبار بربست و به گَردش نرسیدیم و برفت\nبس که ما فاتحه و حرزِ یمانی خواندیم\nوز پی‌اش سوره اخلاص دمیدیم و برفت\nعشوه دادند که بر ما گذری خواهی کرد\nدیدی آخر که چنین عشوه خریدیم و برفت\nشد چمان در چمنِ حسن و لطافت لیکن\nدر گلستانِ وصالش نَچَمیدیم و برفت\nهمچو حافظ همه شب ناله و زاری کردیم\nکای دریغا به وداعش نرسیدیم و برفت"},{"id":86,"poem":"ساقی بیا که یار ز رخ پرده برگرفت\nکارِ چراغ خلوتیان باز درگرفت\nآن شمعِ سرگرفته دگر چهره برفروخت\nوین پیرِ سال‌خورده جوانی ز سر گرفت\nآن عشوه داد عشق که مفتی ز ره برفت\nوان لطف کرد دوست که دشمن حذر گرفت\nزنهار از آن عبارتِ شیرینِ دل‌فریب\nگویی که پستهٔ تو سخن در شکر گرفت\nبارِ غمی که خاطرِ ما خسته کرده بود\nعیسی‌دمی خدا بفرستاد و برگرفت\nهر سروقد که بر مَه و خور حسن می‌فروخت\nچون تو درآمدی پیِ کاری دگر گرفت\nزین قصه هفت گنبدِ افلاک پرصداست\nکوته‌نظر ببین که سخن مختصر گرفت\nحافظ تو این سخن ز که آموختی؟ که بخت\nتعویذ کرد شعرِ تو را و به زر گرفت"},{"id":87,"poem":"حُسنت به اتفاقِ ملاحت جهان گرفت\nآری، به اتفاق، جهان می‌توان گرفت\nافشایِ رازِ خلوتیان خواست کرد شمع\nشُکرِ خدا، که سِرِ دلش در زبان گرفت\nزین آتشِ نهفته که در سینهٔ من است\nخورشید، شعله‌ای‌ست که در آسمان گرفت\nمی‌خواست گُل که دَم زند از رنگ و بویِ دوست\nاز غیرتِ صبا، نفسَش در دهان گرفت\nآسوده بر کنار چُو پرگار می‌شدم\nدوران، چو نقطه، عاقبتم در میان گرفت\nآن روز شوقِ ساغرِ مِی، خرمنم بسوخت\nکآتش زِ عکسِ عارضِ ساقی در آن گرفت\nخواهم شدن به کویِ مُغان آستین‌فشان\nزین فتنه‌ها که دامنِ آخرزمان گرفت\nمِی خور که هر که آخرِ کارِ جهان بِدید\nاز غم سبک برآمد و رَطلِ گران گرفت\nبر برگِ گُل به خونِ شقایق نوشته‌اند\n«کآن کس که پخته شد، مِیِ چون اَرغَوان گرفت»\nحافظ چو آبِ لطف ز نظمِ تو می‌چِکد\nحاسِد چگونه نکته تواند بر آن گرفت؟"},{"id":88,"poem":"شنیده‌ام سخنی خوش که پیرِ کنعان گفت\n«فِراق یار، نه آن می‌کند که بتوان گفت»\nحدیثِ هولِ قیامت که گفت واعظِ شهر\nکنایتی‌ست که از روزگارِ هجران گفت\nنشانِ یارِ سفرکرده از کِه پُرسم باز؟\nکه هر چه گفت بَریدِ صبا، پریشان گفت\nفغان که آن مهِ نامهربانِ مِهرگُسِل\nبه تَرکِ صحبتِ یاران خود چه آسان گفت\nمن و مقامِ رضا بعد از این و شُکرِ رقیب\nکه دل به دردِ تو خو کرد و ترکِ درمان گفت\nغمِ کهن به میِ سال‌خورده دفع کنید\nکه تخم خوش‌دلی این است؛ پیرِ دهقان گفت\nگره به باد مزن گر چه بر مراد رود\nکه این سخن به مَثَل، باد با سلیمان گفت\nبه مهلتی که سپهرت دهد ز راه مرو\nتو را که گفت که این زال تَرک دَستان گفت؟\nمزن ز چون و چرا دم که بندهٔ مُقبِل\nقبول کرد به جان، هر سخن که جانان گفت\nکه گفت حافظ از اندیشهٔ تو آمد باز؟\nمن این نگفته‌ام آن کس که گفت بُهتان گفت"},{"id":89,"poem":"یا رب سببی ساز که یارم به سلامت\nبازآید و بِرهانَدَم از بندِ مَلامت\nخاکِ رهِ آن یارِ سفرکرده بیارید\nتا چشمِ جهان بین کُنَمَش جایِ اقامت\nفریاد که از شش جهتم راه بِبَستند\nآن خال و خط و زلف و رخ و عارض و قامت\nامروز که در دستِ توام مرحمتی کن\nفردا که شَوَم خاک چه سود اشکِ ندامت\nای آن که به تقریر و بیان دم زنی از عشق\nما با تو نداریم سخن، خیر و سلامت\nدرویش مکن ناله ز شمشیرِ اَحِبّا\nکاین طایفه از کشته ستانند غرامت\nدر خرقه زن آتش که خمِ ابرویِ ساقی\nبر می‌شکند گوشهٔ محراب امامت\nحاشا که من از جور و جفای تو بنالم\nبیدادِ لطیفان همه لطف است و کرامت\nکوته نکند بحث سرِ زلف تو حافظ\nپیوسته شد این سلسله تا روزِ قیامت"},{"id":90,"poem":"ای هدهد صبا به سبا می‌فرستمت\nبنگر که از کجا به کجا می‌فرستمت\nحیف است طایری چو تو در خاک‌دانِ غم\nزین جا به آشیانِ وفا می‌فرستمت\nدر راهِ عشق مرحلهٔ قُرب و بُعد نیست\nمی‌بینمت عیان و دعا می‌فرستمت\nهر صبح و شام قافله‌ای از دعای خیر\nدر صحبتِ شمال و صبا می‌فرستمت\nتا لشکرِ غمت نکند مُلکِ دل خراب\nجانِ عزیزِ خود به نوا می‌فرستمت\nای غایب از نظر که شدی هم‌نشین دل\nمی‌گویمت دعا و ثنا می‌فرستمت\nدر رویِ خود تَفَرُّجِ صُنع خدای کن\nکآیینهٔ خدای‌نما می‌فرستمت\nتا مطربان ز شوقِ مَنَت آگهی دهند\nقول و غزل به ساز و نوا می‌فرستمت\nساقی بیا که هاتفِ غیبم به مژده گفت\nبا درد صبر کن که دوا می‌فرستمت\nحافظ، سرودِ مجلس ما ذکرِ خیرِ توست\nبشتاب هان که اسب و قبا می‌فرستمت"},{"id":91,"poem":"ای غایب از نظر به خدا می‌سپارمت\nجانم بسوختی و به دل دوست دارمت\nتا دامنِ کفن نکشم زیرِ پایِ خاک\nباور مکن که دست ز دامن بدارمت\nمحرابِ ابرویت بنما تا سحرگهی\nدستِ دعا برآرم و در گردن آرمت\nگر بایدم شدن سویِ هاروتِ بابلی\nصد گونه جادویی بکنم تا بیارمت\nخواهم که پیش میرمت ای بی‌وفا طبیب\nبیمار باز پرس که در انتظارمت\nصد جوی آب بسته‌ام از دیده بر کنار\nبر بویِ تخمِ مِهر که در دل بکارمت\nخونم بریخت وز غمِ عشقم خلاص داد\nمِنّت پذیرِ غمزهٔ خنجر گذارمت\nمی‌گریم و مرادم از این سیلِ اشک‌بار\nتخمِ محبّت است که در دل بکارمت\nبارم ده از کرم سویِ خود تا به سوزِ دل\nدر پای دم‌به‌دم گهر از دیده بارمت\nحافظ شراب و شاهد و رندی نه وضعِ توست\nفِی‌الجمله می‌کنی و فرو می‌گذارمت"},{"id":92,"poem":"میرِ من خوش می‌روی کاندر سر و پا میرمت\nخوش خرامان شو که پیشِ قدِ رعنا میرمت\nگفته بودی کی بمیری پیشِ من، تعجیل چیست؟\nخوش تقاضا می‌کنی پیشِ تقاضا میرمت\nعاشق و مخمور و مهجورم بتِ ساقی کجاست؟\nگو که بِخرامَد که پیشِ سرو بالا میرمت\nآن که عمری شد که تا بیمارم از سودایِ او\nگو نگاهی کن که پیشِ چشمِ شهلا میرمت\nگفته‌ای لعلِ لبم هم درد بخشد هم دوا\nگاه پیش درد و گَه پیش مداوا میرمت\nخوش خِرامان می‌روی چشمِ بد از رویِ تو دور\nدارم اندر سر خیالِ آن که در پا میرمت\nگرچه جایِ حافظ اندر خلوتِ وصلِ تو نیست\nای همه جایِ تو خوَش، پیشِ همه جا میرمت"},{"id":93,"poem":"چه لطف بود که ناگاه رَشحِهٔ قَلَمَت\nحقوقِ خدمتِ ما عرضه کرد بر کرمت\nبه نوکِ خامه رقم کرده‌ای سلامِ مرا\nکه کارخانهٔ دوران مباد بی رَقَمَت\nنگویم از منِ بی‌دل به سهو کردی یاد\nکه در حسابِ خرد نیست سهو بر قَلَمَت\nمرا ذلیل مگردان به شکرِ این نعمت\nکه داشت دولتِ سرمد عزیز و محترمت\nبیا که با سرِ زلفت قرار خواهم کرد\nکه گر سَرَم برود برندارم از قدمت\nز حالِ ما دلت آگه شود مگر وقتی\nکه لاله بردمد از خاکِ کشتگانِ غمت\nروانِ تشنهٔ ما را به جرعه‌ای دریاب\nچو می‌دهند زُلالِ خِضِر ز جامِ جَمَت\nهمیشه وقتِ تو ای عیسیِ صبا خوش باد\nکه جانِ حافظِ دلخسته زنده شد به دَمَت"},{"id":94,"poem":"زآن یارِ دل‌نوازم، شُکری است با شکایت\nگر نکته‌دانِ عشقی، بشنو تو این حکایت\nبی‌مزد بود و مِنَّت، هر خدمتی که کردم\nیا رب! مباد کس را، مخدومِ بی‌عنایت\nرندانِ تشنه‌لب را، آبی نمی‌دهد کس\nگویی ولی‌شناسان، رفتند از این ولایت\nدر زلفِ چون کمندش، ای دل! مپیچ کآن جا\nسرها بریده بینی، بی‌جرم و بی‌جنایت\nچشمت به غمزه ما را، خون خورد و می‌پسندی\nجانا! روا نباشد، خون‌ریز را حمایت\nدر این شبِ سیاهم، گم گشت راهِ مقصود\nاز گوشه‌ای برون آی، ای کوکبِ هدایت\nاز هر طرف که رفتم، جز وحشتم نَیَفزود\nزِنهار از این بیابان، وین راهِ بی‌نهایت\nای آفتابِ خوبان! می‌جوشد اندرونم\nیک ساعتم بِگُنجان، در سایهٔ عنایت\nاین راه را نهایت، صورت کجا توان بست؟\nکِش صد هزار منزل، بیش است در بِدایت\nهر چند بردی آبم روی از درت نتابم\nجور از حبیب خوش‌تر، کز مُدَّعی رعایت\nعشقت رِسَد به فریاد، ار خود به سانِ حافظ\nقرآن ز بَر بخوانی، در چاردَه روایت"},{"id":95,"poem":"مدامم مست می‌دارد، نسیمِ جَعدِ گیسویت\nخرابم می‌کند هر دَم، فریبِ چشمِ جادویت\nپس از چندین شکیبایی، شبی، یا رب! توان دیدن\nکه شمعِ دیده افروزیم در محرابِ ابرویت؟\nسوادِ لوح بینش را عزیز از بهر آن دارم\nکه جان را نسخه‌ای باشد ز لوحِ خالِ هندویت\nتو گر خواهی که جاویدان جهان یکسر بیارایی\nصبا را گو که بردارد زمانی بُرقِع از رویت\nو گر رسمِ فنا خواهی که از عالم براندازی\nبرافشان تا فروریزد هزاران جان ز هر مویت\nمن و بادِ صبا مِسکین، دو سرگردانِ بی‌حاصل\nمن از افسونِ چشمت مست و او از بویِ گیسویت\nزهی همت که حافظ راست از دنیی و از عقبی\nنیاید هیچ در چشمش به جز خاکِ سرِ کویت"},{"id":96,"poem":"دردِ ما را نیست درمان الغیاث\nهجرِ ما را نیست پایان الغیاث\nدین و دل بردند و قَصدِ جان کنند\nالغیاث از جورِ خوبان، الغیاث\nدر بهایِ بوسه‌ای جانی طلب\nمی‌کنند این دلسِتانان الغیاث\nخونِ ما خوردند این کافَردلان\nای مسلمانان چه درمان؟ الغیاث\nهم‌چو حافظ روز و شب بی‌خویشتن\nگَشته‌ام سوزان و گریان الغیاث"},{"id":97,"poem":"تویی که بر سرِ خوبانِ کشوری چون تاج\nسِزَد اگر همهٔ دلبران دَهَندَت باج\nدو چشمِ شوخِ تو برهم زده خَطا و حَبَش\nبه چینِ زلفِ تو ماچین و هند داده خراج\nبیاضِ رویِ تو روشن چو عارِضِ رُخِ روز\nسوادِ زلفِ سیاهِ تو هست ظلمت داج\nدهانِ شهدِ تو داده رواج آب خِضِر\nلبِ چو قندِ تو بُرد از نباتِ مصر رواج\nاز این مرض به حقیقت شفا نخواهم یافت\nکه از تو دردِ دل ای جان! نمی‌رسد به عِلاج\nچرا همی شکنی جانِ من ز سنگ‌دلی؟\nدلِ ضعیف که باشد، به نازکی چو زُجاج\nلبِ تو خضر و دهانِ تو آبِ حیوان است\nقدِ تو سرو و میان‌موی و بَر، به هیئت عاج\nفِتاد در دلِ حافظ هوایِ چون تو شَهی\nکمینه ذرهٔ خاکِ درِ تو بودی کاج"},{"id":98,"poem":"اگر به مذهبِ تو خونِ عاشق است مُباح\nصلاحِ ما همه آن است کآن تو راست صلاح\nسوادِ زلفِ سیاهِ تو جاعِلُ الظُّلُمات\nبَیاضِ رویِ چو ماهِ تو، فالِقُ الأصباح\nز چینِ زلفِ کمندت کسی نیافت خلاص\nاز آن کمانچهٔ ابرو و تیرِ چشم، نَجاح\nز دیده‌ام شده یک چشمه در کنار روان\nکه آشنا نکند در میان آن، مَلّاح\nلبِ چو آبِ حیاتِ تو هست قُوَّتِ جان\nوجودِ خاکیِ ما را از اوست ذکرِ رَواح\nبداد لعلِ لبت بوسه‌ای به صد زاری\nگرفت کام دلم زو به صد هزار اِلحاح\nدعای جانِ تو وردِ زبان مشتاقان\nهمیشه تا که بُوَد متّصل مَسا و صَباح\nصَلاح و توبه و تقوی ز ما مجو حافظ\nز رند و عاشق و مجنون کسی نیافت صلاح"},{"id":99,"poem":"دلِ من در هوایِ روی فرخ\nبُوَد آشفته همچون مویِ فرخ\nبه جز هندویِ زلفش هیچ کس نیست\nکه برخوردار شد از روی فرخ\nسیاهی نیکبخت است آن که دائم\nبُوَد هم‌راز و هم‌زانوی فرخ\nشود چون بید لرزان سروِ آزاد\nاگر بیند قدِ دلجویِ فَرُّخ\nبده ساقی شرابِ ارغوانی\nبه یادِ نرگسِ جادوی فَرُّخ\nدو تا شد قامتم همچون کمانی\nز غم پیوسته چون ابروی فرخ\nنسیم مُشک تاتاری خجل کرد\nشمیم زلف عَنبربوی فرخ\nاگر میلِ دلِ هر کس به جایی‌ست\nبُوَد میلِ دلِ من سوی فرخ\nغلامِ همتِ آنم که باشد\nچو حافظ بنده و هندوی فرخ"},{"id":100,"poem":"دی پیر می‌فروش که ذکرش به خیر باد\nگفتا شراب نوش و غمِ دل بِبَر ز یاد\nگفتم به باد می‌دهدم باده نام و ننگ\nگفتا قبول کن سخن و هر چه باد، باد\nسود و زیان و مایه چو خواهد شدن ز دست\nاز بهر این معامله غمگین مباش و شاد\nبادت به دست باشد اگر دل نهی به هیچ\nدر معرضی که تخت سلیمان رَوَد به باد\nحافظ گرت ز پندِ حکیمان مَلالت است\nکوته کنیم قصه، که عمرت دراز باد"},{"id":101,"poem":"شراب و عیش نهان چیست؟ کارِ بی‌بنیاد\nزدیم بر صفِ رندان و هر چه بادا باد\nگره ز دل بگشا وز سپهر یاد مکن\nکه فکر هیچ مهندس چنین گره نگشاد\nز انقلابِ زمانه عجب مدار که چرخ\nاز این فسانه هزاران هزار دارد یاد\nقدح به شرطِ ادب گیر زان که ترکیبش\nز کاسهٔ سرِ جمشید و بهمن است و قباد\nکه آگه است که کاووس و کی کجا رفتند؟\nکه واقف است که چون رفت تخت جم، بر باد؟\nز حسرتِ لبِ شیرین هنوز می‌بینم\nکه لاله می‌دمد از خونِ دیدهٔ فرهاد\nمگر که لاله بدانست بی‌وفاییِ دهر\nکه تا بزاد و بِشُد، جامِ می ز کف نَنَهاد\nبیا بیا که زمانی ز می خراب شویم\nمگر رسیم به گنجی در این خراب آباد\nنمی‌دهند اجازت مرا به سِیرِ سفر\nنسیمِ بادِ مُصَلّا و آبِ رُکن آباد\nقدح مگیر چو حافظ مگر به نالهٔ چنگ\nکه بسته‌اند بر ابریشمِ طرب دلِ شاد"},{"id":102,"poem":"دوش آگهی ز یارِ سفر کرده داد باد\nمن نیز دل به باد دهم، هر چه باد باد\nکارم بدان رسید که همرازِ خود کنم\nهر شام برق لامِع و هر بامداد باد\nدر چینِ طرهٔ تو دل بی حِفاظِ من\nهرگز نگفت مسکنِ مألوف یاد باد\nامروز قدرِ پندِ عزیزان شناختم\nیا رب روانِ ناصحِ ما از تو شاد باد\nخون شد دلم به یادِ تو هر گَه که در چمن\nبندِ قبایِ غنچهٔ گل می‌گشاد باد\nاز دست رفته بود وجودِ ضعیفِ من\nصبحم به بویِ وصلِ تو جان باز داد، باد\nحافظ نهادِ نیکِ تو کامت بر آورد\nجان‌ها فدایِ مردمِ نیکو نهاد باد"},{"id":103,"poem":"روز وصلِ دوستداران یاد باد\nیاد باد آن روزگاران، یاد باد\nکامم از تلخیِ غم چون زهر گشت\nبانگِ نوشِ شادخواران یاد باد\nگر چه یاران فارِغَند از یادِ من\nاز من ایشان را هزاران یاد باد\nمبتلا گشتم در این بند و بلا\nکوشش آن حق‌گزاران یاد باد\nگر چه صد رود است در چشمم مُدام\nزنده رودِ باغ‌ِ کاران یاد باد\nرازِ حافظ بعد از این ناگفته ماند\nای دریغا رازداران یاد باد"},{"id":104,"poem":"جمالت آفتابِ هر نظر باد\nز خوبی رویِ خوبت خوب‌تر باد\nهُمای زلفِ شاهین شهپرت را\nدلِ شاهانِ عالم زیرِ پَر باد\nکسی کو بستهٔ زلفت نباشد\nچو زلفت درهم و زیر و زبر باد\nدلی کو عاشقِ رویت نباشد\nهمیشه غرقه در خونِ جگر باد\nبُتا چون غَمزه‌ات ناوَک فشاند\nدلِ مجروحِ من پیشش سپر باد\nچو لعل شکَّرینَت بوسه بخشد\nمذاقِ جانِ من زو پُرشِکر باد\nمرا از توست هر دم تازه عشقی\nتو را هر ساعتی حُسنی دگر باد\nبه جان، مشتاق روی توست حافظ\nتو را در حالِ مشتاقان نظر باد"},{"id":105,"poem":"صوفی ار باده به اندازه خورَد نوشش باد\nور نه اندیشهٔ این کار فراموشش باد\nآن که یک جرعه مِی از دست توانَد دادن\nدست با شاهدِ مقصود در آغوشش باد\nپیرِ ما گفت خطا بر قلم صُنع نرفت\nآفرین بر نظرِ پاکِ خطاپوشَش باد\nشاهِ تُرکان، سخنِ مدعیان می‌شِنَوَد\nشرمی از مَظلَمِهٔ خونِ سیاوشش باد\nگر چه از کِبر، سخن با منِ درویش نگفت\nجان فدایِ شِکَرین‌پستهٔ خاموشش باد\nچشمم از آینه‌دارانِ خط و خالش گشت\nلبم از بوسه‌رُبایانِ بَر و دوشش باد\nنرگسِ مست نوازش‌کُنِ مردم‌دارَش\nخونِ عاشق به قدح گر بِخورد نوشش باد\nبه غلامیِ تو مشهورِ جهان شد حافظ\nحلقهٔ بندگیِ زلفِ تو در گوشش باد"},{"id":106,"poem":"تَنَت به نازِ طبیبان نیازمند مباد\nوجود نازکت آزردهٔ گزند مباد\nسلامتِ همه آفاق در سلامتِ توست\nبه هیچ عارضه شخصِ تو دردمند مباد\nجمالِ صورت و معنی ز امنِ صحتِ توست\nکه ظاهرت دُژَم و باطنت نَژَند مباد\nدر این چمن چو درآید خزان به یغمایی\nرهش به سروِ سهی قامتِ بلند مباد\nدر آن بساط که حُسن تو جلوه آغازد\nمجالِ طعنهٔ بدبین و بدپسند مباد\nهر آن که رویِ چو ماهت به چشمِ بد بیند\nبر آتشِ تو بجز جانِ او سپند مباد\nشفا ز گفتهٔ شِکَّرفِشانِ حافظ جوی\nکه حاجتت به عِلاجِ گلاب و قند مباد"},{"id":107,"poem":"حُسن تو همیشه در فزون باد\nرویت همه ساله لاله‌گون باد\nاندر سرِ ما خیالِ عشقت\nهر روز که باد در فزون باد\nهر سرو که در چمن درآید\nدر خدمتِ قامتت نگون باد\nچشمی که نه فتنهٔ تو باشد\nچون گوهرِ اشک غرقِ خون باد\nچشمِ تو ز بهرِ دلربایی\nدر کردنِ سحر ذوفنون باد\nهر جا که دلیست در غمِ تو\nبی صبر و قرار و بی سکون باد\nقَدِّ همه دلبرانِ عالم\nپیشِ الفِ قَدَت چو نون باد\nهر دل که ز عشقِ توست خالی\nاز حلقهٔ وصلِ تو برون باد\nلعلِ تو که هست جانِ حافظ\nدور از لبِ مردمانِ دون باد"},{"id":108,"poem":"خسروا گویِ فلک در خَمِ چوگان تو باد\nساحتِ کون و مکان عرصهٔ میدانِ تو باد\nزلفِ خاتونِ ظفر شیفتهٔ پرچم توست\nدیدهٔ فتحِ ابد عاشقِ جولانِ تو باد\nای که انشاءِ عطارد صفتِ شوکتِ توست\nعقل کل چاکرِ طُغراکشِ دیوانِ تو باد\nطِیرهٔ جلوهٔ طوبی قدِ چون سروِ تو شد\nغیرتِ خُلدِ بَرین ساحتِ بُستانِ تو باد\nنه به تنها حَیَوانات و نَباتات و جَماد\nهر چه در عالمِ امر است به فرمانِ تو باد"},{"id":109,"poem":"دیر است که دل‌دار پیامی نفرستاد\nننوشت سلامی و کلامی نفرستاد\nصد نامه فرستادم و آن شاهِ سواران\nپیکی نَدوانید و سلامی نفرستاد\nسویِ منِ وحشی‌صفتِ عقل‌رمیده\nآهو رَوشی، کبک خرامی نفرستاد\nدانست که خواهد شُدنم مرغِ دل از دست\nوز آن خطِ چون سلسله دامی نفرستاد\nفریاد که آن ساقیِ شِکَّر لبِ سرمست\nدانست که مخمورم و جامی نفرستاد\nچندان که زدم لافِ کرامات و مقامات\nهیچم خبر از هیچ مقامی نفرستاد\nحافظ به ادب باش که واخواست نباشد\nگر شاه پیامی به غلامی نفرستاد"},{"id":110,"poem":"پیرانه سَرم عشقِ جوانی به سر افتاد\nوآن راز که در دل بِنَهفتم به درافتاد\nاز راهِ نظر مرغِ دلم گشت هواگیر\nای دیده نگه کن که به دامِ که درافتاد\nدردا که از آن آهوی مشکینِ سیه چشم\nچون نافه بسی خونِ دلم در جگر افتاد\nاز رهگذرِ خاکِ سرِ کویِ شما بود\nهر نافه که در دستِ نسیمِ سحر افتاد\nمژگانِ تو تا تیغِ جهانگیر برآورد\nبس کشتهٔ دل زنده که بر یکدگر افتاد\nبس تجربه کردیم در این دِیرِ مکافات\nبا دُردکشان هر که درافتاد برافتاد\nگر جان بدهد سنگِ سیه، لعل نگردد\nبا طینتِ اصلی چه کُند، بدگهر افتاد\nحافظ که سرِ زلفِ بتان دست‌کشش بود\nبس طُرفه حریفی‌ست کَش اکنون به سر افتاد"},{"id":111,"poem":"عکسِ رویِ تو چو در آینهٔ جام افتاد\nعارف از خندهٔ مِی در طمعِ خام افتاد\nحُسن رویِ تو به یک جلوه که در آینه کرد\nاین همه نقش در آیینهٔ اوهام افتاد\nاین همه عکسِ می و نقشِ نگارین که نمود\nیک فروغِ رخِ ساقی‌ست که در جام افتاد\nغیرتِ عشق زبانِ همه خاصان بِبُرید\nکز کجا سِرِّ غمش در دهنِ عام افتاد؟\nمن ز مسجد به خرابات نه خود افتادم\nاینم از عهدِ ازل حاصلِ فرجام افتاد\nچه کند کز پی دوران نرود چون پرگار؟\nهر که در دایرهٔ گردشِ ایام افتاد\nدر خَمِ زلفِ تو آویخت دل از چاهِ زَنَخ\nآه، کز چاه برون آمد و در دام افتاد\nآن شد ای خواجه که در صومعه بازم بینی\nکار ما با رخِ ساقیّ و لبِ جام افتاد\nزیرِ شمشیرِ غمش رقص‌کُنان باید رفت\nکـ‌آن که شد کشتهٔ او نیک سرانجام افتاد\nهر دَمَش با منِ دل‌سوخته لطفی دگر است\nاین گدا بین که چه شایستهٔ انعام افتاد\nصوفیان جمله حریفند و نظرباز ولی\nزین میان حافظِ دل‌سوخته بدنام افتاد"},{"id":112,"poem":"آن که رخسارِ تو را رنگِ گل و نسرین داد\nصبر و آرام توانَد به منِ مسکین داد\nوان که گیسویِ تو را رسمِ تَطاول آموخت\nهم تواند کَرَمَش دادِ منِ غمگین داد\nمن همان روز ز فرهاد طمع بُبریدم\nکه عنانِ دلِ شیدا به لبِ شیرین داد\nگنجِ زر گر نَبُوَد، کُنجِ قناعت باقیست\nآن که آن داد به شاهان، به گدایان این داد\nخوش عروسیست جهان از رهِ صورت لیکن\nهر که پیوست بدو، عمرِ خودش کاوین داد\nبعد از این دستِ من و دامنِ سرو و لبِ جوی\nخاصه اکنون که صبا مژده فروردین داد\nدر کفِ غصه دوران، دلِ حافظ خون شد\nاز فراقِ رُخَت ای خواجه قوامُ الدین، داد"},{"id":113,"poem":"بنفشه دوش به گل گفت و خوش نشانی داد\nکه تابِ من به جهان، طُرِّهٔ فلانی داد\nدلم خزانهٔ اسرار بود و دستِ قضا\nدرش بِبَست و کلیدش به دل‌سِتانی داد\nشکسته‌وار به درگاهت آمدم، که طبیب\nبه مومیاییِ لطفِ توام، نشانی داد\nتنش درست و دلش شاد باد و خاطر خوش\nکه دست دادش و یاریِ ناتوانی داد\nبرو معالجهٔ خود کن ای نصیحت‌گو\nشراب و شاهدِ شیرین، که را زیانی داد؟\nگذشت بر منِ مسکین و با رقیبان گفت\nدریغ، حافظِ مسکینِ من، چه جانی داد"},{"id":114,"poem":"همایِ اوجِ سعادت به دامِ ما افتد\nاگر تو را گذری بر مقام ما افتد\nحباب‌وار براندازم از نشاط کلاه\nاگر ز رویِ تو عکسی به جامِ ما افتد\nشبی که ماهِ مراد از افق شود طالع\nبُوَد که پرتوِ نوری به بامِ ما افتد\nبه بارگاهِ تو چون باد را نباشد بار\nکی اتفاقِ مجالِ سلامِ ما افتد؟\nچو جان فدای لبش شد خیال می‌بستم\nکه قطره‌ای ز زلالش به کامِ ما افتد\nخیالِ زلفِ تو گفتا که جان وسیله مساز\nکز این شکار، فراوان به دامِ ما افتد\nبه ناامیدی از این در مرو، بزن فالی\nبُوَد که قرعهٔ دولت به نامِ ما افتد\nز خاکِ کوی تو هر گَه که دَم زند حافظ\nنسیمِ گلشن جان در مشامِ ما افتد"},{"id":115,"poem":"درختِ دوستی بنشان که کامِ دل به بار آرد\nنهالِ دشمنی بَرکَن که رنج بی‌شمار آرد\nچو مهمانِ خراباتی به عزت باش با رندان\nکه دردِ سر کشی جانا! گرت مستی خمار آرد\nشبِ صحبت غنیمت دان که بعد از روزگارِ ما\nبسی گردش کُنَد گردون، بسی لیل و نهار آرد\nعَماری‌دارِ لیلی را که مَهدِ ماه در حکم است\nخدا را در دل اندازش که بر مجنون گذار آرد\nبهارِ عمر خواه ای دل! و گر نه این چمن هر سال\nچو نسرین صد گل آرد بار و چون بلبل هِزار آرد\nخدا را چون دلِ ریشم قراری بست با زلفت\nبفرما لعلِ نوشین را که زودش با قرار آرد\nدر این باغ از خدا خواهد دگر پیرانه‌سر، حافظ\nنشیند بر لبِ جویی و سروی در کنار آرد"},{"id":116,"poem":"کسی که حُسن و خَطِ دوست در نظر دارد\nمحقَق است که او حاصل بصر دارد\nچو خامه در رهِ فرمانِ او، سرِ طاعت\nنهاده‌ایم مگر او به تیغ بردارد\nکسی به وصلِ تو چون شمع یافت پروانه\nکه زیرِ تیغِ تو هر دم سری دگر دارد\nبه پای‌بوس تو دستِ کسی رسید که او\nچو آستانه بدین در، همیشه سر دارد\nز زهدِ خشک ملولم‌، کجاست بادهٔ ناب‌؟\nکه بویِ باده مدامم دماغ تر دارد\nز باده هیچت اگر نیست، این نه بس که تو را\nدمی ز وسوسهٔ عقل بی‌خبر دارد؟\nکسی که از رهِ تقوا قدم برون ننهاد\nبه عزمِ میکده اکنون رهِ سفر دارد\nدل‌ِ شکستهٔ حافظ به خاک خواهد برد\nچو لاله، داغ هوایی‌، که بر جگر دارد"},{"id":117,"poem":"دل ما به دور رویت ز چمن فَراغ دارد\nکه چو سرو پایبند است و چو لاله داغ دارد\nسرِ ما فرونیآید به کمانِ ابروی کَس\nکه درون گوشه‌گیران، ز جهان فَراغ دارد\nز بنفشه تاب دارم که ز زلفِ او زند دم\nتو سیاهِ کم‌بها بین، که چه در دِماغ دارد‌!\nبه چمن خرام و بنگر برِ تختِ گل که لاله\nبه ندیمِ شاه مانَد که به کف ایاغ دارد\nشبِ ظلمت و بیابان، به کجا توان رسیدن؟\nمگر آن که شمعِ روی‌ات به رَهَم چراغ دارد\nمن و شمعِ صبح‌گاهی سِزَد ار به هم بِگرییم\nکه بسوختیم و از ما بتِ ما فراغ دارد\nسِزَدم چو ابرِ بهمن که بر این چمن بِگریَم\nطرب آشیانِ بلبل، بنگر که زاغ دارد\nسرِ درسِ عشق دارد دلِ دردمند حافظ\nکه نه خاطرِ تماشا نه هوای باغ دارد"},{"id":118,"poem":"آن کس که به دست جام دارد\nسلطانیِ جَم مُدام دارد\nآبی که خِضِر حیات از او یافت\nدر میکده جو‌ که جام دارد\nسررشتهٔ جان به جام بگذار\nکاین رشته از او نظام دارد\nما و مِی و زاهدان و تقوا\nتا یار، سرِ کدام دارد\nبیرون ز لبِ تو ساقیا نیست\nدر دور، کسی که کام دارد\nنرگس، همه شیوه‌های مستی\nاز چشمِ خوشت به وام دارد\nذکرِ رخ و زلف تو دلم را\nوردی‌ست که صبح و شام دارد\nبر سینهٔ ریشِ دردمندان\nلعلت نمکی تمام دارد\nدر چاهِ ذَقَن چو حافظ ای جان\nحُسنِ تو دو صد غلام دارد"},{"id":119,"poem":"دلی که غیب‌نمای است و جامِ جم دارد\nز خاتمی که دمی گم شود، چه غم دارد؟\nبه خَطُّ و خالِ گدایان مده خزینهٔ دل\nبه دستِ شاهوَشی دِه که محترم دارد\nنه هر درخت تحمّل کند جفایِ خزان\nغلامِ همتِ سروم که این قدم دارد\nرسید موسمِ آن کز طرب چو نرگسِ مست\nنهد به پایِ قدح هر که شش درم دارد\nزر از بهایِ می اکنون چو گل دریغ مدار\nکه عقلِ کل به صدت عیب متّهم دارد\nز سِرِّ غیب، کس آگاه نیست؛ قصّه مخوان\nکدام مَحرمِ دل ره در این حرم دارد؟\nدلم که لافِ تَجَرُّد زدی، کنون صد شغل\nبه بویِ زلفِ تو با بادِ صبحدم دارد\nمرادِ دل ز که پرسم؟ که نیست دلداری\nکه جلوهٔ نظر و شیوهٔ کرم دارد\nز جَیبِ خرقهٔ حافظ چه طَرف بِتوان بست\nکه ما صمد طلبیدیم و او صَنم دارد"},{"id":120,"poem":"بتی دارم که گِرد گل ز سُنبل سایه‌بان دارد\nبهارِ عارضش خطّی به خونِ ارغوان دارد\nغبارِ خط بپوشانید خورشیدِ رُخَش یا رب\nبقایِ جاودانش ده، که حُسنِ جاودان دارد\nچو عاشق می‌شدم گفتم که بُردم گوهرِ مقصود\nندانستم که این دریا چه موجِ خون‌فشان دارد\nز چشمت جان نشاید بُرد کز هر سو که می‌بینم\nکمین از گوشه‌ای کرده‌ست و تیر اندر کمان دارد\nچو دامِ طُرِّه افشاند ز گَردِ خاطرِ عشاق\nبه غَمّازِ صبا گوید که راِزِ ما نهان دارد\nبیفشان جرعه‌ای بر خاک و حالِ اهلِ دل بشنو\nکه از جمشید و کیخسرو، فراوان داستان دارد\nچو در رویت بخندد گُل، مشو در دامَش ای بلبل\nکه بر گُل اعتمادی نیست، گر حُسنِ جهان دارد\nخدا را، دادِ من بِسْتان از او ای شِحنهٔ مجلس\nکه می با دیگری خورده‌ست و با من سر گِران دارد\nبه فِتراک ار همی‌بندی خدا را زود صیدم کن\nکه آفت‌هاست در تأخیر و طالب را زیان دارد\nز سروِ قَدِّ دلجویت مکن محروم چشمم را\nبدین سرچشمه‌اش بِنْشان که خوش آبی روان دارد\nز خوفِ هجرم ایمن کن اگر امّیدِ آن داری\nکه از چشمِ بداندیشان خدایت در امان دارد\nچه عذرِ بختِ خود گویم؟ که آن عیّار شهرآشوب\nبه تلخی کُشت حافظ را و شِکَّر در دهان دارد"},{"id":121,"poem":"هر آن کاو خاطِرِ مَجموع و یارِ نازنین دارد\nسَعادَت، همدم او گشت و دولت، هم‌نشین دارد\nحَریمِ عشق را دَرْگَه، بسی بالاتر از عَقْل است\nکسی آن آسْتان بوسد، که جان در آستین دارد\nدهانِ تَنْگِ شیرینش، مگر مُلْکِ سلیمان است\nکه نَقْشِ خاتَمِ لَعْلَش، جهان، زیرِ نگین دارد؟\nلَبِ لَعْل و خَطِ مُشکین، چو آنش هست و اینش هست\nبنازم دِلْبَرِ خود را، که حُسْنَش، آن و این دارد\nبه خواری مَنْگَر ای مُنْعِم، ضَعیفان و نَحیفان را\nکه صَدْرِ مَجْلِسِ عِشْرَت، گدایِ ره‌نشین دارد\nچو بر رویِ زَمین باشی، توانایی، غَنیمت دان\nکه دوران، ناتوانی‌ها، بسی زیرِ زَمین دارد\nبَلاگردانِ جان و تن، دعایِ مُسْتْمَنْدان است\nکه بیند خِیْر از آن خَرْمَن که نَنْگ از خوشه‌چین دارد؟\nصَبا از عِشقِ من، رَمزی بگو با آن شَهِ خوبان\nکه صد جَمشید و کِیخُسرو، غُلامِ کم‌ترین دارد\nوگر گوید نمی‌خواهم، چو «حافِظ»، عاشِقِ مُفْلِس\nبگوییدش که سلطانی، گدایی هم‌نشین دارد"},{"id":122,"poem":"هر آن‌که جانِبِ اَهْلِ خُدا نگه دارد\nخُداش در همه حال از بَلا نگه دارد\nحَدیثِ دوست نگویم مَگَر به حَضْرَتِ دوست\nکه آشنا، سُخَنِ آشنا نگه دارد\nدلا، مَعاش چُنان کُن که گر بِلَغْزَد پای\nفرشته‌ات به دو دستِ دُعا نگه دارد\nگَرَت هَواست که مَعشوق نَگْسَلد پِیمان\nنگاه دار سرِ رشته تا نگه دارد\nصَبا بر آن سَرِ زُلْف اَر دِلِ مرا بینی\nز رویِ لُطْف بگویش که جا نگه دارد\nچو گفتمش که دلم را نگاه دار، چه گفت؟\nز دَسْتِ بَنده چه خیزد؟ خُدا نگه دارد\nسَر و زَر و دل و جانم، فَدایِ آن یاری\nکه حَقِّ صُحْبَتِ مِهْر و وَفا نگه دارد\nغُبارِ راهگذارت کجاست تا «حافِظ»\nبه یادگارِ نَسیمِ صَبا نگه دارد"},{"id":123,"poem":"مطربِ عشق عجب ساز و نوایی دارد\nنقشِ هر نغمه که زد راه به جایی دارد\nعالَم از نالهٔ عُشّاق مبادا خالی\nکه خوش‌آهنگ و فرح‌بخش هوایی دارد\nپیر دُردی‌کَش ما گرچه ندارد زر و زور\nخوش عطابخش و خطاپوش خدایی دارد\nمحترم دار دلم کاین مگسِ قندپَرست\nتا هواخواهِ تو شد فَرِّ هُمایی دارد\nاز عدالت نَبُوَد دور گَرَش پُرسد حال\nپادشاهی که به همسایه گدایی دارد\nاشکِ خونین بنمودم به طبیبان گفتند\nدردِ عشق است و جگرسوز دوایی دارد\nستم از غمزه میاموز که در مذهبِ عشق\nهر عمل اجری و هر کرده جزایی دارد\nنغز گفت آن بتِ ترسابچهٔ باده‌پرست\nشادیِ رویِ کسی خور که صفایی دارد\nخسروا حافظ درگاه‌نشین فاتحه خواند\nوز زبان تو تمنای دعایی دارد"},{"id":124,"poem":"آن که از سُنبُلِ او، غالیه تابی دارد\nباز با دلشدگان ناز و عِتابی دارد\nاز سَرِ کُشتهٔ خود می‌گذری همچون باد\nچه توان کرد؟ که عمر است و شتابی دارد\nماهِ خورشید نُمایَش ز پسِ پردهٔ زلف\nآفتابیست که در پیش سَحابی دارد\nچشمِ من کرد به هر گوشه روان سیلِ سرشک\nتا سَهی سَروِ تو را تازه‌تر آبی دارد\nغمزهٔ شوخِ تو خونم به خطا می‌ریزد\nفرصتش باد که خوش فکر صوابی دارد\nآب حَیوان اگر این است که دارد لبِ دوست\nروشن است این که خِضِر بهره سرابی دارد\nچشمِ مخمورِ تو دارد ز دلم قصدِ جگر\nتُرک مست است مگر میلِ کبابی دارد\nجانِ بیمارِ مرا نیست ز تو روی سؤال\nای خوش آن خسته که از دوست جوابی دارد\nکِی کُنَد سویِ دلِ خستهٔ حافظ نظری\nچشمِ مستش که به هر گوشه خرابی دارد"},{"id":125,"poem":"شاهد آن نیست که موییّ و میانی دارد\nبندهٔ طلعتِ آن باش که آنی دارد\nشیوهٔ حور و پری گرچه لطیف است ولی\nخوبی آن است و لطافت که فُلانی دارد\nچشمهٔ چشمِ مرا ای گلِ خندان دریاب\nکه به امّیدِ تو خوش آبِ روانی دارد\nگوی خوبی که بَرَد از تو؟ که خورشید آن جا\nنه سواریست که در دست عِنانی دارد\nدل نشان شد سخنم تا تو قبولش کردی\nآری آری سخنِ عشق نشانی دارد\nخَمِ ابرویِ تو در صنعتِ تیراندازی\nبُرده از دستِ هر آن کس که کمانی دارد\nدر رَهِ عشق نشد کَس به یقین محرمِ راز\nهر کسی بر حَسَبِ فکر، گُمانی دارد\nبا خرابات نشینان ز کَرامات مَلاف\nهر سخن وقتی و هر نکته مکانی دارد\nمرغِ زیرک نزند در چمنش پرده سرای\nهر بهاری که به دنباله، خزانی دارد\nمدعی گو لُغَز و نکته به حافظ مفروش\nکِلکِ ما نیز زبانی و بیانی دارد"},{"id":126,"poem":"جان بی‌جمالِ جانان، میلِ جهان ندارد\nهر کس که این ندارد حقّا که آن ندارد\nبا هیچ کس نشانی زان دِلْسِتان ندیدم\nیا من خبر ندارم یا او نشان ندارد\nهر شبنمی در این ره صد بحرِ آتشین است\nدردا که این معما شرح و بیان ندارد\nسرمنزلِ فراغت نَتْوان ز دست دادن\nای ساروان فروکش کاین ره کران ندارد\nچنگِ خمیده‌قامت می‌خوانَدَت به عشرت\nبشنو که پندِ پیران هیچت زیان ندارد\nای دل طریقِ رندی از محتسب بیاموز\nمست است و در حقِ او کس این گمان ندارد\nاحوالِ گنجِ قارون کَایّام داد بر باد\nدر گوشِ دل فروخوان تا زر نهان ندارد\nگر خود رقیب شمع است اسرار از او بپوشان\nکان شوخِ سربریده بندِ زبان ندارد\nکس در جهان ندارد یک بنده همچو حافظ\nزیرا که چون تو شاهی کس در جهان ندارد"},{"id":127,"poem":"روشنیِ طلعتِ تو ماه ندارد\nپیشِ تو گُل، رونقِ گیاه ندارد\nگوشهٔ ابرویِ توست منزلِ جانم\nخوشتر از این گوشه، پادْشاه ندارد\nتا چه کُنَد با رخِ تو دودِ دلِ من\nآینه دانی که تابِ آه ندارد\nشوخیِ نرگس نگر که پیشِ تو بشکفت\nچشمْ دریده، ادب نگاه ندارد\nدیدم و آن چشمِ دلْ‌سیه که تو داری\nجانبِ هیچ آشنا نگاه ندارد\nرَطلِ گرانم ده ای مریدِ خرابات\nشادیِ شیخی که خانقاه ندارد\nخون خور و خامُش نشین که آن دلِ نازک\nطاقتِ فریاد دادخواه ندارد\nگو برو و
