دَهَد لَعلِ لَبَت به مُرده جان\nآن که به پُرسش آمَد و فاتحه خواند و می‌رَوَد\nگو نَفَسی که روح را می‌کُنَم از پِیَش رَوان\nای که طَبیبِ خَسته‌ای، رویِ زَبان مَن بِبین\nکـاین دَم و دودِ سینه‌ام، بارِ دل اَست بَر زَبان\nگرچه تَبْ اُستُخوانِ مَن کرد زِ مِهرْ گرم و رَفت\nهمچو تَبَم نمی‌رَوَد آتشِ مِهر از اُستُخوان\nحالِ دِلَم زِ خالِ تو هَست دَر آتَشَش وَطن\nچَشمم از آن دو چَشمِ تو خسته شُده‌ست و ناتَوان\nبازنِشانْ حَرارَتَم ز آبِ دو دیده و ببین\nنَبضِ مَرا که می‌دَهَد هیچ زِ زندگی نِشان\nآن که مُدام شیشه‌ام از پِی عیش داده اَست\nشیشه‌ام از چه می‌بَرَد پیشِ طَبیبْ هَر زَمان؟\nحافظ از آبِ زندگی شعرِ تو داد شَربَتَم\nتَرکِ طَبیب کُن بیا نُسخهٔ شَربَتَم بِخوان"},{"id":383,"poem":"چندان که گفتم غم با طبیبان\nدرمان نکردند مسکین غریبان\nآن گل که هر دم در دست بادیست\nگو شرم بادش از عندلیبان\nیا رب امان ده تا بازبیند\nچشم محبان روی حبیبان\nدرج محبت بر مهر خود نیست\nیا رب مبادا کام رقیبان\nای منعم آخر بر خوان جودت\nتا چند باشیم از بی نصیبان\nحافظ نگشتی شیدای گیتی\nگر می‌شنیدی پند ادیبان"},{"id":384,"poem":"می‌سوزم از فِراقت روی از جَفا بگردان\nهجران بلایِ ما شد، یا رب بلا بگردان\nمَه جلوه می‌نماید بر سبز خِنگِ گَردون\nتا او به سر درآید، بر رَخش پا بگردان\nمَرغول را بَرافشان یعنی به رَغمِ سنبل\nگِردِ چمن بُخوری همچون صبا بگردان\nیغمایِ عقل و دین را بیرون خرام سرمست\nدر سر کلاه بِشکن در بَر قَبا بگردان\nای نورِ چشمِ مستان در عینِ انتظارم\nچنگِ حزین و جامی بِنواز یا بگردان\nدوران همی‌نویسد بر عارضش خطی خوش\nیا رب نوشتهٔ بد از یارِ ما بگردان\nحافظ ز خوبرویان بختت جز این قَدَر نیست\nگر نیستت رضایی حُکمِ قضا بگردان"},{"id":385,"poem":"یا رب آن آهوی مشکین به خُتَن باز رسان\nوان سهی سروِ خرامان به چمن باز رسان\nدل آزردهٔ ما را به نسیمی بنواز\nیعنی آن جانِ ز تن رفته به تن باز رسان\nماه و خورشید به منزل چو به امرِ تو رسند\nیارِ مه‌روی مرا نیز به من باز رسان\nدیده‌ها در طلبِ لعلِ یَمانی خون شد\nیا رب آن کوکبِ رخشان به یَمَن باز رسان\nبرو ای طایرِ میمونِ همایون آثار\nپیش عنقا سخنِ زاغ و زَغَن باز رسان\nسخن این است که ما بی تو نخواهیم حیات\nبشنو ای پیکِ خبرگیر و سخن باز رسان\nآن که بودی وطنش دیدهٔ حافظ یا رب\nبه مرادش ز غریبی به وطن باز رسان"},{"id":386,"poem":"خدا را کم نشین با خرقه پوشان\nرخ از رندان بی‌سامان مپوشان\nدر این خرقه بسی آلودگی هست\nخوشا وقت قبای می فروشان\nدر این صوفی‌وشان دَردی ندیدم\nکه صافی باد عیش دُردنوشان\nتو نازک‌طبعی و طاقت نیاری\nگرانی‌های مشتی دلق‌پوشان\nچو مستم کرده‌ای مستور منشین\nچو نوشم داده‌ای زهرم منوشان\nبیا وز غَبْن این سالوسیان بین\nصُراحی خون‌دل و بربط خروشان\nز دلگرمی حافظ بر حذر باش\nکه دارد سینه‌ای چون دیگ جوشان"},{"id":387,"poem":"شاه شمشادقدان، خسرو شیرین‌دهنان\nکه به مژگان شکند قلب همه صف‌شکنان\nمست بگذشت و نظر بر من درویش انداخت\nگفت: ای چشم و چراغ همه شیرین‌سخنان\nتا کی از سیم و زرت کیسه تهی خواهد بود؟\nبندهٔ من شو و برخور ز همه سیم‌تنان\nکمتر از ذره نه‌ای، پست مشو، مهر بورز\nتا به خلوتگه خورشید رسی چرخ‌زنان\nبر جهان تکیه مکن ور قدحی مِی‌ داری\nشادی زهره‌جبینان خور و نازک‌بدنان\nپیر پیمانه‌کش من که روانش خوش باد\nگفت: پرهیز کن از صحبت پیمان‌شکنان\nدامن دوست به دست آر و ز دشمن بگسل\nمرد یزدان شو و فارغ گذر از اهرمنان\nبا صبا در چمن لاله سحر می‌گفتم\nکه شهیدانِ که‌اند این همه خونین‌کفنان\nگفت: حافظ! من و تو محرم این راز نه‌ایم\nاز می لعل حکایت کن و شیرین‌دهنان"},{"id":388,"poem":"بهار و گل طرب‌انگیز گشت و توبه‌شکن\nبه شادی رخِ گل بیخ غم ز دل بر کن\nرسید باد صبا غنچه در هواداری\nز خود برون شد و بر خود درید پیراهن\nطریق صدق بیاموز از آب صافیِ دل\nبه راستی طلب آزادگی ز سرو چمن\nز دستبرد صبا گرد گل کلاله نگر\nشکنج گیسوی سنبل ببین به روی سمن\nعروس غنچه رسید از حرم به طالع سعد\nبعینه دل و دین می‌برد به وجه حسن\nصفیر بلبل شوریده و نفیر هزار\nبرای وصل گل آمد برون ز بیت حزن\nحدیث صحبت خوبان و جام باده بگو\nبه قول حافظ و فتوی پیر صاحب فن"},{"id":389,"poem":"چو گل هر دم به بویت جامه در تن\nکنم چاک از گریبان تا به دامن\nتنت را دید گل گویی که در باغ\nچو مستان جامه را بدرید بر تن\nمن از دست غمت مشکل برم جان\nولی دل را تو آسان بردی از من\nبه قول دشمنان برگشتی از دوست\nنگردد هیچ کس با دوست دشمن\nتنت در جامه چون در جام باده\nدلت در سینه چون در سیم آهن\nببار ای شمع اشک از چشم خونین\nکه شد سوز دلت بر خلق روشن\nمکن کز سینه‌ام آه جگرسوز\nبرآید همچو دود از راه روزن\nدلم را مشکن و در پا مینداز\nکه دارد در سر زلف تو مسکن\nچو دل در زلف تو بسته‌ست حافظ\nبدین سان کار او در پا میفکن"},{"id":390,"poem":"افسر سلطان گل پیدا شد از طرف چمن\nمقدمش یا رب مبارک باد بر سرو و سمن\nخوش به جای خویشتن بود این نشست خسروی\nتا نشیند هر کسی اکنون به جای خویشتن\nخاتم جم را بشارت ده به حسن خاتمت\nکاسم اعظم کرد از او کوتاه دست اهرمن\nتا ابد معمور باد این خانه کز خاک درش\nهر نفس با بوی رحمان می‌وزد باد یمن\nشوکت پور پشنگ و تیغ عالمگیر او\nدر همه شهنامه‌ها شد داستان انجمن\nخنگ چوگانی چرخت رام شد در زیر زین\nشهسوارا چون به میدان آمدی گویی بزن\nجویبار ملک را آب روان شمشیر توست\nتو درخت عدل بنشان بیخ بدخواهان بکن\nبعد از این نَشگِفت اگر با نکهتِ خُلقِ خوشت\nخیزد از صحرای اِیذَج نافهٔ مُشک خُتن\nگوشه گیران انتظار جلوهٔ خوش می‌کنند\nبرشکن طرف کلاه و برقع از رخ برفکن\nمشورت با عقل کردم گفت حافظ می بنوش\nساقیا می ده به قول مستشار مؤتمن\nای صبا بر ساقی بزم اتابک عرضه دار\nتا از آن جام زرافشان جرعه‌ای بخشد به من"},{"id":391,"poem":"خوش‌تر از فکر می و جام چه خواهد بودن؟\nتا ببینم که سرانجام چه خواهد بودن\nغم دل چند توان خورد؟ که ایام نماند\nگو نه دل باش و نه ایام چه خواهد بودن؟\nمرغ کم‌حوصله را گو غم خود خور که بر او\nرحمِ آن کس که نهد دام چه خواهد بودن؟\nباده خور غم مخور و پند مقلد منیوش\nاعتبار سخن عام چه خواهد بودن؟\nدست‌رنج تو همان به که شود صرف به کام\nدانی آخر که به ناکام چه خواهد بودن؟\nپیر میخانه همی‌خواند معمایی دوش\nاز خط جام، که فرجام چه خواهد بودن؟\nبردم از ره دل حافظ به دف و چنگ و غزل\nتا جزای من بدنام چه خواهد بودن"},{"id":392,"poem":"دانی که چیست دولت؟ دیدار یار دیدن\nدر کوی او گدایی، بر خسروی گزیدن\nاز جان طمع بریدن آسان بود ولیکن\nاز دوستان جانی، مشکل توان بریدن\nخواهم شدن به بستان، چون غنچه با دلِ تنگ\nوآنجا به نیک‌نامی، پیراهنی دریدن\nگه چون نسیم با گل، راز نهفته گفتن\nگه سِرّ عشق‌بازی، از بلبلان شنیدن\nبوسیدن لب یار، اول ز دست مگذار\nکآخر ملول گردی، از دست و لب گزیدن\nفرصت شمار صحبت، کز این دوراهه منزل\nچون بگذریم دیگر، نتوان به هم رسیدن\nگویی برفت حافظ، از یاد شاه‌ یحیی\nیا رب به یادش آور، درویش پروریدن"},{"id":393,"poem":"منم که شهره شهرم به عشق ورزیدن\nمنم که دیده نیالوده‌ام به بد دیدن\nوفا کنیم و ملامت کشیم و خوش باشیم\nکه در طریقتِ ما کافریست رنجیدن\nبه پیرِ میکده گفتم که چیست راه نجات\nبخواست جامِ می و گفت عیب پوشیدن\nمرادِ دل ز تماشای باغِ عالم چیست؟\nبه دستِ مردمِ چشم از رخِ تو گل چیدن\nبه مِیْ پرستی از آن نقشِ خود زدم بر آب\nکه تا خراب کنم نقشِ خود پرستیدن\nبه رحمتِ سرِ زلفِ تو واثقم ورنه\nکشش چو نَبوَد از آن سو چه سود کوشیدن؟\nعنان به میکده خواهیم تافت زین مجلس\nکه وعظ بی‌عملان واجب است نشنیدن\nز خطّ یار بیاموز مِهر با رخِ خوب\nکه گرد عارضِ خوبان خوش است گردیدن\nمبوس جز لبِ ساقی و جامِ می حافظ\nکه دستِ زهد فروشان خطاست بوسیدن"},{"id":394,"poem":"ای روی ماه‌منظر تو نوبهار حُسن\nخال و خط تو مرکز حُسن و مدار حُسن\nدر چشم پرخمار تو پنهان فسون سِحر\nدر زلف بی‌قرار تو پیدا قرار حُسن\nماهی نتافت همچو تو از برج نیکویی\nسروی نخاست چون قَدَت از جویبار حُسن\nخرّم شد از ملاحت تو عهد دلبری\nفرّخ شد از لطافت تو روزگار حُسن\nاز دام زلف و دانهٔ خال تو در جهان\nیک مرغِ دل نماند نگشته شکار حُسن\nدائم به لطف دایهٔ طبع از میانِ جان\nمی‌پرورَد به ناز، تو را در کنار حُسن\nگِرد لبَت بنفشه از آن تازه و تر است\nکآب حیات می‌خورَد از جویبار حُسن\nحافظ طمع برید که بیند نظیر تو\nدیّار نیست جز رُخَت اندر دیار حُسن"},{"id":395,"poem":"گُلبرگ را ز سُنْبُلِ مُشکین، نِقاب کُن\nیعنی که رُخ بپوش و جهانی، خراب کُن\nبِفْشان عَرَق ز چهره و اطرافِ باغ را\nچون شیشه‌هایِ دیدهٔ ما پُرگُلاب کُن\nاَیّامِ گُل، چو عمر به رفتن شتاب کرد\nساقی به دورِ بادهٔ گلگون، شتاب کُن\nبُگْشا به شیوه، نرگسِ پُرخوابِ مست را\nوز رَشک، چَشمِ نرگسِ رَعنا به خواب کن\nبویِ بنفشه بشنو و زُلْفِ نگار گیر\nبِنْگَر به رنگِ لاله و عَزْمِ شراب کُن\nزآن جا که رسم و عادتِ عاشق‌کشی توست\nبا دشمنان، قَدَح کَش و با ما عِتاب کُن\nهمچون حُباب، دیده به رویِ قَدَح گُشای\nوین خانه را قیاسِ اساس از حُباب کُن\nحافظ وِصال می‌طَلَبَد از رهِ دُعا\nیا رب! دعایِ خسته‌دلان، مُسْتَجاب کُن"},{"id":396,"poem":"صبح است ساقیا قدحی پرشراب کن\nدور فلک درنگ ندارد شتاب کن\nزان پیش‌تر که عالم فانی شود خراب\nما را ز جام بادهٔ گلگون خراب کن\nخورشید می ز مشرق ساغر طلوع کرد\nگر برگ عیش می‌طلبی ترک خواب کن\nروزی که چرخ از گل ما کوزه‌ها کند\nزنهار کاسهٔ سر ما پرشراب کن\nما مرد زهد و توبه و طامات نیستیم\nبا ما به جام باده صافی خطاب کن\nکار صواب، باده پرستی‌ست حافظا\nبرخیز و عزم جزم به کار صواب کن"},{"id":397,"poem":"ز در در آ و شبستان ما منور کن\nهوای مجلس روحانیان معطر کن\nاگر فقیه نصیحت کند که عشق مباز\nپیاله‌ای بدهش گو دماغ را تر کن\nبه چشم و ابروی جانان سپرده‌ام دل و جان\nبیا بیا و تماشای طاق و منظر کن\nستاره شب هجران نمی‌فشاند نور\nبه بام قصر برآ و چراغ مه بر کن\nبگو به خازن جنت که خاک این مجلس\nبه تحفه بر سوی فردوس و عود مجمر کن\nاز این مزوجه و خرقه نیک در تنگم\nبه یک کرشمه صوفی‌وشم قلندر کن\nچو شاهدان چمن زیردست حسن تواَند\nکرشمه بر سمن و جلوه بر صنوبر کن\nفضول نفس حکایت بسی کند ساقی\nتو کار خود مده از دست و می به ساغر کن\nحجاب دیده ادراک شد شعاع جمال\nبیا و خرگه خورشید را منور کن\nطمع به قند وصال تو حد ما نبود\nحوالتم به لب لعل همچو شکر کن\nلب پیاله ببوس آنگهی به مستان ده\nبدین دقیقه دماغ معاشران تر کن\nپس از ملازمت عیش و عشق مه‌رویان\nز کارها که کنی شعر حافظ از بر کن"},{"id":398,"poem":"ای نور چشم من سخنی هست گوش کن\nچون ساغرت پُر است بنوشان و نوش کن\nدر راه عشق وسوسهٔ اهرمن بسیست\nپیش آی و گوشِ دل به پیام سروش کن\nبرگ نوا تبه شد و ساز طرب نماند\nای چنگ ناله برکش و ای دف خروش کن\nتسبیح و خرقه لذّت مستی نبخشدت\nهمّت در این عمل طلب از می‌فروش کن\nپیران سخن ز تجربه گویند گفتمت\nهان ای پسر که پیر شوی پند گوش کن\nبر هوشمند سلسله ننهاد دست عشق\nخواهی که زلف یار کشی ترک هوش کن\nبا دوستان مضایقه در عمر و مال نیست\nصد جان فدای یار نصیحت نیوش کن\nساقی که جامت از می صافی تهی مباد\nچشم عنایتی به من دردنوش کن\nسرمست در قبای زرافشان چو بگذری\nیک بوسه نذر حافظ پشمینه‌پوش کن"},{"id":399,"poem":"کرشمه‌ای کن و بازار ساحری بشکن\nبه غمزه رونق و ناموس سامری بشکن\nبه باد ده سر و دستار عالمی یعنی\nکلاه گوشه به آیین سروری بشکن\nبه زلف گوی که آیین دلبری بگذار\nبه غمزه گوی که قلب ستمگری بشکن\nبرون خرام و ببر گوی خوبی از همه کس\nسزای حور بده رونق پری بشکن\nبه آهوان نظر شیر آفتاب بگیر\nبه ابروان دوتا قوس مشتری بشکن\nچو عطرسای شود زلف سنبل از دم باد\nتو قیمتش به سر زلف عنبری بشکن\nچو عندلیب فصاحت فروشد ای حافظ\nتو قدر او به سخن گفتن دری بشکن"},{"id":400,"poem":"بالابلندِ عِشْوِه‌گرِ نقش‌بازِ من\nکوتاه کرد قصّهٔ زُهْدِ درازِ من\nدیدی دلا که آخرِ پیری و زُهْد و عِلْم\nبا من چه کَرْد دیدهٔ معشوقه‌بازِ من؟\nمی‌ترسم از خرابیِ ایمان که می‌بَرَد\nمِحْرابِ ابرویِ تو، حُضورِ نمازِ من\nگفتم به دَلْقِ زَرْق بپوشم نشانِ عشق\nغَمّاز بود اَشْک و عَیان کرد رازِ من\nمست است یار و یادِ حریفان نمی‌کُنَد\nذکرش به خیر‌، ساقیِ مِسْکین‌نوازِ من\nیا رب کی آن صبا بِوَزَد کز نسیمِ آن\nگَرْدَد شمامهٔ کَرَمَش، کارسازِ من؟\nنقشی بر آب می‌زنم از گریه، حالیا\nتا کی شود قرینِ حقیقت، مجازِ من\nبر خود، چو شمع، خنده‌زنان، گریه می‌کنم\nتا با تو سنگ‌دل چه کُنَد سوز و سازِ من؟\nزاهد؛ چو از نمازِ تو کاری نمی‌رود\nهم مستیِ شبانه و راز و نیازِ من\n«حافظ»، زِ گریه سوخت بگو حالش ای صبا\nبا شاهِ دوست‌پرورِ دشمن‌گُدازِ من"},{"id":401,"poem":"چون شوم خاک رهش دامن بیفشاند ز من\nور بگویم دل بگردان رو بگرداند ز من\nروی رنگین را به هر کس می‌نماید همچو گل\nور بگویم بازپوشان بازپوشاند ز من\nچشم خود را گفتم آخر یک نظر سیرش ببین\nگفت می‌خواهی مگر تا جوی خون راند ز من؟\nاو به خونم تشنه و من بر لبش تا چون شود\nکام بستانم از او یا داد بستاند ز من\nگر چو فرهادم به تلخی جان برآید باک نیست\nبس حکایت‌های شیرین باز می‌ماند ز من\nگر چو شمعش پیش میرم بر غمم خندان شود\nور برنجم خاطر نازک برنجاند ز من\nدوستان جان داده‌ام بهر دهانش بنگرید\nکو به چیزی مختصر چون باز می‌ماند ز من\nصبر کن حافظ که گر زین دست باشد درس غم\nعشق در هر گوشه‌ای افسانه‌ای خواند ز من"},{"id":402,"poem":"نکته‌ای دلکَش بگویم خالِ آن مَه‌رو ببین\nعقل و جان را بستهٔ زنجیرِ آن گیسو ببین\nعیبِ دل کردم که وحشی‌وضع و هرجایی مباش\nگفت چشمِ شیرگیر و غنجِ آن آهو ببین\nحلقهٔ زلفش تماشاخانهٔ باد صباست\nجانِ صد صاحب‌دل آن جا بستهٔ یک مو ببین\nعابدانِ آفتاب از دلبرِ ما غافل‌اند\nای ملامت‌گو خدا را رو مبین آن رو ببین\nزلفِ دل‌دزدش صبا را بند بر گردن نهاد\nبا هوادارانِ ره رو حیلهٔ هندو ببین\nاین‌که من در جست‌وجوی او ز خود فارغ شدم\nکس ندیده‌ست و نبیند مثلش از هر سو ببین\nحافظ ار در گوشهٔ محراب می‌نالد رواست\nای نصیحت‌گو خدا را آن خمِ ابرو ببین\nاز مرادِ شاه منصور ای فلک سر برمتاب\nتیزیِ شمشیر بنگر قوّتِ بازو ببین"},{"id":403,"poem":"شراب لعل‌کش و روی مه‌جبینان بین\nخلاف مذهب آنان جمال اینان بین\nبه زیر دلق ملمّع کمندها دارند\nدرازدستی این کوته‌آستینان بین\nبه خرمن دو جهان سر فرونمی‌آرند\nدماغ و کبر گدایان و خوشه‌چینان بین\nبهای نیم کرشمه هزار جان طلبند\nنیاز اهل دل و ناز نازنینان بین\nحقوق صحبت ما را به باد داد و برفت\nوفای صحبت یاران و همنشینان بین\nاسیر عشق شدن چارهٔ خلاص من است\nضمیر عاقبت‌اندیش پیش‌بینان بین\nکدورت از دل حافظ ببرد صحبت دوست\nصفای همّت پاکان و پاک‌دینان بین"},{"id":404,"poem":"می‌فکن بر صف رندان نظری بهتر از این\nبر در میکده می‌کن گذری بهتر از این\nدر حق من لبت این لطف که می‌فرماید\nسخت خوب است ولیکن قَدَری بهتر از این\nآن که فکرش گره از کار جهان بگْشاید\nگو در این کار بفرما، نظری بهتر از این\nناصحم گفت که جز غم چه هنر دارد عشق\nبرو ای خواجهٔ عاقل هنری بهتر از این!؟\nدل بدان رود گرامی چه کنم گر ندهم؟\nمادر دهر ندارد پسری بهتر از این\nمن چو گویم که قَدَح نوش و لب ساقی بوس\nبشنو از من که نگوید دگری بهتر از این\nکِلْکِ حافظ شکرین میوه نباتی‌ست، بچین\nکه در این باغ نبینی ثمری بهتر از این"},{"id":405,"poem":"به جان پیر خرابات و حق صحبت او\nکه نیست در سر من جز هوای خدمت او\nبهشت اگر چه نه جای گناهکاران است\nچراغِ صاعقهٔ آن سحاب روشن باد\nکه زد به خرمن ما آتشِ محبت او\nبر آستانهٔ میخانه گر سری بینی\nمزن به پای که معلوم نیست نیت او\nبیا که دوش به مستی سروش عالم غیب\nنوید داد که عام است فیض رحمت او\nمکن به چشم حقارت نگاه در من مست\nکه نیست معصیت و زهد بی مشیت او\nنمی‌کند دل من میل زهد و توبه ولی\nبه نام خواجه بکوشیم و فرِّ دولت او\nمدام خرقهٔ حافظ به باده در گرو است\nمگر ز خاک خرابات بود فطرت او"},{"id":406,"poem":"گفتا برون شدی به تماشای ماهِ نو\nاز ماهِ ابروانِ مَنت شرم باد رو\nعمری‌ست تا دلت ز اسیرانِ زلفِ ماست\nغافل ز حفظِ جانبِ یارانِ خود مشو\nمَفروش عطرِ عقل به هِندوی زلفِ ما\nکان‌جا هزار نافهٔ مُشکین به نیم‌جو\nتخمِ وفا و مهر در این کهنه کشته‌زار\nآن‌گه عیان شود که بود موسمِ درو\nساقی بیار باده که رمزی بگویمت\nاز سرّ‌ِ اخترانِ کهن‌سیر و ماهِ نو\nشکلِ هلالِ هر سرِ مه می‌دهد نشان\nاز افسرِ سیامک و ترکِ کلاهِ زو\nحافظ جنابِ پیرِ مغان مأمنِ وفاست\nدرسِ حدیثِ عشق بر او خوان و زو شنو"},{"id":407,"poem":"# 【0†حافظ » غزلیات » غزل شمارهٔ ۴۰۷】\nمزرعِ سبزِ فلک دیدم و داسِ مه نو\nیادم از کِشتهٔ خویش آمد و هنگامِ درو\nگفتم ای بخت بخفتیدی و خورشید دمید\nگفت با این همه از سابقه نومید مشو\nگر رَوی پاک و مجرد چو مسیحا به فلک\nاز چراغِ تو به خورشید رسد صد پرتو\nتکیه بر اخترِ شب‌دزد مکن کاین عیار\nتاجِ کاووس ببرد و کمرِ کیخسرو\nگوشوارِ زر و لعل ار چه گران دارد گوش\nدورِ خوبی گذران است نصیحت بشنو\nچشمِ بد دور ز خالِ تو که در عرصهٔ حسن\nبیدقی راند که برد از مه و خورشید گرو\nآسمان گو مفروش این عظمت کاندر عشق\nخرمنِ مه به جُوی خوشهٔ پروین به دو جو\nآتشِ زهد و ریا خرمنِ دین خواهد سوخت\nحافظ این خرقهٔ پشمینه بینداز و برو"},{"id":408,"poem":"ای آفتاب آینه دار جمال تو\nمشک سیاه مجمره گردان خال تو\nصحن سرای دیده بشستم ولی چه سود\nکـ‌این گوشه نیست درخور خیل خیال تو\nدر اوج ناز و نعمتی ای پادشاه حسن\nیا رب مباد تا به قیامت زوال تو\nمطبوعتر ز نقش تو صورت نبست باز\nطغرانویس ابروی مشکین مثال تو\nدر چین زلفش ای دل مسکین چگونه‌ای\nکآشفته گفت باد صبا شرح حال تو\nبرخاست بوی گل ز در آشتی درآی\nای نوبهار ما رخ فرخنده فال تو\nتا آسمان ز حلقه به گوشان ما شود\nکو عشوه‌ای ز ابروی همچون هلال تو\nتا پیش بخت باز رَوَم تهنیت کنان\nکو مژده‌ای ز مقدم عید وصال تو\nاین نقطه سیاه که آمد مدار نور\nعکسیست در حدیقه بینش ز خال تو\nدر پیش شاه عرض کدامین جفا کنم\nشرح نیازمندی خود یا ملال تو\nحافظ در این کمند سر سرکشان بسیست\nسودای کج مپز که نباشد مجال تو"},{"id":409,"poem":"ای خونبهای نافه چین خاک راه تو\nخورشید سایه‌پرور طرف کلاه تو\nنرگس کرشمه می‌برد از حد برون خرام\nای من فدای شیوه چشم سیاه تو\nخونم بخور که هیچ مَلَک با چنان جمال\nاز دل نیایدش که نویسد گناه تو\nآرام و خواب خلق جهان را سبب تویی\nزان شد کنار دیده و دل تکیه‌گاه تو\nبا هر ستاره‌ای سر و کار است هر شبم\nاز حسرت فروغ رخ همچو ماه تو\nیاران همنشین همه از هم جدا شدند\nماییم و آستانه دولت پناه تو\nحافظ طمع مبُر ز عنایت که عاقبت\nآتش زند به خرمن غم دود آه تو"},{"id":410,"poem":"ای قبای پادشاهی، راست بر بالای تو\nزینتِ تاج و نگین از گوهرِ والای تو\nآفتاب فتح را هر دم طلوعی می‌دهد\nاز کلاهِ خسروی رخسارِ مه‌سیمایِ تو\nجلوه‌گاهِ طایرِ اقبال باشد هر کجا\nسایه‌ اندازد همایِ چترِ گردون‌سایِ تو\nاز رسومِ شرع و حکمت با هزاران اختلاف\nنکته‌ای هرگز نشد فوت از دلِ دانای تو\nآب حیوانش ز منقارِ بلاغت می‌چکد\nطوطیِ خوش‌لهجه یعنی کلک شکّرخای تو\nگرچه خورشیدِ فلک چشم و چراغ عالم است\nروشنایی‌بخشِ چشم اوست خاک پای تو\nآن چه اسکندر طلب کرد و ندادش روزگار\nجرعه‌ای بود از زلالِ جام جان‌افزای تو\nعرضِ حاجت در حریم حضرتت محتاج نیست\nراز کس مخفی نمانَد با فروغِ رایِ تو\nخسروا ! پیرانه‌سر، حافظ جوانی می‌کند\nبر امیدِ عفوِ جان‌بخشِ گنه‌فرسایِ تو"},{"id":411,"poem":"تاب بنفشه می‌دهد طرّهٔ مشک‌سای تو\nپردهٔ غنچه می‌درد خندهٔ دلگشای تو\nای گل خوش‌نسیمِ من بلبلِ خویش را مسوز\nکز سر صدق می‌کند شب همه شب دعای تو\nمن که ملول گشتمی از نفس فرشتگان\nقال و مقال عالَمی می‌کشم از برای تو\nدولت عشق بین که چون از سر فقر و افتخار\nگوشهٔ تاج سلطنت می‌شکند گدای تو\nخرقهٔ زهد و جام مِی گرچه نه درخور همند\nاین همه نقش می‌زنم از جهت رضای تو\nشور شراب عشق تو آن نفسم رود ز سر\nکاین سر پُر هوس شود خاک در سرای تو\nشاه‌نشین چشم من تکیه‌گه خیال توست\nجای دعاست شاه من بی‌تو مباد جای تو\nخوش چمنیست عارضت خاصه که در بهار حسن\nحافظِ خوش‌کلام شد مرغِ سخن‌سرایِ تو"},{"id":412,"poem":"مرا چشمی‌ست خون‌افشان ز دست آن کمان‌ابرو\nجهان بس فتنه خواهد دید از آن چشم و از آن ابرو\nغلام چشم آن ترکم که در خوابِ خوشِ مستی\nنگارین گلشنش روی است و مشکین سایبان ابرو\nهلالی شد تنم زین غم که با طغرا‌ی ابرو‌یش\nکه باشد مه که بنماید ز طاق آسمان ابرو؟\nرقیبان غافل و ما را از آن چشم و جبین هر دم\nهزاران گونه پیغام است و حاجب در میان، ابرو\nروانِ گوشه‌گیران را جبینش طرفه گلزار‌ی‌ست\nکه بر طرْف سمن‌زارش همی گردد چمان ابرو\nدگر حور و پری را کس نگوید با چنین حسنی\nکه این را این چنین چشم است و آن را آن چنان ابرو\nتو کافر‌دل نمی‌بندی نقاب زلف و می‌ترسم\nکه محرابم بگرداند خم آن دل‌ستان ابرو\nاگر چه مرغ زیرک بود حافظ در هوادار‌ی\nبه تیر غمزه صیدش کرد چشم آن کمان‌ابرو"},{"id":413,"poem":"خط عذار یار که بگرفت ماه از او\nخوش حلقه‌ای‌ست لیک به دَر نیست راه از او\nابروی دوست گوشهٔ محراب دولت است\nآن جا بمال چهره و حاجت بخواه از او\nای جرعه‌نوش مجلس جم! سینه پاک دار\nکآیینه‌ای‌ست جام جهان‌بین که آه از او\nکردار اهل صومعه‌ام کرد مِی‌پرست\nاین دود بین که نامهٔ من شد سیاه از او\nسلطان غم هر آن چه تواند بگو بکن\nمن بُرده‌ام به باده‌فروشان پناه از او\nساقی چراغ می به ره آفتاب دار\nگو بر فروز مشعلهٔ صبحگاه از او\nآبی به روزنامهٔ اعمال ما فشان\nباشد توان سترد حروف گناه از او\nحافظ که ساز مطرب عشاق ساز کرد\nخالی مباد عرصهٔ این بزمگاه از او\nآیا در این خیال که دارد گدای شهر\nروزی بود که یاد کند پادشاه از او؟"},{"id":414,"poem":"گلبن عیش می‌دمد ساقی گل‌عذار کو؟\nباد بهار می‌وزد بادهٔ خوش‌گوار کو؟\nهر گل نو ز گل‌رخی یاد همی کند ولی\nگوش سخن‌شنو کجا؟ دیدهٔ اعتبار کو؟\nمجلس بزم عیش را غالیهٔ مراد نیست\nای دمِ صبحِ خوش‌نفس نافهٔ زلف یار کو؟\nحُسن‌فروشیِ گلم نیست تحمل ای صبا\nدست زدم به خون دل بهر خدا نگار کو؟\nشمع سحرگهی اگر لاف ز عارض تو زد\nخصم زبان دراز شد خنجر آبدار کو؟\nگفت «مگر ز لعل من بوسه نداری آرزو؟»\nمُردم از این هوس ولی قدرت و اختیار کو؟\nحافظ اگر چه در سخن خازن گنج حکمت است\nاز غم روزگارِ دون، طبعِ سخن‌گزار کو؟"},{"id":415,"poem":"ای پیک راستان خبر یار ما بگو\nاحوال گل به بلبل دستان‌سرا بگو\nما محرمان خلوت انسیم غم مخور\nبا یار آشنا سخن آشنا بگو\nبر هم چو می‌زد آن سر زلفین مشک‌بار\nبا ما سر چه داشت؟ ز بهر خدا بگو\nهر کس که گفت «خاک در دوست توتیاست»\nگو «این سخن معاینه در چشم ما بگو»\nآن کس که منع ما ز خرابات می‌کند\nگو «در حضور پیر من این ماجرا بگو»\nگر دیگرت بر آن در دولت گذر بود\nبعد از ادای خدمت و عرض دعا بگو\nهر چند ما بَدیم تو ما را بِدان مگیر\nشاهانه ماجرای گناه گدا بگو\nبر این فقیر، نامهٔ آن محتشم بخوان\nبا این گدا حکایت آن پادشا بگو\nجان‌ها ز دام زلف چو بر خاک می‌فشاند\nبر آن غریب ما چه گذشت؟ ای صبا بگو\nجان‌پرور است قصّهٔ ارباب معرفت\nرمزی برو بپرس، حدیثی بیا بگو\nحافظ گرت به مجلس او راه می‌دهند\nمی نوش و ترک زرق ز بهر خدا بگو"},{"id":416,"poem":"خنک نسیم معنبر شمامه‌ای دل‌خواه\nکه در هوای تو برخاست بامداد پگاه\nدلیل راه شو ای طایر خجسته‌لقا\nکه دیده آب شد از شوق خاک آن درگاه\nبه یاد شخصِ نزارم که غرقِ خونِ دل است\nهلال را ز کنار افق کنید نگاه\nمنم که بی تو نفس می‌کشم، زهی خجلت\nمگر تو عفو کنی ور نه چیست عذر گناه؟\nز دوستان تو آموخت در طریقت مهر\nسپیده دم که صبا چاک زد شعار سیاه\nبه عشق روی تو روزی که از جهان بروم\nز تربتم بدمد سرخ‌گل به جای گیاه\nمده به خاطر نازک ملالت از من زود\nکه حافظ تو خود این لحظه گفت «بسم الله»"},{"id":417,"poem":"عیشم مدام است، از لعل دل‌خواه\nکارم به کام است، الحمدلله\nای بخت سرکش! تنگش به بَر کش\nگه جام زرکش، گه لعل دل‌خواه\nما را به رندی، افسانه کردند\nپیران جاهل، شیخان گمراه\nاز دست زاهد، کردیم توبه\nوز فعل عابد، استغفرالله\nجانا چه گویم شرح فراقت؟\nچشمی و صد نم، جانی و صد آه\nکافر مبیناد، این غم که دیده‌ست\nاز قامتت سرو، از عارضت ماه\nشوق لبت برد، از یاد حافظ\nدرس شبانه، ورد سحرگاه"},{"id":418,"poem":"گر تیغ بارد در کوی آن ماه\nگردن نهادیم الحکمُ لِلّه\nآیین تقوا ما نیز دانیم\nلیکن چه چاره با بخت گمراه؟\nما شیخ و واعظ کمتر شناسیم\nیا جام باده یا قصه کوتاه\nمن رند و عاشق در موسم گل\nآن گاه توبه، استغفرالله\nمهر تو عکسی بر ما نیفکند\nآیینه‌رویا! آه از دلت آه\nاَلصَبرُ مُرٌّ و العُمرُ فانٍ\nیا لَیتَ شِعري حَتّامَ أَلْقاه\nحافظ چه نالی گر وصل خواهی\nخون بایدت خورد در گاه و بی‌گاه"},{"id":419,"poem":"وصال او ز عمر جاودان به\nخداوندا مرا آن ده که آن به\nبه شمشیرم زد و با کَس نگفتم\nکه راز دوست از دشمن نهان به\nبه داغ بندگی مردن بر این در\nبه جان او که از مُلکِ جهان به\nخدا را از طبیبِ من بپرسید\nکه آخِر کِی شود این ناتوان به؟\nگُلی کآن پایمالِ سروِ ما گشت\nبود خاکش ز خونِ ارغوان به\nبه خلدم دعوت ای زاهد! مفرما\nکه این سیب زَنَخ، زآن بوستان به\nدلا! دائم گدای کوی او باش\nبه حکم آن که دولت جاودان به\nجوانا! سَر متاب از پندِ پیران\nکه رأی پیر از بختِ جوان به\nشبی می‌گفت چشمِ کَس ندیده‌ست\nز مرواریدِ گوشم در جهان به\nاگر چه زنده‌رود آب حیات است\nولی شیرازِ ما از اصفهان به\nسخن اندر دهانِ دوست شکَّر\nولیکِن گفتهٔ حافظ از آن به"},{"id":420,"poem":"ناگهان پرده برانداخته‌ای، یعنی چه؟\nمست از خانه برون تاخته‌ای، یعنی چه؟\nزلف در دستِ صبا، گوش به فرمان رقیب\nاین چنین با همه درساخته‌ای، یعنی چه؟\nشاهِ خوبانی و منظورِ گدایان شده‌ای\nقدرِ این مرتبه نشناخته‌ای، یعنی چه؟\nنه سرِ زلفِ خود اول تو به دستم دادی\nبازم از پای درانداخته‌ای، یعنی چه؟\nسخنت رمزِ دهان گفت و کمر سِرّ‌ِ میان\nوز میان، تیغ به ما آخته‌ای، یعنی چه؟\nهر کس از مُهرهٔ مِهر تو به نقشی مشغول\nعاقبت با همه کج باخته‌ای، یعنی چه؟\nحافظا در دلِ تنگت چو فرود آمد یار\nخانه از غیر نپرداخته‌ای، یعنی چه؟"},{"id":421,"poem":"درِ سرایِ مغان رُفته بود و آب‌زده\nنشسته پیر و صلایی به شیخ و شاب زده\nسبوکشان همه در بندگیش بسته کمر\nولی ز تَرک کُله چتر بر سحاب زده\nشعاع جام و قدح نور ماه پوشیده\nعذار مغ‌بچگان راه آفتاب زده\nعروس بخت در آن حجله با هزاران ناز\nشکسته کسمه و بر برگ گل، گلاب زده\nگرفته ساغر عشرت فرشتهٔ رحمت\nز جرعه بر رخ حور و پری گلاب زده\nز شور و عربدهٔ شاهدان شیرین‌کار\nشکر شکسته، سمن ریخته، رباب زده\nسلام کردم و با من به روی خندان گفت\nکه ای خمارکشِ مفلسِ شراب‌زده\nکه این کند که تو کردی به ضعف همت و رای؟\nز گنج‌خانه شده خیمه بر خراب زده\nوصال دولت بیدار ترسمت ندهند\nکه خفته‌ای تو در آغوش بختِ خواب‌زده\nبیا به میکده حافظ که بر تو عرضه کنم\nهزار صف ز دعاهای مستجاب‌ زده\nفلک جنیبه‌کش شاه نصرت‌الدین است\nبیا ببین ملکش دست در رکاب زده\nخرد که ملهم غیب است بهر کسب شرف\nز بام عرش صدش بوسه بر جناب زده"},{"id":422,"poem":"ای که با سلسلهٔ زلف دراز آمده‌ای\nفرصتت باد که دیوانه‌نواز آمده‌ای\nساعتی ناز مفرما و بگردان عادت\nچون به پرسیدن ارباب نیاز آمده‌ای\nپیش بالای تو میرم چه به صلح و چه به جنگ\nچون به هر حال برازندهٔ ناز آمده‌ای\nآب و آتش به هم آمیخته‌ای از لب لعل\nچشم بد دور که بس شَعبده‌باز آمده‌ای\nآفرین بر دل نرم تو که از بهر ثواب\nکشتهٔ غمزهٔ خود را به نماز آمده‌ای\nزهد من با تو چه سنجد که به یغمای دلم\nمست و آشفته به خلوتگه راز آمده‌ای\nگفت حافظ دگرت خرقه شراب آلوده‌ست\nمگر از مذهب این طایفه باز آمده‌ای"},{"id":423,"poem":"دوش رفتم به در میکده خواب‌آلوده\nخرقه تر دامن و سجّاده شراب‌آلوده\nآمد افسوس‌کنان مغبچهٔ باده‌فروش\nگفت بیدار شو ای رهرو خواب‌آلوده\nشست و شویی کن و آن‌گه به خرابات خرام\nتا نگردد ز تو این دیر خراب آلوده\nبه هوای لب شیرین پسران چند کنی\nجوهر روح به یاقوت مذاب آلوده\nبه طهارت گذران منزل پیری و مکن\nخلعت شیب چو تشریف شباب آلوده\nپاک و صافی شو و از چاه طبیعت به در آی\nکه صفایی ندهد آب تراب‌آلوده\nگفتم ای جان جهان دفتر گل عیبی نیست\nکه شود فصل بهار از می ناب آلوده\nآشنایانِ رهِ عشق در این بحر عمیق\nغرقه گشتند و نگشتند به آب آلوده\nگفت حافظ لغز و نکته به یاران مفروش\nآه از این لطف به انواع عتاب آلوده"},{"id":424,"poem":"از من جدا مشو که توام نور دیده‌ای\nآرام جان و مونس قلب رمیده‌ای\nاز دامن تو دست ندارند عاشقان\nپیراهن صبوری ایشان دریده‌ای\nاز چشم بخت خویش، مبادت گزند از آنک\nدر دلبری، به غایتِ خوبی رسیده‌ای\nمنعم مکن ز عشق وی ای مفتی زمان\nمعذور دارمت که تو او را ندیده‌ای\nآن سرزنش که کرد تو را دوست حافظا\nبیش از گلیم خویش مگر پا کشیده‌ای"},{"id":425,"poem":"دامن‌کشان همی شد در شرب زرکشیده\nصد ماهرو ز رشکش جَیب قصب دریده\nاز تاب آتش مِی، بر گِرد عارضش خوی\nچون قطره‌های شبنم بر برگ گل چکیده\nلفظی فصیح شیرین، قدی بلند چابک\nرویی لطیف زیبا، چشمی خوش کشیده\nیاقوت جان‌فزایش از آب لطف زاده\nشمشاد خوش‌خرامش در ناز پروریده\nآن لعل دلکشش بین، وآن خندهٔ دل‌آشوب\nوآن رفتن خوشش بین، وآن گام آرمیده\nآن آهوی سیه‌چشم از دام ما برون شد\nیاران چه چاره سازم با این دل رمیده؟\nزنهار تا توانی اهل نظر میآزار\nدنیا وفا ندارد ای نور هر دو دیده\nتا کی کِشم عتیبت؟ از چشم دل‌فریبت\nروزی کرشمه‌ای کن، ای یار برگزیده!\nگر خاطر شریفت رنجیده شد ز حافظ\nبازآ که توبه کردیم از گفته و شنیده\nبس شکر بازگویم در بندگیِ خواجه\nگر اوفتد به دستم آن میوهٔ رسیده"},{"id":426,"poem":"از خون دل نوشتم، نزدیک دوست نامه\n«اِنّی رَأیتُ دَهراً، مِن هَجْرِکَ القیامه»\nدارم من از فراقش، در دیده صد علامت\nلَیسَت دُموعُ عَینی، هٰذا لَنا العلامه؟\nهر چند کآزمودم، از وی نبود سودم\nمَن جَرَّبَ المُجَرَّب، حَلَّت به الندامه\nپرسیدم از طبیبی، احوال دوست گفتا\n«فی بُعدها عذابٌ، فی قُربها السلامه»\nگفتم «ملامت آید، گر گِرد دوست گردم»\nو اللهِ ما رَأینا، حُباً بِلا ملامه\nحافظ چو طالب آمد، جامی به جان شیرین\nحَتّیٰ یَذوقَ مِنهُ، کأساً مِن الکرامه"},{"id":427,"poem":"چراغ روی تو را شمع گشت پروانه\nمرا ز حال تو با حال خویش پروا، نه\nخِرد که قید مجانین عشق می‌فرمود\nبه بوی سنبل زلف تو گشت دیوانه\nبه بوی زلف تو گر جان به باد رفت‌، چه شد؟\nهزار جان گرامی فدای جانانه\nمن‌ِ رمیده ز غیرت ز پا فتادم دوش\nنگار خویش چو دیدم به دست بیگانه\nچه نقش‌ها که برانگیختیم و سود نداشت\nفسون ما بر او گشته است افسانه\nبر آتش رخ زیبای او به جای سپند\nبه غیر خال سیاهش که دید به دانه؟\nبه مژده، جان به صبا داد شمع در نفسی\nز شمع روی تواَش چون رسید پروانه\nمرا به دور لب دوست هست پیمانی\nکه بر زبان نبرم جز حدیث پیمانه\nحدیث مدرسه و خانقه مگوی که باز\nفتاد در سر حافظ هوای میخانه"},{"id":428,"poem":"سحرگاهان، که مخمورِ شبانه\nگرفتم باده با چنگ و چَغانه\nنهادم عقل را ره ‌توشه از مِی،\nزِ شهرِ هستی‌اش کردم روانه\nنگارِ مِی‌فروشم عشوه‌ای داد،\nکه ایمن گشتمَ از مکرِ زمانه\nزِ ساقیِ کمان ‌ابرو شنیدم؛\nکه ای تیرِ ملامت را نشانه!\nنبندی زان میان طرفی، کمروار،\nاگر خود را ببینی در میانه\nبرو، این دام بر مرغی دگر نِه\nکه عَنقا را بلند است آشیانه!\nکِه بَندد طرفِ وصل ازْ حُسنِ شاهی؟\nکِه با خود عشق بازد جاودانه‌؟\nندیم و مطرب و ساقی، همه اوست؛\nخیالِ آب و گل در رَه، بهانه\nبِده کشتیِ مِی تا خوش برانیم،\nاز این دریایِ ناپیداکرانه\nوجودِ ما معمایی‌ست، حافظ؛\nکه تحقیقش، فُسون است و فِسانه"},{"id":429,"poem":"ساقی بیا که شد قدحِ لاله پر ز می\nطامات تا به چند و خرافات تا به کی؟\nبگذر ز کبر و ناز که دیده‌ست روزگار\nچینِ قبای قیصر و طرْفِ کلاهِ کی\nهشیار شو که مرغِ چمن مست گشت، هان\nبیدار شو که خوابِ عدم در پی است، هی\nخوش‌نازکانه می‌چمی ای شاخ نوبهار!\nکآشفتگی مبادت از آشوبِ بادِ دی\nبر مِهرِ چرخ و شیوهٔ او اعتماد نیست\nای وای بر کسی که شد ایمن ز مکرِ وی\nفردا شرابِ کوثر و حور از برای ماست\nو امروز نیز ساقیِ مه‌روی و جام می\nبادِ صبا ز عهدِ صبی یاد می‌دهد\nجان‌دارویی که غم ببرد درده ای صبی!\nحشمت مبین و سلطنتِ گل، که بسپرد\nفراشِ باد هر ورقش را به زیر پی\nدرده به یاد حاتمِ طی جام یک منی\nتا نامهٔ سیاه بخیلان کنیم طی\nزآن می که داد حُسن و لطافت به ارغوان\nبیرون فکند لطف مزاج از رخش به خوی\nمسند به باغ بر که به خدمت چو بندگان\nاستاده است سرو و کمر بسته است نی\nحافظ حدیثِ سحرفریبِ خوشت رسید\nتا حدِ مصر و چین و به اطرافِ روم و ری"},{"id":430,"poem":"به صوتِ بلبل و قمری اگر ننوشی می\nعلاج کی کُنمت؟ آخِرالدَواءِ الْکَیْ\nذخیره‌ای بنهْ از رنگ و بویِ فصل بهار\nکه می‌رسند ز پی، رهزنانِ بهمن و دی\nچو گُل نقاب برافکنْد و مرغ زد هوهو\nمَنهْ ز دست پیاله، چه می‌کُنی؟ هی‌هی\nشُکوهِ سلطنت و حُسن، کی ثَباتی داد؟\nز تختِ جَم سخنی مانده است و افسرِ کَی\nخزینه‌داری میراث‌خوارگان کفر است\nبه قولِ مطرب و ساقی، به فَتویِ دَف و نی\nزمانه هیچ نبَخشد که باز نستانَد\nمجو ز سفله مروَّت، که شَیئُهُ لا شَی\nنوشته‌اند بر اِیوانِ جَنةُ المَأویٰ\nکه هر که عشوهٔ دُنییِ خرید، وای به وی\nسَخا نمانْد، سخن طی کنم، شراب کجاست؟\nبده به شادیِ روح و روانِ حاتمِ طَی\nبخیل، بوی خدا نشنود بیا حافظ\nپیاله گیر و کَرَم وَرز، وَ الضَّمانُ عَلَيّ"},{"id":431,"poem":"لبش می‌بوسم و در می‌کشم می\nبه آب زندگانی برده‌ام پی\nنه رازش می‌توانم گفت با کس\nنه کس را می‌توانم دید با وی\nلبش می‌بوسد و خون می‌خورد جام\nرخش می‌بیند و گل می‌کند خوی\nبده جام می و از جم مکن یاد\nکه می‌داند که جم کی بود و کی کی؟\nبزن در پرده چنگ ای ماه مطرب!\nرگش بخراش تا بخروشم از وی\nگل از خلوت به باغ آورد مسند\nبساط زهد همچون غنچه کن طی\nچو چشمش مست را مخمور مگذار\nبه یاد لعلش ای ساقی بده می\nنجوید جان از آن قالب جدایی\nکه باشد خونِ جامش در رگ و پی\nزبانت درکِش ای حافظ زمانی\nحدیث بی‌زبانان بشنو از نی"},{"id":432,"poem":"مخمور جام عشقم، ساقی بده شرابی\nپُر کن قدح که بی مِی، مجلس ندارد آبی\nوصف رخ چو ماهش، در پرده راست نآید\nمطرب بزن نوایی، ساقی بده شرابی\nشد حلقه، قامت من، تا بعد از این رقیبت\nزین در دگر نراند، ما را به هیچ بابی\nدر انتظار رویت، ما و امیدواری\nدر عشوهٔ وصالت، ما و خیال و خوابی\nمخمور آن دو چشمم، آیا کجاست جامی؟\nبیمار آن دو لعلم، آخر کم از جوابی\nحافظ چه می‌نهی دل، تو در خیال خوبان\nکی تشنه سیر گردد، از لمعهٔ سرابی؟"},{"id":433,"poem":"ای که بر ماه از خط مشکین نقاب انداختی\nلطف کردی سایه‌ای بر آفتاب انداختی\nتا چه خواهد کرد با ما آب و رنگ عارضت\nحالیا نیرنگ نقشی خوش بر آب انداختی\nگویِ خوبی بردی از خوبانِ خَلَّخ شاد باش\nجام کیخسرو طلب، کافراسیاب انداختی\nهرکسی با شمع رخسارت به وجهی عشق باخت\nزان میان پروانه را در اضطراب انداختی\nگنج عشق خود نهادی در دل ویران ما\nسایهٔ دولت بر این کنج خراب انداختی\nزینهار از آب آن عارض که شیران را از آن\nتشنه‌لب کردی و گردان را در آب انداختی\nخواب بیداران ببستی وآن گه از نقش خیال\nتهمتی بر شب‌روان خیل خواب انداختی\nپرده از رخ برفکندی یک نظر در جلوه‌گاه\nوز حیا حور و پری را در حجاب انداختی\nباده نوش از جام عالم بین که بر اورنگ جم\nشاهد مقصود را از رخ نقاب انداختی\nاز فریب نرگس مخمور و لعل مِی‌پرست\nحافظ خلوت‌نشین را در شراب انداختی\nوز برای صید دل در گردنم زنجیر زلف\nچون کمند خسرو مالک رقاب انداختی\nداور داراشکوه‌ ای آن که تاج آفتاب\nاز سر تعظیم بر خاک جناب انداختی\nنصرة الدّین شاه یحیی آن که خصم ملک را\nاز دم شمشیر چون آتش در آب انداختی"},{"id":434,"poem":"ای دل مباش یک دم خالی ز عشق و مستی\nوآنگه برو که رستی از نیستی و هستی\nگر جان به تن ببینی مشغول کار او شو\nهر قبله‌ای که بینی بهتر ز خودپرستی\nبا ضعف و ناتوانی همچون نسیم خوش باش\nبیماری اندر این ره بهتر ز تندرستی\nدر مذهب طریقت خامی نشان کفر است\nآری طریقِ دولت چالاکی است و چستی\nتا فضل و عقل بینی بی‌معرفت نشینی\nیک نکته‌ات بگویم خود را مبین که رستی\nدر آستان جانان از آسمان میندیش\nکز اوج سربلندی افتی به خاک پستی\nخار ارچه جان بکاهد گل عذر آن بخواهد\nسهل است تلخی می در جنب ذوق مستی\nصوفی پیاله‌پیما حافظ قرابه‌‌پرهیز\nای کوته‌آستینان تا کی درازدستی؟"},{"id":435,"poem":"با مدّعی مگویید، اسرارِ عشق و مستی\nتا بی‌خبر بمیرد، در دردِ خودپرستی\nعاشق شو اَر نَهْ روزی، کارِ جهان سرآید\nناخوانده نقشِ مقصود، از کارگاهِ هستی\nدوش آن صنم چه خوش گفت، در مجلسِ مُغانَم\n«با کافران چه کارت؟ گر بت نمی‌پرستی»\nسلطانِ من خدا را، زُلفَت شکست ما را\nتا کِی کُنَد سیاهی، چندین درازدستی؟\nدر گوشهٔ سلامت، مستور چون توان بود\nتا نرگسِ تو با ما، گوید رموزِ مستی\nآن روز دیده بودم، این فتنه‌ها که برخاست\nکز سرکشی، زمانی، با ما نمی‌نشستی\nعشقت، به دستِ طوفان، خواهد سپرد حافظ\nچون برق، از این کشاکش، پنداشتی که جستی"},{"id":436,"poem":"آن غالیه‌خط گر سوی ما نامه نوشتی\nگردون ورق هستی ما درننوشتی\nهر چند که هجران ثمر وصل برآرد\nدهقان جهان! کاش که این تخم نکِشتی\nآمرزش نقد است کسی را که در این جا\nیاری‌ست چو حوری و سرایی چو بهشتی\nدر مصطبهٔ عشق تنعم نتوان کرد\nچون بالش زر نیست، بسازیم به خشتی\nمفروش به باغ ارم و نخوت شداد\nیک شیشه می و نوش‌لبی و لبِ کِشتی\nتا کی غم دنیای دنی ای دل دانا؟\nحیف است ز خوبی که شود عاشق زشتی\nآلودگی خرقه، خرابی جهان است\nکو راهروی، اهلِ دلی، پاک‌سرشتی؟\nاز دست چرا هِشت سرِ زلف تو حافظ؟\nتقدیر چنین بود، چه کردی که نهِشتی؟"},{"id":437,"poem":"ای قصهٔ بهشت ز کویت حکایتی\nشرح جمال حور ز رویت روایتی\nانفاس عیسی از لب لعلت لطیفه‌ای\nآب خضر ز نوش لبانت کنایتی\nهر پاره از دل من و از غصه قصه‌ای\nهر سطری از خصال تو و از رحمت آیتی\nکی عطرسای مجلس روحانیان شدی؟\nگل را اگر نه بوی تو کردی رعایتی\nدر آرزوی خاک در یار سوختیم\nیاد آور ای صبا که نکردی حمایتی\nای دل به هرزه دانش و عمرت به باد رفت\nصد مایه داشتی و نکردی کفایتی\nبوی دل کباب من آفاق را گرفت\nاین آتش درون بکند هم سرایتی\nدر آتش ار خیال رخش دست می‌دهد\nساقی بیا که نیست ز دوزخ شکایتی\nدانی مراد حافظ از این درد و غصه چیست؟\nاز تو کرشمه‌ای و ز خسرو عنایتی"},{"id":438,"poem":"سَبَتْ سَلْمیٰ بِصُدْغَیها فُؤادي\nو رُوحي کُلَّ یَومٍ لي یُنادي\nنگارا بر من بی‌دل ببخشای\nو واصِلْني علی رَغْمِ الْأَعادي\nحبیبا در غم سودای عشقت\nتَوَکَّلْنا علی رَبِّ الْعِبادِ\nأَ مَنْ اَنْکَرْتَني عَن عشق سَلْمیٰ\nتُزَاوَّل آن روی نِهْکو بِوادی\nکه همچون مُت به بوتَن دل وَ اِی رَه\nغَریقُ الْعِشقِ في بَحْرِ الْوِدادِ\nبه پی‌ماچان غَرامت بِسپُریمَن\nغَرَت یک وی رَوِشتی از اَما دی\nغم این دل بِواتَت خورد ناچار\nو غَر نه او بِنی آنچَت نَشادی\nدل حافظ شد اندر چین زلفت\nبِلَیلٍ مُظْلِمٍ وَ اللّهُ هادي"},{"id":439,"poem":"دیدم به خواب دوش که ماهی برآمدی\nکز عکس روی او شب هجران سر آمدی\nتعبیر رفت «یار سفرکرده می‌رسد»\nای کاج هر چه زودتر از در درآمدی\nذکرش به خیر ساقی فرخنده‌فال من\nکز در مدام با قدح و ساغر آمدی\nخوش بودی ار به خواب بدیدی دیار خویش\nتا یاد صحبتش سوی ما رهبر آمدی\nفیض ازل به زور و زر ار آمدی به دست\nآب خضر نصیبه اسکندر آمدی\nآن عهد یاد باد که از بام و در مرا\nهر دم پیام یار و خط دلبر آمدی\nکی یافتی رقیب تو چندین مجال ظلم؟\nمظلومی ار شبی به در داور آمدی\nخامان ره نرفته چه دانند ذوق عشق\nدریادلی بجوی دلیری سرآمدی\nآن کو تو را به سنگ‌دلی کرد رهنمون\nای کاشکی که پاش به سنگی برآمدی\nگر دیگری به شیوهٔ حافظ زدی رقم\nمقبول طبع شاه هنرپرور آمدی"},{"id":440,"poem":"سحر با باد می‌گفتم حدیث آرزومندی\nخطاب آمد که «واثق شو، به الطاف خداوندی»\nدعای صبح و آهِ شب، کلید گنج مقصود است\nبدین راه و روش می‌رو، که با دلدار پیوندی\nقلم را آن زبان نَبوَد، که سرِّ عشق گوید باز\nورای حدّ تقریر است، شرح آرزومندی\nالا ای یوسف مصری که کردت سلطنت مغرور!\nپدر را باز پرس آخر، کجا شد مِهرِ فرزندی؟\nجهانِ پیرِ رعنا را، ترحّم در جِبِلَّت نیست\nز مِهر او چه می‌پرسی؟ در او همّت چه می‌بندی؟\nهمایی چون تو عالی‌قدر، حرص استخوان تا کی؟\nدریغ آن سایهٔ همّت، که بر نااهل افکندی\nدر این بازار اگر سودی‌ست، با درویش خرسند است\nخدایا منعَمم گردان به درویشی و خرسندی\nبه شعر حافظِ شیراز می‌رقصند و می‌نازند\nسیه‌چشمان کشمیری و تُرکان سمرقندی"},{"id":441,"poem":"چه بودی ار دل آن ماه مهربان بودی؟\nکه حال ما نه چنین بودی ار چنان بودی\nبگفتمی که «چه ارزد نسیم طرهٔ دوست؟»\nگرم به هر سر مویی هزار جان بودی\nبرات خوش‌دلی ما چه کم شدی یا رب\nگرش نشان امان از بد زمان بودی\nگرَم زمانه سرافراز داشتی و عزیز\nسریر عزتم آن خاک آستان بودی\nز پرده کاش برون آمدی چو قطرهٔ اشک\nکه بر دو دیدهٔ ما حکم او روان بودی\nاگر نه دایرهٔ عشق راه بربستی\nچو نقطه حافظ سرگشته در میان بودی"},{"id":442,"poem":"به جان او که گرم دسترس به جان بودی\nکمینه پیشکش بندگانش آن بودی\nبگفتمی که «بها چیست خاک پایش را؟»\nاگر حیات گران مایه جاودان بودی\nبه بندگی قدش سرو معترف گشتی\nگرش چو سوسن آزاده ده زبان بودی\nبه خواب نیز نمی‌بینمش چه جای وصال\nچو این نبود و ندیدیم باری آن بودی\nاگر دلم نشدی پایبند طرهٔ او\nکی‌اش قرار در این تیره‌خاکدان بودی؟\nبه رخ چو مهرِ فلک بی‌نظیرِ آفاق است\nبه دل دریغ که یک ذره مهربان بودی\nدرآمدی ز درم کاشکی چو لمعهٔ نور\nکه بر دو دیدهٔ ما حکم او روان بودی\nز پرده نالهٔ حافظ برون کی افتادی؟\nاگر نه همدم مرغان صبح خوان بودی"},{"id":443,"poem":"چو سرو اگر بخرامی دمی به گلزاری\nخورد ز غیرت روی تو هر گلی خاری\nز کفر زلف تو، هر حلقه‌ای و آشوبی\nز سحر چشم تو، هر گوشه‌ای و بیماری\nمرو چو بخت من ای چشم مست یار به خواب\nکه در پی است ز هر سویت آه بیداری\nنثار خاک رهت نقد جان من هر چند\nکه نیست نقد روان را بر تو مقداری\nدلا! همیشه مزن لاف زلف دلبندان\nچو تیره‌رأی شوی کی گشایدت کاری؟\nسرم برفت و زمانی به سر نرفت این کار\nدلم گرفت و نبودت غم گرفتاری\nچو نقطه گفتمش «اندر میان دایره آی»\nبه خنده گفت که «ای حافظ! این چه پرگاری»"},{"id":444,"poem":"شهری‌ست پُر ظریفان وز هر طرف نگاری\nیاران! صلای عشق است گر می‌کنید کاری\nچشم فلک نبیند زین طُرفه‌تر جوانی\nدر دست کس نیفتد زین خوب‌تر نگاری\nهرگز که دیده باشد جسمی ز جان مُرَکَّب؟\nبر دامنش مبادا زین خاکیان غباری\nچون من شکسته‌ای را از پیش خود چه رانی؟\nکم غایت توقع بوسی‌ست یا کناری\nمِی بی‌غش است دریاب، وقتی خوش است بشتاب\nسال دگر که دارد امّید نوبهاری؟\nدر بوستان حریفان مانند لاله و گل\nهر یک گرفته جامی بر یادِ رویِ یاری\nچون این گره گشایم؟ وین راز چون نمایم؟\nدردی و سخت دردی، کاری و صعب کاری\nهر تار موی حافظ در دست زلفِ شوخی\nمشکل توان نشستن در این چنین دیاری"},{"id":445,"poem":"تو را که هر چه مراد است در جهان داری\nچه غم ز حال ضعیفان ناتوان داری؟\nبخواه جان و دل از بنده و روان بستان\nکه حکم بر سر آزادگان روان داری\nمیان نداری و دارم عجب که هر ساعت\nمیان مجمع خوبان کنی میان‌داری\nبیاضِ رویِ تو را، نیست نقشِ دَرخور از آنک\nسوادی از خط مشکین بر ارغوان داری\nبنوش می که سبک‌روحی و لطیف مدام\nعلی الخصوص در آن دم که سر گران داری\nمکن عتاب از این بیش و جور بر دل ما\nمکن هر آن چه توانی که جای آن داری\nبه اختیارت اگر صد هزار تیر جفاست\nبه قصد جانِ منِ خسته در کمان داری\nبکِش جفای رقیبان مدام و جور حسود\nکه سهل باشد اگر یارِ مهربان داری\nبه وصل دوست گرت دست می‌دهد یک دم\nبرو که هر چه مراد است در جهان داری\nچو گل به دامن از این باغ می‌بری حافظ\nچه غم ز ناله و فریاد باغبان داری؟"},{"id":446,"poem":"صبا تو نکهت آن زلف مشک بو داری\nبه یادگار بمانی که بوی او داری\nدلم که گوهر اسرار حسن و عشق در اوست\nتوان به دست تو دادن گرش نکو داری\nدر آن شمایل مطبوع هیچ نتوان گفت\nجز این قدر که رقیبان تندخو داری\nنوای بلبلت ای گل کجا پسند افتد\nکه گوش و هوش به مرغان هرزه گو داری\nبه جرعه تو سرم مست گشت نوشت باد\nخود از کدام خم است این که در سبو داری\nبه سرکشی خود ای سرو جویبار مناز\nکه گر بدو رسی از شرم سر فروداری\nدم از ممالک خوبی چو آفتاب زدن\nتو را رسد که غلامان ماه رو داری\nقبای حسن فروشی تو را برازد و بس\nکه همچو گل همه آیین رنگ و بو داری\nز کنج صومعه حافظ مجوی گوهر عشق\nقدم برون نه اگر میل جست و جو داری"},{"id":447,"poem":"بیا با ما مَوَرز این کینه‌داری\nکه حق صحبت دیرینه داری\nنصیحت گوش کن کاین در بسی به\nاز آن گوهر که در گنجینه داری\nولیکن کی نمایی رخ به رندان؟\nتو کز خورشید و مه آیینه داری\nبدِ رندان مگو ای شیخ و هُش دار\nکه با حکم خدایی کینه داری\nنمی‌ترسی ز آه آتشینم؟\nتو دانی خرقهٔ پشمینه داری؟\nبه فریاد خمار مفلسان رس\nخدا را گر میِ دوشینه داری\nندیدم خوش‌تر از شعر تو حافظ\nبه قرآنی که اندر سینه داری"},{"id":448,"poem":"ای که در کوی خرابات مقامی داری\nجم وقت خودی ار دست به جامی داری\nای که با زلف و رخِ یار گذاری شب و روز\nفرصتت باد که خوش صبحی و شامی داری\nای صبا! سوختگان بر سر ره منتظرند\nگر از آن یار سفرکرده پیامی داری\nخال سرسبز تو خوش دانهٔ عیشی‌ست ولی\nبر کنار چمنش وه که چه دامی داری\nبوی جان از لب خندان قدح می‌شنوم\nبشنو ای خواجه اگر زان که مشامی داری\nچون به هنگام وفا هیچ ثباتیت نبود\nمی‌کنم شکر که بر جور دوامی داری\nنام نیک ار طلبد از تو غریبی چه شود؟\nتویی امروز در این شهر که نامی داری\nبس دعای سحرت مونس جان خواهد بود\nتو که چون حافظ شب‌خیز غلامی داری"},{"id":449,"poem":"ای که مهجوری عشاق روا می‌داری\nعاشقان را ز بر خویش جدا می‌داری\nتشنهٔ بادیه را هم به زلالی دریاب\nبه امیدی که در این ره به خدا می‌داری\nدل ببردی و بحل کردمت ای جان لیکن\nبه از این دار نگاهش که مرا می‌داری\nساغر ما که حریفان دگر می‌نوشند\nما تحمل نکنیم ار تو روا می‌داری\nای مگس حضرت سیمرغ نه جولانگه توست\nعرض خود می‌بری و زحمت ما می‌داری\nتو به تقصیر خود افتادی از این در محروم\nاز که می‌نالی و فریاد چرا می‌داری؟\nحافظ از پادشهان پایه به خدمت طلبند\nسعی نابرده چه امید عطا می‌داری؟"},{"id":450,"poem":"روزگاری‌ست که ما را نگران می‌داری\nمخلصان را نه به وضع دگران می‌داری\nگوشهٔ چشمِ رضایی به مَنَتْ باز نشد\nاین چنین عزت صاحب‌نظران می‌داری؟\nساعد آن به که بپوشی تو چو از بهرِ نگار\nدست در خونِ دلِ پُرهنران می‌داری\nنه گل از دستِ غمت رست و نه بلبل در باغ\nهمه را نعره‌زنان جامه‌دران می‌داری\nای که در دلقِ مُلَمَّع طلبی نقد حضور\nچشم سری عجب از بی‌خبران می‌داری؟\nچون تویی نرگسِ باغ نظر ای چشم و چراغ\nسر چرا بر من دل‌خسته گران می‌داری؟\nگوهر جام‌جم از کانِ جهانی دگر است\nتو تمنّا ز گِلِ کوزه‌گران می‌داری\nپدر تجربه ای دل تویی آخر ز چه روی\nطمع مهر و وفا زین پسران می‌داری؟\nکیسهٔ سیم و زرت پاک بباید پرداخت\nاین طمع‌ها که تو از سیم‌بران می‌داری\nگر چه رندیّ و خرابیّ گنهِ ماست، ولی\nعاشقی گفت که تو بنده بر آن می‌داری\nمگذران روزِ سلامت به ملامت حافظ\nچه توقع ز جهانِ گذران می‌داری؟"},{"id":451,"poem":"خوش کرد یاوری فلکت روز داوری\nتا شکر چون کنی و چه شکرانه آوری\nآن کس که اوفتاد خدایش گرفت دست\nگو بر تو باد تا غم افتادگان خوری\nدر کوی عشق شوکت شاهی نمی‌خرند\nاقرار بندگی کن و اظهار چاکری\nساقی به مژدگانی عیش از درم درآی\nتا یک دم از دلم غم دنیا به در بری\nدر شاه‌راه جاه و بزرگی خطر بسی‌ست\nآن به کز این گریوه سبک‌بار بگذری\nسلطان و فکر لشکر و سودای تاج و گنج\nدرویش و امن خاطر و کنج قلندری\nیک حرف صوفیانه بگویم اجازت است؟\nای نور دیده صلح به از جنگ و داوری\nنیل مراد بر حسب فکر و همت است\nاز شاه نذر خیر و ز توفیق یاوری\nحافظ غبار فقر و قناعت ز رخ مشوی\nکاین خاک بهتر از عمل کیمیاگری"},{"id":452,"poem":"طُفیلِ هستیِ عشقند آدمیّ و پَری\nارادتی بنما تا سعادتی بِبَری\nبکوش خواجه و از عشق بی‌نصیب مباش\nکه بنده را نخرد کس به عیب بی‌هنری\nمی صبوح و شکرخواب صبحدم تا چند؟\nبه عذر نیم‌شبی کوش و گریهٔ سحری\nتو خود چه لعبتی ای شهسوار شیرین‌کار\nکه در برابر چشمیّ و غایب از نظری؟\nهزار جان مقدّس بسوخت زین غیرت\nکه هر صباح و مسا شمع مجلس دگری\nز من به حضرت آصف که می‌برد پیغام\nکه یاد گیر دو مصرع ز من به نظم دری؟\nبیا که وضع جهان را چنان که من دیدم\nگر امتحان بکنی مِی خوریّ و غم نخوری\nکلاه سروریَت کج مباد بر سر حُسن\nکه زیبِ بخت و سزاوارِ مُلک و تاجِ سری\nبه بوی زُلف و رُخت می‌روند و می‌آیند\nصبا به غالیه ساییّ و گل به جلوه‌گری\nچو مستعّد نظر نیستی وصال مجوی\nکه جام جم نکند سود وقت بی‌بصری\nدعای گوشه‌نشینان بلا بگرداند\nچرا به گوشهٔ چشمی به ما نمی‌نگری؟\nبیا و سلطنت از ما بخر به مایهٔ حسن\nوَزین معامله غافل مشو که حیف خوری\nطریق عشق طریقی عجب خطرناک است\nنعوذبالله اگر ره به مقصدی نبری\nبه یُمنِ همّتِ حافظ امید هست که باز\nاَریٰ اُسامِرُ لیلایَ لَیلةَ القَمَری"},{"id":453,"poem":"ای که دایم به خویش مغروری\nگر تو را عشق نیست معذوری\nگِرد دیوانگانِ عشق مگرد\nکه به عقلِ عقیله مشهوری\nمستیِ عشق نیست در سرِ تو\nرو که تو مستِ آبِ انگوری\nروی زرد است و آه دردآلود\nعاشقان را دوایِ رنجوری\nبگذر از نام و ننگ خود حافظ\nساغر مِی‌ طلب که مخموری"},{"id":454,"poem":"ز کوی یار می‌آید نسیمِ بادِ نوروزی\nاز این باد ار مدد خواهی، چراغِ دل برافروزی\nچو گل گر خرده‌ای داری، خدا را صرفِ عشرت کن\nکه قارون را غلط‌ها داد، سودای زراندوزی\nز جام گل، دگر بلبل، چنان مستِ میِ لعل است\nکه زد بر چرخ فیروزه صفیرِ تختِ فیروزی\nبه صحرا رو که از دامن، غبارِ غم بیَفشانی\nبه گلزار آی کز بلبل، غزل گفتن بیاموزی\nچو امکانِ خُلود ای دل! در این فیروزه‌ایوان نیست\nمجال عیش فرصت دان، به فیروزی و بهروزی\nطریق کام‌بخشی چیست؟ ترکِ کامِ خود کردن\nکلاهِ سروری آن است، کز این ترک بر دوزی\nسخن در پرده می‌گویم، چو گل از غنچه بیرون آی\nکه بیش از پنج روزی نیست، حکمِ میرِ نوروزی\nندانم نوحهٔ قمری، به طرْف جویباران چیست\nمگر او نیز همچون من، غمی دارد شبان‌روزی؟\nمِیی دارم چو جان، صافی و صوفی می‌کند عیبش\nخدایا هیچ عاقل را، مبادا بختِ بد، روزی\nجدا شد یار شیرینت، کنون تنها نشین ای شمع!\nکه حکم آسمان این است اگر سازی و گر سوزی\nبه عُجْبِ علم نتوان شد، ز اسباب طرب محروم\nبیا ساقی که جاهل را هنی‌تر می‌رسد روزی\nمِی اندر مجلسِ آصف، به نوروزِ جلالی نوش\nکه بخشد جرعهٔ جامت، جهان را سازِ نوروزی\nنه حافظ می‌کند تنها دعای خواجه توران‌شاه\nز مدح آصفی خواهد، جهان عیدی و نوروزی\nجنابش پارسایان راست، محراب دل و دیده\nجبینش صبح‌خیزان راست، روز فتح و فیروزی"},{"id":455,"poem":"عمر بگذشت به بی‌حاصلی و بوالهوسی\nای پسر جام مِی‌ام ده که به پیری برسی\nچه شکرهاست در این شهر که قانع شده‌اند\nشاه‌بازانِ طریقت به مقامِ مگسی\nدوش در خیل غلامان درش می‌رفتم\nگفت: «ای عاشق بیچاره تو باری چه کسی؟»\nبا دل خون‌شده چون نافه خوشش باید بود\nهر که مشهور جهان گشت به مشکین‌نفسی\nلمع البرق مِن الطّور و آنَستُ بهِ\nفلَعَلّی لک آتٍ بشهابٍ قبسِ\nکاروان رفت و تو در خواب و بیابان در پیش\nوه که بس بی‌خبر از غلغل چندین جرسی\nبال بگشا و صفیر از شجر طوبی زن\nحیف باشد چو تو مرغی که اسیر قفسی\nتا چو مجمر نفسی دامن جانان گیرم\nجان نهادیم بر آتش ز پی خوش‌نفسی\nچند پوید به هوای تو ز هر سو حافظ\nیَسَر الله طریقاً بکَ یا ملتمِسی"},{"id":456,"poem":"نوبهار است در آن کوش که خوش‌دل باشی\nکه بسی گُل بدمد باز و تو در گِل باشی\nمن نگویم که کنون با که نشین و چه بنوش\nکه تو خود دانی اگر زیرک و عاقل باشی\nچنگ در پرده همین می‌دهدت پند ولی\nوعظت آن گاه کند سود که قابل باشی\nدر چمن هر ورقی دفتر حالی دگر است\nحیف باشد که ز کار همه غافل باشی\nنقد عمرت ببرد غصهٔ دنیا به گزاف\nگر شب و روز در این قصهٔ مشکل باشی\nگر چه راهی‌ست پر از بیم ز ما تا بر دوست\nرفتن آسان بود ار واقف منزل باشی\nحافظا گر مدد از بخت بلندت باشد\nصید آن شاهد مطبوع‌شمایل باشی"},{"id":457,"poem":"هزار جهد بکردم که یار من باشی\nمرادبخش دل بی‌قرار من باشی\nچراغِ دیدهٔ شب‌زنده‌دار من گردی\nانیسِ خاطر امّیدوار من باشی\nچو خسروانِ ملاحت، به بندگان نازند\nتو در میانه، خداوندگار من باشی\nاز آن عقیق که خونین‌دلم ز عشوهٔ او\nاگر کنم گله‌ای غم‌گسار من باشی\nدر آن چمن که بتان، دست عاشقان گیرند\nگرت ز دست برآید، نگار من باشی\nشبی به کلبهٔ احزانِ عاشقان آیی\nدمی انیسِ دلِ سوگوارِ من باشی\nشود غزالهٔ خورشید، صید لاغر من\nگر آهویی چو تو یک دم، شکار من باشی\nسه بوسه کز دو لبت، کرده‌ای وظیفهٔ من\nاگر ادا نکنی، قرض‌دار من باشی\nمن این مراد ببینم به خود که نیم‌شبی\nبه جای اشک روان، در کنار من باشی\nمن ار چه حافظ شهرم، جویی نمی‌ارزم\nمگر تو از کرم خویش، یار من باشی"},{"id":458,"poem":"ای دل آن دم که خراب از می گلگون باشی\nبی زر و گنج به صد حشمت قارون باشی\nدر مقامی که صدارت به فقیران بخشند\nچشم دارم که به جاه از همه افزون باشی\nدر ره منزل لیلی که خطرهاست در آن\nشرط اول قدم آن است که مجنون باشی\nنقطهٔ عشق نمودم به تو هان سهو مکن\nور نه چون بنگری از دایره بیرون باشی\nکاروان رفت و تو در خواب و بیابان در پیش\nکی روی؟ ره ز که پرسی؟ چه کنی؟ چون باشی؟\nتاج شاهی طلبی، گوهر ذاتی بنمای\nور خود از تخمهٔ جمشید و فریدون باشی\nساغری نوش کن و جرعه بر افلاک فشان\nچند و چند از غم ایام جگرخون باشی؟\nحافظ از فقر مکن ناله که گر شعر این است\nهیچ خوش‌دل نپسندد که تو محزون باشی"},{"id":459,"poem":"زین خوش رقم که بر گل رخسار می‌کشی\nخط بر صحیفهٔ گل و گلزار می‌کشی\nاشک حرم‌نشین نهان‌خانهٔ مرا\nزان سوی هفت‌پرده به بازار می‌کشی\nکاهل روی چو باد صبا را به بوی زلف\nهر دم به قید سلسله در کار می‌کشی\nهر دم به یاد آن لب میگون و چشم مست\nاز خلوتم به خانهٔ خمار می‌کشی\nگفتی سر تو بستهٔ فتراک ما شود\nسهل است اگر تو زحمت این بار می‌کشی\nبا چشم و ابروی تو چه تدبیر دل کنم؟\nوه زین کمان که بر من بیمار می‌کشی\nبازآ که چشم بد ز رخت دفع می‌کند\nای تازه گل که دامن از این خار می‌کشی\nحافظ دگر چه می‌طلبی از نعیم دهر\nمی می‌خوری و طرهٔ دلدار می‌کشی"},{"id":460,"poem":"سُلَیمیٰ مُنذُ حَلَّت بِالْعراقِ\nأُلاقی مِن نَواها ما أُلاقی\nالا ای ساروان منزل دوست\nإِلی رُکبانِکُم طالَ اشْتیاقی\nخِرَد در زنده‌رود انداز و می نوش\nبه گلبانگ جوانان عراقی\nرَبیعُ العُمرِ فی مَرعیٰ حِماکُم\nحَماکَ اللّهُ یا عَهدَ التَّلاقی\nبیا ساقی بده رَطْل گرانم\nسَقاکَ اللّهُ مِن کَأسٍ دِهاقِ\nجوانی باز می‌آرد به یادم\nسماع چنگ و دست افشان ساقی\nمی باقی بده تا مست و خوشدل\nبه یاران برفَشانم عمر باقی\nدرونم خون شد از نادیدن دوست\nأَلا تَعْساً لِأیّامِ الفِراقِ\nدُموعی بَعدَکُم لا تَحْقِروها\nفَکَم بحرٍ عَمیقٍ مِن سَواقِ\nدمی با نیکخواهان متفق باش\nغنیمت دان امور اتفاقی\nبساز ای مطرب خوشخوان خوشگو\nبه شعر فارسی، صوت عراقی\nعروسی بس خوشی ای دختر رَز\nولی گه گه سزاوار طلاقی\nمسیحای مجرد را برازد\nکه با خورشید سازد هم‌وُثاقی\nوصال دوستان روزی ما نیست\nبخوان حافظ غزل‌های فراقی"},{"id":461,"poem":"کَتَبتُ قِصَّةَ شَوقی و مَدمَعی باکی\nبیا که بی تو به جان آمدم ز غمناکی\nبسا که گفته‌ام از شوق با دو دیدهٔ خود\nأیا مَنازِلَ سَلمیٰ فَأینَ سَلماکِ؟\nعجیب واقعه‌ای و غریب حادثه‌ای\nأنَا اصْطَبَرتُ قَتیلاً و قاتِلی شاکی\nکه را رسد که کند عیب دامن پاکت؟\nکه همچو قطره که بر برگ گل چکد پاکی\nز خاک پای تو داد آب، روی لاله و گل\nچو کِلک صُنع رقم زد به آبی و خاکی\nصبا عبیرفشان گشت ساقیا برخیز\nو هاتِ شَمسَةَ کَرْمٍ مُطَیَّبٍ زاکی\nدَعِ التَّکاسُلَ تَغْنَمْ فَقَد جَری مَثَلٌ\nکه زادِ راهروان چستی است و چالاکی\nاثر نماند ز من، بی شمایلت، آری\nأرَی مَآثِرَ مَحیایَ مِن مُحَیّاکِ\nز وصف حسن تو حافظ چگونه نطق زند؟\nکه همچو صنع خدایی ورای ادراکی"},{"id":462,"poem":"یا مُبْسِماً یُحاکي دُرْجاً مِنَ اللِّآلي\nیا رب چه درخور آمد گِردَش خط هلالی\nحالی خیال وصلت خوش می‌دهد فریبم\nتا خود چه نقش بازد این صورت خیالی\nمی ده که گرچه گشتم نامه‌سیاه عالم\nنومید کی توان بود از لطف لایزالی\nساقی بیار جامی و از خلوتم برون کش\nتا در به در بگردم قَلّاش و لااُبالی\nاز چار چیز مگذر گر عاقلی و زیرک\nامن و شرابِ بی‌غش، معشوق و جای خالی\nچون نیست نقش دوران در هیچ حالْ ثابت\nحافظ مکن شکایت تا می خوریم حالی\nصافیست جام خاطر در دور آصف عهد\nقُمْ فَاسْقِني رَحیقاً أَصْفیٰ مِنَ الزُّلالِ\nاَلْمُلْکُ قَد تَباهیٰ مِن جِدِّهِ و جَدِّه\nیا رب که جاودان باد این قدر و این معالی\nمسندفروز دولت، کانِ شکوه و شوکت\nبرهان ملک و ملت بونصر بوالمعالی"},{"id":463,"poem":"سَلامُ اللّهِ ما کَرَّ اللَّیالي\nو جاوَبَتِ الْمثاني و الْمِثالي\nعَلیٰ وادِي الْأَراک و مَن عَلَیها\nو دارٍ بِاللَّویٰ فوقَ الرِّمالِ\nدعاگوی غریبان جهانم\nو أَدعُو بِالتَّواتُر و التَّوالي\nبه هر منزل که رو آرد خدا را\nنگه دارش به لطف لایزالی\nمنال ای دل که در زنجیر زلفش\nهمه جمعیت است آشفته حالی\nز خطت صد جمال دیگر افزود\nکه عمرت باد صد سال جلالی\nتو می‌باید که باشی ور نه سهل است\nزیانِ مایهٔ جاهی و مالی\nبر آن نقاش قدرت آفرین باد\nکه گرد مه کشد خط هلالی\nفَحُبُّک راحَتي في کُلِّ حینٍ\nو ذِکرُک مونِسي في کُلِّ حالِ\nسویدای دل من تا قیامت\nمباد از شوق و سودای تو خالی\nکجا یابم وصال چون تو شاهی\nمن بدنامِ رندِ لااُبالی\nخدا داند که حافظ را غرض چیست\nو عِلْمُ اللّهِ حَسْبي مِن سُؤالي"},{"id":464,"poem":"بگرفت کار حسنت چون عشق من کمالی\nخوش باش زان که نبود این هر دو را زوالی\nدر وهم می‌نگنجد کاندر تصور عقل\nآید به هیچ معنی زین خوب‌تر مثالی\nشد حظ عمر حاصل گر زان که با تو ما را\nهرگز به عمر روزی روزی شود وصالی\nآن دم که با تو باشم یک سال هست روزی\nوان دم که بی تو باشم یک لحظه هست سالی\nچون من خیال رویت جانا به خواب بینم؟\nکز خواب می‌نبیند، چشمم به جز خیالی\nرحم آر بر دل من کز مهر روی خوبت\nشد شخص ناتوانم باریک چون هلالی\nحافظ مکن شکایت گر وصل دوست خواهی\nزین بیشتر بباید بر هجرت احتمالی"},{"id":465,"poem":"رفتم به باغ صبحدمی تا چنم گلی\nآمد به گوش ناگهم آواز بلبلی\nمسکین چو من به عشق گلی گشته مبتلا\nو اندر چمن فکنده ز فریاد غلغلی\nمی‌گشتم اندر آن چمن و باغ دم به دم\nمی‌کردم اندر آن گل و بلبل تاملی\nگل یار حسن گشته و بلبل قرین عشق\nآن را تفضلی نه و این را تبدلی\nچون کرد در دلم اثر آواز عندلیب\nگشتم چنان که هیچ نماندم تحملی\nبس گل شکفته می‌شود این باغ را ولی\nکس بی بلای خار نچیده‌ست از او گلی\nحافظ مدار امید فرج از مدار چرخ\nدارد هزار عیب و ندارد تفضلی"},{"id":466,"poem":"این خرقه که من دارم در رهن شراب اولی\nوین دفتر بی‌معنی غرق می ناب اولی\nچون عمر تبه کردم چندان که نگه کردم\nدر کنج خراباتی افتاده خراب اولی\nچون مصلحت اندیشی دور است ز درویشی\nهم سینه پر از آتش هم دیده پرآب اولی\nمن حالت زاهد را با خلق نخواهم گفت\nاین قصه اگر گویم با چنگ و رباب اولی\nتا بی سر و پا باشد اوضاع فلک زین دست\nدر سر هوس ساقی در دست شراب اولی\nاز همچو تو دلداری دل برنکنم آری\nچون تاب کشم باری زان زلف به تاب اولی\nچون پیر شدی حافظ از میکده بیرون آی\nرندی و هوسناکی در عهد شباب اولی"},{"id":467,"poem":"زان می عشق، کز او پخته شود هر خامی\nگر چه ماه رمضان است بیاور جامی\nروزها رفت که دست من مسکین نگرفت\nزلف شمشادقدی، ساعد سیم‌اندامی\nروزه هر چند که مهمان عزیز است ای دل\nصحبتش موهبتی دان و شدن، انعامی\nمرغ زیرک به در خانقه اکنون نپرد\nکه نهاده‌ست به هر مجلس وعظی دامی\nگله از زاهد بدخو نکنم؛ رسم این است\nکه چو صبحی بدمد، در پی‌اش افتد شامی\nیار من چون بخرامد به تماشای چمن\nبرسانش ز من ای پیک صبا پیغامی\nآن حریفی که شب و روز می صاف کشد\nبود آیا که کند یاد ز دردآشامی؟\nحافظا گر ندهد دادِ دلت آصف عهد\nکام دشوار به دست آوری از خودکامی"},{"id":468,"poem":"که بَرَد به نزد شاهان ز من گدا پیامی؟\nکه به کوی مِی‌فروشان دو هزار جم به جامی\nشده‌ام خراب و بدنام و هنوز امیدوارم\nتو که کیمیافروشی نظری به قلب ما کن\nکه بضاعتی نداریم و فکنده‌ایم دامی\nعجب از وفای جانان که عنایتی نفرمود\nنه به نامه‌ای پیامی نه به خامه‌ای سلامی\nاگر این شراب خام است اگر آن حریف پخته\nبه هزار بار بهتر ز هزار پخته خامی\nز رهم میفکن ای شیخ به دانه‌های تسبیح\nکه چو مرغ، زیرک افتد نفتد به هیچ دامی\nسر خدمت تو دارم بخرم به لطف و مفروش\nکه چو بنده کمتر افتد به مبارکی غلامی\nبه کجا برم شکایت؟ به که گویم این حکایت؟\nکه لبت حیات ما بود و نداشتی دوامی\nبگشای تیر مژگان و بریز خون حافظ\nکه چنان کشنده‌ای را نکند کس انتقامی"},{"id":469,"poem":"أَتَتْ رَوائِحُ رَنْدِ الْحِمیٰ و زادَ غَرامی\nفدای خاک در دوست باد جان گرامی\nپیام دوست شنیدن سعادت است و سلامت\nمَنِ الْمُبَلِّغُ عَنّی إلی سُعادَ سلامی؟\nبیا به شام غریبان و آب دیدهٔ من بین\nبه سان بادهٔ صافی در آبگینهٔ شامی\nإذا تَغَرَّدَ عَن ذِی الْأَراکِ طائرُ خَیرٍ\nفَلا تَفَرَّدَ عَن رَوضِها أَنینُ حَمامي\nبسی نماند که روز فراق یار سر آید\nرَأَیْتُ مِن هَضَباتِ الْحِمیٰ قِبابَ خِیامِ\nخوشا دمی که درآیی و گویمت به سلامت\nقَدِمْتَ خَیْرَ قُدومٍ نَزَلْتَ خَیْرَ مَقامِ\nبَعِدْتُ مِنْکَ وَ قَدْ صِرْتُ ذائباً کَهِلالٍ\nاگر چه روی چو ماهت ندیده‌ام به تمامی\nوَ إِن دُعِیتُ بِخُلْدٍ وَ صِرْتُ ناقِضَ عَهْدٍ\nفما تَطَیَّبَ نَفْسی وَ ما اسْتَطابَ مَنامی\nامید هست که زودت به بخت نیک ببینم\nتو شاد گشته به فرماندهی و من به غلامی\nچو سِلْک دُرّ خوشاب است شعر نغز تو حافظ\nکه گاه لطف سبق می‌برد ز نظم نظامی"},{"id":470,"poem":"سینه مالامال درد است ای دریغا مرهمی\nدل ز تنهایی به جان آمد خدا را همدمی\nچشم آسایش که دارد از سپهر تیزرو؟\nساقیا جامی به من ده تا بیاسایم دمی\nزیرکی را گفتم: «این احوال بین»، خندید و گفت:\n«صعب‌روزی، بوالعجب‌کاری، پریشان‌عالمی»\nسوختم در چاه صبر از بهر آن شمع چگل\nشاه ترکان فارغ است از حال ما، کو رستمی؟\nدر طریق عشق‌بازی امن و آسایش بلاست\nریش باد آن دل که با درد تو خواهد مرهمی\nاهل کام و ناز را در کوی رندی راه نیست\nرهروی باید جهان‌سوزی نه خامی بی‌غمی\nآدمی در عالم خاکی نمی‌آید به دست\nعالمی دیگر بباید ساخت وز نو آدمی\nخیز تا خاطر بدان تُرک سمرقندی دهیم\nکز نسیمش بوی جوی مولیان آید همی\nگریهٔ حافظ چه سنجد پیش استغنای عشق\nکاندر این دریا نماید هفت دریا شبنمی"},{"id":471,"poem":"ز دلبرم که رساند نوازش قلمی\nکجاست پیک صبا گر همی کند کرمی؟\nقیاس کردم و تدبیر عقل در ره عشق\nچو شبنمی است که بر بحر می‌کشد رقمی\nبیا که خرقهٔ من گرچه رهن میکده‌هاست\nز مال وقف نبینی به نام من درمی\nحدیثِ چون و چرا دردِ سر دهد ای دل\nپیاله گیر و بیاسا ز عمرِ خویش دمی\nطبیبِ راه‌نشین درد عشق نشناسد\nبرو به دست کن ای مرده‌دل مسیح‌دمی\nدلم گرفت ز سالوس و طبل زیر گلیم\nبه آن که بر در میخانه برکشم عَلَمی\nبیا که وقت‌شناسان دو کون بفروشند\nبه یک پیاله میِ صاف و صحبتِ صنمی\nدوام عیش و تنعم نه شیوهٔ عشق است\nاگر معاشرِ مایی بنوش نیش غمی\nنمی‌کنم گله‌ای لیک ابر رحمت دوست\nبه کِشته‌زار جگرتشنگان نداد نمی\nچرا به یک نیِ قندش نمی‌خرند آن کس\nکه کرد صد شکرافشانی از نیِ قلمی\nسزای قدر تو شاها به دست حافظ نیست\nجز از دعای شبی و نیاز صبحدمی"},{"id":472,"poem":"اَحمَدُ اللهَ عَلی مَعْدِلَةِ السُلطانِ\nاحمدِ شیخ اُوِیسِ حسنِ ایلخانی\nخانِ بِنْ خان و شهنشاهِ شهنشاه‌نژاد\nآن که می‌زیبد اگر جان جهانش خوانی\nدیده نادیده به اقبال تو ایمان آورد\nمرحبا ای به چنین لطف خدا ارزانی\nماه اگر بی تو برآید به دو نیمش بزنند\nدولت احمدی و معجزهٔ سبحانی\nجلوهٔ بخت تو دل می‌برد از شاه و گدا\nچشم بد دور که هم جانی و هم جانانی\nبرشکن کاکل ترکانه که در طالع توست\nبخشش و کوشش خاقانی و چنگزخانی\nگر چه دوریم به یاد تو قدح می‌گیریم\nبُعد منزل نبود در سفر روحانی\nاز گل پارسیم غنچهٔ عیشی نشکفت\nحبّذا دجله بغداد و می ریحانی\nسر عاشق که نه خاک در معشوق بود\nکی خلاصش بود از محنت سرگردانی\nای نسیم سحری خاک در یار بیار\nکه کند حافظ از او دیدهٔ دل نورانی"},{"id":473,"poem":"وقت را غنیمت دان آن قدر که بتْوانی\nحاصل از حیات ای جان این دم است تا دانی\nکام‌بخشیِ گردون عمر در عوض دارد\nجهد کن که از دولت دادِ عیش بستانی\nباغبان چو من زین جا بگذرم حرامت باد\nگر به جای من سروی غیر دوست بنشانی\nزاهد پشیمان را ذوق باده خواهد کشت\nعاقلا! مکن کاری کآورد پشیمانی\nمحتسب نمی‌داند این قدر که صوفی را\nجنس خانگی باشد همچو لعل رمانی\nبا دعای شب‌خیزان ای شکردهان مستیز\nدر پناه یک اسم است خاتم سلیمانی\nپند عاشقان بشنو و از در طرب بازآ\nکاین همه نمی‌ارزد شغل عالم فانی\nیوسف عزیزم رفت ای برادران رحمی\nکز غمش عجب بینم حال پیر کنعانی\nپیش زاهد از رندی دم مزن که نتوان گفت\nبا طبیب نامحرم حال درد پنهانی\nمی‌روی و مژگانت خون خلق می‌ریزد\nتیز می‌روی جانا ترسمت فرومانی\nدل ز ناوک چشمت گوش داشتم لیکن\nابروی کماندارت می‌برد به پیشانی\nجمع کن به احسانی حافظ پریشان را\nای شکنج گیسویت مجمع پریشانی\nگر تو فارغی از ما ای نگار سنگین‌دل\nحال خود بخواهم گفت پیش آصف ثانی"},{"id":474,"poem":"هواخواه توام جانا و می‌دانم که می‌دانی\nکه هم نادیده می‌بینی و هم ننوشته می‌خوانی\nملامت‌گو چه دریابد میان عاشق و معشوق؟\nنبیند چشم نابینا خصوص اسرار پنهانی\nبیفشان زلف و صوفی را به پابازی و رقص آور\nکه از هر رقعهٔ دلقش هزاران بت بیفشانی\nگشادِ کار مشتاقان در آن ابروی دلبند است\nخدا را یک نفس بنشین گره بگشا ز پیشانی\nملک در سجدهٔ آدم زمین بوس تو نیت کرد\nکه در حُسن تو لطفی دید بیش از حد انسانی\nچراغ افروز چشم ما نسیم زلف جانان است\nمباد این جمع را یا رب غم از باد پریشانی\nدریغا عیش شب‌گیری که در خواب سحر بگذشت\nندانی قدر وقت ای دل مگر وقتی که درمانی\nملول از همرهان بودن طریق کاردانی نیست\nبکش دشواری منزل به یاد عهد آسانی\nخیال چنبر زلفش فریبت می‌دهد حافظ\n«نگر تا حلقهٔ اقبال ناممکن نجنبانی»"},{"id":475,"poem":"گفتند خلایق که تویی یوسف ثانی\nچون نیک بدیدم به حقیقت به از آنی\nشیرین‌تر از آنی به شکرخنده که گویم\nای خسرو خوبان که تو شیرین زمانی\nتشبیه دهانت نتوان کرد به غنچه\nهرگز نبود غنچه بدین تنگ دهانی\nصد بار بگفتی که دهم زان دهنت کام\nچون سوسن آزاده چرا جمله زبانی؟\nگویی بدهم کامت و جانت بستانم\nترسم ندهی کامم و جانم بستانی\nچشم تو خدنگ از سپر جان گذراند\nبیمار که دیده‌ست بدین سخت کمانی\nچون اشک بیندازیش از دیدهٔ مردم\nآن را که دمی از نظر خویش برانی"},{"id":476,"poem":"نسیم صبح سعادت! بدان نشان که تو دانی\nگذر به کوی فلان کن، در آن زمان که تو دانی\nتو پیک خلوت رازی و دیده بر سر راهت\nبه مردمی نه به‌فرمان چنان بران که تو دانی\nبگو که جان عزیزم ز دست رفت، خدا را\nز لعل روح‌فزایش ببخش آن که تو دانی\nمن این حروف نوشتم، چنان که غیر ندانست\nتو هم ز روی کرامت، چنان بخوان که تو دانی\nخیال تیغ تو با ما، حدیث تشنه و آب است\nاسیر خویش گرفتی، بکُش چنان که تو دانی\nامید در کمرِ زَرکِشَت چگونه ببندم؟\nدقیقه‌ای است نگارا در آن میان که تو دانی\nیکی است تُرکی و تازی، در این معامله حافظ\nحدیث عشق بیان کن، بدان زبان که تو دانی"},{"id":477,"poem":"دو یار زیرک و از بادهٔ کهن دو منی\nفراغتی و کتابی و گوشهٔ چمنی\nمن این مقام به دنیا و آخرت ندهم\nاگر چه در پِی‌ام افتند هر دم انجمنی\nهر آن که کنج قناعت به گنج دنیا داد\nفروخت یوسف مصری به کمترین ثمنی\nبیا که رونق این کارخانه کم نشود\nبه زهدِ همچو تویی، یا به فسق همچو منی\nز تندباد حوادث نمی‌توان دیدن\nدر این چمن که گلی بوده است یا سَمنی\nببین در آینهٔ جام، نقش‌بندیِ غیب\nکه کس به یاد ندارد چنین عجب زَمنی\nاز این سَموم که بر طَرْف بوستان بگذشت\nعجب که بوی گلی هست و رنگ نسترنی\nبه صبر کوش تو ای دل که حق رها نکند\nچنین عزیز نگینی به دست اهرمنی\nمزاجِ دَهر تَبَه شد در این بلا حافظ\nکجاست فکر حکیمی و رای برهمنی؟"},{"id":478,"poem":"نوش کن جامِ شرابِ یک منی\nتا بِدان بیخِ غم از دل برکَنی\nدل، گشاده دار چون جامِ شراب\nسر گرفته چند چون خُمّ دَنی\nچون ز جام بی‌خودی رطلی کشی\nکم زنی از خویشتن لافِ منی\nسنگسان شو، در قدم نی همچو آب\nجمله رنگ‌آمیزی و تَردامنی\nدل به مِی دربند تا مردانه‌وار\nگردن سالوس و تقوا بشکنی\nخیز و جهدی کن چو حافظ تا مگر\nخویشتن در پای معشوق افکنی"},{"id":479,"poem":"صبح است و ژاله می‌چکد از ابر بهمنی\nبرگ صبوح ساز و بده جام یک منی\nدر بحر مایی و منی افتاده‌ام، بیار\nمی تا خلاص بخشدم از مایی و منی\nخونِ پیاله خور که حلال است خون او\nدر کار یار باش که کاری‌ست کردنی\nساقی به دست باش که غم در کمین ماست\nمطرب نگاه دار همین ره که می‌زنی\nمِی ده که سر به گوش من آورد چنگ و گفت\n«خوش بگذران و بشنو از این پیرِ منحنی»\nساقی به بی‌نیازی رندان که می بده\nتا بشنوی ز صوت مغنی «هو الغنی»"},{"id":480,"poem":"ای که در کشتن ما هیچ مدارا نکنی\nسود و سرمایه بسوزی و محابا نکنی\nدردمندان بلا زهر هلاهل دارند\nقصد این قوم خطا باشد هان تا نکنی\nرنج ما را که توان برد به یک گوشهٔ چشم\nشرط انصاف نباشد که مداوا نکنی\nدیدهٔ ما چو به امید تو دریاست، چرا\nبه تفرج گذری بر لب دریا نکنی؟\nنقل هر جور که از خلق کریمت کردند\nقول صاحب غرضان است تو آن‌ها نکنی\nبر تو گر جلوه کند شاهد ما ای زاهد\nاز خدا جز می و معشوق تمنا نکنی\nحافظا سجده به ابروی چو محرابش بر\nکه دعایی ز سر صدق جز آن جا نکنی"},{"id":481,"poem":"بشنو این نکته که خود را ز غم آزاده کنی\nخون خوری گر طلب روزی ننهاده کنی\nآخرالامر گِل کوزه‌گران خواهی شد\nحالیا فکر سبو کن که پر از باده کنی\nگر از آن آدمیانی که بهشتت هوس است\nعیش با آدمی‌یی چند پری‌زاده کنی\nتکیه بر جای بزرگان نتوان زد به گزاف\nمگر اسباب بزرگی همه آماده کنی\nاجرها باشدت ای خسرو شیرین‌دهنان\nگر نگاهی سوی فرهاد دل‌افتاده کنی\nخاطرت کی رقم فیض پذیرد، هیهات!\nمگر از نقش پراگنده ورق ساده کنی\nکار خود گر به کرم بازگذاری حافظ\nای بسا عیش که با بخت خداداده کنی\nای صبا بندگی خواجه جلال‌الدین کن\nکه جهان پُر سمن و سوسنِ آزاده کنی"},{"id":482,"poem":"ای دل! به کوی عشق گذاری نمی‌کنی\nاسباب جمع داری و کاری نمی‌کنی\nچوگان حکم در کف و گویی نمی‌زنی\nبازِ ظفر به دست و شکاری نمی‌کنی\nاین خون که موج می‌زند اندر جگر تو را\nدر کار رنگ و بویِ نگاری نمی‌کنی\nمشکین از آن نشد دمِ خُلقت که چون صبا\nبر خاک کوی دوست گذاری نمی‌کنی\nترسم کز این چمن نبری آستینِ گل\nکز گلشنش تحملِ خاری نمی‌کنی\nدر آستینِ جان تو صد نافه مدرج است\nوآن را فدای طرهٔ یاری نمی‌کنی\nساغر لطیف و دلکش و مِی، افکنی به خاک\nواندیشه از بلای خماری نمی‌کنی\nحافظ برو که بندگیِ پادشاهِ وقت\nگر جمله می‌کنند، تو باری نمی‌کنی"},{"id":483,"poem":"سحرگه ره ‎روی در سرزمینی\nهمی گفت این معما با قرینی\nکه ای صوفی شراب آن گه شود صاف\nکه در شیشه برآرد اربعینی\nخدا زان خرقه بیزار است صد بار\nکه صد بت باشدش در آستینی\nمروت گر چه نامی بی‌نشان است\nنیازی عرضه کن بر نازنینی\nثوابت باشد ای دارای خرمن\nاگر رحمی کنی بر خوشه‌چینی\nنمی‌بینم نشاط عیش در کس\nنه درمان دلی نه درد دینی\nدرون‌ها تیره شد باشد که از غیب\nچراغی برکند خلوت‌نشینی\nگر انگشت سلیمانی نباشد\nچه خاصیت دهد نقش نگینی؟\nاگر چه رسم خوبان تندخویی‌ست\nچه باشد گر بسازد با غمینی؟\nره میخانه بنما تا بپرسم\nمَآل خویش را از پیش‌بینی\nنه حافظ را حضور درس خلوت\nنه دانشمند را علم‌ الیقینی"},{"id":484,"poem":"تو مگر بر لب آبی به هوس بنشینی\nور نه هر فتنه که بینی همه از خود بینی\nبه خدایی که تویی بندهٔ بگزیدهٔ او\nکه بر این چاکر دیرینه کسی نگزینی\nگر امانت به سلامت ببرم باکی نیست\nبی‌دلی سهل بود گر نَبُوَد بی‌دینی\nادب و شرم تو را خسرو مه‌رویان کرد\nآفرین بر تو که شایستهٔ صد چندینی\nعجب از لطف تو ای گل که نشستی با خار\nظاهراً مصلحت وقت در آن می‌بینی\nصبر بر جور رقیبت چه کنم گر نکنم؟\nعاشقان را نبود چاره به جز مسکینی\nباد صبحی به هوایت ز گلستان برخاست\nکه تو خوش‌تر ز گل و تازه‌تر از نسرینی\nشیشه‌بازیِ سِرشکم نگری از چپ و راست\nگر بر این منظر بینش نفسی بنشینی\nسخنی بی‌غرض از بندهٔ مخلص بشنو\nای که منظور بزرگان حقیقت بینی\nنازنینی چو تو پاکیزه‌دل و پاک‌نهاد\nبهتر آن است که با مردمِ بد ننشینی\nسیل این اشک روان صبر و دل حافظ برد\nبَلَغَ الطّاقَةَ یا مُقلَةَ عَینی بِیني\nتو بدین نازکی و سرکشی ای شمع چگل\nلایق بندگی خواجه جلال‌الدینی"},{"id":485,"poem":"ساقیا سایهٔ ابر است و بهار و لب جوی\nمن نگویم چه کن ار اهل دلی خود تو بگوی\nبوی یک‌رنگی از این نقش نمی‌آید خیز\nدلق آلودهٔ صوفی به می ناب بشوی\nسفله‌طبع است جهان، بر کَرَمَش تکیه مکن\nای جهان‌دیده! ثباتِ قدم از سفله مجوی\nدو نصیحت کنمت بشنو و صد گنج ببر\n«از در عیش درآ و به ره عیب مپوی»\nشکر آن را که دگربار رسیدی به بهار\nبیخ نیکی بنشان و ره تحقیق بجوی\nروی جانان طلبی، آینه را قابل ساز\nور نه هرگز گل و نسرین ندمد ز آهن و روی\nگوش بگشای که بلبل به فغان می‌گوید\nخواجه تقصیر مفرما گل توفیق ببوی\nگفتی از حافظِ ما بوی ریا می‌آید\nآفرین بر نفست باد که خوش بردی بوی"},{"id":486,"poem":"بلبل، ز شاخِ سرو، به گلبانگِ پهلوی\nمی‌خوانْد دوش، درسِ مقاماتِ معنوی\nیعنی بیا، که آتشِ موسی، نمودْ گُل\nتا از درخت، نکتهٔ توحید بشنوی\nمرغان باغ، قافیه‌سنجند و بذله‌گوی\nتا خواجه مِی خورَد، به غزل‌های پهلوی\nجمشید، جز حکایتِ جام، از جهان نَبُرد\nزنهار! دل مَبَند، بر اسبابِ دنیوی\nاین قصّهٔ عجب شِنو از بختِ واژگون\nما را بِکُشت یار، به انفاسِ عیسَوی\nخوش، وقتِ بوریا و گدایی و خوابِ امن\nکاین عیش، نیست درخورِ اُورَنگِ خسروی\nچَشمت، به غَمزه، خانهٔ مردم، خراب کرد\nمَخموریـَت مَباد، که خوش مَست می‌رَوی\nدهقان سال‌خورده، چه خوش گفت با پسر\nکای نورِ چشمِ من! به جز از کِشته، نَدرَوی\nساقی، مگر وظیفهٔ حافظ، زیاده داد\nکآشفته گَشت، طُرّهٔ دَستارِ مولوی"},{"id":487,"poem":"ای بی‌خبر بکوش که صاحب‌خبر شوی\nتا راهرو نباشی کی راهبر شوی؟\nدر مکتب حقایق پیش ادیب عشق\nهان ای پسر بکوش که روزی پدر شوی\nدست از مسِ وجود چو مردان ره بشوی\nتا کیمیای عشق بیابی و زر شوی\nخواب و خورت ز مرتبهٔ خویش دور کرد\nآن گه رسی به خویش که بی خواب و خور شوی\nگر نور عشق حق به دل و جانت اوفتد\nبالله کز آفتاب فلک خوب‌تر شوی\nیک دم غریق بحر خدا شو گمان مبر\nکز آب هفت بحر به یک موی تر شوی\nاز پای تا سرت همه نور خدا شود\nدر راه ذوالجلال چو بی پا و سر شوی\nوجه خدا اگر شودت منظر نظر\nزین پس شکی نماند که صاحب‌نظر شوی\nبنیاد هستی تو چو زیر و زبر شود\nدر دل مدار هیچ که زیر و زبر شوی\nگر در سرت هوای وصال است حافظا\nباید که خاک درگه اهل هنر شوی"},{"id":488,"poem":"سَحرم هاتف میخانه به دولت‌خواهی\nگفت: باز آی که دیرینهٔ این درگاهی\nهمچو جَم جرعهٔ ما کَش که ز سِرّ دو جهان\nپرتو جام جهان‌بین دهدَت آگاهی\nبر در میکده، رندان قلندر باشند\nکه سِتانند و دهند افسر شاهنشاهی\nخشت، زیر سر و بر تارَک هفت‌اختر پای\nدست قدرت نگر و منصب صاحب‌جاهی\nسَر ما و در میخانه که طرف بامش\nبه فلک بَر شد و دیوار بدین کوتاهی\nقطع این مرحله بی‌همرهی خضر مکن\nظلمات است، بترس از خطر گمراهی\nاگرت سلطنت فقر ببخشند، ای دل!\nکمترین ملک تو از ماه بود تا ماهی\nتو دم فقر ندانی زدن از دست مده\nمسند خواجگی و مجلس تورانشاهی\nحافظِ خام‌طمع! شرمی از این قصّه بدار\nعملت چیست که فردوس بَرین می‌خواهی‌؟"},{"id":489,"poem":"ای در رخ تو پیدا انوار پادشاهی\nدر فکرتِ تو پنهان، صد حکمت الهی\nکلک تو بارک الله بر ملک و دین گشاده\nصد چشمه آب حیوان از قطرهٔ سیاهی\nبر اهرمن نتابد انوار اسم اعظم\nملک آن توست و خاتم فرمای هر چه خواهی\nدر حکمت سلیمان هر کس که شک نماید\nبر عقل و دانش او خندند مرغ و ماهی\nباز ار چه گاه گاهی بر سر نهد کلاهی\nمرغان قاف دانند آیین پادشاهی\nتیغی که آسمانش از فیض خود دهد آب\nتنها جهان بگیرد بی منّت سپاهی\nکلک تو خوش نویسد در شأن یار و اغیار\nتعویذ جان‌فزایی افسون عمرکاهی\nای عنصر تو مخلوق از کیمیای عزّت\nو ای دولت تو ایمن از وَصمت تباهی\nساقی بیار آبی از چشمهٔ خرابات\nتا خرقه‌ها بشوییم از عُجب خانقاهی\nعمری‌ست پادشاها کز می تهی‌ست جامم\nاینک زِ بنده دعوی، وَز محتسب گواهی\nگَر پرتوی زِ تیغت، بر کان و معدن افتد\nیاقوت سرخ‌رو را بخشند رنگ کاهی\nدانم دلت ببخشد بر عجز شب‌نشینان\nگر حال بنده پرسی از باد صبحگاهی\nجایی که برق عصیان بر آدم صفی زد\nما را چگونه زیبد دعویِ بی‌گناهی؟\nحافظ چو پادشاهت گهگاه می‌برد نام\nرنجش ز بخت منما بازآ به عذرخواهی"},{"id":490,"poem":"در همه دِیر مغان نیست چو من شیدایی\nخرقه جایی گرو باده و دفْتر جایی\nدل که آیینه شاهی‌ست غباری دارد\nاز خدا می‌طلبم صحبت روشن‌رایی\nکرده‌ام توبه به دست صنم باده‌فروش\nکه دگَر مِی نخورم بی‌ رخِ بزم‌آرایی\nنرگس اَر لاف زد از شیوه چشمِ تو مَرَنج\nنروند اهل نظر از پی نابینایی\nشرحِ این قصه مگر شمع بَرآرَد به زبان\nوَرنَه پروانه ندارد به سخن، پروایی\nجوی‌ها بسته‌ام از دیده به دامان که مگر\nدر کنارم بنشانند سَهی‌بالایی\nکشتی باده بیاور که مرا بی‌ رخِ دوست\nگشت هر گوشه چشم از غمِ دل، دریایی\nسخن غیر مگو با منِ معشوقه‌پرست\nکَز وِی و جامِ مِی‌ام نیست به کَس پروایی\nاین حدیثم چه خوش آمد که سحرگه می‌گفت\nبر درِ میکده‌ای، با دَف و نِی، ترسایی\n«گر مسلمانی از این است که حافظ دارد\nآه اگر از پی امروز بُوَد فردایی»"},{"id":491,"poem":"به چشم کرده‌ام ابرویِ ماه‌سیمایی\nخیالِ سبزخطی، نقش بسته‌ام جایی\nامید هست که منشورِ عشق‌بازیِ من\nاز آن کمانچهٔ ابرو رسد به طُغرایی\nسَرم زِ دست بشد، چشم از انتظار بسوخت\nدر آرزویِ سر و چشمِ مجلس‌آرایی\nمُکدّر است دِل، آتش به خرقه خواهم زد\nبیا! ببین! که کِرا می‌کُند تماشایی\nبه روزِ واقعه، تابوتِ ما زِ سرو کنید\nکه می‌رَویم به داغِ بلندبالایی\nزمامِ دِل به کسی دادِه‌ام منِ دَرویش\nکه نیستش به کس از تاج و تخت، پروایی\nدر آن مَقام که خوبان ز غَمزه، تیغ زنند\nعجب مدار سَری اوفتاده در پایی\nمرا که از رخِ او، ماه در شبستان است\nکجا بود به فروغِ ستاره، پروایی؟\nفراق و وصل چه باشد؟ رضایِ دوست طلب\nکه حیف باشد از او، غیرِ او، تمنایی\nدُرَر ز شوق برآرند ماهیان به نثار\nاگر سفینهٔ حافظ رسد به دریایی"},{"id":492,"poem":"سَلامی چو بویِ خوشِ آشنایی\nبِدان مَرْدُمِ دیدِهٔ روشَنایی\nدرودی چو نورِ دِلِ پارسایان\nبِدان شَمْعِ خَلْوَتْگَهِ پارسایی\nنِمی‌بینَم از هَمْدَمان، هیچ بَر جای\nدِلَم، خون شد از غُصِّه؛ ساقی! کُجایی؟\nزِ کویِ مُغان، رُخ مَگَرْدان! کِه آنجا\nفُروشَنْد مِفْتاحِ مُشْکِل‌گُشایی\nعَروسِ جَهان گَرچِه دَر حَدِّ حُسْن است\nزِ حَد می‌بَرَد شیوِهٔ بی‌وَفایی\nدِلِ خَسْتِهٔ مَن گَرَش هِمَّتی هَسْت\nنَخواهَد زِ سَنْگین‌دِلان، مومیایی\nمِیِ صوفی‌اَفْکَن، کُجا می‌فُروشَنْد؟\nکِه دَر تابم اَز دَسْتِ زُهْدِ ریایی\nرَفیقان، چُنان، عَهْدِ صُحْبَت شِکَسْتَنْد\nکِه گویی نَبوده‌ست خود، آشْنایی\nمَرا گَر تو بُگْذاری، اِی نَفْس طامِع!\nبَسی پادْشایی کُنَم دَر گِدایی\nبیاموزَمت کیمیایِ سَعادَت\nزِ هَم‌صُحْبَتِ بَد، جُدایی! جُدایی!\nمَکُن «حافِظ» اَز جورِ دوران، شِکایَت!\nچِه دانی تو، اِی بَنْدِه! کارِ خُدایی؟"},{"id":493,"poem":"ای پادشه خوبان! داد از غم تنهایی\nدل بی تو به جان آمد؛ وقت است که بازآیی\nدائم، گل این بستان، شاداب نمی‌ماند\nدریاب ضعیفان را در وقت توانایی\nدیشب، گلهٔ زلفش با باد، همی کردم\nگفتا: «غلطی! بگذر زین فکرَت سودایی!»\nصد باد صبا، این‌جا، با سلسله می‌رقصند\nاین است حریف ای دل! تا باد نپیمایی\nمشتاقی و مهجوری، دور از تو چنانم کرد\nکز دست بخواهد شد پایاب شکیبایی\nیا رب! به که شاید گفت این نکته که در عالم\nرخساره به کس ننمود آن شاهدِ هرجایی؟\nساقی! چمنِ گل را بی روی تو رنگی نیست\nشمشاد، خرامان کن! تا باغ بیارایی\nای درد تواَم درمان در بستر ناکامی\nوِی یاد تواَم مونس در گوشهٔ تنهایی\nدر دایرهٔ قسمت، ما نقطهٔ تسلیمیم\nلطف، آن‌چه تو اندیشی؛ حکم، آن‌چه تو فرمایی\nفکر خود و رایِ خود در عالَم رندی نیست\nکفر است در این مذهب، خودبینی و خودرایی\nزین دایرهٔ مینا، خونین‌جگرم، مِی ده!\nتا حل کنم این مشکل در ساغر مینایی\n«حافظ»! شب هجران شد؛ بوی خوشِ وصل آمد\nشادیت، مبارک باد! ای عاشق شیدایی!"},{"id":494,"poem":"اِی دِل! گَر از آن چاهِ زَنَخْدان به دَرآیی\nهر جا که رَوی، زود، پَشیمان به دَرآیی\nهُش دار که گَر وَسْوَسِهٔ عَقْل کُنی گوش\nآدَم‌صِفَت از روضِهٔ رِضْوان به دَرآیی\nشایَد که به آبی، فَلَکَت، دَسْت نَگیرد\nگر تِشْنِه‌لَب از چَشْمِهٔ حِیوان به دَرآیی\nجان می‌دَهم از حَسْرَتِ دیدارِ تو، چون صُبْح\nباشَد که چو خورشید درخشان به دَرآیی\nچَنْدان، چو صَبا بَر تو گُمارم دَمِ هِمَّت\nکز غُنْچِه چو گُل، خُرَّم و خَنْدان به دَرآیی\nدر تیره‌شَبِ هِجْرِ تو، جانَم به لَب آمَد\nوَقْت است که همچون مَهِ تابان به دَرآیی\nبَر رَهْگُذَرَت بَسْتِه‌ام از دیده، دو صَد جوی\nتا بو که تو چون سَرْوِ خُرامان به دَرآیی\nحافِظ! مَکُن اَنْدیشِه که آن یوسُفِ مَه‌رو\nبازآیَد و از کُلْبِهٔ اَحْزان به دَرآیی!"},{"id":495,"poem":"مِی خواه و گُل‌افشان کن، از دَهر چه می‌جویی؟\nاین گفت سحرگه گُل «بلبل! تو چه می‌گویی؟»\nمسند به گلستان بَر، تا شاهد و ساقی را\nلب گیری و رخ بوسی، مِی نوشی و گُل بویی\nشمشاد، خرامان کُن وآهنگِ گلستان کُن\nتا سرو بیآموزد از قدِّ تو، دل‌جویی\nتا غنچهٔ خندانت، دولت به که خواهد داد\nای شاخِ گُلِ رعنا! از بهرِ که می‌رویی؟\nامروز که بازارت، پرجوش خریدار است\nدریاب و بِنه گنجی از مایهٔ نیکویی\nچون شمع، نکورویی در رهگذرِ باد است\nطرْفِ هنری بربند از شمعِ نکورویی\nآن طرِّه که هر جعدش، صد نافهٔ چین ارزد\nخوش بودی اگر بودی، بوییش ز خوش‌خویی\nهر مُرغ به دستانی در گلشنِ شاه آمد\nبلبل به نواسازی، حافظ به غزل‌گویی"}]</script>
<script>
'use strict';
const poems = JSON.parse(document.getElementById('poem-data').textContent);
const startButton = document.getElementById('startButton');
const container = document.getElementById('container');
let currentRequest;
startButton.addEventListener('click', main);

function toPersianNum(number) {
    return String(number).replace(/\d/g, digit => '۰۱۲۳۴۵۶۷۸۹'[digit]);
}
function addText(parent, tag, text) {
    const element = document.createElement(tag);
    element.textContent = text;
    parent.append(element);
    return element;
}
async function fetchText(url, signal) {
    if (signal.aborted) throw new DOMException('Cancelled', 'AbortError');
    const controller = new AbortController();
    const abort = () => controller.abort();
    signal.addEventListener('abort', abort, {once: true});
    const timeout = setTimeout(abort, 6000);
    try {
        const response = await fetch(url, {
            signal: controller.signal, credentials: 'omit', referrerPolicy: 'no-referrer'
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.text();
    } finally {
        clearTimeout(timeout);
        signal.removeEventListener('abort', abort);
    }
}
async function loadInterpretation(url, extract, signal) {
    const routes = [url, `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`];
    for (const route of routes) {
        if (signal.aborted) throw new DOMException('Cancelled', 'AbortError');
        try {
            const html = await fetchText(route, signal);
            const doc = new DOMParser().parseFromString(html, 'text/html');
            doc.querySelectorAll('script, style, noscript, iframe').forEach(el => el.remove());
            const texts = extract(doc);
            if (texts.length) return texts;
        } catch (error) {
            if (signal.aborted) throw error;
        }
    }
    throw new Error('Interpretation unavailable');
}
function extractFirst(doc) {
    return [...doc.querySelectorAll('.wp-block-group.gtafsir-hafez')]
        .map(el => el.textContent.trim()).filter(Boolean);
}
function extractSecond(doc) {
    for (const p of [...doc.querySelectorAll('p')].reverse()) {
        const text = p.textContent.trim();
        if (text.length > 60 && /[\u0600-\u06ff]/.test(text) &&
            !/powered|mira/i.test(text) &&
            !['طراحی', 'تماس', 'منبع'].some(word => text.includes(word))) return [text];
    }
    return [];
}
function main() {
    if (currentRequest) currentRequest.abort();
    const request = new AbortController();
    currentRequest = request;
    const entry = poems[Math.floor(Math.random() * poems.length)];
    document.title = `غزل شمارۀ ${toPersianNum(entry.id)}`;
    container.replaceChildren();
    addText(container, 'h2', document.title).style.textAlign = 'center';
    addText(container, 'pre', entry.poem);
    container.append(document.createElement('hr'));
    addText(container, 'h3', 'تعبیر:');
    const panel = addText(container, 'pre', 'در حال دریافت تعبیر…');
    panel.setAttribute('aria-live', 'polite');
    const results = [[], []];
    let completed = 0;
    function render() {
        if (request.signal.aborted) return;
        const texts = [...new Set(results.flat())];
        panel.textContent = texts.length
            ? texts.map((text, i) => `${toPersianNum(i + 1)}. ${text}`).join('\n\n')
            : completed === 2 ? 'در حال حاضر دریافت تعبیر امکان‌پذیر نیست.' : 'در حال دریافت تعبیر…';
    }
    async function load(url, extract, index) {
        try { results[index] = await loadInterpretation(url, extract, request.signal); }
        catch (_) { /* The poem remains available if an interpretation cannot load. */ }
        finally { completed++; render(); }
    }
    // Only the optional interpretations use the network. A new click cancels
    // previous requests and immediately displays another bundled poem.
    void load(`https://satinmod.com/ghazal-${entry.id}`, extractFirst, 0);
    void load(`https://hafez-fal.ir/ghazal/${String(entry.id).padStart(3, '0')}`, extractSecond, 1);
}
</script>
